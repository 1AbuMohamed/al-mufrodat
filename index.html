function picHtml(emoji, force){

  else{
    for(const [em,k] of Object.entries(EMOJI_PIC)){
      if(emoji.includes(em)){key=k;break}
    }
  }
  const url=(key&&PHOTO_URLS[key])||PHOTO_URLS.generic;
  return `<div class="pic-frame pic-photo"><img src="${url}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`;
}
function picFromText(text, force){
  if((!force&&!showPics)||!text)return '';
  const t=String(text);
  // Arabic stems (without harakat)
  const ar=t.replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  const map=[
    ['بيت','house'],['مسجد','mosque'],['باب','door'],['كتاب','book'],['قلم','pen'],['مفتاح','key'],
    ['مكتب','desk'],['سرير','bed'],['كرسي','chair'],['نجم','star'],['قميص','shirt'],['طبيب','doctor'],
    ['ولد','boy'],['طالب','student'],['رجل','man'],['تاجر','merchant'],['كلب','dog'],['قط','cat'],
    ['حمار','donkey'],['فرس','horse'],['حصان','horse'],['جمل','camel'],['ديك','rooster'],
    ['شمس','sun'],['قمر','moon'],['بنت','girl'],['مدرس','teacher'],['سياره','car'],['حقيبه','bag'],
    ['ماء','water'],['تفاح','apple'],['مدرسة','school'],['ساعة','clock']
  ];
  for(const [k,v] of map){if(ar.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  // Dutch hints in explain
  const n=t.toLowerCase();
  const nl=[['huis','house'],['moskee','mosque'],['boek','book'],['pen','pen'],['deur','door'],['jongen','boy'],['meisje','girl'],['man','man'],['leraar','teacher']];
  for(const [k,v] of nl){if(n.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  return '';
}

function mistakeStats(){

    if(m.t>map[k].last) map[k].last=m.t;

}

function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\([^)]*\)/g,'').replace(/[^\p{L}\p{N}\s/]/gu,'').trim().replace(/\s+/g,' ')}
function stripAr(s){
  return String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'').trim();
}
function matchAns(typed,...acc){
  const t=normalize(typed);if(!t)return false;
  // Dutch/English path
  if(acc.flatMap(s=>String(s).split('/')).map(normalize).filter(Boolean).includes(t))return true;
  // Arabic path (ignore harakat / alef variants)
  const ta=stripAr(typed);
  if(!ta)return false;
  return acc.some(s=>stripAr(s)===ta);
}

const NAME_TRANSLIT = {

function namePhonetic(who){
  if(!who)return '';
  if(NAME_TRANSLIT[who])return NAME_TRANSLIT[who];
  const strip=String(who).replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  if(NAME_TRANSLIT[strip])return NAME_TRANSLIT[strip];
  for(const [k,v] of Object.entries(NAME_TRANSLIT)){
    if(k.replace(/[\u064B-\u065F\u0670]/g,'')===strip)return v;
  }
  return '';
}
function genderOf(who){
  if(!who)return 'm';
  const raw=String(who);
  const w=raw.replace(/[\u064B-\u065F\u0670\u0640]/g,'').trim();
  for(const f of FEMALE_NAMES){
    const fn=String(f).replace(/[\u064B-\u065F\u0670\u0640]/g,'').trim();
    if(fn && w===fn) return 'f';
  }
  if(/ة$/.test(w) || /ى$/.test(w)) return 'f';
  return 'm';
}

function normAr(s){
  return String(s||'')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function arTokensRaw(s){
  return String(s||'').replace(/[؟?!.،,؛:…]+/g,' ').split(/\s+/).filter(Boolean);
}
function arTokens(s){
  return normAr(s).split(/\s+/).filter(Boolean);
}
function splitTash(raw){
  let t=String(raw||'');
  let punct='';
  const pm=t.match(/[؟?!.،,؛:…]+$/);
  if(pm){ punct=pm[0]; t=t.slice(0, -punct.length); }
  if(/ًا$/.test(t)) return {stem:t.slice(0,-2), tash:'ًا', punct};
  let i=t.length-1, marks='';
  while(i>=0 && /[\u064B-\u065F\u0670]/.test(t[i])){ marks=t[i]+marks; i--; }
  if(!marks && t.endsWith('ا') && t.length>=3 && t[t.length-2]==='ً'){
    return {stem:t.slice(0,-2), tash:t.slice(-2), punct};
  }
  return {stem:t.slice(0,i+1), tash:marks, punct};
}
function wrapTash(raw, kind){
  const s=splitTash(raw);
  const inner=esc(s.stem)+(s.tash?('<span class="tash">'+esc(s.tash)+'</span>'):'')+esc(s.punct);
  const k=kind||'plain';
  return '<span class="tok-'+k+'">'+inner+'</span>';
}
function markAr(s, kind){
  return arTokensRaw(s).map(t=>wrapTash(t, kind||'plain')).join(' ');
}
function translitEndHtml(w){
  const t=esc((w&&w.translit)||romanizeAr((w&&w.ar)||'')||'');
  return t.replace(/(un|in|an)(?=$)/i,'<strong>$1</strong>');
}

    state.lesson='fouten';
    const ids=mistakeStats().map(m=>m.id).filter(Boolean);
    all=ids.map(id=>ALL.find(w=>w.id===id)).filter(Boolean);
    if(!all.length){ toast('Nog geen fouten om te oefenen.'); return; }
  }else{
    state.lesson=sel==='all'?'all':parseInt(sel,10);
    all=wordsFor(state.lesson);
  }
  const fresh=all.filter(w=>getP(w.id).box<MASTERY);
  state.review=fresh.length===0;
  const src=(state.lesson==='fouten'||state.review)?all:fresh;
  const batchSize = state.fastQuiz ? Math.min(SESSION, src.length) : Math.min(6, src.length);
  const chosen=shuffle(src).slice(0, batchSize);
  state.batch=chosen;
  state.sessionWords=chosen.slice();
  if(!chosen.length){state.view='summary';render();return}

  // Actief herinneren: geen passieve kijkfase, meteen zelf raden of typen!
  const steps=[];
  chosen.forEach((w, idx)=>{
    let dir=quizDir;
    if(dir==='mix') dir=(idx%2===0)?'ar2nl':'nl2ar';
    const pool=state.lesson==='fouten'?ALL:wordsFor(state.lesson);
    const dSrc=pool.length>=4?pool:ALL;
    const dist=shuffle(dSrc.filter(x=>x.id!==w.id)).slice(0,3);
    steps.push({
      phase:1,
      phaseLbl:'Herkennen',
      w,
      type:dir==='nl2ar'?'mc-nl2ar':'mc-ar2nl',
      options:shuffle([w,...dist]),
      dir
    });
  });
  chosen.forEach((w)=>{
    const chunks=buildArChunks(w.ar);
    const pool=state.lesson==='fouten'?ALL:wordsFor(state.lesson);
    const dSrc=pool.length>=4?pool:ALL;
    const extraChunks=[];
    shuffle(dSrc.filter(x=>x.id!==w.id)).slice(0,2).forEach(other=>{
      const oc=buildArChunks(other.ar);
      if(oc.length) extraChunks.push(oc[0]);
    });
    steps.push({
      phase:2,
      phaseLbl:'Actief herinneren',
      w,
      type:state.BuildMode==='type'?'typed-ar2nl':'build-ar',
      targetChunks:chunks,
      bank:shuffle(chunks.concat(extraChunks)).map((t,i)=>({i,t}))
    });
  });

  state.queue=steps;
  state.sessionLen=steps.length;
  state.stepIdx=0;
  try {
    localStorage.setItem('alm_last_view', 'vocab');
    localStorage.setItem('alm_last_lesson', String(sel));
  } catch(e){}
  state.asked=0; state.correct=0; state.answered=false;
  state.built=[];
  state.view='learn';
  nextQ();
}

function buildArChunks(ar){
  const s=String(ar||'').trim();
  if(!s) return [];
  // Splits op spaties als het uit meerdere woorden bestaat, anders in clusters van letter + harakaat
  if(s.includes(' ')) return s.split(/\s+/).filter(Boolean);
  const clusters=[];
  let cur='';
  for(const ch of s){
    const code=ch.charCodeAt(0);
    const isMark=(code>=0x064B && code<=0x065F) || code===0x0670;
    if(isMark && cur){ cur+=ch; }
    else { if(cur) clusters.push(cur); cur=ch; }
  }
  if(cur) clusters.push(cur);
  // Groepeer per 1-2 clusters zodat je 3 tot 5 overzichtelijke blokken krijgt
  if(clusters.length<=4) return clusters;
  const out=[];
  for(let i=0;i<clusters.length;i+=2){
    out.push(clusters.slice(i,i+2).join(''));
  }
  return out;
}

function nextQ(){
  if(!state.queue || !state.queue.length){
    const t=today();
    if(streak.last!==t){
      const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
      streak.count=streak.last===y?streak.count+1:1;
      streak.last=t;saveS();
    }
    state.view='summary';render();return;
  }
  const step=state.queue[0];
  state.current=step.w;
  state.q=step;
  state.answered=false;
  state.built=[];
  render();
}

let _vocabFbTimer = null;
function clearVocabFbTimer(){
  if(_vocabFbTimer){
    clearTimeout(_vocabFbTimer);
    _vocabFbTimer = null;
  }
}

function showFb(ok,text){
  clearVocabFbTimer();
  const bar=document.getElementById('fb');const txt=document.getElementById('fb-txt');const btn=document.getElementById('fb-btn');
  if(!bar)return;
  txt.textContent=text;
  bar.className='feedback show '+(ok?'ok':'no');
  if(btn){
    btn.style.display='inline-flex';
    btn.textContent='Volgende →';
  }
  bar.onclick=(e)=>{
    if(e.target&&e.target.id!=='fb-btn'&&_vocabFbTimer){
      clearVocabFbTimer();
      txt.innerHTML=text+' <small style="display:block;opacity:0.8;font-size:12px;margin-top:4px">⏸️ Timer gepauzeerd</small>';
    }
  };
  const delay = ok ? 2000 : 3000;
  _vocabFbTimer = setTimeout(()=>{
    _vocabFbTimer = null;
    if(state.view==='learn' && state.answered){
      continueLearn();
    }
  }, delay);
}

function handleAnswer(ok){
  if(state.answered)return;state.answered=true;
  const w=state.current;const p=getP(w.id);p.seen++;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.dataset.id===w.id)b.classList.add('correct');
    b.disabled=true;
  });
  if(ok){p.box=Math.min(MASTERY,p.box+1);p.correct++;state.correct++}
  else{p.box=Math.max(0,p.box-1);logMistake(w,'word')}
  saveP();
  const msg = ok
    ? (p.box>=MASTERY?'Beheerst':'Goed')
    : w.ar+'  ·  '+w.nl;
  showFb(ok,msg);
}

function handleTyped(){
  if(state.answered)return;
  const input=document.getElementById('type-in');if(!input)return;
  state.answered=true;input.disabled=true;
  const w=state.current;
  const qtype=(state.q&&state.q.type)||'';
  const ok = qtype==='typed-nl2ar'
    ? matchAns(input.value,w.ar)
    : matchAns(input.value,w.nl,w.en);
  const p=getP(w.id);p.seen++;
  if(ok){p.box=Math.min(MASTERY,p.box+1);p.correct++;state.correct++}
  else{p.box=Math.max(0,p.box-1);logMistake(w,'word')}
  saveP();
  showFb(ok,ok?(p.box>=MASTERY?'Goed — woord beheerst!':'Goed zo!'):`Juist: ${w.ar} · ${w.nl}`);
}

function handleDontKnow(){
  if(state.answered)return;state.answered=true;
  const w=state.current;const p=getP(w.id);p.seen++;p.box=Math.max(0,p.box-1);saveP();
  logMistake(w,'word');
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.id===w.id)b.classList.add('correct');b.disabled=true});
  const input=document.getElementById('type-in');if(input)input.disabled=true;
  showFb(false,`Juist: ${w.ar} · ${w.nl}`);
}

function continueLearn(){
  clearVocabFbTimer();
  const bar=document.getElementById('fb');if(bar)bar.classList.remove('show');
  state.queue.shift();state.asked++;
  nextQ();
}

        <div class="sh-progress-bar"><div class="sh-progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <input class="search" id="wl-q" placeholder="Zoek Nederlands, Arabisch of transcriptie (bijv. baytun, moskee, كتاب)…" value="${esc(state.searchQ||'')}">
    <div class="wl-filters">
      <button type="button" class="wl-pill ${flt==='all'?'on':''}" data-act="wl-filter" data-f="all">Alle (${total})</button>
      <button type="button" class="wl-pill ${flt==='mast'?'on':''}" data-act="wl-filter" data-f="mast">Beheerst (${m})</button>
      <button type="button" class="wl-pill ${flt==='todo'?'on':''}" data-act="wl-filter" data-f="todo">Te leren (${todoCount})</button>
      ${hotCount?`<button type="button" class="wl-pill ${flt==='hot'?'on':''}" data-act="wl-filter" data-f="hot">Vaak mis (${hotCount})</button>`:''}
      ${chPills}
    </div>`;

  for(const n of lessonNums()){
    if(flt.startsWith('l') && Number(flt.slice(1))!==Number(n)) continue;
    const ws=wordsFor(n).filter(w=>{
      const isMast=getP(w.id).box>=MASTERY;
      if(flt==='mast' && !isMast) return false;
      if(flt==='todo' && isMast) return false;
      if(flt==='hot' && !heatOf(w.id)) return false;
      if(!q)return true;
      return `${w.nl} ${w.en} ${w.translit} ${w.ar}`.toLowerCase().includes(q);
    });
    if(!ws.length)continue;
    html+=`<div class="wl-group"><div class="wl-h" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(hoofdstuk(n))} · ${esc(VOCAB_TITLES[n] || (LESSON_META[n]||[''])[0])} (${ws.length})</span><button type="button" style="font-size:11px;color:var(--forest);font-weight:700;text-transform:none;letter-spacing:0" data-act="start-learn" data-l="${n}">Oefen H${n} →</button></div>`;
    for(const w of ws){
      const heat=heatOf(w.id);
      const isMast=getP(w.id).box>=MASTERY;
      html+=`<div class="wl-row ${heat}">
        <div class="nl">${esc(w.nl)}${isMast?' <span style="color:var(--ok);font-size:12px" title="Beheerst"></span>':''}${heat?`<span class="mk-heat ${heat}" title="vaak mis"></span>`:''}<div style="font-size:11.5px;color:var(--muted);font-weight:500">${esc(w.translit)}</div></div>
        <div class="ar ar-mark" lang="ar">${wrapTash(w.ar,'plain')}</div>
      </div>`;
    }
    html+=`</div>`;
  }
  if(!html.includes('wl-group')){
    html+=`<div class="empty" style="margin-top:24px">Geen woorden gevonden voor deze selectie.</div>`;
  }
  html+=`</div>`;
  return html;
}

function renderConv(){
  const units=Object.entries(CONVERSATIONS);
  let items='';
  for(const [n,c] of units){
    const nDlg=(c.dialogues||[]).length;
    const allSpks=[];
    (c.dialogues||[]).forEach(d=>{
      (d.lines||[]).forEach(l=>{
        if(l.who && !allSpks.includes(l.who)) allSpks.push(l.who);
      });
    });
    const spkPreview = allSpks.slice(0, 3).map(s => {
      const phon = namePhonetic(s);
      return `<span class="conv-spk-tag">${esc(s)}${phon?` <small>${esc(phon)}</small>`:''}</span>`;
    }).join('');

    items+=`<button type="button" class="conv-unit-card" data-act="open-conv" data-u="${n}">
      <div class="conv-card-top">
        <span class="conv-card-badge">Eenheid ${n}</span>
        <span class="conv-card-scenes">${nDlg} ${nDlg===1?'scène':'scènes'}</span>
      </div>
      <div class="conv-card-body">
        <div class="conv-card-ar ar" lang="ar">${esc(c.titleAr)}</div>
        <div class="conv-card-title">${esc(c.titleNl)}</div>
        ${spkPreview?`<div class="conv-card-speakers">${spkPreview}</div>`:''}
      </div>
      <div class="conv-card-footer">
        <span class="conv-card-cta">Lees gesprek</span>
        <span class="conv-card-arrow">→</span>
      </div>
    </button>`;
  }
  let cont='';
  if(lastConv&&lastConv.u&&CONVERSATIONS[lastConv.u]){
    const cu=CONVERSATIONS[lastConv.u];
    cont=`<button type="button" class="resume-row conv-resume-hero" data-act="open-conv" data-u="${lastConv.u}">
      <span class="resume-k">Verder</span>
      <span class="resume-t">Eenheid ${lastConv.u} · ${esc(cu.titleNl||'')}</span>
      <span class="resume-m">Open dialoog →</span>
    </button>`;
  }
  return`<div class="desktop-page">
    <div class="sh">
      <div class="sh-main">
        <div class="sh-eyebrow">Lezen & Begrijpen · ${units.length} eenheden</div>
        <h1>Arabische Dialogen</h1>
        <p>Lees alledaagse Arabische gesprekken met Nederlandse vertaling en grammaticale zinsontleding.</p>
      </div>
    </div>
    ${cont}
    <div class="desktop-grid-2">${items}</div>
  </div>`;
}
function renderConvUnit(){
  if(state.convShowAll===undefined) state.convShowAll=true;
  const n=String(state.convUnit||'');
  const c=CONVERSATIONS[n]||CONVERSATIONS[Number(n)];
  if(!c)return`<div class="empty">Dialoog niet gevonden (eenheid ${esc(n)}).</div>`;
  const palette=darkMode?['#68D391','#63B3ED','#F6AD55','#B794F4','#F687B3','#F6E05E']:['#1F4F45','#2B6CB0','#C45C26','#6B3FA0','#8B2942','#B8860B'];
  const dialogs=c.dialogues||[];
  const total=dialogs.length;
  if(!total)return`<div class="empty">Geen dialogen in deze eenheid.</div>`;
  let di=state.convDi|0;
  if(di<0)di=0;
  if(di>=total)di=total-1;
  state.convDi=di;
  const d=dialogs[di];
  const colorMap={};
  const spkList=[];
  (d.lines||[]).forEach(l=>{
    if(l.who && !spkList.includes(l.who)) spkList.push(l.who);
  });
  let lines='';
  (d.lines||[]).forEach((line,li)=>{
    const id=`${di}-${li}`;
    const open=!!(state.convOpen&&state.convOpen[id])||!!state.convShowAll;
    const spk=line.who||('s'+li);
    if(!colorMap[spk])colorMap[spk]=palette[Object.keys(colorMap).length%palette.length];
    const col=colorMap[spk];
    const spkIdx=spkList.indexOf(line.who);
    const spkRole=(spkIdx>=0?spkIdx:li)%2===0?'a':'b';
    const initial=(line.who||'').replace(/[\u064B-\u065F\u0670\u0640\s]/g,'')[0]||(li+1);
    const irabKey=`conv_${n}_${di}_${li}`;
    const canIrab=!!(window.analyzeArabicSentence && window.analyzeArabicSentence(line.ar));
    const irabSess=canIrab && window.getInlineIrabSession ? window.getInlineIrabSession(irabKey, 'view') : null;
    const irabOpen=!!(irabSess && irabSess.open);

    lines+=`<div class="book-line conv-line ${open?'open':''} ${state.convShowAll?'show-all':''} spk-${spkRole}" data-act="toggle-line" data-id="${id}">
      <div class="conv-line-inner">
        <div class="conv-line-header">
          <div class="conv-spk-badge">
            <span class="conv-spk-avatar" style="background:${col}">${esc(initial)}</span>
            <div class="conv-spk-info">
              <span class="conv-spk-name ar" lang="ar">${esc(line.who||'')}</span>
              ${namePhonetic(line.who)?`<span class="conv-spk-phon">${esc(namePhonetic(line.who))}</span>`:''}
            </div>
          </div>
          <div class="line-actions conv-line-actions">
            ${canIrab?`<button type="button" class="conv-act-btn conv-irab-btn ${irabOpen?'active':''}" data-act="iirab-toggle" data-key="${esc(irabKey)}" data-sent="${esc(line.ar)}" title="Zinsontleding (Moebtada & Gabr)"><span class="ar" lang="ar">إعراب</span></button>`:''}
          </div>
        </div>
        <div class="conv-line-body">
          <div class="ar ar-mark conv-ar" lang="ar">${markAr(line.ar, 'plain')}</div>
          <div class="nl conv-nl">${esc(line.nl)}</div>
        </div>
        ${irabOpen && window.renderInlineIrab ? window.renderInlineIrab(line.ar, irabKey, irabSess.mode) : ''}
      </div>
    </div>`;
  });

  const bannerSrc=(showPics&&(d.image||c.image))?(d.image||c.image):'';
  const banner=bannerSrc?`<div class="conv-banner"><img src="${bannerSrc}" alt="" loading="lazy" referrerpolicy="no-referrer"/><div class="conv-banner-fade"></div></div>`:'';
  const dots=dialogs.map((_,i)=>`<button type="button" class="conv-dot ${i===di?'on':''}" data-act="conv-di" data-dir="set" data-i="${i}" aria-label="Dialoog ${i+1}"></button>`).join('');

  const sceneTabs=total>1?`
    <div class="conv-scene-tabs" role="tablist">
      ${dialogs.map((dg, i)=>{
        const isCur=i===di;
        const spks=Array.from(new Set((dg.lines||[]).map(l=>l.who).filter(Boolean)));
        const spkStr=spks.slice(0, 2).map(s=>namePhonetic(s)||s).join(' & ');
        let label=dg.titleNl||`Scène ${i+1}`;
        label=label.replace(/^(?:Hoofdstuk|Les)\s*\d+\s*-\s*Dialoog\s*\d+\s*/i,'').replace(/^Dialoog\s*-\s*/i,'').replace(/\s*–\s*/g,' – ');
        return `<button type="button" class="conv-scene-tab ${isCur?'active':''}" data-act="conv-di" data-dir="set" data-i="${i}" role="tab" aria-selected="${isCur}">
          <span class="conv-tab-num">Scène ${i+1}</span>
          <span class="conv-tab-label">${esc(label || spkStr || `Deel ${i+1}`)}</span>
        </button>`;
      }).join('')}
    </div>`:'';

  return`<div class="desktop-narrow conv-unit-view">
    <div class="conv-top-bar">
      <button class="back" data-act="nav" data-v="conv"><span>←</span> Terug naar Dialogen</button>
      <div class="conv-top-unit-tag">Eenheid ${n} · ${di+1} van ${total}</div>
    </div>

    <div class="conv-hero-card">
      ${banner}
      <div class="conv-hero-content">
        <div class="conv-hero-kicker">Eenheid ${n} · Conversatieles</div>
        <h1 class="conv-hero-ar ar" lang="ar">${esc(c.titleAr)}</h1>
        <div class="conv-hero-nl">${esc(d.titleNl||c.titleNl)}</div>
        ${d.instruction?`<div class="conv-instruction"><span class="ar" lang="ar">${esc(d.instruction)}</span> <span class="conv-inst-sub">(Lees en begrijp)</span></div>`:''}
      </div>
    </div>

    ${sceneTabs}

    <div class="conv-control-bar">
      <div class="conv-ctrl-right">
        <button class="btn ${state.convShowIrab?'btn-primary':'btn-ghost'} btn-sm conv-ctrl-btn" data-act="toggle-conv-irab"><span class="ar" lang="ar">إعراب</span> · ${state.convShowIrab?'Ontleding verbergen':'Toon ontleding'}</button>
        <button class="btn btn-ghost btn-sm conv-ctrl-btn" data-act="toggle-all-trans">${state.convShowAll?'Vertaling uit':'Vertaling aan'}</button>
      </div>
    </div>

    <div class="book-dialogue-wrap">
      <div class="book-dialogue">
        <div class="conv-lines-stack">
          ${lines}
        </div>
      </div>
    </div>

    <div class="conv-nav">
      <button class="btn btn-secondary" data-act="conv-di" data-dir="prev" ${di<=0?'disabled':''}>← Vorige scène</button>
      <div class="conv-dots">${dots}</div>
      <button class="btn btn-primary" data-act="conv-di" data-dir="next" ${di>=total-1?'disabled':''}>Volgende scène →</button>
    </div>
  </div>`;
}


function renderMistakes(){
  const stats=mistakeStats();
  if(!stats.length){
    return`<div class="desktop-narrow">
      <button class="back" data-act="nav" data-v="home" style="margin-bottom:8px"><span>←</span> Terug</button>
      <div class="sh">

        </div>
      </div>
      <button class="btn btn-primary" data-act="start-learn" data-l="all">Start woordoefening</button>
    </div>`;
  }
  const rows=stats.map(m=>{
    const heat=m.n>=3?'hot':m.n>=1?'warm':'';
    const lab=m.haraka && !m.word?'harakaat-uitgang':m.haraka?'harakaat + woord':'verkeerd woord';
    const wObj=ALL.find(x=>x.id===m.id);
    const nlTxt=wObj?wObj.nl:'';
    const chTxt=wObj?hoofdstuk(wObj.lesson):'';
    return `<button type="button" class="mistake-row" data-act="learn-one" data-id="${esc(m.id||'')}">
      <div style="text-align:start">
        <div style="font-weight:700;font-size:14.5px">${esc(nlTxt||'Woord oefenen')}</div>
        <div style="font-size:12px;color:var(--muted)">${chTxt?esc(chTxt)+' · ':''}${m.n}× mis (${lab})<span class="mk-heat ${heat}"></span></div>
      </div>
      <div style="flex:1;text-align:end;font-size:24px" class="ar ar-mark" lang="ar">${wrapTash(m.ar, m.haraka?'haraka':'bad')}</div>
      <span class="mistake-meta">Oefen →</span>
    </button>`;
  }).join('');
  return`<div class="desktop-page">
    <button class="back" data-act="nav" data-v="home" style="margin-bottom:8px"><span>←</span> Terug</button>
    <div class="sh">
      <div class="sh-main">
        <div class="sh-eyebrow">Gerichte herhaling · ${stats.length} woorden</div>
        <h1>Jouw aandachtspunten</h1>

    </div>
    <div class="mistake-actions" style="margin-bottom:16px">
      <button class="btn btn-primary" data-act="start-learn" data-l="fouten">Oefen alle fouten (${stats.length})</button>
      <button class="btn btn-secondary" data-act="clear-mistakes">Lijst wissen</button>
    </div>
    <div class="desktop-grid-2">${rows}</div>
  </div>`;
}

function exAr(s){
  return esc(s).replace(/[\u0600-\u06FF\u064B-\u0652]+(?:\s[\u0600-\u06FF\u064B-\u0652]+)*/g, m=>'<span class="ar-run" lang="ar">'+m+'</span>');
}

function examOrder(q){
  let s=5;
  for(const c of q.id) s=(s*31+c.charCodeAt(0))>>>0;
  const idx=q.opts.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){
    s=(Math.imul(s,1664525)+1013904223)>>>0;
    const j=(s>>>8)%(i+1);
    [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  return idx;
}

            <span class="exam-ans-badge">Antwoord</span>
            <strong>${exAr(ansText)}</strong>
          </div>
          ${q.note ? `<div class="exam-sheet-note">${exAr(q.note)}</div>` : ''}
        </div>`;
      }).join('');
      return `<section class="card exam-sheet-part">
        <div class="exam-part-header">
          <span class="exam-part-badge">Deel ${p.num} · ${p.pts} pt</span>
          <h2>${esc(p.title)}</h2>
          <p>${esc(p.desc)}</p>
        </div>
        <div class="exam-sheet-list">${rows}</div>
      </section>`;
    }).join('');

    return `<div class="desktop-page exam-page">
      <div class="exam-topbar">
        <button type="button" class="btn btn-secondary btn-sm" data-act="exam-start" data-mode="hub">← Examenoverzicht</button>
        <div class="exam-var-switch">
          <button type="button" class="btn btn-sm ${v==='official'?'btn-primary':'btn-secondary'}" data-act="exam-sheet" data-var="official">Officieel Examen</button>
          <button type="button" class="btn btn-sm ${v==='practice'?'btn-primary':'btn-secondary'}" data-act="exam-sheet" data-var="practice">Oefenexamen</button>
        </div>
        <button type="button" class="btn btn-primary btn-sm" data-act="exam-start" data-mode="${v}">Interactief maken →</button>
      </div>

      <div class="sh" style="margin-bottom:16px">
        <div class="sh-main">
          <div class="sh-eyebrow">Volledig Antwoordmodel & Studieblad</div>
          <h1>${esc(ex.title)}</h1>
          <p>${esc(ex.subtitle)}</p>
        </div>
      </div>

      ${partsHtml}
    </div>`;
  }

  // Interactive Exam Mode ('official' or 'practice')
  const exKey = mode === 'practice' ? 'practice' : 'official';
  const ex = EXAM_DATA[exKey];
  const ansMap = state.examAnswers[exKey] || {};
  let totalPts = 0, earnedPts = 0, totalQs = 0, answeredQs = 0;
  const partStats = {};

  for(const p of ex.parts){
    let pEarned = 0, pTotal = 0, pAns = 0;
    for(const q of p.questions){
      totalQs++;
      totalPts += q.pts;
      pTotal += q.pts;
      if(ansMap[q.id] !== undefined){
        answeredQs++;
        pAns++;
        if(ansMap[q.id] === q.ans){
          earnedPts += q.pts;
          pEarned += q.pts;
        }
      }
    }
    partStats[p.num] = { earned: pEarned, total: pTotal, ans: pAns, count: p.questions.length };
  }

  const visibleParts = state.examPart === 'all' ? ex.parts : ex.parts.filter(p => String(p.num) === String(state.examPart));
  const gradeLabel = earnedPts >= 90 ? 'Uitstekend (مُمْتَاز)' : earnedPts >= 80 ? 'Goed (جَيِّد جِدًّا)' : earnedPts >= 65 ? 'Voldoende (مَقْبُول / نَاجِح)' : 'Nog oefenen (< 65 pt)';
  const gradeClass = earnedPts >= 80 ? 'good' : earnedPts >= 65 ? 'pass' : 'retry';

  const resultBanner = state.examSubmitted ? `
    <div class="exam-score-card ${gradeClass}">
      <div class="exam-score-main">
        <div>
          <div class="exam-score-kicker">Eindresultaat · ${esc(ex.title)}</div>
          <h2>${earnedPts} / ${totalPts} punten — ${gradeLabel}</h2>
          <p>Je hebt ${answeredQs} van de ${totalQs} vragen beantwoord. Bekijk hieronder jouw score per onderdeel en de uitleg bij elke vraag.</p>
        </div>
        <div class="exam-score-circle">${earnedPts}<span>/100</span></div>
      </div>
      <div class="exam-score-parts">
        ${ex.parts.map(p => {
          const st = partStats[p.num];
          return `<button type="button" class="exam-score-pill" data-act="exam-part" data-part="${p.num}">
            <span>Deel ${p.num}</span>
            <strong>${st.earned}/${st.total} pt</strong>
          </button>`;
        }).join('')}
      </div>
    </div>` : '';

  const partsNav = `<div class="exam-parts-bar">
    <button type="button" class="exam-part-tab ${state.examPart==='all'?'active':''}" data-act="exam-part" data-part="all">Alle 7 delen (${answeredQs}/${totalQs})</button>
    ${ex.parts.map(p => {
      const st = partStats[p.num];
      return `<button type="button" class="exam-part-tab ${String(state.examPart)===String(p.num)?'active':''}" data-act="exam-part" data-part="${p.num}">Deel ${p.num} (${st.ans}/${st.count})</button>`;
    }).join('')}
  </div>`;

  const flat = [];
  visibleParts.forEach(p => p.questions.forEach(q => flat.push({p, q})));
  const cur = Math.max(0, Math.min(state.examIdx || 0, flat.length - 1));
  state.examIdx = cur;
  const cp = flat[cur].p;
  const q = flat[cur].q;
  const picked = ansMap[q.id];
  const isAnswered = picked !== undefined;
  const showFb = isAnswered && (state.examInstant || state.examSubmitted);
  const isRight = isAnswered && picked === q.ans;
  const firstOfPart = cur === 0 || flat[cur-1].p.num !== cp.num;
  const isLast = cur === flat.length - 1;
  const pctDone = Math.round(100 * (cur + 1) / flat.length);

  const qCard = `<div class="exam-q-card ${showFb ? (isRight ? 'correct' : 'wrong') : ''}">
    <div class="exam-q-top">
      <div class="exam-q-title">${exAr(q.q)}</div>
      <span class="exam-q-pts">${q.pts} pt</span>
    </div>
    ${q.ar ? `<div class="exam-q-ar-row">
      <div class="exam-q-ar ar" lang="ar" dir="rtl">${esc(q.ar)}</div>
    </div>` : ''}
    <div class="exam-opts">
      ${examOrder(q).map((oi, pos) => {
        const opt = q.opts[oi];
        let cls = 'exam-opt';
        if(picked === oi) cls += ' selected';
        if(showFb){
          if(oi === q.ans) cls += ' is-correct';
          else if(picked === oi) cls += ' is-wrong';
        }
        return `<button type="button" class="${cls}" data-act="exam-ans" data-qid="${q.id}" data-oi="${oi}">
          <span class="exam-opt-letter">${String.fromCharCode(65+pos)}</span>
          ${/^[op]10_/.test(q.id) ? `<span class="exam-opt-lines">${opt.split(/\s·\s(?![^()]*\))/).map(seg=>`<span class="exam-opt-line ar" lang="ar" dir="rtl">${esc(seg)}</span>`).join('')}</span>` : `<span class="exam-opt-text">${exAr(opt)}</span>`}
        </button>`;
      }).join('')}
    </div>
    ${showFb ? `<div class="exam-q-fb ${isRight?'ok':'err'}">
      <strong>${isRight ? ('Goed! (+' + q.pts + ' pt)') : ('Juiste antwoord: ' + exAr(q.opts[q.ans]))}</strong>
      ${q.note ? `<div>${exAr(q.note)}</div>` : ''}
    </div>` : ''}
  </div>`;

  const navHtml = visibleParts.map(p => `<div class="exam-nav-part">
    <div class="exam-nav-label">Deel ${p.num} <span>${p.pts} pt</span></div>
    <div class="exam-nav-grid">${p.questions.map(qq => {
      const gi = flat.findIndex(f => f.q.id === qq.id);
      const a = ansMap[qq.id];
      let c = 'exam-nav-btn';
      if(gi === cur) c += ' current';
      if(a !== undefined){
        c += ' answered';
        if(state.examInstant || state.examSubmitted) c += (a === qq.ans ? ' ok' : ' bad');
      }
      return `<button type="button" class="${c}" data-act="exam-goto" data-i="${gi}" aria-label="Vraag ${gi+1}">${gi+1}</button>`;
    }).join('')}</div>
  </div>`).join('');

  return `<div class="desktop-page exam-page">
    <div class="exam-topbar">
      <button type="button" class="btn btn-secondary btn-sm" data-act="exam-start" data-mode="hub">← Overzicht</button>
      <div class="exam-var-switch">
        <button type="button" class="btn btn-sm ${exKey==='official'?'btn-primary':'btn-secondary'}" data-act="exam-start" data-mode="official">Officieel</button>
        <button type="button" class="btn btn-sm ${exKey==='practice'?'btn-primary':'btn-secondary'}" data-act="exam-start" data-mode="practice">Oefenexamen</button>
      </div>
      <div class="exam-controls">
        <button type="button" class="btn btn-sm ${state.examInstant?'btn-primary':'btn-secondary'}" data-act="exam-check-instant">Direct nakijken: ${state.examInstant?'aan':'uit'}</button>
        <button type="button" class="btn btn-sm btn-secondary" data-act="exam-sheet" data-var="${exKey}">Antwoordmodel</button>
        <button type="button" class="btn btn-sm btn-secondary" data-act="exam-reset">Opnieuw</button>
      </div>
    </div>

    ${resultBanner}
    ${partsNav}

    <div class="exam-run">
      <div class="exam-run-main">
        <div class="exam-prog">
          <div class="exam-prog-top"><strong>Vraag ${cur+1} van ${flat.length}</strong><span>Deel ${cp.num} · beantwoord ${answeredQs}/${totalQs}${(state.examInstant||state.examSubmitted)?' · score '+earnedPts+' pt':''}</span></div>
          <div class="progress"><i style="width:${pctDone}%"></i></div>
        </div>
        <details class="exam-desc" ${firstOfPart?'open':''}>
          <summary><span class="exam-part-badge">Deel ${cp.num} · ${cp.pts} pt</span> ${esc(cp.title.replace(/^Deel \d+: /,''))}</summary>
          <p>${exAr(cp.desc)}</p>
        </details>
        ${qCard}
        <div class="exam-stepnav">
          <button type="button" class="btn btn-secondary" data-act="exam-prev" ${cur===0?'disabled':''}>← Vorige</button>
          ${isLast
            ? `<button type="button" class="btn btn-primary" data-act="exam-submit">Inleveren en nakijken</button>`
            : `<button type="button" class="btn ${isAnswered?'btn-primary':'btn-secondary'}" data-act="exam-next">Volgende →</button>`}
        </div>
      </div>
      <aside class="exam-run-aside">
        <div class="exam-aside-head">Vragenoverzicht</div>
        ${navHtml}
        <div class="exam-legend"><span><i class="lg answered"></i>beantwoord</span><span><i class="lg ok"></i>goed</span><span><i class="lg bad"></i>fout</span></div>
        <button type="button" class="btn btn-primary btn-block" data-act="exam-submit">Inleveren (${answeredQs}/${totalQs} beantwoord)</button>
      </aside>
    </div>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  document.body.classList.remove('hide-tab');
  if(state.view==='zeg'||state.mode==='zeg'){state.view='vocab';state.mode='verkennen';}
  let html='';
  if(state.view==='home')html=renderHome();
  else if(state.view==='flash')html=renderFlash();
  else if(state.view==='learn')html=renderLearn();
  else if(state.view==='summary')html=renderSummary();
  else if(state.view==='words')html=renderWords();
  else if(state.view==='add')html=renderAdd();
  else if(state.view==='book')html=(window.renderBook?window.renderBook():renderBook());
  else if(state.view==='book-lesson')html=(window.renderBookLesson?window.renderBookLesson():renderBookLesson());
  else if(state.view==='vocab')html=renderVocabHub();
  else if(state.view==='conv')html=renderConv();
  else if(state.view==='conv-unit')html=renderConvUnit();
  else if(state.view==='exam')html=renderExam();
  else if(state.view==='settings')html=renderSettings();
  else if(state.view==='mistakes')html=renderMistakes();
  app.innerHTML=appHeader()+html+((state.view==='vocab'||state.view==='book'||state.view==='conv'||state.view==='exam')?`<button type="button" class="theme-fab" data-act="toggle-theme" aria-label="Thema">${darkMode?GL_ICO_SUN:GL_ICO_MOON}</button>`:'');
  const sbHost=document.getElementById('sidebar-host');
  if(sbHost) sbHost.innerHTML=renderSidebar();
  const tbHost=document.getElementById('topbar-host');
  if(tbHost) tbHost.innerHTML=renderTopbar();
  const host=document.getElementById('tabbar-host');
  if(host) host.innerHTML=tabbar();
  // Remove leftover focus/caret from previous view
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}catch(e){}
  if(state.view==='learn'){
    const input=document.getElementById('type-in');
    if(input && !state.answered){
      // only focus when user should type — prevents caret flash on MC questions
      setTimeout(()=>{try{input.focus()}catch(e){}},30);
      input.addEventListener('keydown',e=>{if(e.key==='Enter')handleTyped()});
    }
  }
  if(state.view==='words'){
    const s=document.getElementById('wl-q');
    if(s){
      s.addEventListener('input',()=>{
        state.searchQ=s.value;
        clearTimeout(window._wlT);
        window._wlT=setTimeout(()=>{
          const keep=document.getElementById('wl-q');
          const pos=keep?keep.selectionStart:null;
          render();
          const s2=document.getElementById('wl-q');
          if(s2){
            s2.focus();
            if(pos!=null){try{s2.setSelectionRange(pos,pos)}catch(e){}}
          }
        },180);
      });
    }
  }
}
window.render = render;

document.addEventListener('change',e=>{
  const t=e.target;
  if(t && t.id==='set-name'){
    userName=String(t.value||'').trim().slice(0,24);
    saveName();
  }
});
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const act=btn.dataset.act;
  if(act==='toggle-sidebar'){
    sbCollapsed=!sbCollapsed;
    try{localStorage.setItem('alm_sb_collapsed',sbCollapsed?'1':'0')}catch(e){}
    applySbCollapsed();
    return;
  }
  else if(act==='sb-menu'){
    const m=btn.dataset.menu;
    const willOpen = !sbMenuState[m];
    sbMenuState[m] = willOpen;
    if(willOpen){
      if(m==='gram' && state.view!=='book' && state.view!=='book-lesson'){
        state.path='grammar';state.view='book';state.bookLesson=null;
      } else if(m==='conv' && state.view!=='conv' && state.view!=='conv-unit'){
        state.path='conv';state.view='conv';state.convUnit=null;
      }
    }
    render();
    return;
  }
  else if(act==='nav'){
    pushNavState(btn.dataset.v);
    clearVocabFbTimer();
    const v=btn.dataset.v;
    if(v==='vocab'){state.path='vocab';state.view='vocab';state.bookLesson=null}
    else if(v==='book'){state.path='grammar';state.view='book';state.bookLesson=null;state.bookTab='uitleg';if(state.g2)state.g2.view='map';sbMenuState.gram=true;}
    else if(v==='home'){state.path='home';state.view='home';state.bookLesson=null}
    else if(v==='conv'){state.path='conv';state.view='conv';state.convUnit=null;sbMenuState.conv=true;}
    else if(v==='exam'){state.path='exam';state.view='exam';if(!state.examMode)state.examMode='hub';}
    else if(v==='mistakes'){state.path='home';state.view='mistakes'}
    else{state.view=v;if(v==='words'||v==='add')state.path='vocab'}
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='exam-start'){
    const m = btn.dataset.mode || 'hub';
    state.view='exam';
    state.path='exam';
    state.examMode=m;
    state.examIdx=0;
    state.examSubmitted=false;
    render();
    (document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='exam-sheet'){
    state.view='exam';
    state.path='exam';
    state.examMode='sheet';
    state.examSheetVar = btn.dataset.var || 'official';
    render();
    (document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='exam-goto'){
    state.examIdx = parseInt(btn.dataset.i,10)||0;
    render(); window.scrollTo(0,0);
  }
  else if(act==='exam-prev'){
    state.examIdx = Math.max(0,(state.examIdx||0)-1);
    render(); window.scrollTo(0,0);
  }
  else if(act==='exam-next'){
    state.examIdx = (state.examIdx||0)+1;
    render(); window.scrollTo(0,0);
  }
  else if(act==='exam-part'){
    state.examIdx = 0;
    state.examPart = btn.dataset.part || 'all';
    render();
    (document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='exam-ans'){
    const exKey = state.examMode === 'practice' ? 'practice' : 'official';
    if(!state.examAnswers) state.examAnswers = {};
    if(!state.examAnswers[exKey]) state.examAnswers[exKey] = {};
    state.examAnswers[exKey][btn.dataset.qid] = parseInt(btn.dataset.oi, 10);
    try{ localStorage.setItem('alm_exam_ans', JSON.stringify(state.examAnswers)); }catch(e){}
    render();
  }
  else if(act==='exam-check-instant'){
    state.examInstant = !state.examInstant;
    render();
  }
  else if(act==='exam-submit'){
    state.examSubmitted = true;
    state.examPart = 'all';
    render();
    (document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='exam-reset'){
    const exKey = state.examMode === 'practice' ? 'practice' : 'official';
    if(state.examAnswers) state.examAnswers[exKey] = {};
    try{ localStorage.setItem('alm_exam_ans', JSON.stringify(state.examAnswers||{})); }catch(e){}
    state.examSubmitted = false;
    state.examIdx = 0;
    render();
    (document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='start-onboard'){
    onboarded=true;saveO();
    const mode=btn.dataset.mode;
    if(mode==='home'){state.view='home';state.path='home';render();return}
    if(mode==='flash'){state.path='vocab';state.lesson=1;state.pool=shuffle(wordsFor(1));state.idx=0;state.flipped=false;state.view='flash'}
    else if(mode==='book'){state.path='grammar';state.view='book'}
    else if(mode==='conv'){state.path='conv';state.view='conv'}
    else startLearn(1);
    render();
  }
  else if(act==='start-flash'){
    const l=btn.dataset.l==='all'?'all':parseInt(btn.dataset.l);
    state.path='vocab';state.lesson=l;state.pool=shuffle(wordsFor(l));state.idx=0;state.flipped=false;state.view='flash';render();
  }
  else if(act==='start-learn'){startLearn(btn.dataset.l)}
  else if(act==='start-zeg'){startLearn(btn.dataset.l)}
  else if(act==='learn-one' || act==='zeg-one'){startLearnOne(btn.dataset.id)}
  else if(act==='clear-mistakes'){
    mistakes=[]; saveMk(); toast('Foutenlijst leeg'); render();
  }
  else if(act==='flip'){state.flipped=!state.flipped;render()}
  else if(act==='wl-filter'){
    state.wlFilter=btn.dataset.f||'all';
    render();
  }
  else if(act==='set-quiz-dir'){
    const d=btn.dataset.d;if(d==='mix'||d==='nl2ar'||d==='ar2nl'){quizDir=d;saveD();render()}
  }
  else if(act==='toggle-pics'){showPics=!showPics;saveI();render()}
  else if(act==='toggle-home-more'){state.homeMore=!state.homeMore;render()}
  else if(act==='save-name'){
    const inp=document.getElementById('set-name')||document.querySelector('input[data-name="user"]');
    userName=String((inp&&inp.value)||'').trim().slice(0,24);
    saveName();
    toast(userName?('Opgeslagen: '+userName):'Naam gewist');
    render();
  }
  else if(act==='set-ar'){
    const s=btn.dataset.s; if(s==='s'||s==='m'||s==='l'){arSize=s;saveArSize();applyArSize();render();}
  }
  
  else if(act==='resume-grammar'){
    const targetL = btn.dataset.l !== undefined ? btn.dataset.l : 0;
    try {
      localStorage.setItem('alm_last_view', 'book');
      localStorage.setItem('alm_last_lesson', String(targetL));
    } catch(e){}
    window.location.hash = '#/grammatica/' + targetL;
  }
  else if(act==='export-backup'){
    try {
      const backup = { app: 'al-mufrodat', version: '2.0', date: new Date().toISOString(), data: {} };
      for(let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('alm_')){
          backup.data[k] = localStorage.getItem(k);
        }
      }
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `al-mufrodat-backup-${dStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Back-up succesvol gedownload!');
    } catch(err){
      alert('Fout bij exporteren: ' + err.message);
    }
  }
  else if(act==='reset-progress'){
    if(!confirm('Alle woord- en grammatica-voortgang wissen?'))return;
    progress={}; gramProgress={}; lastGrammar=null; lastConv=null; streak={count:0,last:null}; mistakes=[];
    try{localStorage.removeItem(LS.p);localStorage.removeItem(LS.g);localStorage.removeItem(LS.s);localStorage.removeItem(LS.cv);localStorage.removeItem(LS.mk)}catch(e){}
    render();
  }
  else if(act==='toggle-theme'){darkMode=!darkMode;saveTheme();applyTheme();render()}
  else if(act==='conv-di'){
    const dir=btn.dataset.dir;
    const c=CONVERSATIONS[String(state.convUnit||'')];
    const n=(c&&c.dialogues||[]).length;
    if(!n)return;
    let i=state.convDi|0;
    if(dir==='next')i=Math.min(n-1,i+1);
    else if(dir==='prev')i=Math.max(0,i-1);
    else if(dir==='set')i=Math.max(0,Math.min(n-1,+(btn.dataset.i||0)));
    state.convDi=i;
    state.convOpen={};
    state.convShowAll=true;
    lastConv={u:String(state.convUnit),di:i};try{saveConv()}catch(e){}
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='toggle-all-trans'){
    state.convShowAll=!state.convShowAll;
    if(state.convShowAll){
      const c=CONVERSATIONS[state.convUnit];
      if(!state.convOpen)state.convOpen={};
      (c&&c.dialogues||[]).forEach((d,di)=>{(d.lines||[]).forEach((_,li)=>{state.convOpen[di+'-'+li]=true})});
    }else{state.convOpen={}}
    render();
  }
  else if(act==='toggle-conv-irab'){
    state.convShowIrab=!state.convShowIrab;
    const n=String(state.convUnit||'');
    const c=CONVERSATIONS[n]||CONVERSATIONS[Number(n)];
    const di=state.convDi|0;
    const d=(c&&c.dialogues&&c.dialogues[di])||null;
    if(d && d.lines && window.getInlineIrabSession){
      d.lines.forEach((line, li)=>{
        const sess=window.getInlineIrabSession(`conv_${n}_${di}_${li}`, 'view');
        sess.open=!!state.convShowIrab;
      });
    }
    render();
  }
  else if(act==='open-conv'){
    state.convUnit=String(btn.dataset.u||'');state.view='conv-unit';state.convOpen={};state.convShowAll=true;state.convDi=0;state.path='conv';
    const _di=(lastConv&&String(lastConv.u)===String(state.convUnit))? (lastConv.di|0) : 0; state.convDi=_di; lastConv={u:String(state.convUnit),di:_di};saveConv();
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='toggle-line'){
    const id=btn.dataset.id;
    if(!state.convOpen)state.convOpen={};
    state.convOpen[id]=!state.convOpen[id];
    render();
  }
  else if(act==='set-flash-dir'){
    const d=btn.dataset.d;if(d==='nl2ar'||d==='ar2nl'){flashDir=d;saveF();state.flipped=false;render()}
  }
  else if(act==='flash-prev'){
    state.idx=Math.max(0,state.idx-1);state.flipped=false;render();
  }
  else if(act==='flash-next'){
    state.idx=Math.min(state.pool.length-1,state.idx+1);state.flipped=false;render();
  }
  else if(act==='answer'){
    if(state.answered)return;
    const ok=btn.dataset.ok==='true';
    if(!ok)btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.ok==='true')b.classList.add('correct');b.disabled=true});
    handleAnswer(ok);
  }
  else if(act==='submit-typed'){handleTyped()}
  else if(act==='dont-know'){handleDontKnow()}
  else if(act==='continue-learn'){clearVocabFbTimer();continueLearn()}
  else if(act==='book-list'){
    state.path='grammar';state.view='book';state.bookLesson=null;
    try{history.pushState(null,'','#/grammatica')}catch(e){}
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='open-book'){
    state.path='grammar';
    const n=parseInt(btn.dataset.l,10);
    state.bookLesson=isNaN(n)?1:n;
    lastGrammar=state.bookLesson;saveG();
    state.view='book-lesson';
    try{history.pushState(null,'','#/grammatica/'+state.bookLesson)}catch(e){}
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='parse-sent'){state.parseShowSent=!state.parseShowSent;render();}
  else if(act==='parse-info'){
    e.stopPropagation();
    state.parseInfo=btn.dataset.role||btn.parentElement&&btn.parentElement.dataset.role;
    render();
  }
  else if(act==='parse-info-close'){state.parseInfo=null;render();}
  else if(act==='parse-pick'){
    state.parsePick=+btn.dataset.i;
    render();
  }
  else if(act==='parse-slot'){
    const role=btn.dataset.role;
    if(!state.parseMap)state.parseMap={};
    if(state.parsePick==null){
      // leeg dit vak
      delete state.parseMap[role];
    } else {
      // verwijder dit woord elders
      Object.keys(state.parseMap).forEach(k=>{ if(state.parseMap[k]===state.parsePick) delete state.parseMap[k]; });
      state.parseMap[role]=state.parsePick;
      state.parsePick=null;
    }
    render();
  }
  else if(act==='parse-reset'){
    state.parseMap={};state.parsePick=null;render();
  }
  else if(act==='parse-next'){
    state.parseI=(state.parseI||0)+1;
    if(state.parseI>=parseTasksFor(state.bookLesson).length && state.bookLesson) glMark(state.bookLesson,'ontleed');
    state.parseMap={};state.parsePick=null;state.parseShowSent=false;state.parseInfo=null;
    const n=state.bookLesson;
    if(state.parseI>=parseTasksFor(n).length) state.parseI=0;
    render();
  }
  else if(act==='book-tab'){
    const tab=btn.getAttribute('data-tab')||btn.dataset.tab||'uitleg';
    glGoto(tab);
    render();
    (document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='gram-answer'){
    const qi=+btn.dataset.qi, oi=+btn.dataset.oi, ok=btn.dataset.ok==='true';
    const g=GRAMMAR[state.bookLesson]; if(!g||!g.exercises||!g.exercises[qi])return;
    if(!state.gramAnswers)state.gramAnswers={};
    if(state.gramAnswers[qi])return;
    state.gramAnswers[qi]={oi,ok};
    // persist grammar progress
    const gp=getGram(state.bookLesson);
    gp.answers=Object.assign({},state.gramAnswers);
    gp.idx=state.gramIdx||0;
    const total=g.exercises.length;
    if(Object.keys(gp.answers).length>=total) glSteps(state.bookLesson).oefenen=true;
    gp.done=gramPct(state.bookLesson)>=100;
    lastGrammar=state.bookLesson;saveG();
    render();
  }
  else if(act==='gram-prev'){
    state.gramIdx=Math.max(0,(state.gramIdx||0)-1); state.gramView='q';
    const gp=getGram(state.bookLesson);gp.idx=state.gramIdx;gp.tab='oefenen';saveG();
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='gram-next'){
    const n=state.bookLesson;
    const g=GRAMMAR[n];const total=g&&g.exercises?g.exercises.length:0;
    const gp=getGram(n);
    let gi=state.gramIdx||0;
    if(gi<total-1) gi++;
    else{
      const ans=state.gramAnswers||{};
      let first=-1; for(let k=0;k<total;k++){ if(!ans[k]){first=k;break} }
      if(first>=0) gi=first;
      else{ state.gramIdx=gi; state.gramView='result'; glMark(n,'oefenen'); render();(document.getElementById("app")||window).scrollTop=0; return; }
    }
    state.gramIdx=gi; state.gramView='q'; gp.idx=gi; gp.tab='oefenen'; lastGrammar=n; saveG();
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='gram-goto'){
    const gp=getGram(state.bookLesson);
    state.gramIdx=+btn.dataset.i||0; state.gramView='q'; gp.idx=state.gramIdx; gp.tab='oefenen'; saveG();
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='gram-retry'){
    const n=state.bookLesson, gp=getGram(n);
    const ans=state.gramAnswers||{};
    let first=-1;
    Object.keys(ans).map(Number).sort((x,y)=>x-y).forEach(k=>{ if(!ans[k].ok){ if(first<0) first=k; delete ans[k]; } });
    state.gramAnswers=ans; gp.answers=Object.assign({},ans);
    if(gp.steps) delete gp.steps.oefenen;
    gp.done=false;
    state.gramIdx=first<0?0:first; state.gramView='q'; gp.idx=state.gramIdx; saveG();
    render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='gl-card'){
    const n=state.bookLesson; const cards=glCards(n); const dir=btn.dataset.dir;
    let i=state.glCard|0;
    if(dir==='set') i=Math.max(0,Math.min(cards.length-1,+btn.dataset.i||0));
    else if(dir==='next'){
      if(i>=cards.length-1){ glMark(n,'uitleg'); state.glEx=0; glGoto(glNextTab(n,'uitleg')); render();(document.getElementById("app")||window).scrollTop=0; return; }
      i++;
    }else{
      if(i<=0){ glGoto('start'); render();(document.getElementById("app")||window).scrollTop=0; return; }
      i--;
    }
    state.glCard=i; getGram(n).card=i;
    glGoto('uitleg'); render();(document.getElementById("app")||window).scrollTop=0;
  }
  else if(act==='gl-ex'){
    const n=state.bookLesson; const exs=(GRAMMAR[n]&&GRAMMAR[n].examples)||[]; const dir=btn.dataset.dir;
    let i=state.glEx|0;
    if(dir==='reveal'){ state.glRev=true; render(); return; }
    if(dir==='set') i=Math.max(0,Math.min(exs.length-1,+btn.dataset.i||0));
    else if(dir==='next'){
      if(i>=exs.length-1){ glMark(n,'voorbeelden'); glGoto(glNextTab(n,'voorbeelden')); render();(document.getElementById("app")||window).scrollTop=0; return; }
      i++;
    }else{
      if(i<=0){ glGoto('uitleg'); render();(document.getElementById("app")||window).scrollTop=0; return; }
      i--;
    }
    state.glEx=i; state.glRev=false; render();
  }
  else if(act==='gl-full'){ state.glFull=!state.glFull; render(); }
  else if(act==='toggle-intro'){ state.introOpen=(state.introOpen===false); render(); }
  else if(act==='toggle-r8'){ state.r8Open=!state.r8Open; render(); }
  else if(act==='toggle-fastquiz'){ state.fastQuiz=!state.fastQuiz; startLearn(state.lesson||1); }
  else if(act==='vl-next-discover'){
    state.queue.shift();
    nextQ();
  }
  else if(act==='vl-skip-phase1'){
    state.queue=(state.queue||[]).filter(s=>s.phase>1);
    nextQ();
  }
  else if(act==='vl-pick-chunk'){
    if(state.answered)return;
    const ci=+btn.dataset.ci;
    const q=state.q;
    const item=(q&&q.bank||[]).find(x=>x.i===ci);
    if(item){
      if(!state.built)state.built=[];
      state.built.push(item);
      render();
    }
  }
  else if(act==='vl-clear-build'){
    if(state.answered)return;
    if(state.built&&state.built.length){state.built.pop();render();}
  }
  else if(act==='vl-switch-type'){
    if(state.q){state.q.type='typed-ar2nl';render();}
  }
  else if(act==='vl-check-build'){
    if(state.answered)return;
    const w=state.current;
    const picked=(state.built||[]);
    const assembled=picked.map(x=>x.t).join(w.ar.includes(' ')?' ':'');
    const ok = normAr(assembled)===normAr(w.ar);
    handleAnswer(ok);
  }
  else if(act==='add-word'){
    const ar=document.getElementById('f-ar').value.trim();
    const nl=document.getElementById('f-nl').value.trim();
    const tr=document.getElementById('f-tr').value.trim();
    const en=document.getElementById('f-en').value.trim();
    const lesson=parseInt(document.getElementById('f-ls').value);
    if(!ar||!nl){toast('Vul Arabisch en Nederlands in.');return}
    customWords.push({id:'c-'+Date.now(),ar,nl,en:en||nl,translit:tr,lesson,custom:true});
    ALL=BASE_WORDS.concat(customWords);saveC();toast('Woord toegevoegd!');render();
  }
  else if(act==='del-custom'){
    customWords=customWords.filter(w=>w.id!==btn.dataset.id);
    delete progress[btn.dataset.id];
    ALL=BASE_WORDS.concat(customWords);saveC();saveP();render();
  }
});

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'){
    if(state.view==='flash'||state.view==='learn'||state.view==='words'||state.view==='add'){
      state.view='vocab';state.path='vocab';render();return;
    }
    if(state.view==='book-lesson'){
      state.view='book';state.path='grammar';state.bookLesson=null;render();return;
    }
    if(state.view==='conv-unit'){
      state.view='conv';state.path='conv';state.convUnit=null;render();return;
    }
  }
  if(state.view==='flash'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();state.flipped=!state.flipped;render();return}
    if(e.key==='ArrowRight'){state.idx=Math.min(state.pool.length-1,state.idx+1);state.flipped=false;render();return}
    if(e.key==='ArrowLeft'){state.idx=Math.max(0,state.idx-1);state.flipped=false;render();return}
  }
  if(state.view==='learn'){
    const bar=document.getElementById('fb');
    if(e.key==='Enter' && bar && bar.classList.contains('show')){e.preventDefault();continueLearn();return}
    if(!state.answered && ['1','2','3','4'].includes(e.key)){
      const opts=document.querySelectorAll('.qcard .opt');
      const btn=opts[parseInt(e.key,10)-1];
      if(btn && !btn.disabled){e.preventDefault();btn.click();return}
    }
  }
  if(state.view==='book-lesson' && state.bookTab==='oefenen'){
    if(['1','2','3','4'].includes(e.key)){
      const opts=document.querySelectorAll('.lesson-pane.active .opt');
      const btn=opts[parseInt(e.key,10)-1];
      if(btn && !btn.disabled){e.preventDefault();btn.click();return}
    }
    if(e.key==='ArrowRight'){
      const nextBtn=document.querySelector('[data-act="gram-next"]:not(:disabled)');
      if(nextBtn){e.preventDefault();nextBtn.click();return}
    }
    if(e.key==='ArrowLeft'){
      const prevBtn=document.querySelector('[data-act="gram-prev"]:not(:disabled)');
      if(prevBtn){e.preventDefault();prevBtn.click();return}
    }
  }
  if(state.view==='book-lesson'){
    const onBtn=e.target&&e.target.closest&&e.target.closest('button');
    if(!(onBtn&&(e.key==='Enter'||e.key===' '))){
      const q=sel=>document.querySelector(sel);
      if(e.key==='ArrowRight'||e.key==='Enter'){const nb=q('.gl-panel [data-gl="next"]:not(:disabled)');if(nb){e.preventDefault();nb.click();return}}
      if(e.key==='ArrowLeft'){const pb=q('.gl-panel [data-gl="prev"]:not(:disabled)');if(pb){e.preventDefault();pb.click();return}}
      if(e.key===' '&&state.bookTab==='voorbeelden'){const rb=q('[data-gl="reveal"]');if(rb){e.preventDefault();rb.click();return}}
    }
  }
});

/* ===== SWIPE NAVIGATION (mobiel) ===== */
let touchStartX=0, touchStartY=0, touchStartTime=0, touchTracking=false, touchSwiping=false;

function onSwipe(dir){
  if(state.view==='flash'){
    const pool=state.pool;if(!pool||!pool.length)return;
    if(dir==='left'){
      if(state.idx<pool.length-1){state.idx++;state.flipped=false;render()}
    }else{
      if(state.idx>0){state.idx--;state.flipped=false;render()}
    }
  }else if(state.view==='book-lesson'){
    const g=GRAMMAR[state.bookLesson];
    if(state.bookTab==='oefenen'){
      const total=g&&g.exercises?g.exercises.length:0;
      if(!total)return;
      if(dir==='left'){if((state.gramIdx||0)<total-1){state.gramIdx=(state.gramIdx||0)+1;render()}}
      else{if((state.gramIdx||0)>0){state.gramIdx=(state.gramIdx||0)-1;render()}}
    }else if(state.bookTab==='uitleg'||state.bookTab==='voorbeelden'){
      const sb=document.querySelector('.gl-panel [data-gl="'+(dir==='left'?'next':'prev')+'"]');
      if(sb) sb.click();
    }
  }
}

document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const v=state&&state.view;
  if(v!=='flash' && v!=='learn' && v!=='book-lesson'){touchTracking=false;return}
  const t=e.touches[0];
  touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now();
  touchTracking=true;touchSwiping=false;
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!touchTracking)return;
  const t=e.touches[0];
  const dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
  if(!touchSwiping && Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.3){
    touchSwiping=true;
  }
},{passive:true});

document.addEventListener('touchend',e=>{
  const wasSwipe=touchSwiping;
  touchTracking=false;touchSwiping=false;
  if(!wasSwipe)return;
  const target=e.target;
  if(target&&target.closest&&target.closest('input,textarea,select,.type-row,.lesson-tabs,.tabbar,.app-header'))return;
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  if(dt>900)return;
  if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy))return;
  onSwipe(dx<0?'left':'right');
},{passive:true});

load();render();

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'import-backup-input'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
      try {
        const json = JSON.parse(evt.target.result);
        const data = json.data || json;
        let count = 0;
        for(const k in data){
          if(k.startsWith('alm_')){
            localStorage.setItem(k, typeof data[k] === 'string' ? data[k] : JSON.stringify(data[k]));
            count++;
          }
        }
        showToast(`Voortgang hersteld (${count} items)!`);
        setTimeout(function(){ window.location.reload(); }, 600);
      } catch(err){
        alert('Ongeldig back-up bestand: ' + err.message);
      }
    };
    reader.readAsText(file);
  }
});

// Phone Back Button History Navigation
function pushNavState(view, extra){
  try {
    const s = Object.assign({ view: view, lesson: state.lesson, bookLesson: state.bookLesson }, extra || {});
    history.pushState(s, '', '#' + view);
  } catch(e){}
}

window.addEventListener('popstate', function(e){
  if(e.state && e.state.view){
    state.view = e.state.view;
    if(e.state.lesson !== undefined) state.lesson = e.state.lesson;
    if(e.state.bookLesson !== undefined) state.bookLesson = e.state.bookLesson;
    render();
  } else if(!window.location.hash || window.location.hash === '' || window.location.hash === '#/'){
    state.view = 'home';
    render();
  }
});
