r":"هَذَا الْكِتَابُ لِأَحْمَدَ وَذَلِكَ لِإِبْرَاهِيمَ.","nl":"Dit boek is van Ahmad en dat is van Ibraahiem."},{"ar":"ذَهَبَ أَبِي إِلَى بَغْدَادَ وَجُدَّةَ وَوَاشِنْطُنَ.","nl":"Mijn vader ging naar Bagdad, Djedda en Washington."},{"ar":"فِي هَذِهِ الْمَدِينَةِ مَسَاجِدُ، صَلَّيْتُ فِي مَسَاجِدَ كَثِيرَةٍ.","nl":"In deze stad zijn moskeeën; ik bad in vele moskeeën."}]},{"sec":"Woordenlijst van Les 23 (blz. 93)","lead":"Woordenlijst van Les 23","ps":["إِصْطَنْبُولُ Istanbul · الطَّائِفُ Taif (stad in Saoedi-Arabië) · وَاشِنْطُنُ Washington"],"ex":[]}],"examples":[{"ar":"مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنْ بَاكِسْتَانَ.","nl":"Waar kom jij vandaan? Ik kom uit Pakistan."},{"ar":"أَيْنَ كِتَابُ زَيْنَبَ وَدَفْتَرُ حَمْزَةَ؟","nl":"Waar zijn het boek van Zainab en het schrift van Hamzah?"},{"ar":"سَافَرَ الْمُدِيرُ مِنْ جُدَّةَ إِلَى إِصْطَنْبُولَ.","nl":"De directeur reisde van Djedda naar Istanbul."}],"exercises":[{"q":"Welke uitgang krijgt een diptoot (zoals أَحْمَدُ، إِبْرَاهِيمُ، زَيْنَبُ of بَغْدَادُ) wanneer het Madjroer (genitief) is?","options":["Een Fathah (-a) in plaats van een Kasrah: مِنْ أَحْمَدَ / كِتَابُ إِبْرَاهِيمَ","Een Kasrah (-i): مِنْ أَحْمَدِ","Een Tanwien (-in): مِنْ أَحْمَدٍ","Een Dammah (-oe): مِنْ أَحْمَدُ"],"answer":0,"explain":"Bij diptoten is de genitief-uitgang (na een voorzetsel of als Moedaaf Ilaih) een Fathah (-a) in plaats van een Kasrah (blz. 92)."},{"q":"Kies de juiste combinatie: «van Bilaal en van Ahmad»:","options":["مِنْ بِلَالٍ وَمِنْ أَحْمَدَ","مِنْ بِلَالٍ وَمِنْ أَحْمَدٍ","مِنْ بِلَالِ وَمِنْ أَحْمَدِ","مِنْ بِلَالَ وَمِنْ أَحْمَدَ"],"answer":0,"explain":"بِلَالٌ is regelmatig (→ مِنْ بِلَالٍ met Kasrah-tanwien), terwijl أَحْمَدُ een diptoot is (→ مِنْ أَحْمَدَ met Fathah)."},{"q":"Kies de juiste vorm voor «het huis van Zainab en de auto van Hamzah»:","options":["بَيْتُ زَيْنَبَ وَسَيَّارَةُ حَمْزَةَ","بَيْتُ زَيْنَبِ وَسَيَّارَةُ حَمْزَةِ","بَيْتُ زَيْنَبٍ وَسَيَّارَةُ حَمْزَةٍ","الْبَيْتُ زَيْنَبُ"],"answer":0,"explain":"Zowel زَيْنَبُ (vrouwelijke naam) als حَمْزَةُ (mannelijke naam op ة) zijn diptoten en krijgen als Moedaaf Ilaih een Fathah (-a)."},{"q":"Welke van deze plaatsnamen in Les 23 heeft WEL الْ (en krijgt daardoor gewoon een Kasrah na مِنْ)?","options":["الطَّائِفُ (مِنَ الطَّائِفِ)","إِصْطَنْبُولُ (مِنْ إِصْطَنْبُولَ)","وَاشِنْطُنُ (مِنْ وَاشِنْطُنَ)","بَغْدَادُ (مِنْ بَغْدَادَ)"],"answer":0,"explain":"الطَّائِفُ heeft het lidwoord الْ (مِنَ الطَّائِفِ), terwijl إِصْطَنْبُولُ، وَاشِنْطُنُ en بَغْدَادُ diptoten zijn (blz. 93)."}],"fullText":[{"h":"Kern van Les 23 (blz. 92–93)"},{"p":"Ontknoping van Deel 1: Diptoten krijgen in de Genitief (Madjroer) een Fathah (-a) in plaats van een Kasrah!"},{"p":"We hebben geleerd dat een naamwoord genitief (Madjroer) is wanneer: (a) het vooraf wordt gegaan door een voorzetsel (Harf Djarr), of (b) het Moedaaf Ilaih is."},{"p":"Merk op dat een diptoot in deze twee situaties een Fathah («-a») krijgt in plaats van een Kasrah («-ie»)! (Tenzij de diptoot zelf الْ heeft of Moedaaf is)."},{"table":{"headers":["Naamwoord","Type","Na voorzetsel (Harf Djarr)","Als Moedaaf Ilaih"],"rows":[["بِلَالٌ","Regelmatig (met Tanwien)","مِنْ بِلَالٍ (met Kasrah -in)","كِتَابُ بِلَالٍ"],["أَحْمَدُ","Diptoot (أَفْعَلُ)","مِنْ أَحْمَدَ (met Fathah -a!)","كِتَابُ أَحْمَدَ"],["إِبْرَاهِيمُ","Diptoot (niet-Arabisch)","مِنْ إِبْرَاهِيمَ (met Fathah -a!)","كِتَابُ إِبْرَاهِيمَ"],["زَيْنَبُ / لَنْدَنُ","Diptoot (vr. / stad)","إِلَى زَيْنَبَ · مِنْ لَنْدَنَ","بَيْتُ زَيْنَبَ"],["مَسَاجِدُ / فَنَادِقُ","Diptoot (مَفَاعِلُ)","فِي مَسَاجِدَ كَثِيرَةٍ","أَبْوَابُ مَسَاجِدَ"]]}},{"ar":"هَذَا الْكِتَابُ لِأَحْمَدَ وَذَلِكَ لِإِبْرَاهِيمَ.","nl":"Dit boek is van Ahmad en dat is van Ibraahiem."},{"ar":"ذَهَبَ أَبِي إِلَى بَغْدَادَ وَجُدَّةَ وَوَاشِنْطُنَ.","nl":"Mijn vader ging naar Bagdad, Djedda en Washington."},{"ar":"فِي هَذِهِ الْمَدِينَةِ مَسَاجِدُ، صَلَّيْتُ فِي مَسَاجِدَ كَثِيرَةٍ.","nl":"In deze stad zijn moskeeën; ik bad in vele moskeeën."},{"h":"Woordenlijst van Les 23 (blz. 93)"},{"p":"Woordenlijst van Les 23"},{"p":"إِصْطَنْبُولُ Istanbul · الطَّائِفُ Taif (stad in Saoedi-Arabië) · وَاشِنْطُنُ Washington"}]},"24":{"title":"Madinah Arabic Reader 8 · المَفْعُولُ فِيهِ (الظُّرُوف) & لَوْ الشَّرْطِيَّة · مِنْ قَبْلُ","summary":"Letterlijke les en oefeningen (تَمَارِينُ) uit «Dr. V. Abdur Rahim – Madinah Arabic Reader - 8 (2019)» (blz. 3–14) — الظُّرُوفُ الْمُعْرَبَةُ وَالْمَبْنِيَّةُ، مَا يَنُوبُ عَنِ الظَّرْفِ، حَرْفُ الشَّرْطِ (لَوْ) en بِنَاءُ قَبْلُ وَبَعْدُ عَلَى الضَّمِّ.","points":["1) المَفْعُولُ فِيهِ (الظَّرْفُ): Bijwoorden van tijd (ظَرْفُ زَمَانٍ zoals يَوْمَ، لَيْلًا، غَدًا، قَبْلَ، بَعْدَ) en plaats (ظَرْفُ مَكَانٍ zoals أَمَامَ، خَلْفَ، تَحْتَ، فَوْقَ، عِنْدَ) staan in de accusatief (Mansoeb).","2) الظُّرُوفُ الْمَبْنِيَّةُ (Onveranderlijke bijwoorden in de positie van Nasb): مَتَى (Soekoen), أَيْنَ (Fathah), أَمْسِ (Kasrah), قَطُّ (Dammah), هُنَا (Soekoen), الْآنَ (Fathah), حَيْثُ (Dammah).","3) مَا يَنُوبُ عَنِ الظَّرْفِ (Woorden die optreden als Zarf en Mansoeb krijgen): (a) woorden als كُلَّ، بَعْضَ، نِصْفَ، رُبْعَ vóór een tijds-/plaatswoord (سَافَرْنَا كُلَّ النَّهَارِ), (b) het bijvoeglijk naamwoord ervan (جَلَسْتُ طَوِيلًا), (c) een aanwijzend voornaamwoord (جِئْتُ هَذَا الْأُسْبُوعَ), (d) een getal of كَمْ (مَكَثْتُ فِي بَغْدَادَ أَرْبَعَةَ أَيَّامٍ).","4) حَرْفُ الشَّرْطِ (لَوْ): geeft een niet-vervulde voorwaarde in het verleden aan (حَرْفُ امْتِنَاعٍ لِامْتِنَاعٍ). Een bevestigende hoofdzin (Djawaab) krijgt لَـ (لَوِ اجْتَهَدْتَ لَنَجَحْتَ); een ontkennende Djawaab met مَا krijgt géén لَـ (لَوْ عَرَفْتُ مَا تَأَخَّرْتُ).","5) مِنْ قَبْلُ en مِنْ بَعْدُ krijgen een vaste Dammah (-oe) wanneer de Moedaaf Ilaih wordt weggelaten: ﴿لِلَّهِ الْأَمْرُ مِنْ قَبْلُ وَمِنْ بَعْدُ﴾."],"cards":[{"sec":"Reader 8 · Dialoog & Kernzinnen (blz. 3–4)","lead":"Hoofddialoog uit Madinah Arabic Reader – 8 (blz. 3–4):","ps":["Beluister en bestudeer de originele zinnen uit de openingsdialoog van Madinah Arabic Reader - 8 tussen de leraar (الْمُدَرِّسُ) en de studenten Ahmad, al-Hoesayn, 'Alie, Djamaal en az-Zoebayr:"],"ex":[{"ar":"أُرَحِّبُ بِكُمْ فِي الْيَوْمِ الْأَوَّلِ مِنَ الْعَامِ الْجَدِيدِ. مَتَى وَصَلْتُمْ مِنْ بِلَادِكُمْ؟","nl":"Ik heet jullie welkom op de eerste dag van het nieuwe jaar. Wanneer zijn jullie aangekomen uit jullie landen?"},{"ar":"وَصَلْنَا قَبْلَ أُسْبُوعٍ. أَمَّا أَنَا فَوَصَلْتُ أَمْسِ.","nl":"Wij zijn een week geleden aangekomen. Wat mij betreft, ik ben gisteren (أَمْسِ) aangekomen."},{"ar":"أَنَا وَصَلْتُ يَوْمَ الثُّلَاثَاءِ، وَذَهَبْتُ إِلَى مَكَّةَ لِأَدَاءِ الْعُمْرَةِ، وَبَقِيتُ هُنَاكَ ثَلَاثَةَ أَيَّامٍ، وَرَجَعْتُ الْبَارِحَةَ.","nl":"Ik kwam dinsdag aan, ging naar Mekka voor de 'Umrah, bleef daar drie dagen en keerde afgelopen nacht terug."},{"ar":"اِجْلِسْ حَيْثُ شِئْتَ.","nl":"Ga zitten waar (حَيْثُ) je wilt."},{"ar":"لَا أُرِيدُ أَنْ أَجْلِسَ تَحْتَ الْمِرْوَحَةِ فَإِنَّ ذَلِكَ يَضُرُّنِي، أَفَأَجْلِسُ خَلْفَ جَمَالٍ؟","nl":"Ik wil niet onder de ventilator zitten want dat schaadt mij; mag ik dan achter Djamaal zitten?"},{"ar":"كَمْ لَبِثْتَ ثَمَّ يَا أُسْتَاذُ؟ لَبِثْتُ ثَمَّةَ يَوْمًا أَوْ بَعْضَ يَوْمٍ.","nl":"Hoe lang bent u daar (ثَمَّ) gebleven, o leraar? Ik ben daar een dag of een deel van een dag gebleven."},{"ar":"لَوْ عَرَفْتُ أَنَّكَ تَأْتِي إِلَى بَلَدِي لَاسْتَقْبَلْتُكَ فِي الْمَطَارِ.","nl":"Als ik had geweten dat u naar mijn land kwam, had ik u opgewacht op de luchthaven."},{"ar":"أَلَمْ تُسَافِرْ إِلَيْهَا مِنْ قَبْلُ؟ نَعَمْ، لَمْ أُسَافِرْ إِلَيْهَا قَطُّ.","nl":"Bent u er nooit eerder (مِنْ قَبْلُ) naartoe gereisd? Ja, ik ben er nog nooit (قَطُّ) naartoe gereisd."}]},{"sec":"Reader 8 · 1) المَفْعُولُ فِيهِ & الظُّرُوفُ الْمَبْنِيَّةُ (blz. 5–6)","lead":"1) الظَّرْفُ (Tijd & Plaats) en de 7 onveranderlijke bijwoorden (الظُّرُوفُ الْمَبْنِيَّةُ):","ps":["De Maf'oel fiehi (المَفْعُولُ فِيهِ / الظَّرْفُ) is een naamwoord in de accusatief (Mansoeb) dat de tijd (ظَرْفُ زَمَانٍ) of de plaats (ظَرْفُ مَكَانٍ) van de handeling aangeeft.","De meeste Zurûf krijgen een Fathah (-a/-an), maar een aantal veelgebruikte Zurûf is onveranderlijk (مَبْنِيٌّ فِي مَحَلِّ نَصْبٍ):"],"table":{"headers":["Zarf (Onveranderlijk / Mabnie)","Type & Eindklank","Voorbeeld uit Reader 8 (blz. 5)","Vertaling"],"rows":[["مَتَى","Tijd · Mabnie op Soekoen","مَتَى خَرَجْتَ؟","Wanneer ben je naar buiten gegaan?"],["أَيْنَ","Plaats · Mabnie op Fathah","أَيْنَ تَدْرُسُ؟","Waar studeer je?"],["أَمْسِ","Tijd · Mabnie op Kasrah (-i!)","لَمْ أَغِبْ أَمْسِ.","Ik was gisteren niet afwezig."],["قَطُّ","Tijd (verleden ontkenning) · Dammah","لَمْ أَذُقْ هَذِهِ الْفَاكِهَةَ قَطُّ.","Ik heb dit fruit nog nooit geproefd."],["هُنَا","Plaats · Mabnie op Soekoen","اِجْلِسْ هُنَا.","Ga hier zitten."],["الْآنَ","Tijd · Mabnie op Fathah","الْآنَ جِئْتَ؟","Kom je nu pas?"],["حَيْثُ","Plaats · Mabnie op Dammah (-oe!)","اِجْلِسْ حَيْثُ شِئْتَ.","Ga zitten waar je wilt."]]},"ex":[]},{"sec":"Reader 8 · 2) أَسْمَاءٌ تَنُوبُ عَنِ الظَّرْفِ (blz. 6)","lead":"2) De 4 categorieën woorden die optreden als Zarf (نَائِبٌ عَنِ الظَّرْفِ):","ps":["Op blz. 6 van Madinah Arabic Reader 8 leer je vier soorten woorden die zelf geen Zarf zijn, maar de positie (en de Mansoeb-uitgang!) van de Zarf overnemen:"],"table":{"headers":["Categorie (نَائِبٌ عَنِ الظَّرْفِ)","Voorbeeld uit Reader 8 (blz. 6)","Uitleg"],"rows":[["(١) الْمُضَافُ إِلَى الظَّرْفِ (كُلّ، بَعْض، رُبْع، نِصْف)","سَافَرْنَا كُلَّ النَّهَارِ · اِنْتَظَرْتُكَ رُبْعَ سَاعَةٍ · مَشَيْتُ نِصْفَ كِيلُو مِتْرٍ","كُلَّ، رُبْعَ en نِصْفَ zijn Mansoeb omdat ze Moedaaf zijn naar een Zarf."],["(٢) صِفَتُهُ (Bijvoeglijk naamwoord)","جَلَسْتُ طَوِيلًا (أَيْ: وَقْتًا طَوِيلًا)","طَوِيلًا vervangt het weggelaten tijdswoord وَقْتًا."],["(٣) اسْمُ الْإِشَارَةِ (Aanwijzend vnw.)","جِئْتُ هَذَا الْأُسْبُوعَ","هَذَا treedt op als Zarf gevolgd door de Badal الْأُسْبُوعَ."],["(٤) الْعَدَدُ (Getal + tijds-/plaatsmaat)","مَكَثْتُ فِي بَغْدَادَ أَرْبَعَةَ أَيَّامٍ · سِرْنَا مِائَةَ كِيلُو مِتْرٍ","أَرْبَعَةَ en مِائَةَ zijn Mansoeb als plaatsvervanger van de Zarf."]]},"ex":[]},{"sec":"Reader 8 · 3) حَرْفُ الشَّرْطِ (لَوْ) & مِنْ قَبْلُ / مِنْ بَعْدُ (blz. 8–10)","lead":"3) Voorwaardelijke zinnen met لَوْ en wanneer قَبْلُ / بَعْدُ op Dammah eindigen:","ps":["• لَوْ (حَرْفُ امْتِنَاعٍ لِامْتِنَاعٍ) geeft aan dat iets in het verleden niet is gebeurd omdat de voorwaarde niet vervuld was.","• Als het antwoord (de Djawaab) bevestigend is, krijgt het werkwoord de prefix لَـ: لَوِ اجْتَهَدْتَ لَنَجَحْتَ (Als je hard had gewerkt, was je geslaagd). Als de Djawaab ontkennend is met مَا, laat je لَـ meestal weg: لَوْ عَرَفْتُ أَنَّ الِاخْتِبَارَ الْيَوْمَ مَا تَأَخَّرْتُ.","• Normaal eindigen قَبْلَ en بَعْدَ na مِنْ op een Kasrah wanneer de Moedaaf Ilaih genoemd wordt (مِنْ قَبْلِ ذَلِكَ). Maar wanneer de Moedaaf Ilaih wordt weggelaten, krijgen zij een vaste Dammah (-oe): مِنْ قَبْلُ en مِنْ بَعْدُ!"],"table":{"headers":["Constructie","Voorbeeld uit Reader 8 (blz. 8–10)","Betekenis"],"rows":[["لَوْ + bevestigende Djawaab (met لَـ)","لَوْ سَمِعْتَ قِصَّتَهُ لَبَكَيْتَ.","Als je zijn verhaal had gehoord, zou je hebben gehuild."],["لَوْ + ontkennende Djawaab (met مَا)","لَوْ حَضَرْتَ أَمْسِ مَا شَكَوْتُكَ إِلَى الْمُدِيرِ.","Als je gisteren aanwezig was geweest, had ik niet over je geklaagd bij de directeur."],["مِنْ قَبْلُ / مِنْ بَعْدُ (zonder Moedaaf Ilaih)","﴿لِلَّهِ الْأَمْرُ مِنْ قَبْلُ وَمِنْ بَعْدُ﴾ · وَكُنْتُ مُدِيرًا مِنْ قَبْلُ","Aan Allah behoort het bevel voorheen en daarna · En ik was voorheen directeur."]]},"ex":[]}],"examples":[{"ar":"جَلَسَ الزُّوَّارُ عِنْدَ الْمُدِيرِ نِصْفَ سَاعَةٍ.","nl":"De bezoekers zaten een half uur bij de directeur."},{"ar":"أَقَبْلَ الْأَذَانِ ذَهَبْتَ إِلَى الْمَسْجِدِ أَمْ بَعْدَهُ؟","nl":"Ben je vóór de Adhaan naar de moskee gegaan of erna?"},{"ar":"لَوْ تَأَخَّرْتُ دَقِيقَتَيْنِ لَفَاتَتْنِي الطَّائِرَةُ.","nl":"Als ik twee minuten te laat was geweest, had ik het vliegtuig gemist."},{"ar":"لَوْ قَرَأْتَ هَذِهِ الْقِصَّةَ لَضَحِكْتَ كَثِيرًا.","nl":"Als je dit verhaal had gelezen, zou je veel hebben gelachen."},{"ar":"لَوْ عَرَفْتُ أَنَّ الْمُدَرِّسَ مُسَافِرٌ مَا جِئْتُ.","nl":"Als ik had geweten dat de leraar op reis was, was ik niet gekomen."}],"exercises":[{"q":"[Reader 8 · blz. 4, Oef. 1.1] مَتَى وَصَلَ الْحُسَيْنُ؟ (Wanneer kwam al-Hoesayn aan, en hoe is de uitgang van dat bijwoord?)","options":["وَصَلَ الْحُسَيْنُ أَمْسِ (अَمْسِ is ظَرْفُ زَمَانٍ مَبْنِيٌّ عَلَى الْكَسْرِ)","وَصَلَ الْحُسَيْنُ أَمْسَ (met Fathah)","وَصَلَ الْحُسَيْنُ أَمْسٌ (met Tanwien)","وَصَلَ الْحُسَيْنُ قَطُّ"],"answer":0,"explain":"In de dialoog zegt al-Hoesayn: أَمَّا أَنَا فَوَصَلْتُ أَمْسِ. Het bijwoord أَمْسِ («gisteren») is altijd mabnie op Kasrah (-i)."},{"q":"[Reader 8 · blz. 4, Oef. 1.2] كَمْ يَوْمًا بَقِيَ عَلِيٌّ فِي مَكَّةَ؟ Waarom staat ثَلَاثَةَ in «بَقِيَ ثَلَاثَةَ أَيَّامٍ» in de accusatief (-a)?","options":["Omdat het getal optreedt als plaatsvervanger van de Zarf (نَائِبٌ عَنْ ظَرْفِ الزَّمَانِ مَنْصُوبٌ)","Omdat het Moedaaf Ilaih is","Omdat het een diptoot is","Omdat فِي ervoor staat"],"answer":0,"explain":"Een getal gevolgd door een tijdswoord (ثَلَاثَةَ أَيَّامٍ / أَرْبَعَةَ أَيَّامٍ) neemt de Mansoeb-positie van de Zarf over (blz. 6, punt 4)."},{"q":"[Reader 8 · blz. 6, Oef. 4.2] Welke woorden treden op als Zarf in: «جَلَسَ الزُّوَّارُ عِنْدَ الْمُدِيرِ نِصْفَ سَاعَةٍ»?","options":["عِنْدَ (ظَرْفُ مَكَانٍ) en نِصْفَ (نَائِبٌ عَنْ ظَرْفِ الزَّمَانِ omdat het Moedaaf is naar سَاعَةٍ)","Alleen الزُّوَّارُ","Alleen الْمُدِيرِ","سَاعَةٍ is Marfoe'"],"answer":0,"explain":"عِنْدَ is een Zarf Makaan en نِصْفَ treedt op als Zarf Zamaan (Mansoeb) omdat het Moedaaf is naar een tijdswoord (blz. 6–7)."},{"q":"[Reader 8 · blz. 7, Oef. 4.8] Waarom heeft كُلَّ een Fathah (-a) in «نِمْتَ كُلَّ اللَّيْلِ» (Je hebt de hele nacht geslapen)?","options":["Omdat كُلَّ Moedaaf is naar het tijdswoord اللَّيْلِ en daardoor optreedt als Zarf (نَائِبٌ عَنِ الظَّرْفِ)","Omdat كُلَّ het onderwerp is","Omdat كُلَّ altijd een Fathah heeft","Omdat اللَّيْلِ Mansoeb is"],"answer":0,"explain":"Woorden als كُلّ، بَعْض، نِصْف en رُبْع worden Mansoeb als نَائِبٌ عَنِ الظَّرْفِ wanneer ze Moedaaf zijn naar een Zarf (blz. 6)."},{"q":"[Reader 8 · blz. 8, Oef. 5.5] Wat is het verschil tussen الْيَوْمَ en يَوْمِكُمْ in het vers: ﴿وَقِيلَ الْيَوْمَ نَنسَاكُمْ كَمَا نَسِيتُمْ لِقَاءَ يَوْمِكُمْ هَذَا﴾?","options":["الْيَوْمَ is ظَرْفُ زَمَانٍ مَنْصُوبٌ (-a), terwijl يَوْمِكُمْ Moedaaf Ilaih is na لِقَاءَ en dus مَجْرُورٌ (-i)","Beide zijn Zarf Zamaan","الْيَوْمَ is lijdend voorwerp","يَوْمِكُمْ is onveranderlijk"],"answer":0,"explain":"Alleen het eerste الْيَوْمَ («Vandaag») geeft het tijdstip van het werkwoord aan (Zarf Mansoeb); يَوْمِكُمْ is Moedaaf Ilaih na لِقَاءَ (blz. 8)."},{"q":"[Reader 8 · blz. 9, Oef. 1.3] Verbind met لَوْ: «تَأَخَّرْتُ دَقِيقَتَيْنِ / فَاتَتْنِي الطَّائِرَةُ» (Ik was 2 minuten te laat / ik miste het vliegtuig):","options":["لَوْ تَأَخَّرْتُ دَقِيقَتَيْنِ لَفَاتَتْنِي الطَّائِرَةُ.","لَوْ تَأَخَّرْتُ دَقِيقَتَيْنِ فَاتَتْنِي الطَّائِرَةُ.","لَوْ تَأَخَّرْتُ دَقِيقَتَيْنِ مَا فَاتَتْنِي الطَّائِرَةُ.","إِذَا تَأَخَّرْتُ لَفَاتَتْنِي."],"answer":0,"explain":"Bij لَوْ krijgt een bevestigende hoofdzin (Djawaab) de prefix لَـ: لَفَاتَتْنِي الطَّائِرَةُ (blz. 9)."},{"q":"[Reader 8 · blz. 9, Oef. 1.2] Verbind met لَوْ: «عَرَفْتُ أَنَّ الْمُدَرِّسَ مُسَافِرٌ / مَا جِئْتُ»:","options":["لَوْ عَرَفْتُ أَنَّ الْمُدَرِّسَ مُسَافِرٌ مَا جِئْتُ.","لَوْ عَرَفْتُ أَنَّ الْمُدَرِّسَ مُسَافِرٌ لَمَا جِئْتُ.","لَوْ عَرَفْتُ أَنَّ الْمُدَرِّسَ مُسَافِرٌ لَجِئْتُ.","لَوْ عَرَفْتُ لَا جِئْتُ."],"answer":0,"explain":"Wanneer de Djawaab van لَوْ ontkennend is met مَا, komt er géén لَـ voor مَا: مَا جِئْتُ (blz. 8–9)."},{"q":"[Reader 8 · blz. 10] Waarom eindigt قَبْلُ op een Dammah (-oe) in «أَلَمْ تُسَافِرْ إِلَيْهَا مِنْ قَبْلُ؟» en «﴿لِلَّهِ الْأَمْرُ مِنْ قَبْلُ وَمِنْ بَعْدُ﴾»?","options":["Omdat de Moedaaf Ilaih is weggelaten (مَبْنِيٌّ عَلَى الضَّمِّ)","Omdat مِنْ een Dammah veroorzaakt","Omdat het onderwerp is","Omdat het een diptoot is"],"answer":0,"explain":"Wanneer na قَبْل en بَعْد de Moedaaf Ilaih (zoals ذَلِكَ) wordt weggelaten maar wel bedoeld wordt, zijn zij mabnie op Dammah: مِنْ قَبْلُ en مِنْ بَعْدُ (blz. 10)."},{"q":"[Reader 8 · blz. 10, Algemene Oef. 1] Wat is de juiste المضارع (tegenwoordige tijd) van de werkwoorden اِسْتَقْبَلَ، مَكَثَ en لَبِثَ?","options":["يَسْتَقْبِلُ · يَمْكُثُ · يَلْبَثُ","يَسْتَقْبَلُ · يَمْكِثُ · يَلْبُثُ","يُسْتَقْبِلُ · يَمْكَثُ · يَلْبِثُ","تَسْتَقْبَلُ · تَمْكُثُ"],"answer":0,"explain":"اِسْتَقْبَلَ → يَسْتَقْبِلُ (stam X), مَكَثَ → يَمْكُثُ (u-klinker), لَبِثَ → يَلْبَثُ (a-klinker) (blz. 10)."}],"fullText":[{"h":"Reader 8 · Dialoog & Kernzinnen (blz. 3–4)"},{"p":"Hoofddialoog uit Madinah Arabic Reader – 8 (blz. 3–4):"},{"p":"Beluister en bestudeer de originele zinnen uit de openingsdialoog van Madinah Arabic Reader - 8 tussen de leraar (الْمُدَرِّسُ) en de studenten Ahmad, al-Hoesayn, 'Alie, Djamaal en az-Zoebayr:"},{"ar":"أُرَحِّبُ بِكُمْ فِي الْيَوْمِ الْأَوَّلِ مِنَ الْعَامِ الْجَدِيدِ. مَتَى وَصَلْتُمْ مِنْ بِلَادِكُمْ؟","nl":"Ik heet jullie welkom op de eerste dag van het nieuwe jaar. Wanneer zijn jullie aangekomen uit jullie landen?"},{"ar":"وَصَلْنَا قَبْلَ أُسْبُوعٍ. أَمَّا أَنَا فَوَصَلْتُ أَمْسِ.","nl":"Wij zijn een week geleden aangekomen. Wat mij betreft, ik ben gisteren (أَمْسِ) aangekomen."},{"ar":"أَنَا وَصَلْتُ يَوْمَ الثُّلَاثَاءِ، وَذَهَبْتُ إِلَى مَكَّةَ لِأَدَاءِ الْعُمْرَةِ، وَبَقِيتُ هُنَاكَ ثَلَاثَةَ أَيَّامٍ، وَرَجَعْتُ الْبَارِحَةَ.","nl":"Ik kwam dinsdag aan, ging naar Mekka voor de 'Umrah, bleef daar drie dagen en keerde afgelopen nacht terug."},{"ar":"اِجْلِسْ حَيْثُ شِئْتَ.","nl":"Ga zitten waar (حَيْثُ) je wilt."},{"ar":"لَا أُرِيدُ أَنْ أَجْلِسَ تَحْتَ الْمِرْوَحَةِ فَإِنَّ ذَلِكَ يَضُرُّنِي، أَفَأَجْلِسُ خَلْفَ جَمَالٍ؟","nl":"Ik wil niet onder de ventilator zitten want dat schaadt mij; mag ik dan achter Djamaal zitten?"},{"ar":"كَمْ لَبِثْتَ ثَمَّ يَا أُسْتَاذُ؟ لَبِثْتُ ثَمَّةَ يَوْمًا أَوْ بَعْضَ يَوْمٍ.","nl":"Hoe lang bent u daar (ثَمَّ) gebleven, o leraar? Ik ben daar een dag of een deel van een dag gebleven."},{"ar":"لَوْ عَرَفْتُ أَنَّكَ تَأْتِي إِلَى بَلَدِي لَاسْتَقْبَلْتُكَ فِي الْمَطَارِ.","nl":"Als ik had geweten dat u naar mijn land kwam, had ik u opgewacht op de luchthaven."},{"ar":"أَلَمْ تُسَافِرْ إِلَيْهَا مِنْ قَبْلُ؟ نَعَمْ، لَمْ أُسَافِرْ إِلَيْهَا قَطُّ.","nl":"Bent u er nooit eerder (مِنْ قَبْلُ) naartoe gereisd? Ja, ik ben er nog nooit (قَطُّ) naartoe gereisd."},{"h":"Reader 8 · 1) المَفْعُولُ فِيهِ & الظُّرُوفُ الْمَبْنِيَّةُ (blz. 5–6)"},{"p":"1) الظَّرْفُ (Tijd & Plaats) en de 7 onveranderlijke bijwoorden (الظُّرُوفُ الْمَبْنِيَّةُ):"},{"p":"De Maf'oel fiehi (المَفْعُولُ فِيهِ / الظَّرْفُ) is een naamwoord in de accusatief (Mansoeb) dat de tijd (ظَرْفُ زَمَانٍ) of de plaats (ظَرْفُ مَكَانٍ) van de handeling aangeeft."},{"p":"De meeste Zurûf krijgen een Fathah (-a/-an), maar een aantal veelgebruikte Zurûf is onveranderlijk (مَبْنِيٌّ فِي مَحَلِّ نَصْبٍ):"},{"table":{"headers":["Zarf (Onveranderlijk / Mabnie)","Type & Eindklank","Voorbeeld uit Reader 8 (blz. 5)","Vertaling"],"rows":[["مَتَى","Tijd · Mabnie op Soekoen","مَتَى خَرَجْتَ؟","Wanneer ben je naar buiten gegaan?"],["أَيْنَ","Plaats · Mabnie op Fathah","أَيْنَ تَدْرُسُ؟","Waar studeer je?"],["أَمْسِ","Tijd · Mabnie op Kasrah (-i!)","لَمْ أَغِبْ أَمْسِ.","Ik was gisteren niet afwezig."],["قَطُّ","Tijd (verleden ontkenning) · Dammah","لَمْ أَذُقْ هَذِهِ الْفَاكِهَةَ قَطُّ.","Ik heb dit fruit nog nooit geproefd."],["هُنَا","Plaats · Mabnie op Soekoen","اِجْلِسْ هُنَا.","Ga hier zitten."],["الْآنَ","Tijd · Mabnie op Fathah","الْآنَ جِئْتَ؟","Kom je nu pas?"],["حَيْثُ","Plaats · Mabnie op Dammah (-oe!)","اِجْلِسْ حَيْثُ شِئْتَ.","Ga zitten waar je wilt."]]}},{"h":"Reader 8 · 2) أَسْمَاءٌ تَنُوبُ عَنِ الظَّرْفِ (blz. 6)"},{"p":"2) De 4 categorieën woorden die optreden als Zarf (نَائِبٌ عَنِ الظَّرْفِ):"},{"p":"Op blz. 6 van Madinah Arabic Reader 8 leer je vier soorten woorden die zelf geen Zarf zijn, maar de positie (en de Mansoeb-uitgang!) van de Zarf overnemen:"},{"table":{"headers":["Categorie (نَائِبٌ عَنِ الظَّرْفِ)","Voorbeeld uit Reader 8 (blz. 6)","Uitleg"],"rows":[["(١) الْمُضَافُ إِلَى الظَّرْفِ (كُلّ، بَعْض، رُبْع، نِصْف)","سَافَرْنَا كُلَّ النَّهَارِ · اِنْتَظَرْتُكَ رُبْعَ سَاعَةٍ · مَشَيْتُ نِصْفَ كِيلُو مِتْرٍ","كُلَّ، رُبْعَ en نِصْفَ zijn Mansoeb omdat ze Moedaaf zijn naar een Zarf."],["(٢) صِفَتُهُ (Bijvoeglijk naamwoord)","جَلَسْتُ طَوِيلًا (أَيْ: وَقْتًا طَوِيلًا)","طَوِيلًا vervangt het weggelaten tijdswoord وَقْتًا."],["(٣) اسْمُ الْإِشَارَةِ (Aanwijzend vnw.)","جِئْتُ هَذَا الْأُسْبُوعَ","هَذَا treedt op als Zarf gevolgd door de Badal الْأُسْبُوعَ."],["(٤) الْعَدَدُ (Getal + tijds-/plaatsmaat)","مَكَثْتُ فِي بَغْدَادَ أَرْبَعَةَ أَيَّامٍ · سِرْنَا مِائَةَ كِيلُو مِتْرٍ","أَرْبَعَةَ en مِائَةَ zijn Mansoeb als plaatsvervanger van de Zarf."]]}},{"h":"Reader 8 · 3) حَرْفُ الشَّرْطِ (لَوْ) & مِنْ قَبْلُ / مِنْ بَعْدُ (blz. 8–10)"},{"p":"3) Voorwaardelijke zinnen met لَوْ en wanneer قَبْلُ / بَعْدُ op Dammah eindigen:"},{"p":"• لَوْ (حَرْفُ امْتِنَاعٍ لِامْتِنَاعٍ) geeft aan dat iets in het verleden niet is gebeurd omdat de voorwaarde niet vervuld was."},{"p":"• Als het antwoord (de Djawaab) bevestigend is, krijgt het werkwoord de prefix لَـ: لَوِ اجْتَهَدْتَ لَنَجَحْتَ (Als je hard had gewerkt, was je geslaagd). Als de Djawaab ontkennend is met مَا, laat je لَـ meestal weg: لَوْ عَرَفْتُ أَنَّ الِاخْتِبَارَ الْيَوْمَ مَا تَأَخَّرْتُ."},{"p":"• Normaal eindigen قَبْلَ en بَعْدَ na مِنْ op een Kasrah wanneer de Moedaaf Ilaih genoemd wordt (مِنْ قَبْلِ ذَلِكَ). Maar wanneer de Moedaaf Ilaih wordt weggelaten, krijgen zij een vaste Dammah (-oe): مِنْ قَبْلُ en مِنْ بَعْدُ!"},{"table":{"headers":["Constructie","Voorbeeld uit Reader 8 (blz. 8–10)","Betekenis"],"rows":[["لَوْ + bevestigende Djawaab (met لَـ)","لَوْ سَمِعْتَ قِصَّتَهُ لَبَكَيْتَ.","Als je zijn verhaal had gehoord, zou je hebben gehuild."],["لَوْ + ontkennende Djawaab (met مَا)","لَوْ حَضَرْتَ أَمْسِ مَا شَكَوْتُكَ إِلَى الْمُدِيرِ.","Als je gisteren aanwezig was geweest, had ik niet over je geklaagd bij de directeur."],["مِنْ قَبْلُ / مِنْ بَعْدُ (zonder Moedaaf Ilaih)","﴿لِلَّهِ الْأَمْرُ مِنْ قَبْلُ وَمِنْ بَعْدُ﴾ · وَكُنْتُ مُدِيرًا مِنْ قَبْلُ","Aan Allah behoort het bevel voorheen en daarna · En ik was voorheen directeur."]]}}]}};

function picHtml(emoji, force){
  if((!force&&!showPics)||!emoji) return '';
  let key=null;
  if(EMOJI_PIC[emoji]) key=EMOJI_PIC[emoji];
  else{
    for(const [em,k] of Object.entries(EMOJI_PIC)){
      if(emoji.includes(em)){key=k;break}
    }
  }
  const url=(key&&PHOTO_URLS[key])||PHOTO_URLS.generic;
  return `<div class="pic-frame pic-photo"><img src="${url}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`;
}
function picFromText(text, force){
  if((!force&&!showPics)||!text)return '';
  const t=String(text);
  // Arabic stems (without harakat)
  const ar=t.replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  const map=[
    ['بيت','house'],['مسجد','mosque'],['باب','door'],['كتاب','book'],['قلم','pen'],['مفتاح','key'],
    ['مكتب','desk'],['سرير','bed'],['كرسي','chair'],['نجم','star'],['قميص','shirt'],['طبيب','doctor'],
    ['ولد','boy'],['طالب','student'],['رجل','man'],['تاجر','merchant'],['كلب','dog'],['قط','cat'],
    ['حمار','donkey'],['فرس','horse'],['حصان','horse'],['جمل','camel'],['ديك','rooster'],
    ['شمس','sun'],['قمر','moon'],['بنت','girl'],['مدرس','teacher'],['سياره','car'],['حقيبه','bag'],
    ['ماء','water'],['تفاح','apple'],['مدرسة','school'],['ساعة','clock']
  ];
  for(const [k,v] of map){if(ar.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  // Dutch hints in explain
  const n=t.toLowerCase();
  const nl=[['huis','house'],['moskee','mosque'],['boek','book'],['pen','pen'],['deur','door'],['jongen','boy'],['meisje','girl'],['man','man'],['leraar','teacher']];
  for(const [k,v] of nl){if(n.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  return '';
}

function logMistake(w, kind, said){
  const id=w&&w.id, ar=(w&&w.ar)||'';
  if(!ar) return;
  mistakes.unshift({id:id||'', ar, kind:kind||'word', said:said||'', t:Date.now()});
  mistakes=mistakes.slice(0,80);
  saveMk();
}
function mistakeStats(){
  const map={};
  mistakes.forEach(m=>{
    const k=m.id||m.ar;
    if(!k) return;
    if(!map[k]) map[k]={id:m.id||'', ar:m.ar, word:0, haraka:0, n:0, last:0, said:''};
    map[k].n++;
    if(m.kind==='haraka') map[k].haraka++; else map[k].word++;
    if(m.t>map[k].last) map[k].last=m.t;
    if(m.said) map[k].said=m.said;
  });
  return Object.values(map).sort((a,b)=>b.n-a.n);
}
function heatOf(id){
  if(!id) return '';
  const n=mistakes.filter(m=>m.id===id).length;
  if(n>=3) return 'hot';
  if(n>=1) return 'warm';
  return '';
}

function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\([^)]*\)/g,'').replace(/[^\p{L}\p{N}\s/]/gu,'').trim().replace(/\s+/g,' ')}
function stripAr(s){
  return String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'').trim();
}
function matchAns(typed,...acc){
  const t=normalize(typed);if(!t)return false;
  // Dutch/English path
  if(acc.flatMap(s=>String(s).split('/')).map(normalize).filter(Boolean).includes(t))return true;

function primeVoices(){

  const pick=()=>{
    try{
      const v=speechSynthesis.getVoices()||[];
      if(!v.length)return;
      voicesReady=true;
      const ar=v.filter(x=>/^ar(?:[-_]|$)/i.test(x.lang||'')||/arabic/i.test(x.name||''));
      if(ar.length){
        const pref=[/google/i,/microsoft/i,/enhanced/i,/premium/i,/natural/i,/maged/i,/tarik/i,/naayf/i];
        for(const re of pref){const f=ar.find(x=>re.test(x.name||''));if(f){arabicVoice=f;return}}

      }
    }catch(e){}
  };
  pick();

}

function unlockAudio(){ audioMuted=false;

  try{speechSynthesis.onvoiceschanged=()=>{refreshArVoices();primeVoices()};refreshArVoices()}catch(e){}
      speechSynthesis.cancel();
      if(speechSynthesis.resume)speechSynthesis.resume();
    }
  }catch(e){}
  if(!unlocked){

// Unieke stem-profielen per spreker (vast voor die naam)
const SPEAKER_PROFILES = {};
const MALE_PROFILES = [
  {rate:0.72, label:'m1'},
  {rate:0.95, label:'m2'},
  {rate:0.80, label:'m3'},
  {rate:1.08, label:'m4'},
  {rate:0.76, label:'m5'},
  {rate:1.00, label:'m6'},
];
const FEMALE_PROFILES = [
  {rate:0.92, label:'f1'},
  {rate:1.18, label:'f2'},
  {rate:1.02, label:'f3'},
  {rate:1.32, label:'f4'},
  {rate:0.96, label:'f5'},
  {rate:1.24, label:'f6'},
];
function profileForSpeaker(who, gender){
  const key=String(who||'onbekend');
  if(SPEAKER_PROFILES[key])return SPEAKER_PROFILES[key];
  const g=gender==='f'?'f':'m';
  const pool=g==='f'?FEMALE_PROFILES:MALE_PROFILES;
  // stabiele index uit naam
  let h=0;
  for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
  // unieke slot: prefer unused profile index
  const used=new Set(Object.values(SPEAKER_PROFILES).filter(p=>p.gender===g).map(p=>p.idx));
  let idx=h%pool.length;
  for(let k=0;k<pool.length;k++){
    const tryIdx=(idx+k)%pool.length;
    if(!used.has(tryIdx)){idx=tryIdx;break}
  }
  const base=pool[idx];
  const prof={rate:base.rate, gender:g, idx, label:base.label};
  SPEAKER_PROFILES[key]=prof;
  return prof;
}
function playBlobPitched(blob, gender, done, who){
  const myGen=audioGen;
  const prof=profileForSpeaker(who, gender);
  const url=URL.createObjectURL(blob);
  const a=getSharedAudio();
  try{a.pause()}catch(e){}
  a.onended=null;a.onerror=null;
  a.src=url;
  // Grote contrasten per spreker (fallback)
  const maleRates=[0.78,0.92,1.08,0.84,1.00,1.16];
  const femaleRates=[0.94,1.10,1.28,1.02,1.18,1.34];
  a.playbackRate=prof.gender==='f'?femaleRates[prof.idx%6]:maleRates[prof.idx%6];
  a.onended=()=>{try{URL.revokeObjectURL(url)}catch(e){}; if(myGen===audioGen&&done)done(true)};
  a.onerror=()=>{try{URL.revokeObjectURL(url)}catch(e){}; if(myGen===audioGen&&done)done(false)};
  activeAudio=a;
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{if(myGen===audioGen&&done)done(false)});
}


function playUrl(src,done){
  try{
    if(audioMuted){if(done)done(false);return}
    stopAudio();
    const a=new Audio();
    activeAudio=a;
    try{a.referrerPolicy='no-referrer'}catch(e){}
    a.setAttribute('referrerpolicy','no-referrer');
    a.setAttribute('playsinline','');
    a.setAttribute('webkit-playsinline','');
    a.preload='auto';
    let settled=false;
    const finish=ok=>{if(settled)return;settled=true;if(done)done(ok)};
    a.onended=()=>finish(true);
    a.onerror=()=>finish(false);
    a.src=src;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>finish(false));
    setTimeout(()=>{if(!settled&&a.paused)finish(false)},4000);
  }catch(e){if(done)done(false)}
}

function playBlob(blob,done){
  try{
    const url=URL.createObjectURL(blob);
    playUrl(url,ok=>{
      try{URL.revokeObjectURL(url)}catch(e){}
      if(done)done(ok);
    });
  }catch(e){if(done)done(false)}
}

/* CORS-friendly Google TTS proxy (works on GitHub Pages) */
function ttsSpell(s){
  // Force audible i'rab: tanween ٌ/ٍ/ً → vowel + nūn
  let o='', t=String(s||'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(c==='ٌ') o+='ُنْ';
    else if(c==='ٍ') o+='ِنْ';
    else if(c==='ً'){
      o+='َنْ';
      if(t[i+1]==='ا') i++;
    }else o+=c;
  }
  return o;
}
function speakProxy(text,done){
  if(audioMuted){if(done)done(false);return}
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://tts-api.netlify.app/?text='+q+'&lang=ar';
  fetch(url,{mode:'cors',credentials:'omit',cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlob(blob,done);
    })
    .catch(()=>{
      if(myGen!==audioGen){if(done)done(false);return}
      playUrl(url,done);
    });
}

function speakGoogle(text,done){
  if(audioMuted){if(done)done(false);return}
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const urls=[
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ar&q='+q,
    'https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q='+q
  ];
  let i=0;
  function next(){
    if(myGen!==audioGen){if(done)done(false);return}
    if(i>=urls.length){if(done)done(false);return}
    const src=urls[i++];
    fetch(src,{referrerPolicy:'no-referrer',mode:'cors',credentials:'omit'})
      .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
      .then(blob=>{
        if(myGen!==audioGen){if(done)done(false);return}
        if(!blob||blob.size<400)throw new Error('empty');
        playBlob(blob,done);
      })
      .catch(()=>{
        if(myGen!==audioGen){if(done)done(false);return}
        playUrl(src,ok=>{if(myGen!==audioGen)return; if(ok){if(done)done(true)}else next()});
      });
  }
  next();
}

function namePhonetic(who){
  if(!who)return '';
  if(NAME_TRANSLIT[who])return NAME_TRANSLIT[who];
  const strip=String(who).replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  if(NAME_TRANSLIT[strip])return NAME_TRANSLIT[strip];
  for(const [k,v] of Object.entries(NAME_TRANSLIT)){
    if(k.replace(/[\u064B-\u065F\u0670]/g,'')===strip)return v;
  }
  return '';
}
function genderOf(who){
  if(!who)return 'm';
  const raw=String(who);
  const w=raw.replace(/[\u064B-\u065F\u0670\u0640]/g,'').trim();
  for(const f of FEMALE_NAMES){
    const fn=String(f).replace(/[\u064B-\u065F\u0670\u0640]/g,'').trim();
    if(fn && w===fn) return 'f';
  }
  if(/ة$/.test(w) || /ى$/.test(w)) return 'f';
  return 'm';
}
let maleArVoices=[], femaleArVoices=[], allArVoices=[];
function refreshArVoices(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices()||[];
  allArVoices=vs.filter(v=>/ar[-_]?/i.test(v.lang||'')||/arab/i.test(v.name||''));
  femaleArVoices=allArVoices.filter(v=>/female|woman|zira|samantha|hedda|naayf|mouna|salma|laila|hala|noura|female/i.test(v.name));
  maleArVoices=allArVoices.filter(v=>/male|man|david|mark|naayf|maged|fahed|talal|male/i.test(v.name));
  // If no gendered names, split list: first half male preference, second female
  if(!femaleArVoices.length && !maleArVoices.length && allArVoices.length){
    maleArVoices=allArVoices.slice(0, Math.ceil(allArVoices.length/2));
    femaleArVoices=allArVoices.slice(Math.floor(allArVoices.length/2));
  }
  if(!maleArVoices.length)maleArVoices=allArVoices.slice();
  if(!femaleArVoices.length)femaleArVoices=allArVoices.slice();
  if(allArVoices.length && !arabicVoice)arabicVoice=allArVoices[0];
}
const speakerVoiceIndex={};
function pickVoiceFor(who){
  refreshArVoices();
  const g=genderOf(who);
  const pool=g==='f'?(femaleArVoices.length?femaleArVoices:allArVoices):(maleArVoices.length?maleArVoices:allArVoices);
  if(!pool.length)return null;
  // stable voice per speaker name
  if(speakerVoiceIndex[who]==null){
    speakerVoiceIndex[who]=Object.keys(speakerVoiceIndex).length % pool.length;
  }
  return pool[speakerVoiceIndex[who] % pool.length];
}

function localLineSrc(text, who){
  const t=String(text||'').trim();
  if(!t) return '';
  const w=String(who||'').trim();
  // unieke stem per persoon (naam + zin)
  if(w) return 'audio/l/'+fnv1a(w+'\t'+t)+'.mp3?'+AUDIO_VER;
  return 'audio/l/'+fnv1a(genderOf(w)+'\t'+t)+'.mp3?'+AUDIO_VER;
}
function localLineSrcLegacy(text, who){
  const t=String(text||'').trim();
  if(!t) return '';
  return 'audio/l/'+fnv1a(genderOf(who||'')+'\t'+t)+'.mp3?'+AUDIO_VER;
}
function speakFile(src, done, onStart){
  if(!src){if(done)done(false);return}
  const myGen=audioGen;
  try{
    const a=new Audio();
    try{a.referrerPolicy='no-referrer'}catch(e){}
    a.setAttribute('playsinline','');
    a.setAttribute('webkit-playsinline','');
    a.preload='auto';
    let settled=false, started=false;
    const finish=ok=>{
      if(settled||myGen!==audioGen)return;
      settled=true;
      clearTimeout(tm);
      clearInterval(poll);
      try{a.onended=null;a.onerror=null;a.onplaying=null;a.ontimeupdate=null}catch(e){}
      if(done)done(!!ok);
    };
    const markStarted=()=>{
      if(started||myGen!==audioGen)return;
      started=true;
      clearTimeout(tm);
      try{if(onStart)onStart()}catch(e){}
    };
    a.onplaying=markStarted;
    a.ontimeupdate=()=>{if(a.currentTime>0.02)markStarted()};
    a.onended=()=>finish(true);
    a.onerror=()=>{if(!started)finish(false)};
    activeAudio=a;
    a.src=src;
    const p=a.play();
    if(p&&p.then)p.catch(()=>{if(!started)finish(false)});
    const poll=setInterval(()=>{
      if(myGen!==audioGen){clearInterval(poll);return}
      if(!a.paused&&a.currentTime>0.02)markStarted();
    },80);
    const tm=setTimeout(()=>{if(!started)finish(false)},2800);
  }catch(e){if(done)done(false)}
}

function speakWord(word,force){
  if(audioMuted && !force)return;
  if(!autoSpeak && !force)return;
  audioMuted=false;
  const t=String(word&&word.ar||word||'').trim();
  if(!t)return;
  unlockAudio();
  stopAudio();
  const myGen=audioGen;
  let usedLocal=false;
  const fallback=()=>{
    if(usedLocal||myGen!==audioGen)return;
    speakProxy(t,ok1=>{
      if(usedLocal||myGen!==audioGen)return;
      if(ok1)return;
      speakGoogle(t,ok2=>{
        if(usedLocal||myGen!==audioGen)return;
        if(ok2)return;
        speakWeb(t);
      });
    });
  };
  const local=localWordSrc(word);
  if(!local){fallback();return}
  speakFile(local, ok=>{
    if(usedLocal||myGen!==audioGen)return;
    if(ok)return;
    fallback();
  }, ()=>{usedLocal=true});
}

function playLines(lines,i){
  const gen=playLinesGen;
  if(audioMuted)return;
  if(gen!==playLinesGen)return;
  if(!lines||i>=lines.length)return;
  const item=lines[i];
  const t=String(item&&item.ar!=null?item.ar:item||'').trim();
  const who=item&&item.who||'';
  if(!t){playLines(lines,i+1);return}
  if(i+1<lines.length){
    const nxt=lines[i+1];
    const src=localLineSrc(String(nxt&&nxt.ar!=null?nxt.ar:nxt||'').trim(), nxt&&nxt.who||'');
    if(src){try{const pre=new Audio(); pre.preload='auto'; pre.src=src}catch(e){}}
  }
  speakDialogueLine(t, who, ()=>{
    if(gen!==playLinesGen)return;
    playLinesTimer=setTimeout(()=>{
      if(gen!==playLinesGen)return;
      playLines(lines,i+1);
    }, 70);
  });
}

function normAr(s){
  return String(s||'')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function arTokensRaw(s){
  return String(s||'').replace(/[؟?!.،,؛:…]+/g,' ').split(/\s+/).filter(Boolean);
}
function arTokens(s){
  return normAr(s).split(/\s+/).filter(Boolean);
}
function endingClass(s){
  let t=String(s||'').replace(/[؟?!.،,؛:…«»"'\s]+$/g,'');
  if(!t)return '';
  if(/ًا$/.test(t) || (t.endsWith('ا') && t.length>=2 && t.slice(-3,-1).indexOf('ً')>=0)) return 'an';
  let i=t.length-1, marks='';
  while(i>=0 && /[\u064B-\u065F\u0670]/.test(t[i])){ marks=t[i]+marks; i--; }
  if(marks.indexOf('ٌ')>=0) return 'un';
  if(marks.indexOf('ٍ')>=0) return 'in';
  if(marks.indexOf('ً')>=0) return 'an';
  if(marks.indexOf('ُ')>=0) return 'u';
  if(marks.indexOf('ِ')>=0) return 'i';
  if(marks.indexOf('َ')>=0) return 'a';
  if(marks.indexOf('ْ')>=0) return 'sukun';
  return '';
}

  }[cls]||'');
}
function splitTash(raw){
  let t=String(raw||'');
  let punct='';
  const pm=t.match(/[؟?!.،,؛:…]+$/);
  if(pm){ punct=pm[0]; t=t.slice(0, -punct.length); }
  if(/ًا$/.test(t)) return {stem:t.slice(0,-2), tash:'ًا', punct};
  let i=t.length-1, marks='';
  while(i>=0 && /[\u064B-\u065F\u0670]/.test(t[i])){ marks=t[i]+marks; i--; }
  if(!marks && t.endsWith('ا') && t.length>=3 && t[t.length-2]==='ً'){
    return {stem:t.slice(0,-2), tash:t.slice(-2), punct};
  }
  return {stem:t.slice(0,i+1), tash:marks, punct};
}
function wrapTash(raw, kind){
  const s=splitTash(raw);
  const inner=esc(s.stem)+(s.tash?('<span class="tash">'+esc(s.tash)+'</span>'):'')+esc(s.punct);
  const k=kind||'wait';
  const tap=k!=='plain';
  return '<span class="tok-'+k+'"'+(tap?(' data-act="tok-tap" data-ar="'+esc(raw)+'"'):'')+'>'+inner+'</span>';
}
function markAr(s, kind){
  return arTokensRaw(s).map(t=>wrapTash(t, kind||'plain')).join(' ');
}

function foldAr(s){
  return normAr(s)
    .replace(/ط/g,'ت')
    .replace(/ض/g,'د')
    .replace(/ص/g,'س')
    .replace(/ظ/g,'ز')
    .replace(/ق/g,'ك')
    .replace(/[ءئؤ]/g,'');
}
function foldLat(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z]/g,'')
    .replace(/oen/g,'un').replace(/oun/g,'un').replace(/uen/g,'un')
    .replace(/oe/g,'u')
    .replace(/aa/g,'a').replace(/ee/g,'i').replace(/ii/g,'i')
    .replace(/uu/g,'u').replace(/oo/g,'u').replace(/ou/g,'u')
    .replace(/kh/g,'k').replace(/th/g,'t').replace(/dh/g,'d')
    .replace(/sh/g,'s').replace(/gh/g,'g')
    .replace(/q/g,'k');
}
function latinScore(said, expected, word){
  const raw=String(said||'');
  if(!/[a-zA-Z]/.test(raw)) return 0;
  const a0=foldLat(raw);
  if(a0.length<2) return 0;
  const vars=[a0, a0.replace(/e/g,'i'), a0.replace(/e/g,'a')];
  const cands=[];
  if(word&&word.translit) cands.push(word.translit);
  cands.push(romanizeAr(expected||(word&&word.ar)||''));
  let best=0;
  for(const a of vars){
  for(const c of cands){
    const b=foldLat(c);
    if(!b) continue;
    if(a===b) best=Math.max(best,1);
    else if(a===b+'n'||a===b+'un'||a===b+'in'||a===b+'an') best=Math.max(best,0.96);
    else if(b===a+'n'||b===a+'un'||b===a+'in') best=Math.max(best,0.9);
    else if(b.startsWith(a) && a.length>=Math.max(3, b.length-3)) best=Math.max(best,0.88);
    else if(a.startsWith(b) && b.length>=3 && a.length<=b.length+3) best=Math.max(best,0.88);
    else {
      const grams=s=>{const g=new Set(); for(let i=0;i<Math.max(0,s.length-1);i++)g.add(s.slice(i,i+2)); return g};
      const A=grams(a), B=grams(b);
      if(A.size&&B.size){
        let inter=0; for(const x of A) if(B.has(x)) inter++;
        best=Math.max(best, 2*inter/(A.size+B.size));
      }
    }
  }
  }
  return best;
}
function arScore(said, expected, word){
  const a0=normAr(said), b0=normAr(expected);
  const a=foldAr(said), b=foldAr(expected);
  let s=0;
  if(a&&b){
    if(a0===b0 || a===b) s=1;
    else if(a===b+'ن'||a===b+'ون'||a===b+'ين'||a===b+'ان'||a===b+'و'||a===b+'ا') s=0.95;
    else if(b===a+'ن'||b===a+'ون'||b===a+'ا'||a===b.slice(0,-1)||b===a.slice(0,-1)) s=0.9;
    else if(a.indexOf(b)>=0 || b.indexOf(a)>=0){
      const shorter=a.length<b.length?a:b, longer=a.length<b.length?b:a;
      if(shorter.length>=3) s=Math.max(s, 0.72+0.18*(shorter.length/longer.length));
    }
    else {
      const grams=x=>{const g=new Set(); for(let i=0;i<Math.max(0,x.length-1);i++)g.add(x.slice(i,i+2)); return g};
      const A=grams(a), B=grams(b);
      if(A.size&&B.size){
        let inter=0; for(const g of A) if(B.has(g)) inter++;
        s=2*inter/(A.size+B.size);
      }
      const ac=a.replace(/[اويىه]/g,''), bc=b.replace(/[اويىه]/g,'');
      if(ac&&bc&&(ac===bc || ac.indexOf(bc)>=0 || bc.indexOf(ac)>=0)) s=Math.max(s,0.82);
    }
  }
  const lat=latinScore(said, expected, word);
  return Math.max(s, lat);
}

function endLabel(cls){
  return ({
    un:'-un ٌ', in:'-in ٍ', an:'-an ً',
    u:'-u ُ', i:'-i ِ', a:'-a َ',
    sukun:'sukūn ْ', drop:'geen uitgang', tan:'tanwīn -n',
    '':'onzeker'
  })[cls]||cls||'onzeker';
}
function splitLatEnd(s){
  const a0=foldLat(s);
  const vars=[a0];
  if(a0){
    const ei=a0.replace(/e/g,'i'); if(ei!==a0) vars.push(ei);
  }
  for(const a of vars){
    if(!a) continue;
    for(const e of ['un','in','an']){
      if(a.endsWith(e) && a.length>e.length+1) return {stem:a.slice(0,-e.length), end:e};
    }
    for(const e of ['u','i']){
      if(a.endsWith(e) && a.length>e.length+1) return {stem:a.slice(0,-e.length), end:e};
    }
  }
  return {stem:a0, end:''};
}
function textHeardEnd(said, expected, word){
  const raw=String(said||'');
  if(!raw.trim()) return {cls:'', conf:0, src:''};
  const want=endingClass(expected);
  const fam=endingFamily(want);
  const tail=raw.replace(/[؟?!.،,؛:\s]+$/g,'');
  if(/ٌ/.test(tail.slice(-2))) return {cls:'un', conf:1, src:'tash'};
  if(/ٍ/.test(tail.slice(-2))) return {cls:'in', conf:1, src:'tash'};
  if(/ً/.test(tail.slice(-3))) return {cls:'an', conf:1, src:'tash'};
  if(/ُ/.test(tail.slice(-1))) return {cls:'u', conf:0.95, src:'tash'};
  if(/ِ/.test(tail.slice(-1))) return {cls:'i', conf:0.95, src:'tash'};
  if(/َ/.test(tail.slice(-1))) return {cls:'a', conf:0.95, src:'tash'};
  if(/[a-zA-Z]/.test(raw)){
    const got=splitLatEnd(raw);
    if(got.end){
      // iOS waqf/pause often yields latin -a for a correct -un. Ignore that.
      if(got.end==='a' && fam==='tan') return {cls:'', conf:0.12, src:'lat'};
      const tanEnd=isTan(got.end);
      const conf=tanEnd?0.93:0.84;
      return {cls:got.end, conf, src:'lat'};
    }
    const wantLat=foldLat((word&&word.translit)||'');
    const saidLat=foldLat(raw);
    if(wantLat && saidLat===wantLat && wantLat.length>=3 && want){

let rollStream=null, rollCtx=null, rollProc=null, rollSrc=null, rollGain=null, rollWork=null, rollAn=null, rollRaf=0;
let rollBuf=null, rollPos=0, rollSr=16000, rollFilled=0;
async function startRoll(){

    rollStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    const AC=window.AudioContext||window.webkitAudioContext;

    rollSr=rollCtx.sampleRate||16000;
    rollBuf=new Float32Array(Math.floor(rollSr*2.8));
    rollPos=0; rollFilled=0;
    rollSrc=rollCtx.createMediaStreamSource(rollStream);
    const push=d=>{
      if(!d||!d.length||!rollBuf) return;
      for(let i=0;i<d.length;i++){
        rollBuf[rollPos]=d[i];
        rollPos=(rollPos+1)%rollBuf.length;
        if(rollFilled<rollBuf.length) rollFilled++;
      }
    };
    let started=false;
    if(rollCtx.audioWorklet){
      try{
        const code='class Cap extends AudioWorkletProcessor{process(i){const x=i[0]&&i[0][0];if(x)this.port.postMessage(x);return true}}registerProcessor("alm-cap",Cap)';
        const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
        await rollCtx.audioWorklet.addModule(url);
        try{URL.revokeObjectURL(url)}catch(e){}
        rollWork=new AudioWorkletNode(rollCtx,'alm-cap');
        rollWork.port.onmessage=e=>push(e.data);
        rollSrc.connect(rollWork);
        rollGain=rollCtx.createGain(); rollGain.gain.value=0.0001;
        rollWork.connect(rollGain); rollGain.connect(rollCtx.destination);
        started=true;
      }catch(e){ started=false; }
    }
    if(!started && rollCtx.createScriptProcessor){
      rollProc=rollCtx.createScriptProcessor(4096,1,1);
      rollProc.onaudioprocess=e=>push(e.inputBuffer.getChannelData(0));
      rollGain=rollCtx.createGain(); rollGain.gain.value=0.0001;
      rollSrc.connect(rollProc); rollProc.connect(rollGain); rollGain.connect(rollCtx.destination);
      started=true;
    }
    if(!started){
      rollAn=rollCtx.createAnalyser();
      rollAn.fftSize=2048;
      rollSrc.connect(rollAn);
      const tmp=new Float32Array(rollAn.fftSize);
      const hop=Math.max(64, Math.floor(rollSr*0.02));
      const tick=()=>{
        if(!rollAn) return;
        try{rollAn.getFloatTimeDomainData(tmp)}catch(e){return}
        push(tmp.subarray(Math.max(0,tmp.length-hop)));
        rollRaf=requestAnimationFrame(tick);
      };
      tick();
    }
    startClip(rollStream);
    const t0=Date.now();
    while(rollFilled<(rollSr*0.04) && Date.now()-t0<900){
      await new Promise(r=>setTimeout(r,40));
    }

  }catch(e){ stopRoll(); return false; }

function stopRoll(){

  rollRaf=0;
  try{if(rollWork){rollWork.port.onmessage=null;rollWork.disconnect()}}catch(e){}
  try{if(rollAn) rollAn.disconnect()}catch(e){}
  try{if(rollProc){rollProc.onaudioprocess=null;rollProc.disconnect()}}catch(e){}
  try{if(rollSrc)rollSrc.disconnect()}catch(e){}
  try{if(rollGain)rollGain.disconnect()}catch(e){}

function rollSamples(sec){

function downsample16k(x, sr){
  const target=16000;
  if(Math.abs(sr-target)<80) return {x:x, sr:sr};
  const ratio=sr/target;
  const n=Math.max(8, Math.floor(x.length/ratio));
  const y=new Float32Array(n);
  for(let i=0;i<n;i++){

    y[i]=a+(b-a)*f;

function bandE(w, sr, f0, f1){

  let s=0;
  const step=N>2400?2:1;
  for(let k=k0;k<=k1;k++){
    let re=0, im=0;
    const w0=2*Math.PI*k/N;
    for(let n=0;n<N;n+=step){
      const hann=0.5-0.5*Math.cos(2*Math.PI*n/N);
      const v=w[n]*hann;
      re+=v*Math.cos(w0*n);
      im-=v*Math.sin(w0*n);
    }

    const expRaw=arTokensRaw(lines[idx].ar);
    const exp=expRaw.map(normAr);
    wordsTotal+=exp.length;
    const parts=[];
    let localOk=0;

    if(idx<lockCount){
      expRaw.forEach(w=>parts.push(wrapTash(w,'ok')));
      localOk=exp.length; wordsOk+=localOk; linesOk++;
      results.push({parts, localOk, ratio:1, state:'ok'});
      continue;
    }

    if(idx>reached){
      expRaw.forEach(w=>parts.push(wrapTash(w,'wait')));
      results.push({parts, localOk:0, ratio:0, state:'wait'});
      continue;
    }

    let c=cursor;
    let placedNow=false;
    for(let i=0;i<exp.length;i++){
      const w=exp[i];
      const raw=expRaw[i];
      let found=-1;
      for(let j=c;j<Math.min(got.length, c+4);j++){
        if(got[j]===w || arScore(got[j],w)>=0.8){found=j;break}
      }
      if(found>=0){
        parts.push(wrapTash(raw,'ok'));
        localOk++;
        c=found+1;
      }else if(live && c>=got.length){
        parts.push(wrapTash(raw, placedNow?'wait':'now'));
        placedNow=true;
      }else{
        parts.push(wrapTash(raw,'bad'));
        if(!live && localOk===0 && i===0) logMistake({ar:raw},'word', said);
      }
    }
    cursor=c;
    let ratio=exp.length?localOk/exp.length:0;
    if(ratio>=0.85 && !live){
      const last=expRaw[expRaw.length-1];
      const es=endingScoreFromRoll(last, said);
      if(es && es.cls && !es.skipped && !es.ok){
        parts[parts.length-1]=wrapTash(last,'haraka');
        localOk=Math.max(0, localOk-1);
        ratio=exp.length?localOk/exp.length:0;
        logMistake({ar:last},'haraka', said);
      }
    }
    wordsOk+=localOk;
    let state='bad';
    if(ratio>=0.85){state='ok'; linesOk++}
    else if(ratio>=0.4) state='mid';
    else if(live && localOk===0) state='wait';
    else state='bad';

    // Pas volgende zin openen als deze grotendeels klopt
    if(ratio>=0.7 || localOk===exp.length){
      reached=Math.max(reached, idx+1);
    }
    results.push({parts, localOk, ratio, state});
  }

  results.forEach((r, idx)=>{
    const el=lineEls[idx];
    if(!el)return;
    el.classList.remove('line-ok','line-bad','line-mid','line-active');
    if(r.state==='ok') el.classList.add('line-ok');
    else if(r.state==='mid') el.classList.add('line-mid');
    else if(r.state==='bad') el.classList.add('line-bad');
    // huidige zin = laatste bereikte die nog niet ok is, of de active
    if(live && idx===Math.min(reached, lines.length-1)) el.classList.add('line-active');
    const ar=el.querySelector('.ar');
    if(ar){ ar.classList.add('ar-mark'); ar.innerHTML=r.parts.join(' '); }
  });

  const pct=wordsTotal?Math.round(100*Math.min(wordsOk,wordsTotal)/wordsTotal):0;
  return {linesOk, linesTotal:lines.length, wordsOk:Math.min(wordsOk,wordsTotal), wordsTotal, pct, reached};
}

  let lockCount=0;

  window._dlgSession=sessionId;
  window._dlgListening=true;
  window._dlgLines=lines;
  window._dlgResultEl=resultEl;

  const saidNow=()=>(finalText+' '+interim).trim();

  /** Bepaal welke zin de gebruiker nu moet zeggen (eerste niet-ok). */

    // reached = hoogste open index; als zin reached-1 nog niet ok, die hernemen
    for(let i=0;i<lines.length;i++){
      // schat via DOM classes
      const el=document.querySelectorAll('.book-line')[i];
      if(!el || !el.classList.contains('line-ok')) return i;
    }
    return Math.max(0, lines.length-1);
  };

  const updateCheckpoints=(g)=>{
    // Als een zin ok is, sla checkpoint op voor de volgende
    const els=document.querySelectorAll('.book-line');
    let done=0;
    for(let i=0;i<els.length;i++){
      if(els[i].classList.contains('line-ok')){
        done=i+1;
        if(checkpoints.length<=done){
          // tekst tot nu (alleen finals) als start voor volgende zin
          checkpoints[done]=finalText.trim();
        }

          '<button type="button" class="btn btn-secondary btn-sm" data-act="dlg-peek">👁 Kijk</button>'+

    if(resumeBtn) resumeBtn.style.display=window._dlgListening?'none':'';

    paintLive();

  const finish=()=>{

    stopped=true;
    window._dlgListening=false;
    window._dlgPracticeFinish=null;
    window._dlgResume=null;
    window._dlgRestart=null;
    window._dlgRetryLine=null;
    try{rec.onend=null;rec.onresult=null;rec.onerror=null}catch(e){}
    safeRecStop(rec);
    recActive=null;
    lastSaid=saidNow();
    freezeClip().then(()=>{
    const said=lastSaid;

        resultEl.className='speak-result bad';

      }
      stopRoll();
      return;
    }
    const g=gradeDialogueLines(lines, said, false, lockCount);
    if(resultEl){
      resultEl.style.display='block';
      resultEl.className='speak-result '+(g.pct>=55?'ok':'bad');
      resultEl.innerHTML=
        '<div class="dlg-score"><span class="pct">'+g.pct+'%</span> · '+g.wordsOk+'/'+g.wordsTotal+' woorden · '+g.linesOk+'/'+g.linesTotal+' zinnen</div>'+
        '<div class="said-live">Tik een rood of oranje woord: jij vs juist</div>'+

        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'+
          '<button type="button" class="btn btn-primary btn-sm" data-act="dlg-restart">↻ Helemaal opnieuw</button>'+
          '<button type="button" class="btn btn-secondary btn-sm" data-act="dlg-retry-line">↺ Deze zin opnieuw</button>'+
        '</div>';
    }
    if(g.pct>=55)try{playOk()}catch(e){}
    else try{playNo()}catch(e){}
    stopRoll();
    });
  };

  const bindAndStart=()=>{
    if(stopped || window._dlgSession!==sessionId)return;
    window._dlgListening=true;
    rec.lang='ar-SA';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=3;
    rec.onresult=(ev)=>{
      if(stopped || window._dlgSession!==sessionId)return;
      interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const t=ev.results[i][0].transcript||'';
        if(ev.results[i].isFinal){
          if(t) finalText=(finalText?finalText+' ':'')+t;
        } else {
          interim+=(interim?' ':'')+t;
        }
      }
      paintLive();
    };
    rec.onerror=(ev)=>{
      if(ev.error==='not-allowed'){
        window._dlgListening=false;
        stopped=true;
        if(resultEl){resultEl.className='speak-result bad';resultEl.textContent='Microfoon geblokkeerd (https + 1× toestaan).';}
      }
    };
    rec.onend=()=>{
      recActive=null;
      if(stopped || window._dlgSession!==sessionId){ if(!stopped) finish(); return; }
      showMenu();
    };
    recActive=rec;
    if(!safeRecStart(rec)){
      setTimeout(()=>{ if(!stopped && window._dlgSession===sessionId) safeRecStart(rec); }, 400);
    }
    paintLive();
  };

  window._dlgResume=()=>{
    if(window._dlgSession!==sessionId)return;
    stopped=false;
    interim='';
    bindAndStart();
  };

  window._dlgRestart=()=>{
    finalText='';
    interim='';
    checkpoints=[''];
    currentLine=0;
    lockCount=0;
    stopped=false;
    document.querySelectorAll('.book-line').forEach(el=>el.classList.remove('line-ok','line-bad','line-mid','line-active'));
    document.querySelectorAll('.book-line .ar').forEach((ar,idx)=>{
      if(lines[idx]){ ar.classList.add('ar-mark'); ar.innerHTML=markAr(lines[idx].ar,'wait'); }
    });
    bindAndStart();
  };

  /** Deze zin opnieuw: terug naar checkpoint van currentLine, wis fouten van die zin */
  window._dlgRetryLine=()=>{
    if(window._dlgSession!==sessionId) return;
    const lineIdx=Math.max(0, currentLine|0);
    lockCount=lineIdx;
    currentLine=lineIdx;
    finalText='';
    interim='';
    stopped=false;
    const els=document.querySelectorAll('.book-dialogue .book-line');
    els.forEach((el,idx)=>{

        el.classList.add('line-ok');

      } else {
        el.classList.remove('line-ok','line-bad','line-mid','line-active');

        if(ar && lines[idx]){ ar.classList.add('ar-mark'); ar.innerHTML=markAr(lines[idx].ar,'wait'); }
      }
    });
    window._dlgListening=false;
    try{rec.onend=null}catch(e){}
    safeRecStop(rec);
    recActive=null;
    if(resultEl){
      resultEl.style.display='block';
      const st=resultEl.querySelector('.dlg-status');
      if(st) st.textContent='Zeg zin '+(lineIdx+1)+' opnieuw';
    }
    setTimeout(()=>bindAndStart(), 280);
  };

window._dlgPracticeFinish=finish;
  bindAndStart();
}

function startSpeakPractice(expected, who, resultEl){
  const rec=getSharedRec();
  if(!rec){
    if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='Spraakherkenning: Chrome op https.';}
    return;
  }
  try{rec.onend=null;rec.onresult=null;rec.onerror=null}catch(e){}
  safeRecStop(rec);
  unlockAudio();
  const t0=Date.now();
  window._spkUntil=t0+LISTEN_MS;
  window._spkDone=false;
  const left=()=>Math.max(0, Math.ceil((window._spkUntil-Date.now())/1000));
  const stillOn=()=>!window._spkDone && Date.now()<=window._spkUntil;
  if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='🎤 Blijf zeggen tot het groen is — tot 1 minuut'}
  document.querySelectorAll('.mic-btn').forEach(b=>b.classList.remove('listening'));
  const btn=document.querySelector('.mic-btn.listening-target');
  if(btn)btn.classList.add('listening');

  const finishOk=(said, g)=>{
    if(window._spkDone) return;
    window._spkDone=true;
    const harakaFail=false;
    const d=diffArHtml(expected, said, harakaFail);
    if(resultEl){
      resultEl.className='speak-result ok';
      resultEl.innerHTML=zegOkHtml(g)+' · <span class="ar-diff ar-mark">'+d.html+'</span>';
    }
    try{playOk()}catch(e){}
    hideCompare();
    freezeClip().then(()=>{
      stopRoll();
      try{rec.onend=null}catch(e){}
      safeRecStop(rec);
      recActive=null;
      document.querySelectorAll('.mic-btn').forEach(b=>b.classList.remove('listening','listening-target'));
    });
  };
  const finishTimeout=()=>{
    if(window._spkDone) return;
    window._spkDone=true;
    const said=lastSaid||'';
    const snap=rollSamples(2.4);
    freezeClip().then(()=>{
      const g=gradeUtterance(expected, said, null, snap);
      if(g.ok){ window._spkDone=false; finishOk(said, g); return; }
      document.querySelectorAll('.mic-btn').forEach(b=>b.classList.remove('listening','listening-target'));
      if(resultEl){
        const harakaFail=!!(said && g.needEnd);
        const d=diffArHtml(expected, said, harakaFail);
        if(!said){ resultEl.className='speak-result hint'; resultEl.textContent='Niets gehoord.'; }
        else if(harakaFail){
          resultEl.className='speak-result bad';
          resultEl.innerHTML='✗ Uitgang: gehoord <b>'+esc(endLabel(g.end.heard))+'</b>, juist <b>'+esc(endLabel(g.end.cls))+'</b>.';
          showCompare(expected, said, 'haraka', g.end.hint||'', {ar:expected}, g.end);
        }else{
          resultEl.className='speak-result bad';
          resultEl.innerHTML='✗ Verkeerd woord.<br><span class="ar-diff ar-mark">'+d.html+'</span>';
          showCompare(expected, said, 'word', 'Zeg het woord opnieuw.', {ar:expected}, g.end);
        }
      }
      try{playNo()}catch(e){}
      try{speakWord({ar:expected}, true)}catch(e){}
      stopRoll();
      recActive=null;
    });
  };

  startRoll().then(()=>{
    const bind=()=>{
      if(!stillOn()){ if(!window._spkDone) finishTimeout(); return; }
      rec.lang='ar-SA';
      rec.continuous=true;
      rec.interimResults=true;
      rec.maxAlternatives=5;
      rec.onresult=(ev)=>{
        if(!stillOn()) return;
        let lastFinal='', interim='';
        for(let i=0;i<ev.results.length;i++){
          const t=ev.results[i][0].transcript||'';
          if(ev.results[i].isFinal) lastFinal=t;
          else interim=t;
        }
        const said=(lastFinal||interim||'').trim();
        lastSaid=said;
        if(resultEl && said){
          const d=diffArHtml(expected, said);
          resultEl.className='speak-result hint';
          resultEl.innerHTML='Nog '+left()+'s · <span class="ar-diff ar-mark">'+(d.html||'')+'</span>';
        }
        if(lastFinal){
          const snap=rollSamples(2.4);
          const g=gradeUtterance(expected, lastFinal, null, snap);
          if(g.ok) finishOk(lastFinal, g);
        }
      };
      rec.onerror=(ev)=>{
        if(resultEl && ev.error==='not-allowed'){
          resultEl.className='speak-result bad';
          resultEl.textContent='Microfoon toestaan via slotje (gebruik https).';
          window._spkDone=true;
        }
      };
      rec.onend=()=>{
        recActive=null;
        if(!stillOn()){ if(!window._spkDone) finishTimeout(); return; }
        setTimeout(()=>{ if(stillOn()) bind(); }, 80);
      };
      recActive=rec;
      safeRecStart(rec);
    };
    setTimeout(bind, 180);
  });
}

function speakDialogueLine(text, who, onDone){
  const t=String(text||'').trim();
  if(!t){if(onDone)onDone(false);return}
  unlockAudio();
  stopAudio();
  const myGen=audioGen;
  const g=genderOf(who);
  const v=pickVoiceFor(who||'');
  const finish=(ok)=>{if(myGen!==audioGen)return; if(onDone)onDone(!!ok)};
  let usedLocal=false;
  const fallback=()=>{
    if(usedLocal||myGen!==audioGen)return;
    speakProxyPitched(t, g, who, ok1=>{
      if(usedLocal||myGen!==audioGen)return;
      if(ok1){finish(true);return}
      speakGooglePitched(t, g, who, ok2=>{
        if(usedLocal||myGen!==audioGen)return;
        if(ok2){finish(true);return}
        const w=speakWebWithVoice(t, v, g, who);
        if(!w)finish(false);
        else {
          const wait=Math.min(9000, Math.max(1500, t.length*95));
          setTimeout(()=>finish(true), wait);
        }
      });
    });
  };
  const local=localLineSrc(t, who);
  const legacy=localLineSrcLegacy(t, who);
  if(!local){fallback();return}
  const tryFile=(src, next)=>{
    if(!src){if(next)next();return}
    speakFile(src, ok=>{
      if(myGen!==audioGen)return;
      if(ok||usedLocal){finish(true);return}
      if(next)next(); else fallback();
    }, ()=>{usedLocal=true});
  };
  tryFile(local, ()=>{
    if(legacy && legacy!==local) tryFile(legacy, fallback);
    else fallback();
  });
}

function speakProxyPitched(text, gender, who, done){
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://tts-api.netlify.app/?text='+q+'&lang=ar';
  fetch(url,{mode:'cors',credentials:'omit',cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlobPitched(blob, gender, done, who);
    })
    .catch(()=>{if(done)done(false)});
}
function speakGooglePitched(text, gender, who, done){
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ar&q='+q;
  fetch(url,{referrerPolicy:'no-referrer',mode:'cors',credentials:'omit'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlobPitched(blob, gender, done, who);
    })
    .catch(()=>{if(done)done(false)});
}
function speakWebWithVoice(text, voice, gender, who){
  if(!('speechSynthesis' in window))return false;
  try{
    primeVoices();
    refreshArVoices();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(ttsSpell(text));
    const prof=profileForSpeaker(who||'', gender);
    let v=voice;
    if(!v){
      const pool=gender==='f'?(femaleArVoices.length?femaleArVoices:allArVoices):(maleArVoices.length?maleArVoices:allArVoices);
      if(pool.length)v=pool[prof.idx % pool.length];
      else if(arabicVoice)v=arabicVoice;
    }
    if(v){u.voice=v;u.lang=v.lang||'ar-SA'}
    else u.lang='ar-SA';
    // Elk personage: tempo + toonhoogte ver uit elkaar
    u.rate = Math.min(1.35, Math.max(0.55, prof.rate));
    u.pitch = gender==='f' ? (0.95 + (prof.idx%6)*0.22) : (0.45 + (prof.idx%6)*0.20);
    u.volume=1;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false}
}

function tone(type,from,to,g,dur){
  unlockAudio();
  if(!audioCtx)return;
  try{
    const now=audioCtx.currentTime,o=audioCtx.createOscillator(),gn=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(to,now+dur*.7);
    gn.gain.setValueAtTime(.0001,now);gn.gain.exponentialRampToValueAtTime(g,now+.01);gn.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.connect(gn);gn.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.02);
  }catch(e){}
}
function playOk(){if(!autoSpeak)return;tone('sine',880,1320,.14,.2)}
function playNo(){if(!autoSpeak)return;tone('sawtooth',280,180,.1,.18)}

function nextLesson(){
  for(const n of lessonNums()){
    const ws=wordsFor(n);
    if(mastered(ws)<ws.length)return n;
  }
  return 'all';
}

function renderVocabHub(){
  const total=ALL.length, m=mastered(ALL), pct=total?Math.round(100*m/total):0;
  let lessons='';
  for(const n of lessonNums()){
    const ws=wordsFor(n); const mm=mastered(ws); const p=ws.length?Math.round(100*mm/ws.length):0;
    const stt=p>=100?'done':p>0?'busy':'new';
    const lab=p>=100?'Beheerst':p>0?'Bezig · '+p+'%':'Nieuw';
    const cleanTitle = VOCAB_TITLES[n] || (LESSON_META[n]||['',''])[0];
    const previewWords = ws.slice(0, 4).map(w=>w.ar).join('  ·  ');
    lessons+=`<div class="lesson path-lesson ${stt}">
      <div class="path-num">${n}</div>
      <div class="path-body">
        <div class="status ${stt}">${lab} · ${mm}/${ws.length} woorden</div>
        <h3>Les ${n} · ${esc(cleanTitle)}</h3>
        <div class="vocab-preview ar" lang="ar" dir="rtl">${previewWords}</div>
        <div class="progress"><i style="width:${p}%"></i></div>
        <button class="btn btn-primary btn-sm" data-act="start-learn" data-l="${n}">${p>=100?'Herhaal hoofdstuk':'Start oefenen'}</button>
        <div class="path-alts">
          <button type="button" data-act="start-flash" data-l="${n}">${GL_ICO_CARDS} Kaarten</button>
          <button type="button" data-act="start-zeg" data-l="${n}">${GL_ICO_MIC} Zeg & Harakaat</button>
          <button type="button" data-act="open-book" data-l="${n}">${GL_ICO_BOOK} Grammatica</button>
        </div>
      </div>
    </div>`;
  }
  return`<div class="desktop-page">
    <div class="sh">
      <div class="sh-main">
        <div class="sh-eyebrow">Woordenschat · ${m} / ${total} beheerst</div>
        <h1>Woorden per hoofdstuk</h1>
        <p>Oefen de woorden uit het Medina-boek met flashcards, meerkeuze, schrijfvragen en live uitspraakcontrole op de tanwīn en korte klinkers.</p>
      </div>
      <div class="sh-progress-box">
        <div class="sh-progress-label">Beheersing</div>
        <div class="sh-progress-pct">${pct}%</div>
        <div class="sh-progress-bar"><div class="sh-progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>

    <div class="hub-toolbar" style="margin-bottom:16px">
      <button class="btn btn-sm ${quizDir==='ar2nl'?'btn-primary':'btn-secondary'}" data-act="set-quiz-dir" data-d="ar2nl">AR → NL</button>
      <button class="btn btn-sm ${quizDir==='nl2ar'?'btn-primary':'btn-secondary'}" data-act="set-quiz-dir" data-d="nl2ar">NL → AR</button>
      <button class="btn btn-sm ${quizDir==='mix'?'btn-primary':'btn-secondary'}" data-act="set-quiz-dir" data-d="mix">Gemengd</button>
      <span class="grow"></span>
      <button class="btn btn-sm ${showPics?'btn-primary':'btn-secondary'}" data-act="toggle-pics">${GL_ICO_PIC} ${showPics?'Foto\'s aan':'Foto\'s uit'}</button>
      <button class="btn btn-secondary btn-sm" data-act="nav" data-v="words">Woordenlijst</button>
      <button class="btn btn-secondary btn-sm" data-act="nav" data-v="add">+ Eigen woord</button>
    </div>

    <div class="desktop-grid-2">
      ${lessons}
    </div>

    <div class="card" style="margin-top:18px">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <h3 style="font-size:16px;font-weight:700;margin-bottom:2px">Alles door elkaar oefenen</h3>
          <p style="font-size:13px;color:var(--muted)">Test jezelf over alle ${total} woorden uit alle 24 hoofdstukken tegelijk.</p>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn btn-primary btn-sm" data-act="start-learn" data-l="all">Mix oefenen</button>
          <button class="btn btn-secondary btn-sm" data-act="start-flash" data-l="all">Mix kaarten</button>
          <button class="btn btn-secondary btn-sm" data-act="start-zeg" data-l="all">Mix Zeg</button>
          ${mistakes.length?`<button class="btn btn-secondary btn-sm" data-act="start-zeg" data-l="fouten">Fouten (${mistakeStats().length})</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function startZegListen(w, resultEl){
  const rec=getSharedRec();
  if(!rec){
    if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='Chrome op https nodig voor microfoon.';}
    return;
  }
  const wordId=w && w.id;
  if(window._zegLock && window._zegLock===wordId) return;
  try{rec.onend=null;rec.onresult=null;rec.onerror=null}catch(e){}
  safeRecStop(rec);
  unlockAudio();
  const mush=document.querySelector('.zeg-mushaf');
  if(mush) mush.innerHTML=wrapTash(w.ar, hideText?'wait':'now');
  window._zegUntil=Date.now()+LISTEN_MS;
  window._zegDone=false;
  if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='🎤 Blijf zeggen tot het groen is — tot 1 minuut'}
  const left=()=>Math.max(0, Math.ceil((window._zegUntil-Date.now())/1000));
  const stillOn=()=>!window._zegDone && state.view==='zeg' && state.current && state.current.id===wordId && !state.answered && Date.now()<=window._zegUntil;

  const succeed=(g)=>{
    if(window._zegDone) return;
    window._zegDone=true;
    try{clearTimeout(window._zegRegrade)}catch(e){}
    window._zegLock=wordId;
    state.answered=true;
    if(mush) mush.innerHTML=wrapTash(w.ar,'ok');
    if(resultEl){
      resultEl.className='speak-result ok';
      resultEl.innerHTML=zegOkHtml(g);
    }
    try{playOk()}catch(e){}
    hideCompare();
    freezeClip().then(()=>{
      stopRoll();
      try{rec.onend=null}catch(e){}
      safeRecStop(rec);
      recActive=null;
      setTimeout(()=>{ window._zegLock=null; nextZeg(true); }, 700);
    });
  };

  const timeoutFail=()=>{
    if(window._zegDone || state.view!=='zeg' || state.answered) return;
    window._zegDone=true;
    const said=lastSaid||'';
    const snap=rollSamples(2.4);
    freezeClip().then(()=>{
      const g=gradeUtterance(w.ar, said, w.id, snap, window._zegAlts||null);
      if(g.uitspraak==='juist'){ window._zegDone=false; succeed(g); return; }
      if(said && g.needEnd){
        if(mush) mush.innerHTML=wrapTash(w.ar,'haraka');
        logMistake(w,'haraka', said);
        if(resultEl){
          resultEl.className='speak-result bad';
          resultEl.innerHTML='✗ Uitgang: gehoord <b>'+esc(endLabel(g.end.heard))+'</b>, juist <b>'+esc(endLabel(g.end.cls))+'</b>. Tik Zeg en probeer opnieuw.';
        }
        showCompare(w.ar, said, 'haraka', g.end.hint||'', w, g.end);
      } else if(said){
        if(mush) mush.innerHTML=wrapTash(w.ar,'bad');
        logMistake(w,'word', said);
        if(resultEl){resultEl.className='speak-result bad'; resultEl.innerHTML='✗ Verkeerd woord — zeg <b>'+esc(w.translit||'')+'</b>. Tik Zeg.';}
        showCompare(w.ar, said, 'word', 'Zeg het hele woord, met de uitgang.', w, g.end);
      } else {
        if(mush) mush.innerHTML=wrapTash(w.ar,'wait');
        if(resultEl){resultEl.className='speak-result hint'; resultEl.textContent='Niets gehoord. Tik Zeg en lees voor.';}
      }
      try{playNo()}catch(e){}
      try{speakWord(w, true)}catch(e){}
      stopRoll();
      recActive=null;
    });
  };

  startRoll().then(()=>{
    const bind=()=>{
      if(!stillOn()){
        if(!window._zegDone && state.view==='zeg' && !state.answered) timeoutFail();
        return;
      }
      rec.lang='ar-SA';
      rec.continuous=false;
      rec.interimResults=true;
      rec.maxAlternatives=8;
      rec.onresult=(ev)=>{
        if(!stillOn()) return;
        const alts=collectAlts(ev);
        const said=(pickSaid(ev, w.ar, w) || (ev.results[ev.results.length-1]&&ev.results[ev.results.length-1][0]&&ev.results[ev.results.length-1][0].transcript) || '').trim();
        lastSaid=said;
        window._zegAlts=alts;
        const apply=()=>{
          if(!stillOn() || window._zegDone) return false;
          const snap=rollSamples(2.4);
          const g=gradeUtterance(w.ar, lastSaid, w.id, snap, window._zegAlts||alts);
          if(mush) mush.innerHTML=wrapTash(w.ar, g.uitspraak==='juist'?'ok':g.uitspraak==='fout-klank'?'haraka':g.uitspraak==='fout-woord'?'bad':'now');
          const live=document.querySelector('.said-live');
          if(live){
            if(g.uitspraak==='juist') live.textContent='klank goed';
            else if(g.uitspraak==='fout-klank' && g.heard) live.textContent='gehoord '+endLabel(g.heard);
            else if(g.uitspraak==='onzeker') live.textContent='nog niet zeker van de uitgang';
            else live.textContent='🎤 nog '+left()+'s';
          }
          if(g.uitspraak==='juist'){ succeed(g); return true; }
          if(resultEl){
            resultEl.className='speak-result hint';
            const tip=esc(w.translit||'het woord');
            if(g.uitspraak==='fout-klank') resultEl.innerHTML='Nog '+left()+'s · gehoord <b>'+esc(endLabel(g.heard))+'</b>, juist <b>'+esc(endLabel(g.want))+'</b>';
            else if(g.uitspraak==='fout-woord') resultEl.innerHTML='Nog '+left()+'s · zeg <b>'+tip+'</b>';
            else resultEl.innerHTML='Nog '+left()+'s · ik hoor het woord. Zeg de uitgang nog eens: <b>'+tip+'</b>';
          }
          return false;
        };
        if(apply()) return;
        try{clearTimeout(window._zegRegrade)}catch(e){}
        window._zegRegrade=setTimeout(()=>{ apply(); }, 380);
      };
      rec.onerror=(ev)=>{
        if(resultEl && ev.error==='not-allowed'){
          resultEl.className='speak-result bad';
          resultEl.textContent='Microfoon toestaan via het slotje (https).';
          window._zegDone=true;
        }
      };
      rec.onend=()=>{
        recActive=null;
        if(window._zegDone) return;
        const finishEnd=()=>{
          if(window._zegDone) return;
          const said=lastSaid||'';
          const snap=rollSamples(2.4);
          const g=gradeUtterance(w.ar, said, w.id, snap, window._zegAlts||null);
          if(g.uitspraak==='juist'){ succeed(g); return; }
          if(!stillOn()){
            if(!window._zegDone && state.view==='zeg' && !state.answered) timeoutFail();
            return;
          }
          if(resultEl){
            resultEl.className='speak-result hint';
            resultEl.textContent='🎤 Nog '+left()+'s — zeg het woord met de uitgang';
          }
          setTimeout(()=>{ if(stillOn()) bind(); }, 60);
        };
        try{clearTimeout(window._zegRegrade)}catch(e){}
        window._zegRegrade=setTimeout(finishEnd, 220);
      };
      recActive=rec;
      safeRecStart(rec);
    };
    setTimeout(bind, 180);
  });
}
function startZeg(sel){
  unlockAudio();
  hideCompare();
  state.path='vocab';
  state.lesson=sel==='all'?'all':(sel==='fouten'?sel:parseInt(sel));
  let all;
  if(sel==='fouten'){
    const ids=mistakeStats().map(m=>m.id).filter(Boolean);
    all=ids.map(id=>ALL.find(w=>w.id===id)).filter(Boolean);
    if(!all.length){ toast('Nog geen fouten om te oefenen.'); return; }
  }else{
    all=wordsFor(state.lesson);
  }
  state.queue=shuffle(all.slice()).slice(0, Math.min(SESSION, all.length));
  if(sel==='fouten' && state.queue.length<4){
    const extra=[];
    while(extra.length+state.queue.length<Math.min(6, SESSION) && all.length){
      extra.push(all[extra.length%all.length]);
    }
    state.queue=state.queue.concat(extra);
  }
  state.sessionLen=state.queue.length;
  state.asked=0;state.correct=0;state.answered=false;
  state.view='zeg';
  state.current=state.queue[0]||null;
  render();
}

}

function startLearn(sel){
  unlockAudio();
  state.path='vocab';
  state.lesson=sel==='all'?'all':parseInt(sel,10);
  const all=wordsFor(state.lesson);
  const fresh=all.filter(w=>getP(w.id).box<MASTERY);
  state.review=fresh.length===0;
  const src=state.review?all:fresh;
  const batchSize = state.fastQuiz ? Math.min(SESSION, src.length) : Math.min(6, src.length);
  const chosen=shuffle(src).slice(0, batchSize);
  state.batch=chosen;
  state.sessionWords=chosen.slice();
  if(!chosen.length){state.view='summary';render();return}

  // Bouw het 4-fasen leerpad op:
  // Fase 1: Verkennen (voor woorden met box === 0, tenzij Sneltoets aan staat)
  // Fase 2: Herkennen (Meerkeuze AR -> NL en NL -> AR)
  // Fase 3: Actief geheugen (Woordbouw met lettergreepblokken of typen)
  const steps=[];
  if(!state.fastQuiz){
    chosen.forEach((w, idx)=>{
      steps.push({phase:1, phaseLbl:'Fase 01 · Verkennen', w, idx, totalPhase:chosen.length});
    });
  }
  chosen.forEach((w, idx)=>{
    let dir=quizDir;
    if(dir==='mix') dir=(idx%2===0)?'ar2nl':'nl2ar';
    const pool=wordsFor(state.lesson);
    const dSrc=pool.length>=4?pool:ALL;
    const dist=shuffle(dSrc.filter(x=>x.id!==w.id)).slice(0,3);
    steps.push({
      phase:2,
      phaseLbl:'Fase 02 · Herkennen',
      w,
      type:dir==='nl2ar'?'mc-nl2ar':'mc-ar2nl',
      options:shuffle([w,...dist]),
      dir
    });
  });
  chosen.forEach((w)=>{
    const chunks=buildArChunks(w.ar);
    const pool=wordsFor(state.lesson);
    const dSrc=pool.length>=4?pool:ALL;
    const extraChunks=[];
    shuffle(dSrc.filter(x=>x.id!==w.id)).slice(0,2).forEach(other=>{
      const oc=buildArChunks(other.ar);
      if(oc.length) extraChunks.push(oc[0]);
    });
    steps.push({
      phase:3,
      phaseLbl:'Fase 03 · Actief geheugen',
      w,
      type:state.BuildMode==='type'?'typed-ar2nl':'build-ar',
      targetChunks:chunks,
      bank:shuffle(chunks.concat(extraChunks)).map((t,i)=>({i,t}))
    });
  });

  state.queue=steps;
  state.sessionLen=steps.filter(s=>s.phase>1).length || steps.length;
  state.stepIdx=0;
  state.asked=0; state.correct=0; state.answered=false;
  state.built=[];
  state.view='learn';
  nextQ();
}

function buildArChunks(ar){
  const s=String(ar||'').trim();
  if(!s) return [];
  // Splits op spaties als het uit meerdere woorden bestaat, anders in clusters van letter + harakaat
  if(s.includes(' ')) return s.split(/\s+/).filter(Boolean);
  const clusters=[];
  let cur='';
  for(const ch of s){
    const code=ch.charCodeAt(0);
    const isMark=(code>=0x064B && code<=0x065F) || code===0x0670;
    if(isMark && cur){ cur+=ch; }
    else { if(cur) clusters.push(cur); cur=ch; }
  }
  if(cur) clusters.push(cur);
  // Groepeer per 1-2 clusters zodat je 3 tot 5 overzichtelijke blokken krijgt
  if(clusters.length<=4) return clusters;
  const out=[];
  for(let i=0;i<clusters.length;i+=2){
    out.push(clusters.slice(i,i+2).join(''));
  }
  return out;
}

function nextQ(){
  if(!state.queue || !state.queue.length){
    const t=today();
    if(streak.last!==t){
      const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
      streak.count=streak.last===y?streak.count+1:1;
      streak.last=t;saveS();
    }
    state.view='summary';render();return;
  }
  const step=state.queue[0];
  state.current=step.w;
  state.q=step;
  state.answered=false;
  state.built=[];
  render();
  if(autoSpeak && state.current && (step.phase===1 || String(step.type||'').indexOf('ar2nl')>=0)){
    setTimeout(()=>speakWord(state.current), 160);
  }
}
