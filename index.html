<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Al-Mufrodat — Arabische woordenschat</title>
<meta name="theme-color" content="#EFE4D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFE4D4; --paper-deep:#E5D4C0; --surface:#F7EEE2;
  --ink:#3B2A1C; --ink-soft:#5C4432; --muted:#8A7060;
  --line:#E2D0B8; --line-strong:#D2B896;
  --forest:#6B4630; --forest-dark:#4E3222; --forest-soft:#F0E2D0;
  --on-forest:#F7EEE2;
  --clay:#A35A42; --clay-soft:#F3E4DA; --ok:#5A6B48; --ok-soft:#E6EBD8;
  --purple:#6B4630; --purple-soft:#F0E2D0; --on-purple:#F7EEE2;
  --blue:#6B4630; --blue-soft:#F0E2D0; --on-blue:#F7EEE2;
  --radius:16px; --shadow:none;
  --font:Figtree,system-ui,sans-serif; --ar:Amiri,serif;
}

[data-theme="dark"]{
  --paper:#181410; --paper-deep:#221C16; --surface:#261F18;
  --ink:#F0E4D4; --ink-soft:#D2C0AA; --muted:#A89078;
  --line:#3A3026; --line-strong:#4C4034;
  --forest:#D4B08C; --forest-dark:#C4A07C; --forest-soft:#2E261E;
  --on-forest:#181410;
  --clay:#D4A090; --clay-soft:#32241E; --ok:#B4C49A; --ok-soft:#22281C;
  --purple:#D4B08C; --purple-soft:#2E261E; --on-purple:#181410;
  --blue:#D4B08C; --blue-soft:#2E261E; --on-blue:#181410;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;color-scheme:light}
[data-theme="dark"]{color-scheme:dark}
[data-theme="dark"] .app-header-inner .title,
[data-theme="dark"] .app-header-inner .sub{color:var(--ink)}
[data-theme="dark"] .app-header .brand{color:var(--forest)}
[data-theme="dark"] .hdr-back{color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .tab{color:var(--muted)}
[data-theme="dark"] .tab.active{color:var(--forest)}
[data-theme="dark"] .card,
[data-theme="dark"] .book-lesson,
[data-theme="dark"] .book-dialogue,
[data-theme="dark"] .lesson,
[data-theme="dark"] .wl-row,
[data-theme="dark"] .flash-card{background:var(--surface);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .btn-secondary{background:var(--paper-deep);border-color:var(--line-strong);color:var(--ink)}
[data-theme="dark"] .btn-ghost{color:var(--ink-soft)}
[data-theme="dark"] .icon-btn{background:var(--paper-deep);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .search,
[data-theme="dark"] input,
[data-theme="dark"] textarea{background:var(--paper-deep);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .opt{background:var(--surface);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .path-card{background:var(--surface);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .path-card.vocab{background:linear-gradient(160deg,#152824,var(--surface));border-color:var(--forest)}
[data-theme="dark"] .path-card.grammar{background:linear-gradient(160deg,var(--purple-soft),var(--surface));border-color:var(--purple)}
[data-theme="dark"] .lesson-tabs{background:var(--paper-deep);border-color:var(--line)}
[data-theme="dark"] .lesson-tab{color:var(--muted)}
[data-theme="dark"] .lesson-tab.active{background:var(--surface);color:var(--ink)}
[data-theme="dark"] .path-badge.vocab{background:var(--forest-soft);color:var(--forest)}
[data-theme="dark"] .path-badge.grammar{background:#2A2438;color:#C4A8E0}
[data-theme="dark"] .continue .btn{background:var(--surface);color:inherit}
[data-theme="dark"] .continue.grammar .btn{background:var(--on-purple);color:var(--purple)}
[data-theme="dark"] .continue.conv .btn{background:var(--on-blue);color:var(--blue)}
[data-theme="dark"] .continue .btn.ghost{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.35)}
[data-theme="dark"] .who-phon{color:var(--muted)}
[data-theme="dark"] .chip{background:var(--paper-deep);color:var(--ink-soft);border-color:var(--line)}
[data-theme="dark"] .empty{color:var(--muted)}
[data-theme="dark"] .welcome .header h1,
[data-theme="dark"] .header h1{color:var(--ink)}

body{font-family:var(--font);background:var(--paper);color:var(--ink);min-height:100dvh;caret-color:transparent}
input,textarea,select,[contenteditable="true"]{caret-color:var(--ink)}
button,.tab,.path-card,.card,.lesson,.book-lesson,.opt,.icon-btn{caret-color:transparent;-webkit-user-select:none;user-select:none}

button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom));min-height:100dvh}
.ar{font-family:var(--ar);direction:rtl}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--forest);color:var(--on-forest)}
.btn-primary:active{background:var(--forest-dark)}
.btn-secondary{background:var(--surface);border:1.5px solid var(--line-strong)}
.btn-ghost{color:var(--ink-soft)}
.btn-danger{background:var(--clay);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft)}
.icon-btn:hover{border-color:var(--forest);color:var(--forest)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.progress{height:8px;background:var(--paper-deep);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--forest);border-radius:inherit;transition:width .4s}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);min-height:40px}
.back span{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;background:color-mix(in srgb, var(--surface) 94%, transparent);border-top:1px solid var(--line);border-bottom:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
[data-theme="dark"] .tabbar{background:rgba(18,20,26,.96);border-top-color:var(--line)}
.tabbar-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;font-size:10px;font-weight:700;color:var(--muted)}
.tab.active{color:var(--forest);background:var(--forest-soft)}
.tab svg{width:20px;height:20px}
.header{text-align:center;padding:8px 0 18px}
.header .logo{font-family:var(--ar);font-size:42px;font-weight:700;color:var(--forest);line-height:1}
.header h1{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
.header p{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-soft)}
.continue{background:var(--forest);color:var(--on-forest);border-radius:var(--radius);padding:18px;margin:14px 0}
.continue .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.continue h2{font-size:18px;margin:4px 0 2px}
.continue .meta{font-size:13px;opacity:.8;margin-bottom:12px}
.continue .row{display:flex;gap:8px}
.continue .btn{flex:1;background:var(--on-forest);color:var(--forest)}
.continue.grammar{background:var(--purple);color:var(--on-purple)}
.continue.grammar .btn{background:var(--on-purple);color:var(--purple)}
.continue.conv{background:var(--blue);color:var(--on-blue)}
.continue.conv .btn{background:var(--on-blue);color:var(--blue)}
.continue .btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;opacity:.85}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.section-h h2{font-size:18px;font-weight:700}
.section-h span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lesson{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.lesson .status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.lesson .status.new{color:var(--muted)}.lesson .status.busy{color:var(--forest)}.lesson .status.done{color:var(--ok)}
.lesson h3{font-size:15px;font-weight:700}
.lesson .blurb{font-size:13px;color:var(--muted);margin:2px 0 10px}
.lesson .row{display:flex;gap:8px;margin-top:10px}
.lesson .row .btn{flex:1}
.flash-card{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;cursor:pointer;padding:48px 20px 28px;-webkit-tap-highlight-color:rgba(31,79,69,.12)}.flash-card:active{transform:scale(.99);background:var(--paper)}
.flash-card .tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.flash-card .speak{position:absolute;top:10px;right:10px}
.flash-card .big-ar{font-family:var(--ar);font-size:clamp(40px,12vw,64px);font-weight:700;line-height:1.25;direction:rtl}
.flash-card .translit{color:var(--muted);font-size:14px;margin-top:6px}
.flash-card .hint{margin-top:22px;font-size:11px;font-weight:700;color:var(--forest);letter-spacing:.08em;text-transform:uppercase}
.flash-card .nl{font-size:28px;font-weight:700}
.flash-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.swipe-hint{display:none;text-align:center;font-size:11px;color:var(--muted);margin-top:10px;font-weight:600}
@media (hover:none) and (pointer:coarse){.swipe-hint{display:block}}
.card{touch-action:pan-y}
.qcard{position:relative;text-align:center;padding:28px 18px}
.qcard .qlabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qcard .qmain{font-size:28px;font-weight:700;margin:10px 0 4px}
.qcard .qar{font-family:var(--ar);font-size:clamp(40px,11vw,56px);font-weight:700;direction:rtl;margin:8px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(max-width:420px){.options{grid-template-columns:1fr}}
.opt{min-height:64px;border:2px solid var(--line);border-radius:12px;background:var(--paper);font-family:var(--ar);font-size:22px;direction:rtl;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.opt:active{border-color:var(--forest)}
.opt.correct{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--clay);border-color:var(--clay);color:#fff}
.opt:disabled{cursor:default}
.type-row{display:flex;gap:8px;margin-top:16px}
.type-row input{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper)}
.type-row input:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(31,79,69,.12)}
.dont-know{margin-top:14px;font-size:13px;color:var(--muted);text-decoration:underline;font-weight:600}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:14px 16px calc(78px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .28s cubic-bezier(.22,1,.36,1);border-top:3px solid transparent;pointer-events:none;visibility:hidden}
.feedback.show{transform:translateY(0);pointer-events:auto;visibility:visible}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok)}
.feedback.no{background:var(--clay-soft);border-color:var(--clay)}
.feedback-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.feedback .txt{font-weight:700;font-size:14px}
.feedback.ok .txt{color:var(--ok)}.feedback.no .txt{color:var(--clay)}
.summary{text-align:center;padding:36px 20px}
.summary h2{font-size:26px;margin:8px 0}
.summary p{color:var(--muted);margin-bottom:16px}
.badge{display:inline-block;background:var(--forest-soft);color:var(--forest);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:20px}
.search{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);margin:10px 0 16px}
.search:focus{outline:none;border-color:var(--forest)}
.wl-group{margin-bottom:18px}
.wl-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wl-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wl-row .nl{flex:1;font-weight:600;font-size:14px}
.wl-row .ar{font-size:22px}
.form label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.form input,.form select{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper)}
.form input:focus,.form select:focus{outline:none;border-color:var(--forest)}
.form .ar-in{font-family:var(--ar);font-size:20px;direction:rtl}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90%}
.toast.show{opacity:1}
.book-lesson{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.book-lesson .status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}.book-lesson .status.new{color:var(--muted)}.book-lesson .status.busy{color:#5B3A7A}.book-lesson .status.done{color:var(--ok)}.book-lesson h3{font-size:15px;font-weight:700}
.book-lesson p{font-size:13px;color:var(--muted);margin-top:2px}
.grammar-block{margin-bottom:16px}
.grammar-block h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--forest)}
.grammar-block ul{padding-left:18px;margin-bottom:12px}
.grammar-block li{font-size:14px;line-height:1.5;margin-bottom:6px;color:var(--ink-soft)}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ex .ar{font-size:20px;font-weight:700}
.ex .nl{font-size:13px;color:var(--muted);text-align:right}
.welcome{padding:24px 4px 12px}
.welcome .steps{margin:20px 0}
.step{display:flex;gap:12px;padding:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:8px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--forest-soft);color:var(--forest);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.step b{display:block;font-size:14px}
.step span{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;font-style:italic}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper-deep)}
.dot.on{background:var(--forest)}
/* Fixed app header — always visible */
.app-header,.app-header-OLD-HIDDEN{display:none!important;pointer-events:none!important}
.app-header-OLD-HIDDEN{
  position:fixed;left:0;right:0;top:0;z-index:45;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:8px 14px calc(8px);
  padding-top:calc(8px + env(safe-area-inset-top));
}
.app-header-inner{
  max-width:900px;margin:0 auto;
  display:flex;align-items:center;gap:10px;min-height:40px;
}
.app-header .brand{
  font-family:var(--ar);font-size:20px;font-weight:700;color:var(--forest);line-height:1;
  flex-shrink:0;
}
.app-header .ctx{flex:1;min-width:0}
.app-header .ctx .path-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;margin-bottom:2px;
}
.app-header .ctx .path-badge.vocab{background:var(--forest-soft);color:var(--forest)}
.app-header .ctx .path-badge.grammar{background:#E8E0F0;color:#5B3A7A}
.app-header .ctx .title{
  font-size:13px;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.app-header .ctx .sub{
  font-size:11px;color:var(--muted);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.app-header .hdr-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.app-header .hdr-back{
  width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);display:grid;place-items:center;
  font-size:16px;color:var(--ink-soft);flex-shrink:0;
}
.app-header .hdr-back:active{background:var(--paper-deep)}
.path-cards{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.path-card{
  border:1.5px solid var(--line);background:var(--surface);border-radius:18px;
  padding:14px 16px;cursor:pointer;text-align:left;transition:.15s;
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:auto;
}
.path-card:active{transform:scale(.98)}
.path-card.vocab{border-color:var(--forest);background:linear-gradient(160deg,var(--forest-soft),var(--surface))}
.path-card.grammar{border-color:#9B7AB8;background:linear-gradient(160deg,#F3EDF8,var(--surface))}
.path-card .pc-icon{font-size:28px;margin-bottom:6px}
.path-card h3{font-size:16px;font-weight:700;margin:0;flex-shrink:0}
.path-card p{font-size:12px;color:var(--muted);line-height:1.4;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path-card .pc-meta{font-size:11px;font-weight:700;margin:0;flex-shrink:0;white-space:nowrap;color:var(--ink-soft)}


.pic-frame{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin:8px auto 14px;display:flex;justify-content:center;align-items:center;max-width:200px;box-shadow:0 2px 8px rgba(44,74,58,.06)}.pic-frame svg{display:block;width:72px;height:72px}.pic-photo{padding:0;overflow:hidden;max-width:200px;border-radius:16px}.pic-photo img{display:block;width:160px;height:160px;object-fit:cover;background:var(--paper-deep)}.flash-card .pic-frame{margin-bottom:12px}
.pic-frame svg{display:block}


.lesson-tabs{position:sticky;top:8px;z-index:15;display:flex;gap:6px;margin:12px 0 16px;padding:4px;background:var(--cream);border-radius:14px;border:1.5px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.lesson-tabs::-webkit-scrollbar{display:none}
.lesson-tab{flex:1;min-width:0;padding:10px 8px;border:none;border-radius:10px;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap;text-align:center}
.lesson-tab.active{background:var(--forest);color:var(--paper);box-shadow:0 2px 8px rgba(44,74,58,.2)}
.lesson-tab .tab-count{display:block;font-size:10px;font-weight:600;opacity:.75;margin-top:2px}
.lesson-pane{display:none}
.lesson-pane.active{display:block}
@media(max-width:420px){
  .lesson-tab{font-size:12px;padding:9px 6px}
  .pic-frame{padding:12px;max-width:100%}
  .pic-frame svg{width:56px;height:56px}
}
@media(min-width:700px){
  .lesson-tab{font-size:14px;padding:12px 14px}
  .pic-frame{max-width:260px}
}


/* App padding: fixed header top + tabbar bottom (mobile) */
#app{
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  padding-top:calc(12px + env(safe-area-inset-top));
  margin:0 auto;
  max-width:520px;
}
/* Desktop: tabbar also at top under header */
@media(min-width:768px){
  .tabbar{
    top:0!important;bottom:auto!important;padding-top:calc(6px + env(safe-area-inset-top))!important;
    border-bottom:1px solid var(--line)!important;
    border-top:none!important;
    padding:6px 20px!important;
  }
  .tabbar-inner{max-width:720px!important;gap:8px}
  .tab{flex-direction:row!important;gap:8px;padding:10px 14px;font-size:13px;justify-content:center}
  #app{
    padding-top:calc(64px + env(safe-area-inset-top))!important;
    padding-bottom:40px!important;
    max-width:720px;
  }
  .app-header-inner{max-width:720px}
}
/* Feedback above bottom tabbar on mobile */
.feedback{bottom:calc(60px + env(safe-area-inset-bottom))!important}
@media(min-width:768px){
  .feedback{bottom:0!important}
}



.conv-hero{width:100%;max-height:160px;object-fit:cover;border-radius:14px;margin-bottom:12px;background:var(--paper-deep);border:1.5px solid var(--line)}
.book-dialogue{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.book-dialogue h3{font-size:15px;font-weight:700;color:var(--forest);margin-bottom:4px}
.book-dialogue .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.book-line{display:grid;grid-template-columns:12px 1fr;gap:2px;align-items:start;padding:0;margin:0;border-bottom:none;cursor:pointer}
.book-line:last-child{border-bottom:none}
.book-dialogue-wrap{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;margin-bottom:14px}
@media(max-width:560px){.book-dialogue-wrap{grid-template-columns:100px 1fr;gap:10px}}
.conv-side-img{width:140px;height:140px;object-fit:cover;border-radius:14px;border:1.5px solid var(--line);background:var(--paper-deep);box-shadow:var(--shadow)}
@media(max-width:560px){.conv-side-img{width:100px;height:100px}}
.book-dialogue{margin-bottom:0;padding:12px}
.book-line .num{font-size:10px;font-weight:700;color:var(--muted);padding-top:4px}
.book-line .who{font-size:13px;font-weight:700;margin-bottom:0;display:inline-block;padding:1px 6px;border-radius:5px;color:#fff;font-family:var(--ar);line-height:1.25}.who-phon{display:block;font-size:10px;font-weight:600;color:var(--muted);margin:1px 0 2px 0;padding:0;text-align:left;direction:ltr;font-style:italic;line-height:1.15;width:100%}
.book-line{border-right:none}
.book-line[data-color]{border-right-color:var(--spk)}

.book-line .ar{font-size:15px;font-weight:700;line-height:1.15;text-align:right;margin:0}
.book-line .nl{display:none;font-size:12px;font-weight:600;color:var(--ink);margin-top:1px;margin-bottom:0;padding:2px 5px;background:var(--paper-deep);border-radius:5px;text-align:right;direction:ltr;line-height:1.2}
.book-line.open .nl{display:block}
.line-actions{display:inline-flex;flex-direction:row;gap:0;align-items:center;vertical-align:middle;margin-right:4px}
.line-actions .icon-btn,.line-actions button{
  width:22px!important;height:22px!important;min-height:22px!important;padding:0!important;
  font-size:11px!important;border-radius:6px;opacity:.75;flex-shrink:0;
  border:none!important;background:transparent!important;box-shadow:none!important;
}
.line-actions button:active{opacity:1}
.ar-row{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex-wrap:nowrap}
.ar-row .ar{flex:1;min-width:0}
.mic-btn.listening{background:#C45C26;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.speak-result{font-size:12px;font-weight:600;margin-top:4px;padding:4px 8px;border-radius:8px;text-align:right}
.speak-result.ok{background:#E6F2EC;color:var(--ok)}
.speak-result.bad{background:#FCEDEA;color:var(--no)}
.speak-result.hint{background:var(--paper-deep);color:var(--muted)}
.book-line .tap{margin:0;line-height:1.1;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;text-align:left;direction:ltr}
.book-line.open .tap{display:none}
.book-phrases{margin-top:8px}
.book-phrases .row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.book-phrases .row .ar{font-size:18px;font-weight:700;text-align:right}
.book-phrases .row .nl{display:none;font-size:13px;color:var(--muted);text-align:left;direction:ltr;margin-top:4px}
.book-phrases .row.open .nl{display:block}

.book-line.open .nl,
.book-line.show-all .nl{display:block !important}

.conv-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 8px;flex-wrap:wrap}
.conv-nav .btn{min-height:42px;padding:0 14px}
.conv-nav .btn:disabled{opacity:.35;pointer-events:none}
.conv-dots{display:flex;gap:6px;align-items:center;justify-content:center;flex:1}
.conv-dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);border:none;padding:0;cursor:pointer}
.conv-dot.on{background:var(--forest);transform:scale(1.25)}

.ar-mark .tok-ok{color:var(--ok)!important;background:rgba(45,90,61,.12);border-radius:3px;padding:0 1px}
.ar-mark .tok-bad{color:#C45C26!important;background:rgba(196,92,38,.14);border-radius:3px;padding:0 1px;text-decoration:underline;text-decoration-style:wavy}
.ar-mark .tok-haraka{color:#B45309!important;background:rgba(180,83,9,.12);border-radius:3px;padding:0 1px}
.ar-mark .tok-haraka .tash,.ar-mark .tash.bad{
  color:#B45309;background:rgba(180,83,9,.22);border-radius:3px;outline:2px dotted #B45309;padding:0 1px
}
.ar-mark .tok-ok .tash{color:var(--ok)}
.ar-mark .tok-now{
  background:rgba(61,155,134,.18)!important;border-radius:4px;padding:0 3px;
  box-shadow:0 0 0 2px rgba(61,155,134,.35);
  animation:tokpulse 1.15s ease-in-out infinite
}
@keyframes tokpulse{0%,100%{opacity:1}50%{opacity:.62}}
.ar-mark .tash{font-weight:800}
.tarteel-leg{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin:8px 0 4px;justify-content:center}
.tarteel-leg b{font-weight:700}
.zeg-mushaf{
  font-family:var(--ar);font-size:clamp(42px,13vw,68px);font-weight:700;line-height:1.45;
  direction:rtl;text-align:center;margin:8px 0 4px;min-height:72px
}
.book-line.line-ok{border-inline-start:3px solid var(--ok);padding-inline-start:6px}
.book-line.line-bad{border-inline-start:3px solid #C45C26;padding-inline-start:6px}
.book-line.line-mid{border-inline-start:3px solid #C4A035;padding-inline-start:6px}
.book-line.line-active{background:rgba(61,155,134,.08);border-radius:8px}
.dlg-score{font-size:14px;font-weight:700;margin-bottom:6px}
.dlg-score .pct{font-size:20px}

.ar-mark .tok-wait{color:var(--muted)!important;opacity:.55}
.ar-mark .tok-plain{color:inherit}
.ar-mark .tok-plain .tash{
  color:var(--forest);font-weight:800;
  border-bottom:2px dotted var(--forest);padding:0 1px
}
.hide-ar .tok-wait,
.hide-ar .tok-now{
  color:transparent!important;
  background:var(--paper-deep)!important;
  box-shadow:none;
  border-radius:8px;
  min-width:2.4ch;
  display:inline-block;
  user-select:none
}
.hide-ar .tok-wait .tash,
.hide-ar .tok-now .tash{visibility:hidden}
.hide-ar.peek .tok-wait,
.hide-ar.peek .tok-now{
  color:inherit!important;
  background:rgba(61,155,134,.14)!important
}
.hide-ar.peek .tok-wait .tash,
.hide-ar.peek .tok-now .tash{visibility:visible}
.hide-ar .zeg-tr{filter:blur(10px);user-select:none}
.hide-ar.peek .zeg-tr{filter:none}
.cmp-sheet{
  position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));
  z-index:70;margin:0 auto;max-width:560px;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:18px 18px 0 0;
  padding:14px 16px 18px;box-shadow:0 -10px 32px rgba(0,0,0,.14)
}
.cmp-sheet .cmp-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cmp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cmp-lab{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
.cmp-ar{font-family:var(--ar);font-size:28px;font-weight:700;direction:rtl;line-height:1.35}
.cmp-hint{font-size:13px;color:var(--ink-soft);margin:8px 0 4px;line-height:1.4}
.end-pill{
  display:inline-block;font-family:system-ui,sans-serif;font-size:12px;font-weight:800;
  padding:3px 9px;border-radius:999px;background:var(--paper-deep);color:var(--ink);
  margin-inline-start:8px;direction:ltr;letter-spacing:.02em;vertical-align:middle;white-space:nowrap
}
.end-pill.ok{background:var(--ok-soft);color:var(--ok)}
.end-pill.bad{background:rgba(196,92,38,.14);color:#C45C26}
.end-pill.maybe{background:rgba(180,83,9,.14);color:#B45309}
.mk-heat{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:6px;vertical-align:middle;background:var(--line)}
.mk-heat.warm{background:#D4A017}
.mk-heat.hot{background:#C45C26}
.wl-row.warm{box-shadow:inset -3px 0 0 #D4A017}
.wl-row.hot{box-shadow:inset -3px 0 0 #C45C26}
.said-live{font-size:13px;color:var(--muted);min-height:18px;text-align:center;margin:2px 0 4px}
.flash-mushaf{font-family:var(--ar);font-size:clamp(36px,10vw,56px);font-weight:700;line-height:1.45;direction:rtl;text-align:center}

.dlg-practice-result{display:block!important;min-height:28px;margin-top:8px;padding:10px 12px;border-radius:12px}

.speak-result.bad{background:rgba(196,92,38,.12)!important;color:#C45C26!important}

.dlg-score{font-size:14px;font-weight:700}
.dlg-score .pct{font-size:22px;font-weight:800}

el · طَبِيبٌ een dokter · طَالِبٌ een student · مِفْتَاحٌ een sleutel · مِنْدِيلٌ een zakdoek · مَكْتَبٌ een bureau · تَاجِرٌ een handelaar · مَسْجِدٌ een moskee · وَلَدٌ een kind, jongen"}]},"2":{"title":"ذَلِكَ · وَ","summary":"Hoofdstuk 2 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het gebruik van ذَلِكَ en وَ.","Het woord ذَلِكَ betekent: «die», «dat».","Het woord وَ betekent: «en».","1. Het woord ذَلِكَ wordt uitgesproken als «dhaalika». Maar dit woord wordt zonder de eerste alif geschreven.","2. Het woord وَ wordt vlak bij het volgende woord geschreven. Met andere woorden: er komt geen spatie na het woord وَ.","حَجَرٌ een steen · سُكَّرٌ suiker · إِمَامٌ een imam · لَبَنٌ melk, yoghurt"],"examples":[{"ar":"هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ.","nl":"Dit is een huis en dat is een moskee."},{"ar":"هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ.","nl":"Dit is een pen en dat is een boek."},{"ar":"أَذَلِكَ مِفْتَاحٌ؟","nl":"Is dat een sleutel?"},{"ar":"مَا ذَلِكَ؟","nl":"Wat is dat?"}],"exercises":[{"type":"pic","emoji":"🏠","q":"هَذَا بَيْتٌ وَ… مَسْجِدٌ. Wat past?","options":["هَذَا","ذَلِكَ","مَا","نَعَمْ"],"answer":1,"explain":"Verder weg → ذَلِكَ مَسْجِدٌ."},{"type":"pic","emoji":"🖊️","q":"«Dit is een pen en dat is een boek»","options":["هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ","هَذَا كِتَابٌ وَذَلِكَ قَلَمٌ","ذَلِكَ قَلَمٌ وَهَذَاٌ كِتَابٌ","هَذَا قَلَمٌ هَذَا كِتَابٌ"],"answer":0,"explain":"هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ."},{"q":"Welk woord gebruik je voor «dat» (verder weg, mannelijk)?","options":["هَذَا","ذَلِكَ","هَذِهِ","تِلْكَ"],"answer":1,"explain":"ذَلِكَ = die/dat (m, verder)."},{"q":"Hoe schrijf je «en» in het Arabisch?","options":["Los woord met spaties eromheen","وَ vast tegen het volgende woord","Alleen aan het eind van de zin","Met tanwien"],"answer":1,"explain":"وَ plakt vast aan het volgende woord."},{"q":"هَذَا is voor iets…","options":["verder weg","dichtbij","vrouwelijks","meervoud"],"answer":1,"explain":"هَذَا = dichtbij (m)."},{"q":"ذَلِكَ is voor iets…","options":["dichtbij","verder weg","alleen mensen","alleen vragen"],"answer":1,"explain":"ذَلِكَ = verder weg (m)."},{"q":"Welke zin klopt?","options":["هَذَا بَيْتٌ وَ ذَلِكَ مَسْجِدٌ (met spatie na وَ)ٌ","هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ","هَذَا بَيْتٌ ذَلِكَ مَسْجِدٌ","وَهَذَاٌ بَيْتٌ ذَلِكَ"],"answer":1,"explain":"وَ plakt vast: وَذَلِكَ."},{"q":"وَ betekent…","options":["of","maar","en","in"],"answer":2,"explain":"وَ = en."},{"q":"Wat betekent: هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ.?","options":["Dit is een huis en dat is een moskee.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ. = Dit is een huis en dat is een moskee."},{"q":"Wat betekent: هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ.?","options":["Dit is een pen en dat is een boek.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ. = Dit is een pen en dat is een boek."},{"q":"Wat betekent: أَذَلِكَ مِفْتَاحٌ؟?","options":["Is dat een sleutel?","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"أَذَلِكَ مِفْتَاحٌ؟ = Is dat een sleutel?"},{"q":"Wat betekent: نَعَمْ، ذَلِكَ مِفْتَاحٌ.?","options":["Ja, dat is een sleutel.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"نَعَمْ، ذَلِكَ مِفْتَاحٌ. = Ja, dat is een sleutel."}],"fullText":[{"h":"Hoofdstuk 2"},{"p":"In deze les leren we het gebruik van ذَلِكَ en وَ."},{"p":"Het woord ذَلِكَ betekent: «die», «dat»."},{"p":"Het woord وَ betekent: «en»."},{"p":"Voorbeeld:"},{"ar":"هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ.","nl":"Dit is een huis en dat is een moskee."},{"h":"Merk op"},{"p":"1. Het woord ذَلِكَ wordt uitgesproken als «dhaalika». Maar dit woord wordt zonder de eerste alif geschreven."},{"p":"2. Het woord وَ wordt vlak bij het volgende woord geschreven. Met andere woorden: er komt geen spatie na het woord وَ."},{"h":"Woordenlijst van hoofdstuk 2"},{"p":"حَجَرٌ een steen · سُكَّرٌ suiker · إِمَامٌ een imam · لَبَنٌ melk, yoghurt"}]},"3":{"title":"ال · zonne- en maanletters","summary":"Hoofdstuk 3 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het gebruik van het Arabische bepaald lidwoord «al» (ال)ٌ dat overeenkomt met de Nederlandse lidwoorden «de» en «het». Wanneer het bepaald lidwoord «al» voorafgaat aan een naamwoord, dan vervalt het onbepaald lidwoord «-n».","Het Arabische alfabet bestaat uit 28 letters. Hiervan worden 14 letters zonneletters genoemd, en de overige 14 worden maanletters genoemd. Bij het uitspreken van de zonneletters wordt de punt van de tong gebruikt, zoals bij t, n, r, s. De punt van de tong speelt geen enkele rol bij het uitspreken van de maanletters, zoals bij b, w, m, k.","Wanneer «al» (ال)ٌ voorafgaat aan het begin van een naamwoord dat met een zonneletter begint, dan assimileert de «l» van «al» aan de zonneletter.","Een dergelijke assimilatie vindt niet plaats bij de maanletters.","Meer voorbeelden van de assimilatie van de «l» van «al» aan de zonneletters:","Merk op dat de «a» van «al» alleen wordt uitgesproken wanneer het niet vooraf wordt gegaan door een ander woord. De «a» van «al» wordt achterwege gelaten wanneer «al» vooraf wordt gegaan door een woord, alhoewel het in schrift blijft staan.","Om deze weglating in de uitspraak aan te geven, wordt het teken (ٱ)ٌ boven de hamzah geplaatst. De eerste klinker (a, i of u) die wordt weggelaten wanneer het vooraf wordt gegaan door een woord, wordt hamzat al-waṣl (همزةٌ الوصل)ُ — de hamzah van de verbinding — genoemd.","We hebben geleerd dat de tanwien het onbepaald lidwoord is. Het bepaald lidwoord is «al». Een naamwoord is ofwel bepaald ofwel onbepaald. Het kan niet beide tegelijk zijn.","ت ث د ذ ر ز س ش ص ض ط ظ ل ن","أ ب ج ح خ ع غ ف ق ك م و ه ي","Antoniemen (× = tegengestelde): غَنِيٌّ rijk × فَقِيرٌ arm · طَوِيلٌ lang × قَصِيرٌ kort · خَفِيفٌ licht × ثَقِيلٌ zwaar · صَغِيرٌ klein × كَبِيرٌ groot · بَارِدٌ koud × حَارٌّ heet · جَالِسٌ zittend × وَاقِفٌ staand · نَظِيفٌ schoon × وَسِخٌ vies · قَرِيبٌ dichtbij × بَعِيدٌ ver · جَدِيدٌ nieuw × قَدِيمٌ oud · جَمِيلٌ mooi · الْمَاءُ het water · حُلْوٌ zoet · الدُّكَّانُ de winkel · التُّفَّاحُ de appel · الْوَرَقُ het papier"],"examples":[{"ar":"بَيْتٌ → الْبَيْتُ","nl":"een huis → het huis"},{"ar":"الشَّمْسُ","nl":"de zon (ash-shams)"},{"ar":"الْقَمَرُ","nl":"de maan (al-qamar)"},{"ar":"الرَّجُلُ","nl":"de man (ar-rajul)"},{"ar":"الْبَابُ مَفْتُوحٌ.","nl":"De deur is open."},{"ar":"الْقَلَمُ مَكْسُورٌ.","nl":"De pen is gebroken."}],"exercises":[{"type":"pic","emoji":"🏠","q":"«een huis» → «het huis»","options":["بَيْتٌ → الْبَيْتُ","بَيْتٌ → بَيْتُ ال","الْبَيْتُ → بَيْتٌ","بَيْتٌ → بَيْتٌ"],"answer":0,"explain":"ال + tanwien weg."},{"type":"pic","emoji":"☀️","q":"الشَّمْسُ spreek je uit als…","options":["al-shams","ash-shams","as-shams zonder sh","shams"],"answer":1,"explain":"Zonneletter ش → ash-shams."},{"type":"pic","emoji":"🌙","q":"الْقَمَرُ spreek je uit als…","options":["aq-qamar","al-qamar","ar-qamar","qamar"],"answer":1,"explain":"Maanletter → al-qamar."},{"q":"Wat gebeurt er met de tanwien als je ال zet?","options":["Niets","De tanwien verdwijnt","De tanwien verdubbelt","Hij wordt een fathah"],"answer":1,"explain":"ال vervangt de tanwien: بَيْتٌ → الْبَيْتُ."},{"q":"Bij een zonneletter…","options":["blijft de ل hoorbaar","smelt de ل samen (shaddah)","valt ال helemaal weg","komt er tanwien bij"],"answer":1,"explain":"Bij zonneletters assimileert ل: ash-shams."},{"q":"Hoe spreek je الشَّمْسُ uit?","options":["al-shams","ash-shams","shams zonder al-","as-shamsu zonder sh"],"answer":1,"explain":"Zonneletter ش → ash-shams."},{"q":"بَيْتٌ met ال wordt…","options":["بَيْتٌ ال","الْبَيْتُ","الْبَيْتٌ","بَيْتُ ال"],"answer":1,"explain":"ال + woord, tanwien weg: الْبَيْتُ."},{"q":"الْقَمَرُ (maanletter) spreek je uit als…","options":["aq-qamar","al-qamar","ar-qamar","qamar zonder al"],"answer":1,"explain":"Maanletter: ل blijft hoorbaar → al-qamar."},{"q":"الرَّجُلُ (zonneletter ر)ٌ spreek je uit als…","options":["al-rajul","ar-rajul","a-rajul","rajul"],"answer":1,"explain":"Zonneletter ر → ar-rajul."},{"q":"Na وَ valt de a van ال in de uitspraak weg. Klopt dat?","options":["Ja","Nee"],"answer":0,"explain":"Ja: wal-bayt, niet wa al-bayt."},{"q":"Welke letter is een zonneletter?","options":["ب","م","ش","ك"],"answer":2,"explain":"ش is een zonneletter (ash-…)."}],"fullText":[{"h":"Hoofdstuk 3"},{"p":"In deze les leren we het gebruik van het Arabische bepaald lidwoord «al» (ال) dat overeenkomt met de Nederlandse lidwoorden «de» en «het». Wanneer het bepaald lidwoord «al» voorafgaat aan een naamwoord, dan vervalt het onbepaald lidwoord «-n»."},{"p":"Voorbeeld:"},{"ar":"بَيْتٌ → الْبَيْتُ","nl":"baitun → al-baytu"},{"p":"Het Arabische alfabet bestaat uit 28 letters. Hiervan worden 14 letters zonneletters genoemd, en de overige 14 worden maanletters genoemd. Bij het uitspreken van de zonneletters wordt de punt van de tong gebruikt, zoals bij t, n, r, s. De punt van de tong speelt geen enkele rol bij het uitspreken van de maanletters, zoals bij b, w, m, k."},{"p":"Wanneer «al» (ال) voorafgaat aan het begin van een naamwoord dat met een zonneletter begint, dan assimileert de «l» van «al» aan de zonneletter."},{"p":"Voorbeeld: al-shamsu (de zon) wordt uitgesproken als ash-shamsu. In de spelling vindt er geen verandering plaats: الشَّمْسُ. De assimilatie wordt aangegeven met de shaddah op de eerste letter van het naamwoord."},{"p":"Een dergelijke assimilatie vindt niet plaats bij de maanletters."},{"p":"Voorbeeld: al-qamaru (de maan) wordt uitgesproken als al-qamaru: الْقَمَرُ."},{"p":"Meer voorbeelden van de assimilatie van de «l» van «al» aan de zonneletters:"},{"ar":"النَّجْمُ","nl":"an-najmu (de ster)"},{"ar":"الرَّجُلُ","nl":"ar-rajulu (de man)"},{"ar":"الدِّيكُ","nl":"ad-dīku (de haan)"},{"ar":"السَّمَكُ","nl":"as-samaku (de vis)"},{"p":"Merk op dat de «a» van «al» alleen wordt uitgesproken wanneer het niet vooraf wordt gegaan door een ander woord. De «a» van «al» wordt achterwege gelaten wanneer «al» vooraf wordt gegaan door een woord, alhoewel het in schrift blijft staan."},{"p":"Voorbeeld: al-baytu — hier wordt de «a» uitgesproken. Maar als het vooraf wordt gegaan door «wa» (وَ), dat «en» betekent, dan wordt de «a» achterwege gelaten. De woorden worden dan uitgesproken als wal-baytu, en niet als: wa al-baytu."},{"p":"Om deze weglating in de uitspraak aan te geven, wordt het teken (ٱ) boven de hamzah geplaatst. De eerste klinker (a, i of u) die wordt weggelaten wanneer het vooraf wordt gegaan door een woord, wordt hamzat al-waṣl (همزة الوصل) — de hamzah van de verbinding — genoemd."},{"p":"Voorbeelden:"},{"ar":"الْبَابُ مَفْتُوحٌ.","nl":"De deur is open."},{"ar":"الْقَلَمُ مَكْسُورٌ.","nl":"De pen is gebroken."},{"p":"We hebben geleerd dat de tanwien het onbepaald lidwoord is. Het bepaald lidwoord is «al». Een naamwoord is ofwel bepaald ofwel onbepaald. Het kan niet beide tegelijk zijn."},{"h":"De zonneletters"},{"p":"ت ث د ذ ر ز س ش ص ض ط ظ ل ن"},{"h":"De maanletters"},{"p":"أ ب ج ح خ ع غ ف ق ك م و ه ي"},{"h":"Woordenlijst van hoofdstuk 3"},{"p":"Antoniemen (× = tegengestelde): غَنِيٌّ rijk × فَقِيرٌ arm · طَوِيلٌ lang × قَصِيرٌ kort · خَفِيفٌ licht × ثَقِيلٌ zwaar · صَغِيرٌ klein × كَبِيرٌ groot · بَارِدٌ koud × حَارٌّ heet · جَالِسٌ zittend × وَاقِفٌ staand · نَظِيفٌ schoon × وَسِخٌ vies · قَرِيبٌ dichtbij × بَعِيدٌ ver · جَدِيدٌ nieuw × قَدِيمٌ oud · جَمِيلٌ mooi · الْمَاءُ het water · حُلْوٌ zoet · الدُّكَّانُ de winkel · التُّفَّاحُ de appel · الْوَرَقُ het papier"}]},"4":{"title":"Voorzetsels · هُوَ هِيَ · أَنَا أَنْتَ","summary":"Hoofdstuk 4a en 4b uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het gebruik van de voorzetsels (حروفٌ الجر)ُ.","1) Arabische naamwoorden hebben verschillende uitgangen om zo hun functie in de zin te laten zien. De normale uitgang is de «-u» (ḍammah) zoals in:","Over een naamwoord met de normale uitgang wordt er gezegd dat het nominatief is. In het Arabisch wordt dit marfūʿ (مرفوع)ٌ genoemd.","Na een voorzetsel (ḥarf jarr) verandert deze uitgang in «-i» (kasrah).","Over een naamwoord dat vooraf wordt gegaan door een voorzetsel wordt er gezegd dat het genitief is. In het Arabisch wordt dit majrūr (مجرور)ٌ genoemd.","In het Arabisch: ḥurūf al-jarr (حروفٌ الجر)ُ. Het enkelvoud ervan is: ḥarf jarr.","Het woord فِي heeft een lange «ī». Maar wanneer het gevolgd wordt door «al-», dan wordt de «ī» korter omdat lange klinkers in het Arabisch niet gevolgd worden door een klinkerloze medeklinker (fī + al → fi l-).","2) In deze les leren we ook twee voornaamwoorden:","هُوَ «hij», «het»;","هِيَ «zij», «het».","In het Arabisch zijn alle naamwoorden mannelijk of vrouwelijk. Een mannelijk naamwoord wordt aangeduid met het persoonlijk voornaamwoord هُوَ, ongeacht of het een mens, een dier of een ding is. Een vrouwelijk naamwoord wordt aangeduid met هِيَ.","أَنَا = ik. أَنْتَ = jij (mannelijk enkelvoud)."],"examples":[{"ar":"هُوَ فِي الْمَسْجِدِ.","nl":"Hij is in de moskee."},{"ar":"الْقَلَمُ عَلَى الْمَكْتَبِ.","nl":"De pen is op het bureau."},{"ar":"ذَهَبَ إِلَى الْمَسْجِدِ.","nl":"Hij ging naar de moskee."},{"ar":"خَرَجَ مِنَ الْبَيْتِ.","nl":"Hij ging het huis uit."},{"ar":"أَيْنَ الْكِتَابُ؟","nl":"Waar is het boek?"},{"ar":"أَنَا مُحَمَّدٌ.","nl":"Ik ben Mohammed."}],"exercises":[{"type":"pic","emoji":"🕌","q":"«Hij is in de moskee»","options":["هُوَ فِي الْمَسْجِدِ","هُوَ عَلَى الْمَسْجِدِ","هِيَ فِي الْمَسْجِدِ","هُوَ إِلَى الْمَسْجِدِ"],"answer":0,"explain":"هُوَ فِي الْمَسْجِدِ."},{"type":"pic","emoji":"🛏️","q":"«Zij/het is op het bed»","options":["هِيَ عَلَى السَّرِيرِ","هُوَ فِي السَّرِيرِ","هِيَ فِي السَّرِيرِ","هُوَ عَلَى السَّرِيرِ"],"answer":0,"explain":"هِيَ عَلَى السَّرِيرِ."},{"type":"pic","emoji":"🕌","q":"«Hij ging naar de moskee»","options":["ذَهَبَ إِلَى الْمَسْجِدِ","خَرَجَ مِنْ الْمَسْجِدِ","هُوَ فِي الْمَسْجِدِ","أَنَا إِلَى الْمَسْجِدِ"],"answer":0,"explain":"ذَهَبَ إِلَى الْمَسْجِدِ."},{"q":"Na فِي krijgt het naamwoord welke uitgang?","options":["-u (nominatief)","-i (genitief)","-a (accusatief)","altijd tanwien"],"answer":1,"explain":"Na een voorzetsel → genitief (-i)."},{"q":"هِيَ gebruik je voor…","options":["alleen vrouwen","alles wat grammaticaal vrouwelijk is","alleen dieren","meervoud"],"answer":1,"explain":"Ook voor vrouwelijke dingen, zoals een auto."},{"q":"«Hij ging naar de moskee» is…","options":["هُوَ الْمَسْجِدُ","ذَهَبَ إِلَى الْمَسْجِدِ","خَرَجَ مِنْ الْمَسْجِدِ","أَنَا فِي الْمَسْجِدِ"],"answer":1,"explain":"ذَهَبَ إِلَى الْمَسْجِدِ."},{"q":"فِي betekent…","options":["op","in","naar","van"],"answer":1,"explain":"فِي = in."},{"q":"عَلَى betekent…","options":["in","onder","op","met"],"answer":2,"explain":"عَلَى = op."},{"q":"إِلَى betekent…","options":["van","naar","in","onder"],"answer":1,"explain":"إِلَى = naar."},{"q":"هُوَ gebruik je voor…","options":["alleen mannen","mannelijke woorden (ook dingen)","alleen vrouwen","meervoud"],"answer":1,"explain":"Ook voor mannelijke dingen, bijv. een boek."},{"q":"أَنَا betekent…","options":["jij","hij","ik","wij"],"answer":2,"explain":"أَنَا = ik."},{"q":"ذَهَبَ إِلَى الْمَسْجِدِ = …","options":["Hij kwam uit de moskee","Hij ging naar de moskee","Hij is in de moskee","Waar is de moskee?"],"answer":1,"explain":"ذَهَبَ = ging, إِلَى = naar."}],"fullText":[{"h":"Hoofdstuk 4a — Voorzetsels"},{"p":"In deze les leren we het gebruik van de voorzetsels (حروف الجر)."},{"p":"1) Arabische naamwoorden hebben verschillende uitgangen om zo hun functie in de zin te laten zien. De normale uitgang is de «-u» (ḍammah) zoals in:"},{"ar":"الْبَيْتُ جَدِيدٌ.","nl":"Het huis is nieuw. (al-baytu jadīdun)"},{"p":"Over een naamwoord met de normale uitgang wordt er gezegd dat het nominatief is. In het Arabisch wordt dit marfūʿ (مرفوع) genoemd."},{"p":"Na een voorzetsel (ḥarf jarr) verandert deze uitgang in «-i» (kasrah)."},{"p":"Voorbeelden:"},{"ar":"الْبَيْتُ","nl":"het huis (al-baytu)"},{"ar":"فِي الْبَيْتِ","nl":"in het huis (fī l-bayti)"},{"ar":"بَيْتٌ","nl":"een huis (baytun)"},{"ar":"فِي بَيْتٍ","nl":"in een huis (fī baytin)"},{"ar":"الْمَكْتَبُ","nl":"het bureau"},{"ar":"عَلَى الْمَكْتَبِ","nl":"op het bureau"},{"p":"Over een naamwoord dat vooraf wordt gegaan door een voorzetsel wordt er gezegd dat het genitief is. In het Arabisch wordt dit majrūr (مجرور) genoemd."},{"p":"In het Arabisch: ḥurūf al-jarr (حروف الجر). Het enkelvoud ervan is: ḥarf jarr."},{"p":"Het woord فِي heeft een lange «ī». Maar wanneer het gevolgd wordt door «al-», dan wordt de «ī» korter omdat lange klinkers in het Arabisch niet gevolgd worden door een klinkerloze medeklinker (fī + al → fi l-)."},{"h":"Voornaamwoorden"},{"p":"2) In deze les leren we ook twee voornaamwoorden:"},{"p":"هُوَ «hij», «het»;"},{"p":"هِيَ «zij», «het»."},{"p":"In het Arabisch zijn alle naamwoorden mannelijk of vrouwelijk. Een mannelijk naamwoord wordt aangeduid met het persoonlijk voornaamwoord هُوَ, ongeacht of het een mens, een dier of een ding is. Een vrouwelijk naamwoord wordt aangeduid met هِيَ."},{"h":"Hoofdstuk 4b — أَنَا، أَنْتَ en werkwoorden"},{"p":"أَنَا = ik. أَنْتَ = jij (mannelijk enkelvoud)."},{"p":"ذَهَبَ = hij ging. خَرَجَ = hij ging naar buiten."},{"p":"أَيْنَ = waar?"},{"ar":"أَيْنَ الْكِتَابُ؟","nl":"Waar is het boek?"},{"ar":"الْكِتَابُ عَلَى الْمَكْتَبِ.","nl":"Het boek is op het bureau."},{"ar":"ذَهَبَ بِلَالٌ إِلَى الْمَسْجِدِ.","nl":"Bilāl ging naar de moskee."},{"ar":"خَرَجَ مِنَ الْبَيْتِ.","nl":"Hij ging het huis uit."},{"ar":"أَنَا طَالِبٌ.","nl":"Ik ben student."},{"ar":"أَنْتَ مُدَرِّسٌ.","nl":"Jij bent leraar."}]},"5":{"title":"Bezitsconstructie · تَحْتَ · يَا","summary":"Hoofdstuk 5 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we de bezitsconstructie (الإضافة)ٌ, het woord تَحْتَ en de aanspreekvorm يَاٌ.","Bezit zeg je zo:","Eerste woord = muḍāf (het bezit). Tweede woord = muḍāf ilayh (de bezitter).","Regel: de muḍāf krijgt géén ال en géén tanwien. Dus niet: الْكِتَابُ بِلَالٍ.","Het tweede woord staat in de genitief (-i): بِلَالٍ، الْإِمَامِ.","تَحْتَ = onder.","يَاٌ gebruik je om iemand aan te spreken:","Na يَاٌ: één ḍammah (-u), geen tanwien: يَاٌ بِلَالُ (niet يَاٌ بِلَالٌ)ٌ."],"examples":[{"ar":"كِتَابُ بِلَالٍ","nl":"het boek van Bilāl"},{"ar":"بَيْتُ الْإِمَامِ","nl":"het huis van de imam"},{"ar":"تَحْتَ الْمَكْتَبِ","nl":"onder het bureau"},{"ar":"يَاٌ بِلَالُ","nl":"O Bilāl!"},{"ar":"كِتَابُ مَنْ؟","nl":"Wiens boek?"}],"exercises":[{"type":"pic","emoji":"📖","q":"«het boek van Bilāl»","options":["كِتَابُ بِلَالٍ","بِلَالُ كِتَابٍ","الْكِتَابُ بِلَالٍ","كِتَابٌ بِلَالٌ"],"answer":0,"explain":"كِتَابُ بِلَالٍ."},{"type":"pic","emoji":"🖥️","q":"«onder het bureau»","options":["تَحْتَ الْمَكْتَبِ","عَلَى الْمَكْتَبِ","فِي الْمَكْتَبِ","مِنْ الْمَكْتَبِ"],"answer":0,"explain":"تَحْتَ الْمَكْتَبِ."},{"q":"In كِتَابُ بِلَالٍ is كِتَابُ de…","options":["bezitter (muḍāf ilayh)","het bezit (muḍāf)","een voorzetsel","een werkwoord"],"answer":1,"explain":"Muḍāf = het bezit (hier: boek)."},{"q":"Mag de muḍāf ال of tanwien hebben?","options":["Ja, allebei","Alleen ال","Nee, geen van beide","Alleen tanwien"],"answer":2,"explain":"Muḍāf: geen ال en geen tanwien."},{"q":"Welke uitgang krijgt een naam na يَاٌ?","options":["tanwien -un","één ḍammah -u","kasrah -i","sukūn"],"answer":1,"explain":"Na يَاٌ: één ḍammah."},{"q":"كِتَابُ بِلَالٍ = …","options":["Bilāl is een boek","het boek van Bilāl","een boek en Bilāl","Bilāl las een boek"],"answer":1,"explain":"Iḍāfa: bezit + bezitter."},{"q":"Het eerste woord in de iḍāfa (muḍāf) mag…","options":["wel ال hebben","wel tanwien hebben","geen ال en geen tanwien hebben","alleen meervoud zijn"],"answer":2,"explain":"Muḍāf: geen ال, geen tanwien."},{"q":"تَحْتَ betekent…","options":["boven","naast","onder","in"],"answer":2,"explain":"تَحْتَ = onder."},{"q":"يَاٌ بِلَالُ zeg je om…","options":["naar Bilāl te vragen","Bilāl aan te spreken","Bilāl te beschrijven","Bilāl te tellen"],"answer":1,"explain":"يَاٌ = o… (roepvorm)."},{"q":"بَيْتُ الْإِمَامِ = …","options":["een huis en een imam","het huis van de imam","de imam is een huis","in het huis van de imam"],"answer":1,"explain":"Iḍāfa met bepaald tweede deel."}],"fullText":[{"h":"Hoofdstuk 5"},{"p":"In deze les leren we de bezitsconstructie (الإضافة), het woord تَحْتَ en de aanspreekvorm يَا."},{"p":"Bezit zeg je zo:"},{"ar":"كِتَابُ بِلَالٍ","nl":"het boek van Bilāl"},{"p":"Eerste woord = muḍāf (het bezit). Tweede woord = muḍāf ilayh (de bezitter)."},{"p":"Regel: de muḍāf krijgt géén ال en géén tanwien. Dus niet: الْكِتَابُ بِلَالٍ."},{"p":"Het tweede woord staat in de genitief (-i): بِلَالٍ، الْإِمَامِ."},{"ar":"بَيْتُ الْإِمَامِ","nl":"het huis van de imam"},{"ar":"قَلَمُ الطَّالِبِ","nl":"de pen van de student"},{"ar":"بَابُ الْبَيْتِ","nl":"de deur van het huis"},{"p":"تَحْتَ = onder."},{"ar":"تَحْتَ الْمَكْتَبِ","nl":"onder het bureau"},{"p":"يَا gebruik je om iemand aan te spreken:"},{"ar":"يَاٌ بِلَالُ","nl":"O Bilāl!"},{"p":"Na يَا: één ḍammah (-u), geen tanwien: يَا بِلَالُ (niet يَا بِلَالٌ)."},{"ar":"كِتَابُ مَنْ؟","nl":"Wiens boek?"}]},"6":{"title":"هَذِهِ · tāʾ marbūṭa","summary":"Hoofdstuk 6 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we هَذِهِ (de vrouwelijke vorm van هَذَا)ٌ en de tāʾ marbūṭa (ة)ٌ.","هَذِهِ is de vrouwelijke vorm van هَذَا. Gebruik het bij vrouwelijke woorden.","Veel woorden maak je vrouwelijk met ة (tāʾ marbūṭa):","De letter vóór de ة krijgt een fathah (a-klank).","Sommige woorden hebben een eigen vrouwelijke vorm:","Elk Arabisch naamwoord is mannelijk of vrouwelijk. Leer het geslacht meteen mee.","Ook dingen kunnen vrouwelijk zijn:"],"examples":[{"ar":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","nl":"Dit is een jongen en dit is een meisje."},{"ar":"هَذِهِ سَيَّارَةٌ.","nl":"Dit is een auto."},{"ar":"هَذِهِ طَبِيبَةٌ.","nl":"Dit is een dokter (vrouw)."},{"ar":"أَهَذِهِ حَقِيبَةٌ؟","nl":"Is dit een tas?"}],"exercises":[{"type":"pic","emoji":"👦","q":"«Dit is een jongen en dit is een meisje»","options":["هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ","هَذَا وَلَدٌ وَهَذَاٌ بِنْتٌ","هَذِهِ وَلَدٌ وَهَذَاٌ بِنْتٌ","هَذَا بِنْتٌ وَهَذِهِ وَلَدٌ"],"answer":0,"explain":"هَذَا (m) وَ هَذِهِ (v)."},{"type":"pic","emoji":"👨‍🏫","q":"مُدَرِّسٌ → vrouwelijk","options":["مُدَرِّسَةٌ","مُدَرِّسُونَ","مُدَرِّسِينَ","الْمُدَرِّسُ"],"answer":0,"explain":"مُدَرِّسَةٌ."},{"q":"Wat is de vrouwelijke vorm van «dit»?","options":["هَذَا","هَذِهِ","ذَلِكَ","تِلْكَ"],"answer":1,"explain":"هَذِهِ = dit (vrouwelijk)."},{"q":"مُدَرِّسٌ wordt vrouwelijk…","options":["مُدَرِّسُونَ","مُدَرِّسَةٌ","مُدَرِّسَاتٌ","مُدَرِّسِينَ"],"answer":1,"explain":"Voeg ة toe: مُدَرِّسَةٌ."},{"q":"هَذِهِ gebruik je bij…","options":["mannelijke woorden","vrouwelijke woorden","alleen meervoud","alleen vragen"],"answer":1,"explain":"هَذِهِ = dit (v)."},{"q":"Hoe maak je مُدَرِّسٌ vrouwelijk?","options":["مُدَرِّسُونَ","مُدَرِّسَةٌ","الْمُدَرِّسُ","مُدَرِّسِينَ"],"answer":1,"explain":"Voeg ة toe."},{"q":"اِبْنٌ (zoon) → vrouwelijk is…","options":["اِبْنَةٌ altijd","بِنْتٌ","أُخْتٌ","وَلَدٌ"],"answer":1,"explain":"بِنْتٌ = dochter/meisje."},{"q":"Moet je bij elk nieuw woord het geslacht leren?","options":["Nee, alleen bij mensen","Ja","Alleen bij dieren","Nee, altijd mannelijk"],"answer":1,"explain":"Ja — elk naamwoord is m of v."},{"q":"Wat betekent: هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.?","options":["Dit is een jongen en dit is een meisje.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ. = Dit is een jongen en dit is een meisje."},{"q":"Wat betekent: مُدَرِّسَةٌ?","options":["een lerares","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"مُدَرِّسَةٌ = een lerares"},{"q":"Wat betekent: هَذِهِ سَيَّارَةٌ.?","options":["Dit is een auto.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذِهِ سَيَّارَةٌ. = Dit is een auto."},{"q":"Wat betekent: هَذِهِ طَبِيبَةٌ.?","options":["Dit is een dokter (vrouw).","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذِهِ طَبِيبَةٌ. = Dit is een dokter (vrouw)."}],"fullText":[{"h":"Hoofdstuk 6"},{"p":"In deze les leren we هَذِهِ (de vrouwelijke vorm van هَذَا) en de tāʾ marbūṭa (ة)."},{"p":"هَذِهِ is de vrouwelijke vorm van هَذَا. Gebruik het bij vrouwelijke woorden."},{"p":"Veel woorden maak je vrouwelijk met ة (tāʾ marbūṭa):"},{"ar":"مُدَرِّسٌ → مُدَرِّسَةٌ","nl":"leraar → lerares"},{"p":"De letter vóór de ة krijgt een fathah (a-klank)."},{"p":"Sommige woorden hebben een eigen vrouwelijke vorm:"},{"ar":"اِبْنٌ → بِنْتٌ","nl":"zoon → dochter / meisje"},{"ar":"أَخٌ → أُخْتٌ","nl":"broer → zus"},{"p":"Elk Arabisch naamwoord is mannelijk of vrouwelijk. Leer het geslacht meteen mee."},{"p":"Ook dingen kunnen vrouwelijk zijn:"},{"ar":"هَذِهِ سَيَّارَةٌ.","nl":"Dit is een auto."},{"ar":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","nl":"Dit is een jongen en dit is een meisje."},{"ar":"أَهَذِهِ مُدَرِّسَةٌ؟","nl":"Is dit een lerares?"}]},"7":{"title":"تِلْكَ · overzicht aanwijzers","summary":"Hoofdstuk 7 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we تِلْكَ en het overzicht van de aanwijzende voornaamwoorden.","تِلْكَ = die / dat voor vrouwelijke woorden die verder weg zijn.","Complete set dichtbij: هَذَا (mannelijk) en هَذِهِ (vrouwelijk).","Complete set verder weg: ذَلِكَ (mannelijk) en تِلْكَ (vrouwelijk).","Kies altijd op geslacht én afstand."],"examples":[{"ar":"هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ.","nl":"Dit is Bilāl en dat is Ḥāmid."},{"ar":"هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ.","nl":"Dit is Āmina en dat is Maryam."},{"ar":"تِلْكَ طَبِيبَةٌ.","nl":"Dat is een dokter (vrouw)."},{"ar":"أَتِلْكَ سَيَّارَةٌ؟","nl":"Is dat een auto?"}],"exercises":[{"q":"«Die» (vrouwelijk, verder weg) is…","options":["هَذِهِ","تِلْكَ","ذَلِكَ","هَذَا"],"answer":1,"explain":"تِلْكَ = die/dat (v, verder)."},{"q":"Welk paar is mannelijk?","options":["هَذِهِ / تِلْكَ","هَذَا / ذَلِكَ","هُوَ / هِيَ","أَنَا / أَنْتَ"],"answer":1,"explain":"Mannelijk: هَذَا (dicht) / ذَلِكَ (ver)."},{"q":"تِلْكَ hoort bij…","options":["mannelijk dichtbij","vrouwelijk verder weg","mannelijk verder weg","vrouwelijk dichtbij"],"answer":1,"explain":"تِلْكَ = v, verder weg."},{"q":"هَذِهِ hoort bij…","options":["mannelijk dichtbij","vrouwelijk dichterbij","mannelijk verder","alleen dieren"],"answer":1,"explain":"هَذِهِ = v, dichtbij."},{"q":"Complete set mannelijk is…","options":["هَذَا / ذَلِكَ","هَذِهِ / تِلْكَ","هُوَ / هِيَ","أَنَا / أَنْتَ"],"answer":0,"explain":"m: هَذَا (dicht) / ذَلِكَ (ver)."},{"q":"Complete set vrouwelijk is…","options":["هَذَا / ذَلِكَ","هَذِهِ / تِلْكَ","مَا / مَنْ","فِي / عَلَى"],"answer":1,"explain":"v: هَذِهِ (dicht) / تِلْكَ (ver)."},{"q":"Wat betekent: هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ.?","options":["Dit is Bilāl en dat is Ḥāmid.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ. = Dit is Bilāl en dat is Ḥāmid."},{"q":"Wat betekent: هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ.?","options":["Dit is Āmina en dat is Maryam.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ. = Dit is Āmina en dat is Maryam."},{"q":"Wat betekent: تِلْكَ طَبِيبَةٌ.?","options":["Dat is een dokter (vrouw).","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"تِلْكَ طَبِيبَةٌ. = Dat is een dokter (vrouw)."},{"q":"Wat betekent: أَتِلْكَ سَيَّارَةٌ؟?","options":["Is dat een auto?","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"أَتِلْكَ سَيَّارَةٌ؟ = Is dat een auto?"}],"fullText":[{"h":"Hoofdstuk 7"},{"p":"In deze les leren we تِلْكَ en het overzicht van de aanwijzende voornaamwoorden."},{"p":"تِلْكَ = die / dat voor vrouwelijke woorden die verder weg zijn."},{"p":"Complete set dichtbij: هَذَا (mannelijk) en هَذِهِ (vrouwelijk)."},{"p":"Complete set verder weg: ذَلِكَ (mannelijk) en تِلْكَ (vrouwelijk)."},{"p":"Kies altijd op geslacht én afstand."},{"ar":"هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ.","nl":"Dit is Bilāl en dat is Ḥāmid."},{"ar":"هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ.","nl":"Dit is Āmina en dat is Maryam."},{"ar":"تِلْكَ طَبِيبَةٌ.","nl":"Dat is een dokter (vrouw)."},{"ar":"أَتِلْكَ سَيَّارَةٌ؟","nl":"Is dat een auto?"}]},"8":{"title":"Aanwijzer + bepaald lidwoord","summary":"Hoofdstuk 8 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het verschil tussen «dit is een boek» en «dit boek».","Hetzelfde patroon werkt met ذَلِكَ، هَذِهِ en تِلْكَ.","Kort: zonder ال + tanwien ≈ «dit is een…». Met ال ≈ «dit …» (nog aanvullen met een predicaat)."],"examples":[{"ar":"هَذَا الْكِتَابُ جَدِيدٌ.","nl":"Dit boek is nieuw."},{"ar":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.","nl":"Die man is een ingenieur."},{"ar":"هَذِهِ السَّاعَةُ جَمِيلَةٌ.","nl":"Dit horloge is mooi."},{"ar":"تِلْكَ الْبِنْتُ طَالِبَةٌ.","nl":"Dat meisje is studente."}],"exercises":[{"q":"هَذَا كِتَابٌ is…","options":["alleen een woordgroep","een volledige zin","fout Arabisch","alleen een vraag"],"answer":1,"explain":"Met tanwien: «Dit is een boek» = zin."},{"q":"هَذَا الْكِتَابُ betekent…","options":["Dit is een boek","Dit boek (nog geen complete zin)","Dat boek","Mijn boek"],"answer":1,"explain":"Aanwijzend + bepaald = «dit boek»."},{"q":"هَذَا كِتَابٌ betekent…","options":["dit boek (woordgroep)","Dit is een boek (zin)","dat boek","mijn boek"],"answer":1,"explain":"Tanwien → «dit is een…»."},{"q":"هَذَا الْكِتَابُ betekent…","options":["Dit is een boek","dit boek","dat is een boek","welk boek"],"answer":1,"explain":"Met ال: «dit boek»."},{"q":"Maak een complete zin: هَذَا الْكِتَابُ …","options":["فقطٌ","جَدِيدٌ","مَا","وَ"],"answer":1,"explain":"Bijv. هَذَا الْكِتَابُ جَدِيدٌ."},{"q":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ = …","options":["Deze man is student","Die man is ingenieur","Dit is een man","Waar is de man?"],"answer":1,"explain":"ذَلِكَ + bepaald + predicaat."},{"q":"Wat betekent: هَذَا الْكِتَابُ جَدِيدٌ.?","options":["Dit boek is nieuw.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذَا الْكِتَابُ جَدِيدٌ. = Dit boek is nieuw."},{"q":"Wat betekent: ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.?","options":["Die man is een ingenieur.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ. = Die man is een ingenieur."},{"q":"Wat betekent: هَذِهِ السَّاعَةُ جَمِيلَةٌ.?","options":["Dit horloge is mooi.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"هَذِهِ السَّاعَةُ جَمِيلَةٌ. = Dit horloge is mooi."},{"q":"Wat betekent: تِلْكَ الْبِنْتُ طَالِبَةٌ.?","options":["Dat meisje is studente.","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"تِلْكَ الْبِنْتُ طَالِبَةٌ. = Dat meisje is studente."}],"fullText":[{"h":"Hoofdstuk 8"},{"p":"In deze les leren we het verschil tussen «dit is een boek» en «dit boek»."},{"ar":"هَذَا كِتَابٌ.","nl":"Dit is een boek. (volledige zin, tanwien op كِتَابٌ)"},{"ar":"هَذَا الْكِتَابُ","nl":"dit boek (bepaald; nog geen complete zin zonder predicaat)"},{"ar":"هَذَا الْكِتَابُ جَدِيدٌ.","nl":"Dit boek is nieuw."},{"p":"Hetzelfde patroon werkt met ذَلِكَ، هَذِهِ en تِلْكَ."},{"p":"Kort: zonder ال + tanwien ≈ «dit is een…». Met ال ≈ «dit …» (nog aanvullen met een predicaat)."},{"ar":"هَذِهِ السَّيَّارَةُ جَمِيلَةٌ.","nl":"Deze auto is mooi."},{"ar":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.","nl":"Die man is een ingenieur."},{"ar":"أَهَذَاٌ الْقَلَمُ جَدِيدٌ؟","nl":"Is deze pen nieuw?"}]},"9":{"title":"Bijvoeglijk naamwoord (naʿt)","summary":"Hoofdstuk 9a en 9b uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In het Nederlands: «een nieuw huis». In het Arabisch: بَيْتٌ جَدِيدٌ (het bijvoeglijk naamwoord komt ná het zelfstandig naamwoord).","Het bijvoeglijk naamwoord (naʿt / نعت)ٌ komt overeen in vier dingen:","a. Geslacht — mannelijk of vrouwelijk.","b. Bepaaldheid — beide bepaald of beide onbepaald.","c. Naamval — het bijvoeglijk naamwoord heeft dezelfde naamval als het zelfstandig naamwoord.","d. Aantal/getal — enkelvoud, dualis of meervoud komen overeen.","2) Bijvoeglijke naamwoorden die eindigen op «-ān» (ان)ٌ krijgen geen tanwien.","الْقَاهِرَةُ Caïro · اللُّغَةُ de taal · الْمَدِينَةُ de stad · صَعْبٌ moeilijk · سَهْلٌ makkelijk · مَشْهُورٌ beroemd · مُجْتَهِدٌ hardwerkend, ijverig · الْعَرَبِيَّةُ het Arabisch · الْإِنْجِلِيزِيَّةُ het Engels"],"examples":[{"ar":"بَيْتٌ جَدِيدٌ","nl":"een nieuw huis"},{"ar":"بِنْتٌ صَغِيرَةٌ","nl":"een klein meisje"},{"ar":"الْبَيْتُ الْكَبِيرُ","nl":"het grote huis"},{"ar":"هَذَا كِتَابٌ مُفِيدٌ.","nl":"Dit is een nuttig boek."}],"exercises":[{"q":"Waar staat het bijvoeglijk naamwoord in het Arabisch?","options":["Voor het zelfstandig naamwoord","Na het zelfstandig naamwoord","Alleen aan het eind van de zin","Met أَ ervoor"],"answer":1,"explain":"Altijd ná: بَيْتٌ جَدِيدٌ."},{"q":"Waarom heeft صَغِيرَةٌ een ة in بِنْتٌ صَغِيرَةٌ?","options":["Toeval","Het komt overeen in geslacht (vrouwelijk)","Omdat het een vraag is","Verplicht bij alle bijvoeglijke naamwoorden"],"answer":1,"explain":"Naʿt komt overeen in geslacht."},{"q":"In het Arabisch staat het bijvoeglijk naamwoord…","options":["vóór het zelfstandig naamwoord","ná het zelfstandig naamwoord","alleen in vragen","met أَ ervoor"],"answer":1,"explain":"بَيْتٌ جَدِيدٌ — adj komt na."},{"q":"بَيْتٌ جَدِيدٌ = …","options":["nieuw is een huis","een nieuw huis","het nieuwe huis","grote huis"],"answer":1,"explain":"Onbepaald + adj met tanwien."},{"q":"الْبَيْتُ الْكَبِيرُ = …","options":["een groot huis","het grote huis","groot is het huis","huis groot"],"answer":1,"explain":"Beide met ال = bepaald."},{"q":"بِنْتٌ صَغِيرَةٌ — waarom ة bij صَغِيرَةٌ?","options":["Verplicht bij alle woorden","Overeenkomst in geslacht (v)","Omdat het meervoud is","Toeval"],"answer":1,"explain":"Naʿt komt overeen in geslacht."},{"q":"Het bijvoeglijk naamwoord moet overeenkomen in…","options":["alleen geslacht","geslacht, getal, bepaaldheid en naamval","alleen bepaaldheid","alleen uitspraak"],"answer":1,"explain":"Vier punten van overeenkomst."},{"q":"Wat betekent: بَيْتٌ جَدِيدٌ?","options":["een nieuw huis","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"بَيْتٌ جَدِيدٌ = een nieuw huis"},{"q":"Wat betekent: بِنْتٌ صَغِيرَةٌ?","options":["een klein meisje","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"بِنْتٌ صَغِيرَةٌ = een klein meisje"},{"q":"Wat betekent: سَيَّارَةٌ جَدِيدَةٌ?","options":["een nieuwe auto","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"سَيَّارَةٌ جَدِيدَةٌ = een nieuwe auto"},{"q":"Wat betekent: الْبَيْتُ الْكَبِيرُ?","options":["het grote huis","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"الْبَيْتُ الْكَبِيرُ = het grote huis"}],"fullText":[{"h":"Hoofdstuk 9a — Het bijvoeglijk naamwoord"},{"p":"In het Nederlands: «een nieuw huis». In het Arabisch: بَيْتٌ جَدِيدٌ (het bijvoeglijk naamwoord komt ná het zelfstandig naamwoord)."},{"p":"Het bijvoeglijk naamwoord (naʿt / نعت) komt overeen in vier dingen:"},{"p":"a. Geslacht — mannelijk of vrouwelijk."},{"ar":"بَيْتٌ جَدِيدٌ","nl":"een nieuw huis (m)"},{"ar":"بِنْتٌ صَغِيرَةٌ","nl":"een klein meisje (v)"},{"p":"b. Bepaaldheid — beide bepaald of beide onbepaald."},{"ar":"الْبَيْتُ الْكَبِيرُ","nl":"het grote huis"},{"p":"c. Naamval — het bijvoeglijk naamwoord heeft dezelfde naamval als het zelfstandig naamwoord."},{"ar":"هَذَا بَيْتٌ جَدِيدٌ.","nl":"Dit is een nieuw huis. (beide nominatief)"},{"ar":"فِي بَيْتٍ جَدِيدٍ","nl":"in een nieuw huis (beide genitief)"},{"p":"d. Aantal/getal — enkelvoud, dualis of meervoud komen overeen."},{"p":"2) Bijvoeglijke naamwoorden die eindigen op «-ān» (ان) krijgen geen tanwien."},{"ar":"كَسْلَانُ","nl":"lui"},{"ar":"جَوْعَانُ","nl":"hongerig"},{"ar":"عَطْشَانُ","nl":"dorstig"},{"ar":"غَضْبَانُ","nl":"boos"},{"ar":"مَلْآنُ","nl":"vol"},{"h":"Woordenlijst van hoofdstuk 9a (selectie)"},{"p":"الْقَاهِرَةُ Caïro · اللُّغَةُ de taal · الْمَدِينَةُ de stad · صَعْبٌ moeilijk · سَهْلٌ makkelijk · مَشْهُورٌ beroemd · مُجْتَهِدٌ hardwerkend, ijverig · الْعَرَبِيَّةُ het Arabisch · الْإِنْجِلِيزِيَّةُ het Engels"}]},"10":{"title":"Bezittelijke achtervoegsels","summary":"Hoofdstuk 10 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het volgende:","1) De bezittelijke voornaamwoorden: -كَ «jouw», -هُ «zijn», -هَاٌ «haar» en -يٌ «mijn».","Deze bezittelijke voornaamwoorden zijn geen volwaardige woorden. Ze zijn als achtervoegsels die verbonden worden aan de naamwoorden.","2) Het woord voor «vader» is أَبٌ en voor «broer» is أَخٌ.","«Jouw broer» is أَخُوكَ, en niet أَخُكَ. Een extra wāw (و)ٌ dient tussen de muḍāf en de muḍāf ilayh te worden toegevoegd. Op dezelfde manier: «zijn vader» is أَبُوهُ, niet أَبُهُ.","Let op het volgende:","«Mijn vader» en «mijn broer» krijgen geen extra wāw: أَبِيٌ، أَخِيٌ.","Er zijn vijf woorden die deze extra wāw krijgen wanneer ze muḍāf zijn. Je hebt er nu twee geleerd en je zult de andere drie in de toekomst leren, in shāʾ Allāh.","3) We hebben geleerd dat het woord عِنْدَ «bij» betekent. Het wordt ook gebruikt om het idee van «hebben» uit te drukken.","4) We hebben geleerd dat het voorzetsel لِ «behoort tot/aan», «van» of «voor» betekent. Wanneer het geconnecteerd wordt aan de voornaamwoorden, dan krijgt het een fathah:","لِيٌ أَخٌ betekent: «Ik heb een broer.» Letterlijk: «Een broer behoort aan mij.»","Het is verkeerd om عِنْدِي أَخٌ te zeggen voor familie/lichaamsdelen, omdat عِنْدَ gebruikt wordt voor dingen die scheidbaar zijn; relaties en lichaamsdelen zijn niet van deze aard."],"examples":[{"ar":"كِتَابِيٌ","nl":"mijn boek"},{"ar":"كِتَابُكَ","nl":"jouw boek"},{"ar":"كِتَابُهُ","nl":"zijn boek"},{"ar":"كِتَابُهَاٌ","nl":"haar boek"},{"ar":"أَخُوكَ","nl":"jouw broer"},{"ar":"أَهَذَاٌ كِتَابُكَ؟","nl":"Is dit jouw boek?"},{"ar":"نَعَمْ، هَذَا كِتَابِيٌ.","nl":"Ja, dit is mijn boek."},{"ar":"مَا اسْمُكَ؟","nl":"Wat is jouw naam?"}],"exercises":[{"q":"«Mijn boek» is…","options":["كِتَابُكَ","كِتَابِيٌ","كِتَابُهُ","كِتَابُهَاٌ"],"answer":1,"explain":"ـِيٌ = mijn."},{"q":"«Haar boek» is…","options":["كِتَابُهُ","كِتَابُهَاٌ","كِتَابُكَ","كِتَابِيٌ"],"answer":1,"explain":"ـهَاٌ = haar."},{"q":"كِتَابِيٌ = …","options":["jouw boek","mijn boek","zijn boek","haar boek"],"answer":1,"explain":"ـِيٌ = mijn."},{"q":"كِتَابُكَ = …","options":["mijn boek","jouw boek","zijn boek","haar boek"],"answer":1,"explain":"ـُكَ = jouw (m)."},{"q":"كِتَابُهُ = …","options":["mijn boek","jouw boek","zijn boek","haar boek"],"answer":2,"explain":"ـُهُ = zijn."},{"q":"كِتَابُهَاٌ = …","options":["mijn boek","jouw boek","zijn boek","haar boek"],"answer":3,"explain":"ـهَاٌ = haar."},{"q":"أَخُوكَ = …","options":["mijn broer","jouw broer","zijn broer","haar broer"],"answer":1,"explain":"أَخٌ + و + كَ = jouw broer."},{"q":"Wat betekent: كِتَابِيٌ?","options":["mijn boek","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"كِتَابِيٌ = mijn boek"},{"q":"Wat betekent: كِتَابُكَ?","options":["jouw boek","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"كِتَابُكَ = jouw boek"},{"q":"Wat betekent: كِتَابُهُ?","options":["zijn boek","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"كِتَابُهُ = zijn boek"},{"q":"Wat betekent: كِتَابُهَاٌ?","options":["haar boek","Ik weet het niet","Dat klopt niet","Geen van deze"],"answer":0,"explain":"كِتَابُهَاٌ = haar boek"}],"fullText":[{"h":"Hoofdstuk 10"},{"p":"In deze les leren we het volgende:"},{"p":"1) De bezittelijke voornaamwoorden: -كَ «jouw», -هُ «zijn», -هَا «haar» en -ي «mijn»."},{"ar":"كِتَابُكَ","nl":"jouw boek (mannelijk enkelvoud)"},{"ar":"كِتَابُهُ","nl":"zijn boek"},{"ar":"كِتَابُهَاٌ","nl":"haar boek"},{"ar":"كِتَابِيٌ","nl":"mijn boek"},{"p":"Deze bezittelijke voornaamwoorden zijn geen volwaardige woorden. Ze zijn als achtervoegsels die verbonden worden aan de naamwoorden."},{"p":"2) Het woord voor «vader» is أَبٌ en voor «broer» is أَخٌ."},{"p":"«Jouw broer» is أَخُوكَ, en niet أَخُكَ. Een extra wāw (و) dient tussen de muḍāf en de muḍāf ilayh te worden toegevoegd. Op dezelfde manier: «zijn vader» is أَبُوهُ, niet أَبُهُ."},{"p":"Let op het volgende:"},{"ar":"بَيْتُ مُحَمَّدٍ","nl":"het huis van Mohammed"},{"ar":"أَبُوٌ مُحَمَّدٍ","nl":"de vader van Mohammed"},{"ar":"أَخُوٌ مُحَمَّدٍ","nl":"de broer van Mohammed"},{"p":"«Mijn vader» en «mijn broer» krijgen geen extra wāw: أَبِي، أَخِي."},{"p":"Er zijn vijf woorden die deze extra wāw krijgen wanneer ze muḍāf zijn. Je hebt er nu twee geleerd en je zult de andere drie in de toekomst leren, in shāʾ Allāh."},{"p":"3) We hebben geleerd dat het woord عِنْدَ «bij» betekent. Het wordt ook gebruikt om het idee van «hebben» uit te drukken."},{"ar":"أَعِنْدَكَ قَلَمٌ؟","nl":"Heb jij een pen? (letterlijk: is er een pen bij jou?)"},{"p":"4) We hebben geleerd dat het voorzetsel لِ «behoort tot/aan», «van» of «voor» betekent. Wanneer het geconnecteerd wordt aan de voornaamwoorden, dan krijgt het een fathah:"},{"ar":"لَكَ","nl":"van jou"},{"ar":"لَهُ","nl":"van hem"},{"ar":"لَهَاٌ","nl":"van haar"},{"ar":"لِيٌ","nl":"van mij (met kasrah)"},{"p":"لِي أَخٌ betekent: «Ik heb een broer.» Letterlijk: «Een broer behoort aan mij.»"},{"p":"Het is verkeerd om عِنْدِي أَخٌ te zeggen voor familie/lichaamsdelen, omdat عِنْدَ gebruikt wordt voor dingen die scheidbaar zijn; relaties en lichaamsdelen zijn niet van deze aard."},{"p":"5–9) Verdere notities uit het boek: مَعَ betekent «met». مَا kan ook als ontkennend partikel gebruikt worden: مَا لِي سَيَّارَةٌ = «Ik heb geen auto.»"},{"h":"Woordenlijst van hoofdstuk 10 (selectie)"},{"p":"الْوَلَدُ het kind · الزَّمِيلُ de collega, de klasgenoot · الشَّابُّ de jongeman · الزَّوْجُ / الزَّوْجَةُ de echtgenoot / de echtgenote"}]}};

    ['شمس','sun'],['قمر','moon'],['بنت','girl'],['مدرس','teacher'],['سياره','car'],['حقيبه','bag'],
    ['ماء','water'],['تفاح','apple'],['مدرسة','school'],['ساعة','clock']
  ];
  for(const [k,v] of map){if(ar.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  // Dutch hints in explain
  const n=t.toLowerCase();
  const nl=[['huis','house'],['moskee','mosque'],['boek','book'],['pen','pen'],['deur','door'],['jongen','boy'],['meisje','girl'],['man','man'],['leraar','teacher']];

  return '';
}

let activeAudio=null, arabicVoice=null, voicesReady=false, unlocked=false, audioCtx=null;

function primeVoices(){
  try{refreshArVoices()}catch(e){}
  if(!('speechSynthesis' in window))return;
  const pick=()=>{
    try{
      const v=speechSynthesis.getVoices()||[];
      if(!v.length)return;
      voicesReady=true;
      const ar=v.filter(x=>/^ar(?:[-_]|$)/i.test(x.lang||'')||/arabic/i.test(x.name||''));
      if(ar.length){
        const pref=[/google/i,/microsoft/i,/enhanced/i,/premium/i,/natural/i,/maged/i,/tarik/i,/naayf/i];
        for(const re of pref){const f=ar.find(x=>re.test(x.name||''));if(f){arabicVoice=f;return}}
        arabicVoice=ar[0];
      }
    }catch(e){}
  };
  pick();
  try{speechSynthesis.onvoiceschanged=pick;speechSynthesis.getVoices()}catch(e){}
}

function unlockAudio(){ audioMuted=false; 
  try{

    }
  }catch(e){}
  try{
    if('speechSynthesis' in window){
  try{speechSynthesis.onvoiceschanged=()=>{refreshArVoices();primeVoices()};refreshArVoices()}catch(e){}
      speechSynthesis.cancel();
      if(speechSynthesis.resume)speechSynthesis.resume();
    }
  }catch(e){}
  if(!unlocked){

    try{

  }
}

// Unieke stem-profielen per spreker (vast voor die naam)
const SPEAKER_PROFILES = {};
const MALE_PROFILES = [
  {rate:0.72, label:'m1'},
  {rate:0.95, label:'m2'},
  {rate:0.80, label:'m3'},
  {rate:1.08, label:'m4'},
  {rate:0.76, label:'m5'},
  {rate:1.00, label:'m6'},
];
const FEMALE_PROFILES = [
  {rate:0.92, label:'f1'},
  {rate:1.18, label:'f2'},
  {rate:1.02, label:'f3'},
  {rate:1.32, label:'f4'},
  {rate:0.96, label:'f5'},
  {rate:1.24, label:'f6'},
];
function profileForSpeaker(who, gender){
  const key=String(who||'onbekend');
  if(SPEAKER_PROFILES[key])return SPEAKER_PROFILES[key];
  const g=gender==='f'?'f':'m';
  const pool=g==='f'?FEMALE_PROFILES:MALE_PROFILES;
  // stabiele index uit naam
  let h=0;
  for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
  // unieke slot: prefer unused profile index
  const used=new Set(Object.values(SPEAKER_PROFILES).filter(p=>p.gender===g).map(p=>p.idx));
  let idx=h%pool.length;
  for(let k=0;k<pool.length;k++){
    const tryIdx=(idx+k)%pool.length;
    if(!used.has(tryIdx)){idx=tryIdx;break}
  }
  const base=pool[idx];
  const prof={rate:base.rate, gender:g, idx, label:base.label};
  SPEAKER_PROFILES[key]=prof;
  return prof;
}
function playBlobPitched(blob, gender, done, who){
  const myGen=audioGen;
  const prof=profileForSpeaker(who, gender);
  const url=URL.createObjectURL(blob);
  const a=getSharedAudio();
  try{a.pause()}catch(e){}
  a.onended=null;a.onerror=null;
  a.src=url;
  // Grote contrasten per spreker (fallback)
  const maleRates=[0.78,0.92,1.08,0.84,1.00,1.16];
  const femaleRates=[0.94,1.10,1.28,1.02,1.18,1.34];
  a.playbackRate=prof.gender==='f'?femaleRates[prof.idx%6]:maleRates[prof.idx%6];
  a.onended=()=>{try{URL.revokeObjectURL(url)}catch(e){}; if(myGen===audioGen&&done)done(true)};
  a.onerror=()=>{try{URL.revokeObjectURL(url)}catch(e){}; if(myGen===audioGen&&done)done(false)};
  activeAudio=a;
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{if(myGen===audioGen&&done)done(false)});
}


function playUrl(src,done){
  try{
    if(audioMuted){if(done)done(false);return}
    stopAudio();
    const a=new Audio();
    activeAudio=a;
    try{a.referrerPolicy='no-referrer'}catch(e){}
    a.setAttribute('referrerpolicy','no-referrer');
    a.setAttribute('playsinline','');
    a.setAttribute('webkit-playsinline','');
    a.preload='auto';
    let settled=false;
    const finish=ok=>{if(settled)return;settled=true;if(done)done(ok)};
    a.onended=()=>finish(true);
    a.onerror=()=>finish(false);
    a.src=src;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>finish(false));
    setTimeout(()=>{if(!settled&&a.paused)finish(false)},4000);
  }catch(e){if(done)done(false)}
}

function playBlob(blob,done){
  try{
    const url=URL.createObjectURL(blob);
    playUrl(url,ok=>{
      try{URL.revokeObjectURL(url)}catch(e){}
      if(done)done(ok);
    });
  }catch(e){if(done)done(false)}
}

/* CORS-friendly Google TTS proxy (works on GitHub Pages) */
function ttsSpell(s){
  // Force audible i'rab: tanween ٌ/ٍ/ً → vowel + nūn
  let o='', t=String(s||'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(c==='ٌ') o+='ُنْ';
    else if(c==='ٍ') o+='ِنْ';
    else if(c==='ً'){
      o+='َنْ';
      if(t[i+1]==='ا') i++;
    }else o+=c;
  }
  return o;
}
function speakProxy(text,done){
  if(audioMuted){if(done)done(false);return}
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://tts-api.netlify.app/?text='+q+'&lang=ar';
  fetch(url,{mode:'cors',credentials:'omit',cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlob(blob,done);
    })
    .catch(()=>{
      if(myGen!==audioGen){if(done)done(false);return}
      playUrl(url,done);
    });
}

function speakGoogle(text,done){
  if(audioMuted){if(done)done(false);return}
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const urls=[
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ar&q='+q,
    'https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q='+q
  ];
  let i=0;
  function next(){
    if(myGen!==audioGen){if(done)done(false);return}
    if(i>=urls.length){if(done)done(false);return}
    const src=urls[i++];
    fetch(src,{referrerPolicy:'no-referrer',mode:'cors',credentials:'omit'})
      .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
      .then(blob=>{
        if(myGen!==audioGen){if(done)done(false);return}
        if(!blob||blob.size<400)throw new Error('empty');
        playBlob(blob,done);
      })
      .catch(()=>{
        if(myGen!==audioGen){if(done)done(false);return}
        playUrl(src,ok=>{if(myGen!==audioGen)return; if(ok){if(done)done(true)}else next()});
      });
  }
  next();
}


/* Gender + multi-voice for dialogues */
const FEMALE_NAMES = new Set(['خَوْلَة','خولة','خَدِيجَة','خديجة','مَرْيَم','مريم','زَيْنَب','زينب','نَدَى','ندى','هُدَى','هدى','الْأُخْت','الأخت','فَاطِمَة','فاطمة','سَعِيدَة','سعيدة','آٰمِنَة','آمنة','عَائِشَة','عائشة']);

const NAME_TRANSLIT = {
  'خَالِد':'Khālid','خالد':'Khālid',
  'خَلِيل':'Khalīl','خليل':'Khalīl',
  'خَوْلَة':'Khawla','خولة':'Khawla',
  'خَدِيجَة':'Khadīja','خديجة':'Khadīja',

  'نَدَى':'Nadā','ندى':'Nadā',
  'هُدَى':'Hudā','هدى':'Hudā',
  'الْأَخ':'al-akh','الأخ':'al-akh','الاخ':'al-akh',

  'سَعْد':'Saʿd','سعد':'Saʿd',
  'فَهْد':'Fahd','فهد':'Fahd',
  'نَاصِر':'Nāṣir','ناصر':'Nāṣir',
