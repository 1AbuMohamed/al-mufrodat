rom · الْكُوبُ de beker, het glas · كَسْلَانُ lui · جَوْعَانُ hongerig · عَطْشَانُ dorstig · غَضْبَانُ boos · مَلْآنُ vol · الْمَكْتَبَةُ de bibliotheek · الْآنَ nu · الْمُسْتَوْصَفُ de kliniek · الْمِرْوَحَةُ de ventilator · الْكُوَيْتُ Koeweit · الْمَدْرَسَةُ الثَّانَوِيَّةُ de middelbare school · الْوَزِيرُ de minister · حَادٌّ scherp · إِنْدُونِيسِيَا Indonesië · الَّذِي die, dat (m) · عِنْدَ bij"],"ex":[]}],"examples":[{"ar":"مُحَمَّدٌ طَالِبٌ قَدِيمٌ وَحَامِدٌ طَالِبٌ جَدِيدٌ.","nl":"Moehammad is een oude student en Haamied is een nieuwe student."},{"ar":"أَنَا فِي الْمَدْرَسَةِ الثَّانَوِيَّةِ.","nl":"Ik zit op de middelbare school."},{"ar":"هَذَا الْوَلَدُ مُجْتَهِدٌ وَذَلِكَ الْوَلَدُ كَسْلَانُ.","nl":"Deze jongen is ijverig en die jongen is lui."},{"ar":"الْعُصْفُورُ طَائِرٌ صَغِيرٌ.","nl":"De mus is een kleine vogel."},{"ar":"لِمَنْ هَذَا الْقَلَمُ الْجَمِيلُ؟ هُوَ لِعَبَّاسٍ.","nl":"Van wie is deze mooie pen? Hij is van 'Abbaas."},{"ar":"الْفَتَى الَّذِي خَرَجَ مِنْ فَصْلِكَ الْآنَ مِنَ الْكُوَيْتِ.","nl":"De jongeman die net uit jouw klas kwam, komt uit Koeweit."},{"ar":"هَذَا السِّكِّينُ حَادٌّ جِدًّا.","nl":"Dit mes is erg scherp."}],"exercises":[{"q":"Hoe vertaal je «een nieuw huis» en «het nieuwe huis» (Na't & Man'oet)?","options":["بَيْتٌ جَدِيدٌ en الْبَيْتُ الْجَدِيدُ","جَدِيدٌ بَيْتٌ en الْجَدِيدُ الْبَيْتُ","الْبَيْتُ جَدِيدٌ en بَيْتٌ الْجَدِيدُ","بَيْتُ جَدِيدٍ en الْبَيْتِ الْجَدِيدُ"],"answer":0,"explain":"Het bijvoeglijk naamwoord (Na't) volgt ná het zelfstandig naamwoord en stemt overeen in bepaaldheid: بَيْتٌ جَدِيدٌ (een nieuw huis) vs. الْبَيْتُ الْجَدِيدُ (het nieuwe huis). Noteer dat الْبَيْتُ جَدِيدٌ betekent: «Het huis IS nieuw»!"},{"q":"Kies de juiste vorm na het voorzetsel فِي: أَنَا فِي ...","options":["بَيْتٍ جَدِيدٍ (of الْبَيْتِ الْجَدِيدِ)","بَيْتٍ جَدِيدٌ","الْبَيْتِ الْجَدِيدُ","بَيْتٌ جَدِيدٍ"],"answer":0,"explain":"De Na't neemt dezelfde naamval aan als de Man'oet (overeenkomst c): beide zijn hier Madjroer (-in of -i)."},{"q":"Welke schrijfwijze is juist voor de bijvoeglijke naamwoorden op «-aan» (zoals «hongerig», «dorstig», «lui»)?","options":["جَوْعَانُ · عَطْشَانُ · كَسْلَانُ (zonder Tanwien!)","جَوْعَانٌ · عَطْشَانٌ · كَسْلَانٌ","الْجَوْعَانٌ · الْعَطْشَانٌ","جَوْعَانٍ · عَطْشَانٍ"],"answer":0,"explain":"Bijvoeglijke naamwoorden op -aan (فَعْلَانُ) krijgen géén Tanwien (blz. 41)."},{"q":"Hoe schrijf je لِ («voor/van») + الْإِمَامُ («de imam»)?","options":["لِلْإِمَامِ (de Alief van الْ valt weg)","لِالْإِمَامِ","لِلْإِمَامُ","لِإِمَامُ"],"answer":0,"explain":"Wanneer لِ voorafgaat aan الْ, valt de Hamzah (Alief) van الْ in de schrijfwijze weg en wordt het naamwoord Madjroer: لِلْإِمَامِ (blz. 44)."},{"q":"Vul het juiste betrekkelijk voornaamwoord in: الرَّجُلُ ... خَرَجَ مِنَ الْمَسْجِدِ تَاجِرٌ شَهِيرٌ.","options":["الَّذِي","هَذَا","ذَلِكَ","مَنْ"],"answer":0,"explain":"الَّذِي betekent «die / dat» na een bepaald mannelijk enkelvoudig naamwoord (blz. 43)."},{"q":"Kies de juiste vorm na عِنْدَ («bij»): الْمُدَرِّسُ عِنْدَ ...","options":["الْمُدِيرِ","الْمُدِيرُ","الْمُدِيرٌ","مُدِيرٌ"],"answer":0,"explain":"Het zelfstandig naamwoord na عِنْدَ heeft de uitgang -ie (Madjroer als Moedaaf Ilaih): عِنْدَ الْمُدِيرِ (blz. 44)."},{"q":"Wat betekent: الْكُوبُ مَلْآنُ وَالسِّكِّينُ حَادٌّ.","options":["De beker is vol en het mes is scherp.","De beker is leeg en de lepel is schoon.","Het glas is gebroken en het mes is oud.","Het water is koud en het fruit is zoet."],"answer":0,"explain":"الْكُوبُ = de beker, مَلْآنُ = vol, السِّكِّينُ = het mes, حَادٌّ = scherp."}],"fullText":[{"h":"Les 9a · 1) Na't & Man'oet: De 4 overeenkomsten (blz. 39–41)"},{"p":"1) Het bijvoeglijk naamwoord (نَعْتٌ) volgt ná het naamwoord (مَنْعُوتٌ) en stemt overeen in 4 dingen:"},{"p":"In het Nederlands staat het bijvoeglijk naamwoord vóór het zelfstandig naamwoord («een nieuw huis»). In het Arabisch komt het bijvoeglijk naamwoord (Na't) altijd ná het zelfstandig naamwoord (Man'oet): بَيْتٌ جَدِيدٌ."},{"p":"De Na't moet in vier opzichten precies overeenkomen met de Man'oet:"},{"table":{"headers":["Overeenkomst","Voorbeeld 1","Voorbeeld 2","Uitleg"],"rows":[["a. Geslacht (m / v)","وَلَدٌ صَغِيرٌ (een kleine jongen)","بِنْتٌ صَغِيرَةٌ (een klein meisje)","Mannelijk bij m., vrouwelijk (ة) bij v."],["b. Bepaaldheid","بِلَالٌ مُدَرِّسٌ جَدِيدٌ (een nieuwe leraar)","الْمُدَرِّسُ الْجَدِيدُ فِي الْفَصْلِ (De nieuwe leraar…)","Beide onbepaald óf beide met الْ!"],["c. Naamval (I'raab)","هَذَا بَيْتٌ جَدِيدٌ (Marfoe' -oen)","أَنَا فِي بَيْتٍ جَدِيدٍ / فِي الْبَيْتِ الْجَدِيدِ (Madjroer)","Beide Marfoe' óf beide Madjroer!"],["d. Aantal / Getal","مُدَرِّسٌ جَدِيدٌ (enkelvoud)","مُدَرِّسَانِ جَدِيدَانِ / مُدَرِّسُونَ جُدُدٌ","Enkelvoud, tweevoud of meervoud."]]}},{"ar":"أَيْنَ الْمُدَرِّسُ الْجَدِيدُ؟ هُوَ فِي الْفَصْلِ.","nl":"Waar is de nieuwe leraar? Hij is in het klaslokaal."},{"ar":"مَنْ فِي الْبَيْتِ الْجَدِيدِ؟","nl":"Wie is er in het nieuwe huis?"},{"h":"Les 9a · 2) Bijvoeglijke naamwoorden op «-aan» (ان) zonder Tanwien (blz. 41)"},{"p":"2) Bijvoeglijke naamwoorden op «-aan» (ـَانُ) krijgen géén Tanwien:"},{"p":"Bijvoeglijke naamwoorden die eindigen op «-aan» (فَعْلَانُ) zijn diptoten (mamnoe' mina s-sarf): zij krijgen géén Tanwien en eindigen op één enkele Dammah (-oe), ook als ze onbepaald zijn!"},{"table":{"headers":["Arabisch (géén Tanwien!)","Uitspraak","Betekenis","Voorbeeldzin"],"rows":[["كَسْلَانُ (NIET كَسْلَانٌ)","kaslaanoe","lui","هَذَا الْوَلَدُ كَسْلَانُ."],["جَوْعَانُ","djaw'aanoe","hongerig","أَنَا جَوْعَانُ. (Ik heb honger)"],["عَطْشَانُ","'atshaanoe","dorstig","أَأَنْتَ عَطْشَانُ؟ (Heb jij dorst?)"],["غَضْبَانُ","ghadbaanoe","boos","لِمَاذَا الْمُدَرِّسُ غَضْبَانُ الْيَوْمَ؟"],["مَلْآنُ","mal'aanoe","vol","الْكُوبُ مَلْآنُ. (De beker is vol)"]]}},{"ar":"عَبَّاسٌ تَاجِرٌ غَنِيٌّ، وَبِلَالٌ مُدَرِّسٌ جَدِيدٌ.","nl":"'Abbaas is een rijke handelaar en Bilaal is een nieuwe leraar."},{"ar":"اللُّغَةُ الْعَرَبِيَّةُ سَهْلَةٌ وَجَمِيلَةٌ.","nl":"De Arabische taal is gemakkelijk en mooi."},{"h":"Les 9b · الَّذِي, لِلْـ en عِنْدَ (blz. 43–44)"},{"p":"Les 9b: Betrekkelijk voornaamwoord الَّذِي («die/dat»), لِ + الْ → لِلْـ en عِنْدَ («bij»):"},{"p":"1) الَّذِي (alladhie) betekent «die», «dat», «wie» of «welk» en verwijst naar een mannelijk enkelvoudig naamwoord."},{"p":"2) Merk op dat wanneer het voorzetsel لِ voorafgaat aan een woord met الْ, de Hamzah (Alief) van الْ helemaal wegvalt in de schrijfwijze: لِ + الْإِمَامُ → لِلْإِمَامِ (voor/van de imam)."},{"p":"3) عِنْدَ betekent «bij». Het zelfstandig naamwoord dat erop volgt is Moedaaf Ilaih en heeft daarom de uitgang «-ie» (Madjroer)."},{"ar":"الرَّجُلُ الَّذِي خَرَجَ مِنَ الْمَسْجِدِ الْآنَ تَاجِرٌ شَهِيرٌ.","nl":"De man die nu uit de moskee kwam, is een beroemde handelaar."},{"ar":"الْبَيْتُ الَّذِي أَمَامَ الْمَسْجِدِ لِلْإِمَامِ.","nl":"Het huis dat vóór de moskee staat, is van de imam."},{"ar":"أَيْنَ الْمُدَرِّسُ الْجَدِيدُ؟ هُوَ عِنْدَ الْمُدِيرِ.","nl":"Waar is de nieuwe leraar? Hij is bij de directeur."},{"h":"Woordenlijst van Les 9a & 9b (blz. 42 & 44)"},{"p":"Woordenlijst van Les 9a en 9b (30 woorden)"},{"p":"الْفَاكِهَةُ het fruit · الْعُصْفُورُ de mus · الطَّائِرُ de vogel · الْعَرَبِيَّةُ het Arabisch · اللُّغَةُ de taal · سَهْلٌ gemakkelijk · صَعْبٌ moeilijk · مُجْتَهِدٌ ijverig, hardwerkend · شَهِيرٌ beroemd · الْمَدِينَةُ de stad · الْقَاهِرَةُ Caïro · الْيَوْمَ vandaag · لِمَاذَا waarom · الْكُوبُ de beker, het glas · كَسْلَانُ lui · جَوْعَانُ hongerig · عَطْشَانُ dorstig · غَضْبَانُ boos · مَلْآنُ vol · الْمَكْتَبَةُ de bibliotheek · الْآنَ nu · الْمُسْتَوْصَفُ de kliniek · الْمِرْوَحَةُ de ventilator · الْكُوَيْتُ Koeweit · الْمَدْرَسَةُ الثَّانَوِيَّةُ de middelbare school · الْوَزِيرُ de minister · حَادٌّ scherp · إِنْدُونِيسِيَا Indonesië · الَّذِي die, dat (m) · عِنْدَ bij"}]},"10":{"title":"Bezittelijke voornaamwoorden · أَبُو/أَخُو · عِنْدِي vs. لِي · ذَهَبْتَ/ذَهَبْتُ · مَعَ · حَمْزَةُ","summary":"Les 10 uit het Grammaticaboek Medina-methode Deel 1 (blz. 45–49) — bezittelijke achtervoegsels (ـكَ، ـهُ، ـهَا، ـِي), de vijf bijzondere naamwoorden (أَبُو، أَخُو), verschil tussen عِنْدِي en لِي, werkwoordsvormen ذَهَبْتَ/ذَهَبْتُ, mannelijke namen op ة en مَعَ.","points":["1) Bezittelijke voornaamwoorden zijn achtervoegsels die als Moedaaf Ilaih aan het naamwoord worden gehecht: كِتَابُكَ (jouw boek), كِتَابُهُ (zijn boek), كِتَابُهَا (haar boek), كِتَابِي (mijn boek — de naamvalsuitgang vóór ـِي verdwijnt).","2) De twee woorden أَبٌ («vader») en أَخٌ («broer») krijgen een extra Waaw (و) wanneer zij Moedaaf zijn: أَبُوكَ، أَبُوهُ، أَبُوهَا، أَبُو مُحَمَّدٍ en أَخُوكَ، أَخُوهُ، أَخُو حَامِدٍ — behalve bij «mijn»: أَبِي en أَخِي!","3 & 4) عِنْدِي («ik heb») gebruik je voor scheidbaar bezit (auto, boek, pen: عِنْدِي سَيَّارَةٌ), terwijl je لِي («ik heb») gebruikt voor onafscheidelijke relaties zoals familieleden en lichaamsdelen (لِي أَخٌ وَاحِدٌ، لِي فَمٌ). Met مَا ontken je: مَا عِنْدِي سَيَّارَةٌ.","5 & 6) Werkwoorden: ذَهَبَ (hij ging) → ذَهَبْتَ (jij ging, m.) → ذَهَبْتُ (ik ging). En mannelijke eigennamen die op ة eindigen krijgen géén Tanwien: حَمْزَةُ، أُسَامَةُ، مُعَاوِيَةُ.","7 & 8) مَعَ («met» = samen met iemand, op elke plek) vs. عِنْدَ («bij» = op iemands werkplek/kantoor). En voorzetsel بِ («in/bij»): بِالْجَامِعَةِ."],"cards":[{"sec":"1) Bezittelijke achtervoegsels & 2) أَبٌ en أَخٌ (blz. 45–46)","lead":"1) Bezittelijke achtervoegsels (ـكَ، ـهُ، ـهَا، ـِي) en 2) De speciale regel voor أَبٌ en أَخٌ:","ps":["1) In het Arabisch worden bezittelijke voornaamwoorden («jouw», «zijn», «haar», «mijn») als achtervoegsels (Moedaaf Ilaih) direct aan het zelfstandig naamwoord vastgeschreven. Het naamwoord zelf heeft dus géén الْ en géén Tanwien.","Bij «mijn» (ـِي) krijgt de laatste letter van het naamwoord altijd een Kasrah, ongeacht de naamval (كِتَابِي، فِي كِتَابِي).","2) De twee woorden أَبٌ («vader») en أَخٌ («broer») krijgen een extra Waaw (و) wanneer zij Moedaaf zijn (vóór een achtervoegsel of naam), behalve bij «mijn» (أَبِي en أَخِي)!"],"table":{"headers":["Betekenis","Normaal naamwoord (كِتَابٌ / بَيْتٌ)","Met أَبٌ (vader)","Met أَخٌ (broer)"],"rows":[["jouw (m.)","كِتَابُكَ / بَيْتُكَ","أَبُوكَ (aboeka)","أَخُوكَ (achoeka)"],["zijn","كِتَابُهُ / بَيْتُهُ","أَبُوهُ (aboehoe)","أَخُوهُ (achoehoe)"],["haar","كِتَابُهَا / بَيْتُهَا","أَبُوهَا (aboehaa)","أَخُوهَا (achoehaa)"],["mijn","كِتَابِي / بَيْتِي / يَدِي","أَبِي (abie — zonder و!)","أَخِي (achie — zonder و!)"],["van Moehammad","كِتَابُ مُحَمَّدٍ","أَبُو مُحَمَّدٍ","أَخُو مُحَمَّدٍ"]]},"ex":[{"ar":"مَا اسْمُكَ؟ اِسْمِي حَامِدٌ.","nl":"Wat is jouw naam? Mijn naam is Haamied."},{"ar":"أَيْنَ أَبُوكَ؟ أَبِي فِي السُّوقِ، وَأُمِّي فِي الْبَيْتِ.","nl":"Waar is jouw vader? Mijn vader is op de markt en mijn moeder is thuis."}]},{"sec":"3 & 4 & 9) Verschil tussen عِنْدِي en لِي + ontkenning met مَا (blz. 46–48)","lead":"3 & 4) «Hebben» in het Arabisch: Wanneer gebruik je عِنْدِي en wanneer لِي?","ps":["Het Arabisch heeft geen werkwoord «hebben», maar gebruikt twee constructies met een belangrijk betekenisverschil (blz. 47):","• عِنْدَ (عِنْدَكَ، عِنْدَهُ، عِنْدَهَا، عِنْدِي): wordt gebruikt voor dingen die scheidbaar zijn van een persoon (spullen, geld, voertuigen: «Ik heb een boek / auto / pen»).","• لِ (لَكَ، لَهُ، لَهَا، لِي): wordt gebruikt voor zaken die onafscheidelijk zijn, zoals familieleden en lichaamsdelen («Ik heb een broer / zus / mond / hand»). Zeg dus: لِي أَخٌ en NIET عِنْدِي أَخٌ!","• Met مَا ontken je bezit: مَا عِنْدِي سَيَّارَةٌ (Ik heb geen auto)."],"table":{"headers":["Constructie","Gebruik","Correct voorbeeld","Betekenis"],"rows":[["عِنْدِي / عِنْدَكَ","Scheidbaar bezit (voorwerpen)","أَعِنْدَكَ قَلَمٌ؟ نَعَمْ، عِنْدِي قَلَمٌ.","Heb jij een pen? Ja, ik heb een pen."],["لِي / لَكَ / لَهُ","Familieleden & lichaamsdelen","أَلَكَ أَخٌ؟ نَعَمْ، لِي أَخٌ وَاحِدٌ.","Heb jij een broer? Ja, ik heb één broer."],["لِي (lichaamsdeel)","Onafscheidelijk","لِي فَمٌ وَاحِدٌ وَأَنْفٌ وَاحِدٌ.","Ik heb één mond en één neus."],["مَا عِنْدِي","Ontkenning van bezit","مَا عِنْدِي دَرَّاجَةٌ.","Ik heb geen fiets."]]},"ex":[{"ar":"أَلَكَ أُخْتٌ؟ لَا، مَا لِي أُخْتٌ.","nl":"Heb jij een zus? Nee, ik heb geen zus."},{"ar":"عِنْدِي سَيَّارَةٌ جَمِيلَةٌ.","nl":"Ik heb een mooie auto."}]},{"sec":"5 & 6) ذَهَبْتَ / ذَهَبْتُ en Mannelijke namen op ة (blz. 47)","lead":"5) Werkwoordsvormen ذَهَبَ / ذَهَبْتَ / ذَهَبْتُ en 6) Mannelijke namen op ة (حَمْزَةُ):","ps":["5) We hebben ذَهَبَ («hij ging») geleerd. Nu leren we: ذَهَبْتَ («jij ging», mannelijk enkelvoud) en ذَهَبْتُ («ik ging», m/v).","6) We hebben in Les 4 geleerd dat vrouwelijke eigennamen op ة géén Tanwien krijgen (آمِنَةُ، فَاطِمَةُ). Evenzo krijgen mannelijke eigennamen die eindigen op een Taa' Marboetah (ة) óók géén Tanwien!"],"table":{"headers":["Onderwerp / Categorie","Arabische vorm","Uitleg / Betekenis"],"rows":[["Hij ging (هُوَ)","ذَهَبَ (dhahaba)","3e persoon mannelijk enkelvoud"],["Jij ging (أَنْتَ)","ذَهَبْتَ (dhahabta)","2e persoon mannelijk enkelvoud (-ta)"],["Ik ging (أَنَا)","ذَهَبْتُ (dhahabtoe)","1e persoon enkelvoud (-toe)"],["Mannelijke namen op ة","حَمْزَةُ · أُسَامَةُ · مُعَاوِيَةُ · طَلْحَةُ","Eindigen op één Dammah (-oe), géén Tanwien!"]]},"ex":[{"ar":"أَذَهَبْتَ إِلَى الْمَدْرَسَةِ الْيَوْمَ؟ نَعَمْ، ذَهَبْتُ.","nl":"Ben jij vandaag naar school gegaan? Ja, ik ben gegaan."},{"ar":"زَوْجُ أُخْتِي اسْمُهُ حَمْزَةُ، وَصَدِيقِي اسْمُهُ أُسَامَةُ.","nl":"De echtgenoot van mijn zus heet Hamzah, en mijn vriend heet Oesaamah."}]},{"sec":"7 & 8) مَعَ vs. عِنْدَ en voorzetsel بِ (blz. 47–48)","lead":"7) Het fijne verschil tussen مَعَ («met») en عِنْدَ («bij»), en 8) voorzetsel بِ («in/bij»):","ps":["7) مَعَ betekent «met» (het naamwoord erna is Madjroer). Wat is het verschil tussen «الْمُدَرِّسُ عِنْدَ الْمُدِيرِ» en «الْمُدَرِّسُ مَعَ الْمُدِيرِ»?","• عِنْدَ الْمُدِيرِ betekent: in het kantoor / op de plek van de directeur.","• مَعَ الْمُدِيرِ betekent: in het gezelschap van de directeur (samen met hem, waar zij zich ook bevinden).","8) بِ («in / bij») is een voorzetsel dat vast wordt geschreven en het volgende woord Madjroer maakt: أَنَا طَالِبٌ بِالْجَامِعَةِ (Ik ben student aan/in de universiteit)."],"ex":[{"ar":"مَنْ مَعَكَ؟ مَعِي زَمِيلِي.","nl":"Wie is er met jou? Mijn klasgenoot/collega is met mij."},{"ar":"خَرَجَ حَامِدٌ مَعَ خَالِدٍ.","nl":"Haamied ging naar buiten samen met Chaalid."},{"ar":"أَنَا طَالِبٌ بِالْجَامِعَةِ الْإِسْلَامِيَّةِ بِالْمَدِينَةِ الْمُنَوَّرَةِ.","nl":"Ik ben student aan de Islamitische Universiteit in Medina."}]},{"sec":"Woordenlijst van Les 10 (blz. 49)","lead":"Woordenlijst van Les 10 (13 woorden)","ps":["الزَّمِيلُ de collega, klasgenoot · الزَّوْجُ de echtgenoot · الطِّفْلُ het kind, de baby · الْفَتَى de jongeman · وَاحِدٌ één · عِنْدَ bij, hebben · مَعَ met · عِنْدِي ik heb (scheidbaar) · لِي ik heb (familie/lichaam) · أَبٌ een vader (أَبُو) · أَخٌ een broer (أَخُو) · ذَهَبْتَ jij ging · ذَهَبْتُ ik ging"],"ex":[]}],"examples":[{"ar":"مَا اسْمُكَ؟ اِسْمِي حَامِدٌ. وَمَا اسْمُ صَدِيقِكَ؟ اِسْمُهُ بِلَالٌ.","nl":"Wat is jouw naam? Mijn naam is Haamied. En wat is de naam van jouw vriend? Zijn naam is Bilaal."},{"ar":"أَيْنَ أَبُوكَ يَا مُحَمَّدُ؟ أَبِي فِي الْمَدِينَةِ الْمُنَوَّرَةِ.","nl":"Waar is jouw vader, o Moehammad? Mijn vader is in Medina."},{"ar":"أَخُوكَ طَبِيبٌ شَهِيرٌ وَأَبُوكَ مُهَنْدِسٌ كَبِيرٌ.","nl":"Jouw broer is een beroemde arts en jouw vader is een grote ingenieur."},{"ar":"لِي أَخٌ وَاحِدٌ وَأُخْتٌ وَاحِدَةٌ.","nl":"Ik heb één broer en één zus."},{"ar":"أَعِنْدَكَ سَيَّارَةٌ؟ لَا، مَا عِنْدِي سَيَّارَةٌ. عِنْدِي دَرَّاجَةٌ.","nl":"Heb jij een auto? Nee, ik heb geen auto. Ik heb een fiets."},{"ar":"أَذَهَبْتَ إِلَى الطَّبِيبِ الْيَوْمَ؟ نَعَمْ، ذَهَبْتُ.","nl":"Ben jij vandaag naar de dokter gegaan? Ja, ik ben gegaan."},{"ar":"آمِنَةُ مَعَ زَوْجِهَا وَطِفْلِهَا.","nl":"Aaminah is met haar echtgenoot en haar kind."}],"exercises":[{"q":"Hoe zeg je «jouw broer» en «zijn vader» in het Arabisch?","options":["أَخُوكَ en أَبُوهُ (met extra Waaw و)","أَخُكَ en أَبُهُ","الْأَخُوكَ en الْأَبُوهُ","أَخِيكَ en أَبِيهُ"],"answer":0,"explain":"أَبٌ en أَخٌ krijgen een extra Waaw (و) wanneer zij Moedaaf zijn: أَخُوكَ، أَبُوهُ، أَبُو مُحَمَّدٍ (blz. 45)."},{"q":"Hoe zeg je «mijn vader» en «mijn broer»?","options":["أَبِي en أَخِي (zonder extra Waaw)","أَبُوي en أَخُوي","أَبِكَ en أَخِكَ","الْأَبِي en الْأَخِي"],"answer":0,"explain":"Bij het achtervoegsel ـِي («mijn») komt géén extra Waaw: أَبِي (abie) en أَخِي (achie) (blz. 46)."},{"q":"Welke zin is grammaticaal juist voor «Ik heb één broer»?","options":["لِي أَخٌ وَاحِدٌ.","عِنْدِي أَخٌ وَاحِدٌ.","مَعِي أَخٌ وَاحِدٌ.","فِي أَخٌ وَاحِدٌ."],"answer":0,"explain":"Voor familieleden en lichaamsdelen (onafscheidelijk) gebruik je لِي en niet عِنْدِي (blz. 47)."},{"q":"Welke zin is juist voor «Ik heb geen auto»?","options":["مَا عِنْدِي سَيَّارَةٌ.","مَا لِي سَيَّارَةٌ.","لَا عِنْدِي سَيَّارَةٌ.","مَنْ عِنْدِي سَيَّارَةٌ."],"answer":0,"explain":"Voor een auto (scheidbaar bezit) gebruik je عِنْدِي, en ontkenning daarvan gebeurt met مَا: مَا عِنْدِي سَيَّارَةٌ (blz. 48)."},{"q":"Kies het juiste antwoord: أَذَهَبْتَ إِلَى الْمَدْرَسَةِ الْيَوْمَ؟","options":["نَعَمْ، ذَهَبْتُ.","نَعَمْ، ذَهَبْتَ.","نَعَمْ، ذَهَبَ.","نَعَمْ، أَنَا ذَهَبَ."],"answer":0,"explain":"ذَهَبْتَ = «jij ging»; in het antwoord zeg je «Ja, ik ging» = نَعَمْ، ذَهَبْتُ (blz. 47)."},{"q":"Kies de juiste schrijfwijze van de mannelijke eigennamen Hamzah, Oesaamah en Moe'aawiyah:","options":["حَمْزَةُ · أُسَامَةُ · مُعَاوِيَةُ (zonder Tanwien!)","حَمْزَةٌ · أُسَامَةٌ · مُعَاوِيَةٌ","الْحَمْزَةُ · الْأُسَامَةُ","حَمْزَةٍ · أُسَامَةٍ"],"answer":0,"explain":"Mannelijke eigennamen die eindigen op een Taa' Marboetah (ة) krijgen géén Tanwien (blz. 47, punt 6)."},{"q":"Wat is het verschil tussen «الْمُدَرِّسُ عِنْدَ الْمُدِيرِ» en «الْمُدَرِّسُ مَعَ الْمُدِيرِ»?","options":["عِنْدَ = in het kantoor van de directeur; مَعَ = samen met hem (op elke willekeurige plek)","Er is geen verschil","عِنْدَ = achter de directeur; مَعَ = vóór de directeur","مَعَ betekent «zonder»"],"answer":0,"explain":"عِنْدَ duidt de plek/het kantoor van de directeur aan, terwijl مَعَ «in het gezelschap van» betekent (blz. 47, punt 7)."},{"q":"Wat betekent: آمِنَةُ مَعَ زَوْجِهَا وَطِفْلِهَا.","options":["Aaminah is met haar echtgenoot en haar kind.","Aaminah is bij haar broer en haar vader.","Aaminah heeft een echtgenoot en een zoon.","De echtgenoot van Aaminah is in het ziekenhuis."],"answer":0,"explain":"زَوْجُهَا = haar echtgenoot, طِفْلُهَا = haar kind/baby."}],"fullText":[{"h":"1) Bezittelijke achtervoegsels & 2) أَبٌ en أَخٌ (blz. 45–46)"},{"p":"1) Bezittelijke achtervoegsels (ـكَ، ـهُ، ـهَا، ـِي) en 2) De speciale regel voor أَبٌ en أَخٌ:"},{"p":"1) In het Arabisch worden bezittelijke voornaamwoorden («jouw», «zijn», «haar», «mijn») als achtervoegsels (Moedaaf Ilaih) direct aan het zelfstandig naamwoord vastgeschreven. Het naamwoord zelf heeft dus géén الْ en géén Tanwien."},{"p":"Bij «mijn» (ـِي) krijgt de laatste letter van het naamwoord altijd een Kasrah, ongeacht de naamval (كِتَابِي، فِي كِتَابِي)."},{"p":"2) De twee woorden أَبٌ («vader») en أَخٌ («broer») krijgen een extra Waaw (و) wanneer zij Moedaaf zijn (vóór een achtervoegsel of naam), behalve bij «mijn» (أَبِي en أَخِي)!"},{"table":{"headers":["Betekenis","Normaal naamwoord (كِتَابٌ / بَيْتٌ)","Met أَبٌ (vader)","Met أَخٌ (broer)"],"rows":[["jouw (m.)","كِتَابُكَ / بَيْتُكَ","أَبُوكَ (aboeka)","أَخُوكَ (achoeka)"],["zijn","كِتَابُهُ / بَيْتُهُ","أَبُوهُ (aboehoe)","أَخُوهُ (achoehoe)"],["haar","كِتَابُهَا / بَيْتُهَا","أَبُوهَا (aboehaa)","أَخُوهَا (achoehaa)"],["mijn","كِتَابِي / بَيْتِي / يَدِي","أَبِي (abie — zonder و!)","أَخِي (achie — zonder و!)"],["van Moehammad","كِتَابُ مُحَمَّدٍ","أَبُو مُحَمَّدٍ","أَخُو مُحَمَّدٍ"]]}},{"ar":"مَا اسْمُكَ؟ اِسْمِي حَامِدٌ.","nl":"Wat is jouw naam? Mijn naam is Haamied."},{"ar":"أَيْنَ أَبُوكَ؟ أَبِي فِي السُّوقِ، وَأُمِّي فِي الْبَيْتِ.","nl":"Waar is jouw vader? Mijn vader is op de markt en mijn moeder is thuis."},{"h":"3 & 4 & 9) Verschil tussen عِنْدِي en لِي + ontkenning met مَا (blz. 46–48)"},{"p":"3 & 4) «Hebben» in het Arabisch: Wanneer gebruik je عِنْدِي en wanneer لِي?"},{"p":"Het Arabisch heeft geen werkwoord «hebben», maar gebruikt twee constructies met een belangrijk betekenisverschil (blz. 47):"},{"p":"• عِنْدَ (عِنْدَكَ، عِنْدَهُ، عِنْدَهَا، عِنْدِي): wordt gebruikt voor dingen die scheidbaar zijn van een persoon (spullen, geld, voertuigen: «Ik heb een boek / auto / pen»)."},{"p":"• لِ (لَكَ، لَهُ، لَهَا، لِي): wordt gebruikt voor zaken die onafscheidelijk zijn, zoals familieleden en lichaamsdelen («Ik heb een broer / zus / mond / hand»). Zeg dus: لِي أَخٌ en NIET عِنْدِي أَخٌ!"},{"p":"• Met مَا ontken je bezit: مَا عِنْدِي سَيَّارَةٌ (Ik heb geen auto)."},{"table":{"headers":["Constructie","Gebruik","Correct voorbeeld","Betekenis"],"rows":[["عِنْدِي / عِنْدَكَ","Scheidbaar bezit (voorwerpen)","أَعِنْدَكَ قَلَمٌ؟ نَعَمْ، عِنْدِي قَلَمٌ.","Heb jij een pen? Ja, ik heb een pen."],["لِي / لَكَ / لَهُ","Familieleden & lichaamsdelen","أَلَكَ أَخٌ؟ نَعَمْ، لِي أَخٌ وَاحِدٌ.","Heb jij een broer? Ja, ik heb één broer."],["لِي (lichaamsdeel)","Onafscheidelijk","لِي فَمٌ وَاحِدٌ وَأَنْفٌ وَاحِدٌ.","Ik heb één mond en één neus."],["مَا عِنْدِي","Ontkenning van bezit","مَا عِنْدِي دَرَّاجَةٌ.","Ik heb geen fiets."]]}},{"ar":"أَلَكَ أُخْتٌ؟ لَا، مَا لِي أُخْتٌ.","nl":"Heb jij een zus? Nee, ik heb geen zus."},{"ar":"عِنْدِي سَيَّارَةٌ جَمِيلَةٌ.","nl":"Ik heb een mooie auto."},{"h":"5 & 6) ذَهَبْتَ / ذَهَبْتُ en Mannelijke namen op ة (blz. 47)"},{"p":"5) Werkwoordsvormen ذَهَبَ / ذَهَبْتَ / ذَهَبْتُ en 6) Mannelijke namen op ة (حَمْزَةُ):"},{"p":"5) We hebben ذَهَبَ («hij ging») geleerd. Nu leren we: ذَهَبْتَ («jij ging», mannelijk enkelvoud) en ذَهَبْتُ («ik ging», m/v)."},{"p":"6) We hebben in Les 4 geleerd dat vrouwelijke eigennamen op ة géén Tanwien krijgen (آمِنَةُ، فَاطِمَةُ). Evenzo krijgen mannelijke eigennamen die eindigen op een Taa' Marboetah (ة) óók géén Tanwien!"},{"table":{"headers":["Onderwerp / Categorie","Arabische vorm","Uitleg / Betekenis"],"rows":[["Hij ging (هُوَ)","ذَهَبَ (dhahaba)","3e persoon mannelijk enkelvoud"],["Jij ging (أَنْتَ)","ذَهَبْتَ (dhahabta)","2e persoon mannelijk enkelvoud (-ta)"],["Ik ging (أَنَا)","ذَهَبْتُ (dhahabtoe)","1e persoon enkelvoud (-toe)"],["Mannelijke namen op ة","حَمْزَةُ · أُسَامَةُ · مُعَاوِيَةُ · طَلْحَةُ","Eindigen op één Dammah (-oe), géén Tanwien!"]]}},{"ar":"أَذَهَبْتَ إِلَى الْمَدْرَسَةِ الْيَوْمَ؟ نَعَمْ، ذَهَبْتُ.","nl":"Ben jij vandaag naar school gegaan? Ja, ik ben gegaan."},{"ar":"زَوْجُ أُخْتِي اسْمُهُ حَمْزَةُ، وَصَدِيقِي اسْمُهُ أُسَامَةُ.","nl":"De echtgenoot van mijn zus heet Hamzah, en mijn vriend heet Oesaamah."},{"h":"7 & 8) مَعَ vs. عِنْدَ en voorzetsel بِ (blz. 47–48)"},{"p":"7) Het fijne verschil tussen مَعَ («met») en عِنْدَ («bij»), en 8) voorzetsel بِ («in/bij»):"},{"p":"7) مَعَ betekent «met» (het naamwoord erna is Madjroer). Wat is het verschil tussen «الْمُدَرِّسُ عِنْدَ الْمُدِيرِ» en «الْمُدَرِّسُ مَعَ الْمُدِيرِ»?"},{"p":"• عِنْدَ الْمُدِيرِ betekent: in het kantoor / op de plek van de directeur."},{"p":"• مَعَ الْمُدِيرِ betekent: in het gezelschap van de directeur (samen met hem, waar zij zich ook bevinden)."},{"p":"8) بِ («in / bij») is een voorzetsel dat vast wordt geschreven en het volgende woord Madjroer maakt: أَنَا طَالِبٌ بِالْجَامِعَةِ (Ik ben student aan/in de universiteit)."},{"ar":"مَنْ مَعَكَ؟ مَعِي زَمِيلِي.","nl":"Wie is er met jou? Mijn klasgenoot/collega is met mij."},{"ar":"خَرَجَ حَامِدٌ مَعَ خَالِدٍ.","nl":"Haamied ging naar buiten samen met Chaalid."},{"ar":"أَنَا طَالِبٌ بِالْجَامِعَةِ الْإِسْلَامِيَّةِ بِالْمَدِينَةِ الْمُنَوَّرَةِ.","nl":"Ik ben student aan de Islamitische Universiteit in Medina."},{"h":"Woordenlijst van Les 10 (blz. 49)"},{"p":"Woordenlijst van Les 10 (13 woorden)"},{"p":"الزَّمِيلُ de collega, klasgenoot · الزَّوْجُ de echtgenoot · الطِّفْلُ het kind, de baby · الْفَتَى de jongeman · وَاحِدٌ één · عِنْدَ bij, hebben · مَعَ met · عِنْدِي ik heb (scheidbaar) · لِي ik heb (familie/lichaam) · أَبٌ een vader (أَبُو) · أَخٌ een broer (أَخُو) · ذَهَبْتَ jij ging · ذَهَبْتُ ik ging"}]},"11":{"title":"فِيهِ en فِيهَا (erin) · أُحِبُّ & تُحِبُّ · Lijdend voorwerp (الْمَنْصُوبُ op -a)","summary":"Les 11 uit het Grammaticaboek Medina-methode Deel 1 (blz. 50–51) — voorzetsel فِي met achtervoegsel (فِيهِ / فِيهَا), het werkwoord أُحِبُّ («ik houd van») en de accusatief (Mansoeb op -a) voor het lijdend voorwerp.","points":["1 & 2) فِيهِ betekent «erin / in hem» (mannelijk: مَنْ فِي الْبَيْتِ؟ فِيهِ أَبِي وَأُمِّي). De vrouwelijke vorm is فِيهَا «erin / in haar» (مَنْ فِي الْغُرْفَةِ؟ فِيهَا أَخِي).","3) أُحِبُّ betekent «ik houd van» en تُحِبُّ betekent «jij houdt van» (mannelijk enkelvoud).","Het lijdend voorwerp van een werkwoord staat in de accusatief (Mansoeb / مَنْصُوبٌ) en eindigt op «-a» (Fathah): أُحِبُّ اللَّهَ، أُحِبُّ الرَّسُولَ، أُحِبُّ اللُّغَةَ الْعَرَبِيَّةَ.","Bij een woord met het bezittelijk achtervoegsel «ـِي» (mijn) is deze «-a» niet zichtbaar: أُحِبُّ أَبِي وَأُمِّي وَأَخِي وَأُخْتِي."],"cards":[{"sec":"1 & 2) فِيهِ en فِيهَا · 3) أُحِبُّ en Mansoeb (blz. 50–51)","lead":"فِيهِ / فِيهَا («erin») en het lijdend voorwerp in de accusatief (Mansoeb op «-a»):","ps":["1 & 2) فِيهِ (fie-hi) betekent «erin / in hem» (verwijzend naar een mannelijk woord zoals الْبَيْتُ). De vrouwelijke vorm is فِيهَا (fie-haa) «erin / in haar» (verwijzend naar een vrouwelijk woord zoals الْغُرْفَةُ).","3) أُحِبُّ betekent «ik houd van» en تُحِبُّ betekent «jij houdt van». Het lijdend voorwerp (Maf'oel bihi) van een werkwoord is accusatief (Mansoeb, مَنْصُوبٌ), wat betekent dat het eindigt op een «-a» (Fathah)!","Merk op: wanneer het achtervoegsel «ـِي» («mijn») aan het naamwoord vastzit, is deze «-a» niet zichtbaar (أُحِبُّ أَبِي وَأُمِّي). En in het Arabisch herhaal je het voegwoord وَ («en») vóór elk opgesomd woord!"],"table":{"headers":["Onderwerp / Vorm","Arabisch voorbeeld (let op de -a bij Mansoeb!)","Betekenis"],"rows":[["فِيهِ (in hem/het, m.)","مَنْ فِي الْبَيْتِ؟ فِيهِ أَبِي وَأُمِّي.","Wie is in het huis? Mijn vader en moeder zijn erin."],["فِيهَا (in haar/het, v.)","مَنْ فِي الْغُرْفَةِ؟ فِيهَا أَخِي.","Wie is in de kamer? Mijn broer is erin."],["Lijdend voorwerp (-a)","أُحِبُّ اللَّهَ وَأُحِبُّ الرَّسُولَ.","Ik houd van Allah en ik houd van de Boodschapper."],["Met Na't (beide op -a!)","أُحِبُّ اللُّغَةَ الْعَرَبِيَّةَ.","Ik houd van de Arabische taal."],["Vraag met تُحِبُّ","أَتُحِبُّ لُغَتَكَ؟ مَنْ تُحِبُّ؟ مَاذَا تُحِبُّ؟","Houd jij van jouw taal? Van wie / waar houd jij van?"]]},"ex":[{"ar":"أُحِبُّ أَبِي وَأُمِّي وَأَخِي وَأُخْتِي.","nl":"Ik houd van mijn vader, moeder, broer en zus."},{"ar":"أُحِبُّ رَسُولَ اللَّهِ ﷺ.","nl":"Ik houd van de Boodschapper van Allah (oehibboe rasoela llaahi)."}]},{"sec":"Woordenlijst van Les 11 (blz. 50–51)","lead":"Nieuwe woorden in Les 11","ps":["فِيهِ erin, in hem (m) · فِيهَا erin, in haar (v) · أُحِبُّ ik houd van · تُحِبُّ jij houdt van (m) · مَاذَا wat? (vóór een werkwoord)"],"ex":[]}],"examples":[{"ar":"مَنْ فِي هَذَا الْبَيْتِ؟ فِيهِ حَامِدٌ.","nl":"Wie is er in dit huis? Haamied is erin."},{"ar":"مَاذَا فِي الْحَقِيبَةِ؟ فِيهَا كِتَابِي وَقَلَمِي وَدَفْتَرِي.","nl":"Wat zit er in de tas? Mijn boek, mijn pen en mijn schrift zitten erin."},{"ar":"أُحِبُّ اللَّهَ وَرَسُولَهُ.","nl":"Ik houd van Allah en Zijn Boodschapper."},{"ar":"أُحِبُّ اللُّغَةَ الْعَرَبِيَّةَ.","nl":"Ik houd van de Arabische taal."}],"exercises":[{"q":"Welke vorm gebruik je voor «erin» als je terugverwijst naar الْغُرْفَةُ («de kamer», vrouwelijk)?","options":["فِيهَا","فِيهِ","فِيكَ","فِيهُمْ"],"answer":0,"explain":"الْغُرْفَةُ is vrouwelijk, dus zeg je فِيهَا («erin / in haar») (blz. 50)."},{"q":"Op welke klinker eindigt het lijdend voorwerp (Mansoeb / accusatief) na أُحِبُّ?","options":["Op «-a» (Fathah): أُحِبُّ اللُّغَةَ الْعَرَبِيَّةَ","Op «-oe» (Dammah): أُحِبُّ اللُّغَةُ","Op «-ie» (Kasrah): أُحِبُّ اللُّغَةِ","Op Soekoen"],"answer":0,"explain":"Het lijdend voorwerp van een werkwoord is Mansoeb (مَنْصُوبٌ) en eindigt op een Fathah (-a) (blz. 50–51)."},{"q":"Waarom zie je geen «-a» aan het eind van أَبِي in «أُحِبُّ أَبِي» (Ik houd van mijn vader)?","options":["Omdat vóór het achtervoegsel ـِي («mijn») de naamvalsuitgang niet zichtbaar is","Omdat أَبِي geen lijdend voorwerp is","Omdat أَبِي Marfoe' is","Omdat أَبِي meervoud is"],"answer":0,"explain":"Bij een woord waaraan ـِي («mijn») is verbonden, is de accusatief-uitgang (-a) niet zichtbaar (blz. 50)."},{"q":"Hoe vraag je aan een man: «Houd jij van jouw taal?»","options":["أَتُحِبُّ لُغَتَكَ؟","أَأُحِبُّ لُغَتُكَ؟","مَنْ تُحِبُّ لُغَتِكَ؟","أَتُحِبُّ اللُّغَةُ؟"],"answer":0,"explain":"تُحِبُّ = jij houdt van, en لُغَتَكَ heeft een Fathah (-ta-) op de ت omdat het lijdend voorwerp (Mansoeb) is (blz. 51)."}],"fullText":[{"h":"1 & 2) فِيهِ en فِيهَا · 3) أُحِبُّ en Mansoeb (blz. 50–51)"},{"p":"فِيهِ / فِيهَا («erin») en het lijdend voorwerp in de accusatief (Mansoeb op «-a»):"},{"p":"1 & 2) فِيهِ (fie-hi) betekent «erin / in hem» (verwijzend naar een mannelijk woord zoals الْبَيْتُ). De vrouwelijke vorm is فِيهَا (fie-haa) «erin / in haar» (verwijzend naar een vrouwelijk woord zoals الْغُرْفَةُ)."},{"p":"3) أُحِبُّ betekent «ik houd van» en تُحِبُّ betekent «jij houdt van». Het lijdend voorwerp (Maf'oel bihi) van een werkwoord is accusatief (Mansoeb, مَنْصُوبٌ), wat betekent dat het eindigt op een «-a» (Fathah)!"},{"p":"Merk op: wanneer het achtervoegsel «ـِي» («mijn») aan het naamwoord vastzit, is deze «-a» niet zichtbaar (أُحِبُّ أَبِي وَأُمِّي). En in het Arabisch herhaal je het voegwoord وَ («en») vóór elk opgesomd woord!"},{"table":{"headers":["Onderwerp / Vorm","Arabisch voorbeeld (let op de -a bij Mansoeb!)","Betekenis"],"rows":[["فِيهِ (in hem/het, m.)","مَنْ فِي الْبَيْتِ؟ فِيهِ أَبِي وَأُمِّي.","Wie is in het huis? Mijn vader en moeder zijn erin."],["فِيهَا (in haar/het, v.)","مَنْ فِي الْغُرْفَةِ؟ فِيهَا أَخِي.","Wie is in de kamer? Mijn broer is erin."],["Lijdend voorwerp (-a)","أُحِبُّ اللَّهَ وَأُحِبُّ الرَّسُولَ.","Ik houd van Allah en ik houd van de Boodschapper."],["Met Na't (beide op -a!)","أُحِبُّ اللُّغَةَ الْعَرَبِيَّةَ.","Ik houd van de Arabische taal."],["Vraag met تُحِبُّ","أَتُحِبُّ لُغَتَكَ؟ مَنْ تُحِبُّ؟ مَاذَا تُحِبُّ؟","Houd jij van jouw taal? Van wie / waar houd jij van?"]]}},{"ar":"أُحِبُّ أَبِي وَأُمِّي وَأَخِي وَأُخْتِي.","nl":"Ik houd van mijn vader, moeder, broer en zus."},{"ar":"أُحِبُّ رَسُولَ اللَّهِ ﷺ.","nl":"Ik houd van de Boodschapper van Allah (oehibboe rasoela llaahi)."},{"h":"Woordenlijst van Les 11 (blz. 50–51)"},{"p":"Nieuwe woorden in Les 11"},{"p":"فِيهِ erin, in hem (m) · فِيهَا erin, in haar (v) · أُحِبُّ ik houd van · تُحِبُّ jij houdt van (m) · مَاذَا wat? (vóór een werkwoord)"}]},"12":{"title":"أَنْتِ en ـكِ (vrouwelijk) · ذَهَبَتْ · الَّتِي · Nadruk (كِتَابُكَ أَنْتَ)","summary":"Les 12 uit het Grammaticaboek Medina-methode Deel 1 (blz. 52–54) — aanspreken van een vrouw met أَنْتِ en ـكِ, werkwoord ذَهَبَتْ («zij ging»), betrekkelijk voornaamwoord الَّتِي en nadruksconstructies.","points":["1) Voor vrouwelijk enkelvoud is «jij» أَنْتِ (anti) en is «jouw» het achtervoegsel ـكِ (-ki): مِنْ أَيْنَ أَنْتِ يَا آمِنَةُ؟ / أَيْنَ بَيْتُكِ يَا مَرْيَمُ؟.","2) «Zij ging» is ذَهَبَتْ (met Soekoen op de تْ). Als er een woord met الْ op volgt, verandert de Soekoen in een Kasrah: ذَهَبَتِ الْبِنْتُ.","3) Het vrouwelijk betrekkelijk voornaamwoord («die, dat, welk») is الَّتِي (tegenover mannelijk الَّذِي).","4) Voor nadruk («Dit is jóúw boek») voeg je het losse voornaamwoord toe na het achtervoegsel: هَذَا كِتَابُكَ أَنْتَ / هَذَا قَلَمِي أَنَا."],"cards":[{"sec":"1 & 2) أَنْتِ، ـكِ en ذَهَبَتْ (blz. 52–53)","lead":"1) Vrouwelijk «jij» (أَنْتِ) & «jouw» (ـكِ), en 2) «zij ging» (ذَهَبَتْ):","ps":["1) Waar je tegen een man أَنْتَ (-ta) en ـكَ (-ka) gebruikt, gebruik je tegen een vrouw أَنْتِ (anti, met Kasrah) en ـكِ (-ki): أَيْنَ بَيْتُكِ يَا مَرْيَمُ؟.","2) «Zij ging» is ذَهَبَتْ (dhahabat, met een Soekoen op de تْ). Let op: als ذَهَبَتْ direct gevolgd wordt door الْ, verandert deze Soekoen in een Kasrah voor de uitspraak: ذَهَبَتِ الْبِنْتُ (dhahabati l-bintoe)."],"table":{"headers":["Betekenis","Mannelijk enkelvoud","Vrouwelijk enkelvoud"],"rows":[["jij (los)","أَنْتَ (anta)","أَنْتِ (anti)"],["jouw huis","بَيْتُكَ (baitoeka)","بَيْتُكِ (baitoeki)"],["hij ging / zij ging","ذَهَبَ مَحْمُودٌ","ذَهَبَتْ مَرْيَمُ / ذَهَبَتِ الْبِنْتُ"],["betrekkelijk («die/dat»)","الطَّالِبُ الَّذِي خَرَجَ","الطَّالِبَةُ الَّتِي خَرَجَتْ"]]},"ex":[{"ar":"مِنْ أَيْنَ أَنْتِ يَا آمِنَةُ؟","nl":"Waar kom jij vandaan, o Aaminah?"},{"ar":"أَيْنَ آمِنَةُ؟ ذَهَبَتْ إِلَى الْجَامِعَةِ.","nl":"Waar is Aaminah? Zij is naar de universiteit gegaan."}]},{"sec":"3) الَّتِي en 4) Nadruk met los voornaamwoord (blz. 53)","lead":"3) Betrekkelijk voornaamwoord الَّتِي (v.) en 4) Benadrukking (هَذَا كِتَابُكَ أَنْتَ):","ps":["3) الَّتِي (allatie) is de vrouwelijke tegenhanger van الَّذِي en betekent «die», «dat» of «welke» bij een vrouwelijk enkelvoudig naamwoord.","4) Om bezit extra te benadrukken (bij twijfel of geschil), plaats je het losse persoonlijk voornaamwoord direct achter het bezittelijk achtervoegsel:"],"ex":[{"ar":"الطَّالِبَةُ الَّتِي جَلَسَتْ أَمَامَ الْمُدَرِّسَةِ مِنْ أَلْمَانِيَا.","nl":"De studente die vóór de lerares zat, komt uit Duitsland."},{"ar":"السَّاعَةُ الَّتِي عَلَى الْمَكْتَبِ لِلْمُدَرِّسِ.","nl":"Het horloge dat op het bureau ligt, is van de leraar."},{"ar":"هَذَا كِتَابُكَ أَنْتَ، وَهَذَا قَلَمِي أَنَا، وَذَلِكَ كِتَابُهَا هِيَ.","nl":"Dit is jóúw boek, dit is míjn pen en dat is háár boek."}]},{"sec":"Woordenlijst van Les 12 (blz. 54)","lead":"Woordenlijst van Les 12 (22 woorden)","ps":["يَا سَيِّدِي Meneer! · يَا سَيِّدَتِي Mevrouw! · الدَّفْتَرُ het schrift · الْعَمَّةُ de tante (vaderskant) · الْخَالَةُ de tante (moederskant) · كَيْفَ حَالُكَ؟ Hoe gaat het met je? · أَنَا بِخَيْرٍ Het gaat goed met mij · بَعْدَ na · الشَّجَرَةُ de boom · الْفَتَاةُ de jongedame · الْمُفَتِّشُ de inspecteur · سُورِيَا Syrië · مَالِيزِيَا Maleisië · عُلَمَاءُ geleerden · أَقْوِيَاءُ sterk (mv.) · ضِعَافٌ zwak (mv.) · أُمَّهَاتٌ moeders · آبَاءٌ vaders · وُزَرَاءُ ministers"],"ex":[]}],"examples":[{"ar":"كَيْفَ حَالُكِ يَا أُمِّي؟ أَنَا بِخَيْرٍ وَالْحَمْدُ لِلَّهِ.","nl":"Hoe gaat het met u, o mijn moeder? Het gaat goed met mij, alle lof zij Allah."},{"ar":"الْفَتَاةُ الَّتِي فِي السَّيَّارَةِ بِنْتُ الْمُدَرِّسِ.","nl":"De jongedame die in de auto zit, is de dochter van de leraar."},{"ar":"خَرَجَتِ الطَّالِبَةُ مِنَ الْفَصْلِ.","nl":"De studente ging het klaslokaal uit."}],"exercises":[{"q":"Hoe vraag je aan Maryam (vrouwelijk): «Waar is jouw schrift, o Maryam?»","options":["أَيْنَ دَفْتَرُكِ يَا مَرْيَمُ؟","أَيْنَ دَفْتَرُكَ يَا مَرْيَمُ؟","أَيْنَ دَفْتَرُهَا يَا مَرْيَمُ؟","أَيْنَ دَفْتَرُكِ يَا مَرْيَمٌ؟"],"answer":0,"explain":"Tegen een vrouw gebruik je het achtervoegsel ـكِ (-ki), en Maryam krijgt geen Tanwien (blz. 52)."},{"q":"Waarom krijgt ذَهَبَتْ een Kasrah op de ت in «ذَهَبَتِ الْبِنْتُ» (Het meisje ging)?","options":["Omdat na de Soekoen van تْ het bepaald lidwoord الْ volgt","Omdat het voornaamwoord أَنْتِ erin zit","Omdat الْبِنْتُ Madjroer is","Omdat het tegenwoordige tijd is"],"answer":0,"explain":"Wanneer een werkwoord op تْ (Soekoen) gevolgd wordt door الْ, verandert de Soekoen in een Kasrah: ذَهَبَتِ الْبِنْتُ (blz. 53)."},{"q":"Vul het juiste betrekkelijk voornaamwoord in: السَّاعَةُ ... عَلَى الْمَكْتَبِ جَمِيلَةٌ.","options":["الَّتِي","الَّذِي","هَذِهِ","تِلْكَ"],"answer":0,"explain":"السَّاعَةُ is vrouwelijk enkelvoud, dus gebruik je الَّتِي («die/dat») (blz. 53)."},{"q":"Hoe druk je extra nadruk uit in «Dit is míjn pen, en dat is jóúw pen»?","options":["هَذَا قَلَمِي أَنَا، وَذَلِكَ قَلَمُكَ أَنْتَ.","هَذَا أَنَا قَلَمِي.","هَذَا الْقَلَمِي.","قَلَمِي هُوَ."],"answer":0,"explain":"Voor benadrukking plaats je het losse voornaamwoord (أَنَا، أَنْتَ، هُوَ، هِيَ) achter het bezittelijk achtervoegsel (blz. 53)."}],"fullText":[{"h":"1 & 2) أَنْتِ، ـكِ en ذَهَبَتْ (blz. 52–53)"},{"p":"1) Vrouwelijk «jij» (أَنْتِ) & «jouw» (ـكِ), en 2) «zij ging» (ذَهَبَتْ):"},{"p":"1) Waar je tegen een man أَنْتَ (-ta) en ـكَ (-ka) gebruikt, gebruik je tegen een vrouw أَنْتِ (anti, met Kasrah) en ـكِ (-ki): أَيْنَ بَيْتُكِ يَا مَرْيَمُ؟."},{"p":"2) «Zij ging» is ذَهَبَتْ (dhahabat, met een Soekoen op de تْ). Let op: als ذَهَبَتْ direct gevolgd wordt door الْ, verandert deze Soekoen in een Kasrah voor de uitspraak: ذَهَبَتِ الْبِنْتُ (dhahabati l-bintoe)."},{"table":{"headers":["Betekenis","Mannelijk enkelvoud","Vrouwelijk enkelvoud"],"rows":[["jij (los)","أَنْتَ (anta)","أَنْتِ (anti)"],["jouw huis","بَيْتُكَ (baitoeka)","بَيْتُكِ (baitoeki)"],["hij ging / zij ging","ذَهَبَ مَحْمُودٌ","ذَهَبَتْ مَرْيَمُ / ذَهَبَتِ الْبِنْتُ"],["betrekkelijk («die/dat»)","الطَّالِبُ الَّذِي خَرَجَ","الطَّالِبَةُ الَّتِي خَرَجَتْ"]]}},{"ar":"مِنْ أَيْنَ أَنْتِ يَا آمِنَةُ؟","nl":"Waar kom jij vandaan, o Aaminah?"},{"ar":"أَيْنَ آمِنَةُ؟ ذَهَبَتْ إِلَى الْجَامِعَةِ.","nl":"Waar is Aaminah? Zij is naar de universiteit gegaan."},{"h":"3) الَّتِي en 4) Nadruk met los voornaamwoord (blz. 53)"},{"p":"3) Betrekkelijk voornaamwoord الَّتِي (v.) en 4) Benadrukking (هَذَا كِتَابُكَ أَنْتَ):"},{"p":"3) الَّتِي (allatie) is de vrouwelijke tegenhanger van الَّذِي en betekent «die», «dat» of «welke» bij een vrouwelijk enkelvoudig naamwoord."},{"p":"4) Om bezit extra te benadrukken (bij twijfel of geschil), plaats je het losse persoonlijk voornaamwoord direct achter het bezittelijk achtervoegsel:"},{"ar":"الطَّالِبَةُ الَّتِي جَلَسَتْ أَمَامَ الْمُدَرِّسَةِ مِنْ أَلْمَانِيَا.","nl":"De studente die vóór de lerares zat, komt uit Duitsland."},{"ar":"السَّاعَةُ الَّتِي عَلَى الْمَكْتَبِ لِلْمُدَرِّسِ.","nl":"Het horloge dat op het bureau ligt, is van de leraar."},{"ar":"هَذَا كِتَابُكَ أَنْتَ، وَهَذَا قَلَمِي أَنَا، وَذَلِكَ كِتَابُهَا هِيَ.","nl":"Dit is jóúw boek, dit is míjn pen en dat is háár boek."},{"h":"Woordenlijst van Les 12 (blz. 54)"},{"p":"Woordenlijst van Les 12 (22 woorden)"},{"p":"يَا سَيِّدِي Meneer! · يَا سَيِّدَتِي Mevrouw! · الدَّفْتَرُ het schrift · الْعَمَّةُ de tante (vaderskant) · الْخَالَةُ de tante (moederskant) · كَيْفَ حَالُكَ؟ Hoe gaat het met je? · أَنَا بِخَيْرٍ Het gaat goed met mij · بَعْدَ na · الشَّجَرَةُ de boom · الْفَتَاةُ de jongedame · الْمُفَتِّشُ de inspecteur · سُورِيَا Syrië · مَالِيزِيَا Maleisië · عُلَمَاءُ geleerden · أَقْوِيَاءُ sterk (mv.) · ضِعَافٌ zwak (mv.) · أُمَّهَاتٌ moeders · آبَاءٌ vaders · وُزَرَاءُ ministers"}]},"13":{"title":"Het Meervoud (Les 13a, 13b & 13c) · الْجَمْعُ · 8 Patronen · هَؤُلَاءِ & أُولَئِكَ · هُمْ & هُنَّ","summary":"Les 13a, 13b en 13c uit het Grammaticaboek Medina-methode Deel 1 (blz. 55–64) — ongebroken meervoud (-oena en -aatoen), de 8 patronen van het gebroken meervoud, هَؤُلَاءِ, أُولَئِكَ, هُمْ/هُنَّ en ذَهَبُوا/ذَهَبْنَ.","points":["Les 13a · 1) In het Arabisch hebben zowel zelfstandige als bijvoeglijke naamwoorden een meervoud! Er zijn twee soorten: (a) Ongebroken meervoud (mannelijk op «-oena» مُدَرِّسُونَ, vrouwelijk op «-aatoen» مُدَرِّسَاتٌ) en (b) Gebroken meervoud (8 basispatronen op blz. 57).","Les 13a · 2–5) Meervoud van هَذَا/هَذِهِ is هَؤُلَاءِ («deze», voor mensen). Meervoud van هُوَ is هُمْ («zij/hun» m. mv.) en van ذَهَبَ is ذَهَبُوا («zij gingen» m. mv., met stille Alief aan het eind). بَعْضٌ betekent «sommige(n)».","Les 13b: Meervoud van هِيَ/ـهَا is هُنَّ («zij/hun» v. mv.), en «zij gingen» (v. mv.) is ذَهَبْنَ. Let op onregelmatig vrouwelijk meervoud: بِنْتٌ → بَنَاتٌ، أُخْتٌ → أَخَوَاتٌ، فَتَاةٌ → فَتَيَاتٌ، اِمْرَأَةٌ → نِسَاءٌ.","Les 13c: Het meervoud van ذَلِكَ en تِلْكَ is أُولَئِكَ («die», uitgesproken als oelaa-ika; de و wordt niet uitgesproken)."],"cards":[{"sec":"Les 13a · Ongebroken Meervoud & de 8 Gebroken Meervoudspatronen (blz. 55–57)","lead":"1) Ongebroken meervoud (ـُونَ / ـَاتٌ) en de 8 patronen van het gebroken meervoud:","ps":["In het Arabisch hebben óók bijvoeglijke naamwoorden een meervoudsvorm (رَجُلٌ طَوِيلٌ → رِجَالٌ طِوَالٌ).","• Ongebroken mannelijk meervoud eindigt op «-oena»: مُسْلِمٌ → مُسْلِمُونَ، مُدَرِّسٌ → مُدَرِّسُونَ.","• Ongebroken vrouwelijk meervoud eindigt op «-aatoen»: مُسْلِمَةٌ → مُسْلِمَاتٌ، مُهَنْدِسَةٌ → مُهَنْدِسَاتٌ.","• Gebroken meervoud (جَمْعُ التَّكْسِيرِ): de stam verandert volgens een patroon. Hier zijn de 8 patronen van blz. 57:"],"table":{"headers":["Nr.","Patroon","Enkelvoud","Gebroken Meervoud"],"rows":[["1","فُعُولٌ","نَجْمٌ (nadjmoen) · ضَيْفٌ · شَيْخٌ","نُجُومٌ (noedjoemoen) · ضُيُوفٌ · شُيُوخٌ"],["2","فُعُلٌ","كِتَابٌ (kitaaboen) · جَدِيدٌ","كُتُبٌ (koetoeboen) · جُدُدٌ"],["3","فِعَالٌ","جَبَلٌ (djabaloen) · رَجُلٌ · طَوِيلٌ · قَصِيرٌ","جِبَالٌ · رِجَالٌ · طِوَالٌ · قِصَارٌ"],["4","فُعَّالٌ","تَاجِرٌ (taadjiroen) · طَالِبٌ · حَاجٌّ","تُجَّارٌ (toedjdjaaroen) · طُلَّابٌ · حُجَّاجٌ"],["5","أَفْعَالٌ","قَلَمٌ (qalamoen) · اِبْنٌ · اِسْمٌ","أَقْلَامٌ (aqlaamoen) · أَبْنَاءٌ · أَسْمَاءٌ"],["6","فُعَلَاءُ (géén Tanwien!)","زَمِيلٌ (zamieloen) · وَزِيرٌ · عَالِمٌ","زُمَلَاءُ (zoemalaa-oe) · وُزَرَاءُ · عُلَمَاءُ"],["7","أَفْعِلَاءُ (géén Tanwien!)","صَدِيقٌ (sadieqoen) · غَنِيٌّ · قَوِيٌّ","أَصْدِقَاءُ (asdiqaa-oe) · أَغْنِيَاءُ · أَقْوِيَاءُ"],["8","فِعْلَةٌ","أَخٌ (achoen) · فَتًى (jongeman)","إِخْوَةٌ (ichwatoen) · فِتْيَةٌ"]]},"ex":[{"ar":"هَؤُلَاءِ الرِّجَالُ تُجَّارٌ أَغْنِيَاءُ.","nl":"Deze mannen zijn rijke handelaren."}]},{"sec":"Les 13a, 13b & 13c · Voornaamwoorden, Aanwijzers & Werkwoorden in het Meervoud (blz. 58–64)","lead":"Overzicht: هَؤُلَاءِ & أُولَئِكَ, هُمْ & هُنَّ, en ذَهَبُوا vs. ذَهَبْنَ:","ps":["• Het meervoud van هَذَا en هَذِهِ is هَؤُلَاءِ («deze», voor zowel mannen als vrouwen). Het meervoud van ذَلِكَ en تِلْكَ is أُولَئِكَ («die», uitgesproken als oelaa-ika met stille و).","• Mannelijk meervoud: هُمْ («zij» én «hun»: بَيْتُهُمْ) en werkwoord ذَهَبُوا («zij gingen», met een stille Alief aan het eind).","• Vrouwelijk meervoud: هُنَّ («zij» én «hun»: بَيْتُهُنَّ) en werkwoord ذَهَبْنَ («zij gingen»).","• Let op de bijzondere vrouwelijke meervouden: بِنْتٌ → بَنَاتٌ، أُخْتٌ → أَخَوَاتٌ، فَتَاةٌ → فَتَيَاتٌ، اِمْرَأَةٌ → النِّسَاءُ."],"table":{"headers":["Functie","Mannelijk Meervoud (mensen)","Vrouwelijk Meervoud (mensen)"],"rows":[["Deze (dichtbij)","هَؤُلَاءِ طُلَّابٌ","هَؤُلَاءِ طَالِبَاتٌ"],["Die (veraf)","أُولَئِكَ مُهَنْدِسُونَ","أُولَئِكَ مُمَرِّضَاتٌ"],["Zij / hun","هُمْ إِخْوَتِي · بَيْتُهُمْ","هُنَّ أَخَوَاتِي · بَيْتُهُنَّ"],["Zij gingen","ذَهَبُوا إِلَى الْجَامِعَةِ","ذَهَبْنَ إِلَى الْمَكْتَبَةِ"]]},"ex":[{"ar":"بَعْضُهُمْ مُدَرِّسُونَ، وَبَعْضُهُمْ مُهَنْدِسُونَ.","nl":"Sommigen van hen zijn leraren en sommigen van hen zijn ingenieurs."},{"ar":"مَنْ أُولَئِكَ الْفَتَيَاتُ؟ هُنَّ بَنَاتُ الْمُدَرِّسَةِ.","nl":"Wie zijn die meisjes? Zij zijn de dochters van de lerares."}]},{"sec":"Woordenlijst van Les 13a, 13b & 13c (blz. 60, 63 & 64)","lead":"Woordenlijst van Les 13 (26 woorden)","ps":["هَؤُلَاءِ deze (mv.) · أُولَئِكَ die (mv.) · هُمْ zij, hun (m. mv.) · هُنَّ zij, hun (v. mv.) · ذَهَبُوا zij gingen (m) · ذَهَبْنَ zij gingen (v) · بَعْضٌ sommige(n) · طِوَالٌ lang (mv.) · قِصَارٌ kort (mv.) · جُدُدٌ nieuw (mv.) · قَرْيَةٌ een dorp · ضَيْفٌ een gast · طُلَّابٌ studenten · زُمَلَاءُ klasgenoten · أَصْدِقَاءُ vrienden · فِتْيَةٌ jongemannen · حُجَّاجٌ bedevaartgangers · شَيْخٌ een geleerde · حَقْلٌ een veld · النَّاسُ de mensen · الْمَطْعَمُ het restaurant · أَبْنَاءٌ zonen · بَنَاتٌ dochters · أَخَوَاتٌ zussen · النِّسَاءُ de vrouwen · زَوْجَةٌ een echtgenote"],"ex":[]}],"examples":[{"ar":"مَنْ هَؤُلَاءِ الْفِتْيَةُ الطِّوَالُ؟ هُمْ طُلَّابٌ جُدُدٌ.","nl":"Wie zijn deze lange jongemannen? Zij zijn nieuwe studenten."},{"ar":"أَيْنَ أَصْدِقَاؤُكَ؟ ذَهَبُوا إِلَى الْمَطْعَمِ.","nl":"Waar zijn jouw vrienden? Zij zijn naar het restaurant gegaan."},{"ar":"أَيْنَ أَخَوَاتُكِ؟ ذَهَبْنَ إِلَى الْمَكْتَبَةِ.","nl":"Waar zijn jouw zussen? Zij zijn naar de bibliotheek gegaan."},{"ar":"أُولَئِكَ النِّسَاءُ أُمَّهَاتُ الطَّالِبَاتِ.","nl":"Die vrouwen zijn de moeders van de studentes."}],"exercises":[{"q":"Welke twee patronen van het gebroken meervoud krijgen GÉÉN Tanwien (zoals زُمَلَاءُ en أَصْدِقَاءُ)?","options":["فُعَلَاءُ en أَفْعِلَاءُ","فُعُولٌ en فِعَالٌ","أَفْعَالٌ en فُعَّالٌ","فُعُلٌ en فِعْلَةٌ"],"answer":0,"explain":"De patronen فُعَلَاءُ (زُمَلَاءُ، عُلَمَاءُ، وُزَرَاءُ) en أَفْعِلَاءُ (أَصْدِقَاءُ، أَغْنِيَاءُ، أَقْوِيَاءُ) zijn diptoten en krijgen geen Tanwien (blz. 57)."},{"q":"Kies de juiste vormen voor «Zij (mannen) gingen» en «Zij (vrouwen) gingen»:","options":["ذَهَبُوا (m. mv.) en ذَهَبْنَ (v. mv.)","ذَهَبْنَ (m. mv.) en ذَهَبُوا (v. mv.)","ذَهَبَ en ذَهَبَتْ","ذَهَبْتُمْ en ذَهَبْتُنَّ"],"answer":0,"explain":"Mannelijk meervoud: ذَهَبُوا (met stille Alief); vrouwelijk meervoud: ذَهَبْنَ (blz. 59 & 62)."},{"q":"Wat is het meervoud van ذَلِكَ en تِلْكَ, en hoe spreek je het uit?","options":["أُولَئِكَ — uitgesproken als «oelaa-ika» (de و wordt niet uitgesproken)","هَؤُلَاءِ — uitgesproken als «haa-oelaa-i»","أُولَئِكَ — uitgesproken als «oe-walaa-ika»","ذَلِكُمْ"],"answer":0,"explain":"Het meervoud van ذَلِكَ en تِلْكَ is أُولَئِكَ; de Waaw (و) wordt geschreven maar niet uitgesproken (blz. 64)."},{"q":"Wat zijn de juiste meervouden van بِنْتٌ («dochter»), أُخْتٌ («zus») en اِمْرَأَةٌ («vrouw»)?","options":["بَنَاتٌ · أَخَوَاتٌ · نِسَاءٌ","بِنْتَاتٌ · أُخْتَاتٌ · اِمْرَأَاتٌ","أَبْنَاءٌ · إِخْوَةٌ · رِجَالٌ","فَتَيَاتٌ · زَوْجَاتٌ · أُمَّهَاتٌ"],"answer":0,"explain":"بِنْتٌ → بَنَاتٌ، أُخْتٌ → أَخَوَاتٌ، en het meervoud van اِمْرَأَةٌ komt van een andere stam: النِّسَاءُ (blz. 62–63)."}],"fullText":[{"h":"Les 13a · Ongebroken Meervoud & de 8 Gebroken Meervoudspatronen (blz. 55–57)"},{"p":"1) Ongebroken meervoud (ـُونَ / ـَاتٌ) en de 8 patronen van het gebroken meervoud:"},{"p":"In het Arabisch hebben óók bijvoeglijke naamwoorden een meervoudsvorm (رَجُلٌ طَوِيلٌ → رِجَالٌ طِوَالٌ)."},{"p":"• Ongebroken mannelijk meervoud eindigt op «-oena»: مُسْلِمٌ → مُسْلِمُونَ، مُدَرِّسٌ → مُدَرِّسُونَ."},{"p":"• Ongebroken vrouwelijk meervoud eindigt op «-aatoen»: مُسْلِمَةٌ → مُسْلِمَاتٌ، مُهَنْدِسَةٌ → مُهَنْدِسَاتٌ."},{"p":"• Gebroken meervoud (جَمْعُ التَّكْسِيرِ): de stam verandert volgens een patroon. Hier zijn de 8 patronen van blz. 57:"},{"table":{"headers":["Nr.","Patroon","Enkelvoud","Gebroken Meervoud"],"rows":[["1","فُعُولٌ","نَجْمٌ (nadjmoen) · ضَيْفٌ · شَيْخٌ","نُجُومٌ (noedjoemoen) · ضُيُوفٌ · شُيُوخٌ"],["2","فُعُلٌ","كِتَابٌ (kitaaboen) · جَدِيدٌ","كُتُبٌ (koetoeboen) · جُدُدٌ"],["3","فِعَالٌ","جَبَلٌ (djabaloen) · رَجُلٌ · طَوِيلٌ · قَصِيرٌ","جِبَالٌ · رِجَالٌ · طِوَالٌ · قِصَارٌ"],["4","فُعَّالٌ","تَاجِرٌ (taadjiroen) · طَالِبٌ · حَاجٌّ","تُجَّارٌ (toedjdjaaroen) · طُلَّابٌ · حُجَّاجٌ"],["5","أَفْعَالٌ","قَلَمٌ (qalamoen) · اِبْنٌ · اِسْمٌ","أَقْلَامٌ (aqlaamoen) · أَبْنَاءٌ · أَسْمَاءٌ"],["6","فُعَلَاءُ (géén Tanwien!)","زَمِيلٌ (zamieloen) · وَزِيرٌ · عَالِمٌ","زُمَلَاءُ (zoemalaa-oe) · وُزَرَاءُ · عُلَمَاءُ"],["7","أَفْعِلَاءُ (géén Tanwien!)","صَدِيقٌ (sadieqoen) · غَنِيٌّ · قَوِيٌّ","أَصْدِقَاءُ (asdiqaa-oe) · أَغْنِيَاءُ · أَقْوِيَاءُ"],["8","فِعْلَةٌ","أَخٌ (achoen) · فَتًى (jongeman)","إِخْوَةٌ (ichwatoen) · فِتْيَةٌ"]]}},{"ar":"هَؤُلَاءِ الرِّجَالُ تُجَّارٌ أَغْنِيَاءُ.","nl":"Deze mannen zijn rijke handelaren."},{"h":"Les 13a, 13b & 13c · Voornaamwoorden, Aanwijzers & Werkwoorden in het Meervoud (blz. 58–64)"},{"p":"Overzicht: هَؤُلَاءِ & أُولَئِكَ, هُمْ & هُنَّ, en ذَهَبُوا vs. ذَهَبْنَ:"},{"p":"• Het meervoud van هَذَا en هَذِهِ is هَؤُلَاءِ («deze», voor zowel mannen als vrouwen). Het meervoud van ذَلِكَ en تِلْكَ is أُولَئِكَ («die», uitgesproken als oelaa-ika met stille و)."},{"p":"• Mannelijk meervoud: هُمْ («zij» én «hun»: بَيْتُهُمْ) en werkwoord ذَهَبُوا («zij gingen», met een stille Alief aan het eind)."},{"p":"• Vrouwelijk meervoud: هُنَّ («zij» én «hun»: بَيْتُهُنَّ) en werkwoord ذَهَبْنَ («zij gingen»)."},{"p":"• Let op de bijzondere vrouwelijke meervouden: بِنْتٌ → بَنَاتٌ، أُخْتٌ → أَخَوَاتٌ، فَتَاةٌ → فَتَيَاتٌ، اِمْرَأَةٌ → النِّسَاءُ."},{"table":{"headers":["Functie","Mannelijk Meervoud (mensen)","Vrouwelijk Meervoud (mensen)"],"rows":[["Deze (dichtbij)","هَؤُلَاءِ طُلَّابٌ","هَؤُلَاءِ طَالِبَاتٌ"],["Die (veraf)","أُولَئِكَ مُهَنْدِسُونَ","أُولَئِكَ مُمَرِّضَاتٌ"],["Zij / hun","هُمْ إِخْوَتِي · بَيْتُهُمْ","هُنَّ أَخَوَاتِي · بَيْتُهُنَّ"],["Zij gingen","ذَهَبُوا إِلَى الْجَامِعَةِ","ذَهَبْنَ إِلَى الْمَكْتَبَةِ"]]}},{"ar":"بَعْضُهُمْ مُدَرِّسُونَ، وَبَعْضُهُمْ مُهَنْدِسُونَ.","nl":"Sommigen van hen zijn leraren en sommigen van hen zijn ingenieurs."},{"ar":"مَنْ أُولَئِكَ الْفَتَيَاتُ؟ هُنَّ بَنَاتُ الْمُدَرِّسَةِ.","nl":"Wie zijn die meisjes? Zij zijn de dochters van de lerares."},{"h":"Woordenlijst van Les 13a, 13b & 13c (blz. 60, 63 & 64)"},{"p":"Woordenlijst van Les 13 (26 woorden)"},{"p":"هَؤُلَاءِ deze (mv.) · أُولَئِكَ die (mv.) · هُمْ zij, hun (m. mv.) · هُنَّ zij, hun (v. mv.) · ذَهَبُوا zij gingen (m) · ذَهَبْنَ zij gingen (v) · بَعْضٌ sommige(n) · طِوَالٌ lang (mv.) · قِصَارٌ kort (mv.) · جُدُدٌ nieuw (mv.) · قَرْيَةٌ een dorp · ضَيْفٌ een gast · طُلَّابٌ studenten · زُمَلَاءُ klasgenoten · أَصْدِقَاءُ vrienden · فِتْيَةٌ jongemannen · حُجَّاجٌ bedevaartgangers · شَيْخٌ een geleerde · حَقْلٌ een veld · النَّاسُ de mensen · الْمَطْعَمُ het restaurant · أَبْنَاءٌ zonen · بَنَاتٌ dochters · أَخَوَاتٌ zussen · النِّسَاءُ de vrouwen · زَوْجَةٌ een echtgenote"}]},"14":{"title":"أَنْتُمْ & نَحْنُ · ذَهَبْتُمْ & ذَهَبْنَا · Vreemde namen · Bijv. nw. bij Moedaaf · أَيُّ","summary":"Les 14 uit het Grammaticaboek Medina-methode Deel 1 (blz. 65–69) — meervoud «jullie» (أَنْتُمْ/ـكُمْ/ذَهَبْتُمْ) en «wij» (نَحْنُ/ـنَا/ذَهَبْنَا), niet-Arabische namen, bijvoeglijk naamwoord na een Idaafah en het vraagwoord أَيُّ.","points":["1–4) Mannelijk meervoud «jullie»: أَنْتُمْ، بَيْتُكُمْ، ذَهَبْتُمْ. Meervoud «wij» (m/v): نَحْنُ، بَيْتُنَا، ذَهَبْنَا (let op de lange -naa tegenover korte -na in ذَهَبْنَ «zij gingen» v. mv.).","5) Niet-Arabische eigennamen (وِلْيَمُ، لَنْدَنُ، بَاكِسْتَانُ en de meeste Profetennamen zoals إِبْرَاهِيمُ، إِسْمَاعِيلُ، إِسْحَاقُ، يَعْقُوبُ، آدَمُ) krijgen géén Tanwien — tenzij ze uit 3 letters bestaan met een Soekoen op de middelste letter (نُوحٌ، لُوطٌ، خَانٌ، جُرْجٌ).","6) Omdat een Moedaaf bepaald is, komt het bijvoeglijk naamwoord dat bij de Moedaaf hoort NA de Moedaaf Ilaih én krijgt het الْ: بَيْتُ الْإِمَامِ الْجَدِيدُ (het nieuwe huis van de imam, met -oe) vs. بَيْتُ الْإِمَامِ الْجَدِيدِ (het huis van de nieuwe imam, met -i).","7) أَيُّ («welk/welke?») is altijd Moedaaf; het woord erna is enkelvoud Madjroer: أَيُّ بَيْتٍ؟ / مِنْ أَيِّ بَلَدٍ؟ / أَيَّ لُغَةٍ تُحِبُّ؟."],"cards":[{"sec":"1 t/m 4) أَنْتُمْ en نَحْنُ · ذَهَبْتُمْ en ذَهَبْنَا (blz. 65–66)","lead":"1–4) Meervoudsvormen voor «jullie» (m.) en «wij» (m/v):","ps":["• Het meervoud van أَنْتَ («jij», m.) is أَنْتُمْ («jullie»), het achtervoegsel is ـكُمْ (بَيْتُكُمْ «jullie huis»), en het werkwoord is ذَهَبْتُمْ («jullie gingen»).","• Het meervoud van أَنَا («ik») is نَحْنُ («wij», voor m én v), het achtervoegsel is ـنَا (بَيْتُنَا «ons huis»), en het werkwoord is ذَهَبْنَا («wij gingen»).","• Let scherp op het uitspraak- en schrijfverschil tussen ذَهَبْنَ (dhahab-na, korte -a = «zij gingen» v. mv.) en ذَهَبْنَا (dhahab-naa, lange -aa met Alief = «wij gingen»)!"],"table":{"headers":["Persoon","Los voornaamwoord","Bezittelijk («huis»)","Werkwoord («gingen»)"],"rows":[["Jullie (mannelijk mv.)","أَنْتُمْ","بَيْتُكُمْ (baitoekoem)","ذَهَبْتُمْ (dhahabtoem)"],["Wij (mannelijk & vrouwelijk)","نَحْنُ","بَيْتُنَا (baitoenaa)","ذَهَبْنَا (dhahabnaa — lange aa!)"],["Zij (vrouwelijk mv. ter vergelijking)","هُنَّ","بَيْتُهُنَّ","ذَهَبْنَ (dhahabna — korte a!)"]]},"ex":[{"ar":"اللَّهُ رَبُّنَا، وَالْإِسْلَامُ دِينُنَا، وَمُحَمَّدٌ ﷺ نَبِيُّنَا.","nl":"Allah is onze Heer, de Islam is onze religie en Mohammed (ﷺ) is onze Profeet."},{"ar":"أَيْنَ ذَهَبْتُمْ يَا إِخْوَانُ؟ ذَهَبْنَا إِلَى الْمَحْكَمَةِ.","nl":"Waar gingen jullie heen, o broeders? Wij gingen naar de rechtbank."}]},{"sec":"5) Niet-Arabische eigennamen & Profetennamen (blz. 66–67)","lead":"5) Niet-Arabische eigennamen krijgen géén Tanwien (behalve 3-letterige namen met Soekoen zoals نُوحٌ):","ps":["Niet-Arabische eigennamen (persoonsnamen en plaatsnamen zoals وِلْيَمُ، لَنْدَنُ، بَاكِسْتَانُ، إِصْطَنْبُولُ) krijgen géén Tanwien.","Ook de namen van de meeste Profeten (vrede zij met hen) zijn niet-Arabisch en krijgen géén Tanwien: إِبْرَاهِيمُ، إِسْمَاعِيلُ، إِسْحَاقُ، يَعْقُوبُ، آدَمُ، يُونُسُ، دَاوُدُ، سُلَيْمَانُ، أَيُّوبُ، إِدْرِيسُ.","Uitzondering: als een niet-Arabische mannelijke naam uit slechts 3 letters bestaat waarvan de middelste letter een Soekoen heeft, krijgt hij wél Tanwien: نُوحٌ، لُوطٌ، خَانٌ، جُرْجٌ!"],"table":{"headers":["Categorie","Voorbeelden uit het boek","Uitgang"],"rows":[["Niet-Arabische namen & steden","وِلْيَمُ · لَنْدَنُ · بَاكِسْتَانُ · فِرْعَوْنُ","Géén Tanwien (één Dammah -oe)"],["Profetennamen (meeste)","إِبْرَاهِيمُ · إِسْمَاعِيلُ · إِسْحَاقُ · يَعْقُوبُ · آدَمُ · دَاوُدُ · يُونُسُ","Géén Tanwien (één Dammah -oe)"],["3 letters met middelste Soekoen","نُوحٌ (Noeh) · لُوطٌ (Loet) · خَانٌ (Khan) · جُرْجٌ (George)","Wél Tanwien (-oen)!"]]},"ex":[]},{"sec":"6) Bijvoeglijk naamwoord bij Moedaaf & 7) Vraagwoord أَيُّ (blz. 67–68)","lead":"6) «Het nieuwe huis van de imam» vs. «Het huis van de nieuwe imam» & 7) أَيُّ («welke?»):","ps":["6) De Moedaaf is bepaald door zijn positie. Een bijvoeglijk naamwoord dat de Moedaaf beschrijft, komt pas NA de hele Idaafah én krijgt الْ. De naamvalsuitgang (-oe of -ie) verraadt bij welk woord het bijvoeglijk naamwoord hoort!","7) أَيُّ («welk/welke?») wordt altijd als Moedaaf gebruikt (het woord erna is Madjroer op -in). أَيُّ zelf verandert wel van naamval: أَيُّ بَيْتٍ (Marfoe'), مِنْ أَيِّ بَلَدٍ (Madjroer na مِنْ), أَيَّ لُغَةٍ تُحِبُّ (Mansoeb als lijdend voorwerp)."],"table":{"headers":["Arabische zin","Uitgang van الْجَدِيد","Exacte betekenis"],"rows":[["بَيْتُ الْإِمَامِ الْجَدِيدُ","الْجَدِيدُ (Marfoe' -oe → hoort bij بَيْتُ)","Het nieuwe huis van de imam"],["بَيْتُ الْإِمَامِ الْجَدِيدِ","الْجَدِيدِ (Madjroer -ie → hoort bij الْإِمَامِ)","Het huis van de nieuwe imam"],["بَيْتُهُ الْجَدِيدُ","الْجَدِيدُ (bepaald omdat بَيْتُهُ bepaald is)","Zijn nieuwe huis"],["مِنْ أَيِّ بَلَدٍ أَنْتَ؟ / أَيَّ لُغَةٍ تُحِبُّ؟","أَيِّ (Madjroer) / أَيَّ (Mansoeb)","Uit welk land kom jij? / Welke taal heb je lief?"]]},"ex":[{"ar":"أَيْنَ بَيْتُ الْمُدَرِّسِ الْجَدِيدُ؟","nl":"Waar is het nieuwe huis van de leraar?"},{"ar":"فِي أَيِّ كُلِّيَّةٍ تَدْرُسُ؟ أَدْرُسُ فِي كُلِّيَّةِ الطِّبِّ.","nl":"Aan welke faculteit studeer jij? Ik studeer aan de Faculteit Geneeskunde."}]},{"sec":"Woordenlijst van Les 14 (blz. 69)","lead":"Woordenlijst van Les 14 (18 woorden)","ps":["أَنْتُمْ jullie (m) · نَحْنُ wij · ذَهَبْتُمْ jullie gingen (m) · ذَهَبْنَا wij gingen · أَيُّ welk(e) · الدِّينُ de religie · الرَّبُّ de Heer · النَّبِيُّ de Profeet · الْقِبْلَةُ de gebedsrichting · الْكُلِّيَّةُ de faculteit · كُلِّيَّةُ الطِّبِّ Faculteit Geneeskunde · كُلِّيَّةُ الشَّرِيعَةِ Faculteit Islamitisch Recht · الْمَطَارُ het vliegveld · الْحَدِيقَةُ de tuin · الشَّهْرُ de maand · الْمَحْكَمَةُ de rechtbank · الدُّسْتُورُ de grondwet · حَفِيدٌ een kleinzoon"],"ex":[]}],"examples":[{"ar":"مَنْ أَنْتُمْ؟ نَحْنُ طُلَّابٌ فِي كُلِّيَّةِ الشَّرِيعَةِ.","nl":"Wie zijn jullie? Wij zijn studenten aan de Faculteit Islamitisch Recht."},{"ar":"مِنْ أَيِّ بَلَدٍ أَنْتُمْ؟ نَحْنُ مِنَ الْيُونَانِ.","nl":"Uit welk land komen jullie? Wij komen uit Griekenland."},{"ar":"سَيَّارَةُ الْمُدِيرِ الْجَدِيدَةُ أَمَامَ الْمَدْرَسَةِ.","nl":"De nieuwe auto van de directeur staat vóór de school."}],"exercises":[{"q":"Wat is het verschil tussen «بَيْتُ الْإِمَامِ الْجَدِيدُ» en «بَيْتُ الْإِمَامِ الْجَدِيدِ»?","options":["الْجَدِيدُ (-oe) = het nieuwe huis van de imam; الْجَدِيدِ (-ie) = het huis van de nieuwe imam","Het is precies hetzelfde","الْجَدِيدُ hoort bij de imam en الْجَدِيدِ hoort bij het huis","Beide betekenen: het huis van de imam is nieuw"],"answer":0,"explain":"De naamvalsuitgang bepaalt welk woord wordt beschreven: الْجَدِيدُ (-oe) stemt overeen met بَيْتُ (Marfoe'), terwijl الْجَدِيدِ (-ie) overeenstemt met الْإِمَامِ (Madjroer) (blz. 67)."},{"q":"Welke van deze niet-Arabische Profetennamen krijgt WÉL Tanwien en waarom?","options":["نُوحٌ en لُوطٌ — omdat ze uit slechts 3 letters bestaan waarvan de tweede letter een Soekoen heeft","إِبْرَاهِيمُ en إِسْمَاعِيلُ","يَعْقُوبُ en إِسْحَاقُ","آدَمُ en يُونُسُ"],"answer":0,"explain":"Niet-Arabische mannelijke namen van 3 letters met een middelste Soekoen (نُوحٌ، لُوطٌ، خَانٌ، جُرْجٌ) krijgen wél Tanwien (blz. 66–67)."},{"q":"Kies de juiste vorm: «Uit welk land kom jij?» en «Welke taal heb je lief?»","options":["مِنْ أَيِّ بَلَدٍ أَنْتَ؟ en أَيَّ لُغَةٍ تُحِبُّ؟","مِنْ أَيُّ بَلَدٌ أَنْتَ؟ en أَيُّ لُغَةٌ تُحِبُّ؟","مِنْ أَيَّ بَلَدٍ en أَيِّ لُغَةٍ","أَيُّ الْبَلَدِ"],"answer":0,"explain":"Na مِنْ is أَيِّ Madjroer (-i); als lijdend voorwerp van تُحِبُّ is أَيَّ Mansoeb (-a), en het woord erna is altijd Moedaaf Ilaih (Madjroer) (blz. 68)."},{"q":"Wat is het verschil tussen ذَهَبْنَ en ذَهَبْنَا?","options":["ذَهَبْنَ (korte -a) = zij gingen (v. mv.); ذَهَبْنَا (lange -aa) = wij gingen","ذَهَبْنَ = wij gingen; ذَهَبْنَا = zij gingen","Er is geen verschil","ذَهَبْنَ is enkelvoud"],"answer":0,"explain":"In ذَهَبْنَ («zij gingen», v. mv.) is de a kort; in ذَهَبْنَا («wij gingen») is de aa lang (blz. 66)."}],"fullText":[{"h":"1 t/m 4) أَنْتُمْ en نَحْنُ · ذَهَبْتُمْ en ذَهَبْنَا (blz. 65–66)"},{"p":"1–4) Meervoudsvormen voor «jullie» (m.) en «wij» (m/v):"},{"p":"• Het meervoud van أَنْتَ («jij», m.) is أَنْتُمْ («jullie»), het achtervoegsel is ـكُمْ (بَيْتُكُمْ «jullie huis»), en het werkwoord is ذَهَبْتُمْ («jullie gingen»)."},{"p":"• Het meervoud van أَنَا («ik») is نَحْنُ («wij», voor m én v), het achtervoegsel is ـنَا (بَيْتُنَا «ons huis»), en het werkwoord is ذَهَبْنَا («wij gingen»)."},{"p":"• Let scherp op het uitspraak- en schrijfverschil tussen ذَهَبْنَ (dhahab-na, korte -a = «zij gingen» v. mv.) en ذَهَبْنَا (dhahab-naa, lange -aa met Alief = «wij gingen»)!"},{"table":{"headers":["Persoon","Los voornaamwoord","Bezittelijk («huis»)","Werkwoord («gingen»)"],"rows":[["Jullie (mannelijk mv.)","أَنْتُمْ","بَيْتُكُمْ (baitoekoem)","ذَهَبْتُمْ (dhahabtoem)"],["Wij (mannelijk & vrouwelijk)","نَحْنُ","بَيْتُنَا (baitoenaa)","ذَهَبْنَا (dhahabnaa — lange aa!)"],["Zij (vrouwelijk mv. ter vergelijking)","هُنَّ","بَيْتُهُنَّ","ذَهَبْنَ (dhahabna — korte a!)"]]}},{"ar":"اللَّهُ رَبُّنَا، وَالْإِسْلَامُ دِينُنَا، وَمُحَمَّدٌ ﷺ نَبِيُّنَا.","nl":"Allah is onze Heer, de Islam is onze religie en Mohammed (ﷺ) is onze Profeet."},{"ar":"أَيْنَ ذَهَبْتُمْ يَا إِخْوَانُ؟ ذَهَبْنَا إِلَى الْمَحْكَمَةِ.","nl":"Waar gingen jullie heen, o broeders? Wij gingen naar de rechtbank."},{"h":"5) Niet-Arabische eigennamen & Profetennamen (blz. 66–67)"},{"p":"5) Niet-Arabische eigennamen krijgen géén Tanwien (behalve 3-letterige namen met Soekoen zoals نُوحٌ):"},{"p":"Niet-Arabische eigennamen (persoonsnamen en plaatsnamen zoals وِلْيَمُ، لَنْدَنُ، بَاكِسْتَانُ، إِصْطَنْبُولُ) krijgen géén Tanwien."},{"p":"Ook de namen van de meeste Profeten (vrede zij met hen) zijn niet-Arabisch en krijgen géén Tanwien: إِبْرَاهِيمُ، إِسْمَاعِيلُ، إِسْحَاقُ، يَعْقُوبُ، آدَمُ، يُونُسُ، دَاوُدُ، سُلَيْمَانُ، أَيُّوبُ، إِدْرِيسُ."},{"p":"Uitzondering: als een niet-Arabische mannelijke naam uit slechts 3 letters bestaat waarvan de middelste letter een Soekoen heeft, krijgt hij wél Tanwien: نُوحٌ، لُوطٌ، خَانٌ، جُرْجٌ!"},{"table":{"headers":["Categorie","Voorbeelden uit het boek","Uitgang"],"rows":[["Niet-Arabische namen & steden","وِلْيَمُ · لَنْدَنُ · بَاكِسْتَانُ · فِرْعَوْنُ","Géén Tanwien (één Dammah -oe)"],["Profetennamen (meeste)","إِبْرَاهِيمُ · إِسْمَاعِيلُ · إِسْحَاقُ · يَعْقُوبُ · آدَمُ · دَاوُدُ · يُونُسُ","Géén Tanwien (één Dammah -oe)"],["3 letters met middelste Soekoen","نُوحٌ (Noeh) · لُوطٌ (Loet) · خَانٌ (Khan) · جُرْجٌ (George)","Wél Tanwien (-oen)!"]]}},{"h":"6) Bijvoeglijk naamwoord bij Moedaaf & 7) Vraagwoord أَيُّ (blz. 67–68)"},{"p":"6) «Het nieuwe huis van de imam» vs. «Het huis van de nieuwe imam» & 7) أَيُّ («welke?»):"},{"p":"6) De Moedaaf is bepaald door zijn positie. Een bijvoeglijk naamwoord dat de Moedaaf beschrijft, komt pas NA de hele Idaafah én krijgt الْ. De naamvalsuitgang (-oe of -ie) verraadt bij welk woord het bijvoeglijk naamwoord hoort!"},{"p":"7) أَيُّ («welk/welke?») wordt altijd als Moedaaf gebruikt (het woord erna is Madjroer op -in). أَيُّ zelf verandert wel van naamval: أَيُّ بَيْتٍ (Marfoe'), مِنْ أَيِّ بَلَدٍ (Madjroer na مِنْ), أَيَّ لُغَةٍ تُحِبُّ (Mansoeb als lijdend voorwerp)."},{"table":{"headers":["Arabische zin","Uitgang van الْجَدِيد","Exacte betekenis"],"rows":[["بَيْتُ الْإِمَامِ الْجَدِيدُ","الْجَدِيدُ (Marfoe' -oe → hoort bij بَيْتُ)","Het nieuwe huis van de imam"],["بَيْتُ الْإِمَامِ الْجَدِيدِ","الْجَدِيدِ (Madjroer -ie → hoort bij الْإِمَامِ)","Het huis van de nieuwe imam"],["بَيْتُهُ الْجَدِيدُ","الْجَدِيدُ (bepaald omdat بَيْتُهُ bepaald is)","Zijn nieuwe huis"],["مِنْ أَيِّ بَلَدٍ أَنْتَ؟ / أَيَّ لُغَةٍ تُحِبُّ؟","أَيِّ (Madjroer) / أَيَّ (Mansoeb)","Uit welk land kom jij? / Welke taal heb je lief?"]]}},{"ar":"أَيْنَ بَيْتُ الْمُدَرِّسِ الْجَدِيدُ؟","nl":"Waar is het nieuwe huis van de leraar?"},{"ar":"فِي أَيِّ كُلِّيَّةٍ تَدْرُسُ؟ أَدْرُسُ فِي كُلِّيَّةِ الطِّبِّ.","nl":"Aan welke faculteit studeer jij? Ik studeer aan de Faculteit Geneeskunde."},{"h":"Woordenlijst van Les 14 (blz. 69)"},{"p":"Woordenlijst van Les 14 (18 woorden)"},{"p":"أَنْتُمْ jullie (m) · نَحْنُ wij · ذَهَبْتُمْ jullie gingen (m) · ذَهَبْنَا wij gingen · أَيُّ welk(e) · الدِّينُ de religie · الرَّبُّ de Heer · النَّبِيُّ de Profeet · الْقِبْلَةُ de gebedsrichting · الْكُلِّيَّةُ de faculteit · كُلِّيَّةُ الطِّبِّ Faculteit Geneeskunde · كُلِّيَّةُ الشَّرِيعَةِ Faculteit Islamitisch Recht · الْمَطَارُ het vliegveld · الْحَدِيقَةُ de tuin · الشَّهْرُ de maand · الْمَحْكَمَةُ de rechtbank · الدُّسْتُورُ de grondwet · حَفِيدٌ een kleinzoon"}]},"15":{"title":"أَنْتُنَّ، ـكُنَّ en ذَهَبْتُنَّ (vrouwelijk mv.) · قَبْلَ & بَعْدَ · رَجَعَ","summary":"Les 15 uit het Grammaticaboek Medina-methode Deel 1 (blz. 70–72) — vrouwelijk meervoud «jullie» (أَنْتُنَّ / ـكُنَّ / ذَهَبْتُنَّ), de tijdsbepalingen قَبْلَ («vóór») en بَعْدَ («na») en het werkwoord رَجَعَ («hij keerde terug»).","points":["1 & 2) Het vrouwelijk meervoud van أَنْتِ («jij», v.) is أَنْتُنَّ («jullie», v. mv.) en het bezittelijk achtervoegsel is ـكُنَّ (بَيْتُكُنَّ «jullie huis»).","3) «Jij ging» (v. enk.) is ذَهَبْتِ, en het meervoud daarvan is ذَهَبْتُنَّ («jullie gingen», v. mv.).","4) قَبْلَ («vóór») en بَعْدَ («na») zijn tijdsbepalingen (Zarf Zamaan) die als Moedaaf worden gebruikt; het naamwoord erna is altijd Madjroer (-ie): قَبْلَ الصَّلَاةِ، بَعْدَ الدَّرْسِ.","5) رَجَعَ betekent «hij keerde terug» (رَجَعْتُ = ik keerde terug)."],"cards":[{"sec":"1 t/m 3) أَنْتُنَّ، ـكُنَّ en ذَهَبْتُنَّ (blz. 70–71)","lead":"1–3) Vrouwelijk meervoud «jullie»: أَنْتُنَّ، بَيْتُكُنَّ en ذَهَبْتُنَّ:","ps":["Waar je tegen een groep mannen أَنْتُمْ، بَيْتُكُمْ en ذَهَبْتُمْ gebruikt, gebruik je tegen een groep vrouwen أَنْتُنَّ، بَيْتُكُنَّ en ذَهَبْتُنَّ."],"table":{"headers":["Persoon","Los voornaamwoord","Bezittelijk («huis»)","Werkwoord («gingen»)"],"rows":[["Jij (vrouwelijk enk.)","أَنْتِ","بَيْتُكِ (baitoeki)","ذَهَبْتِ (dhahabti)"],["Jullie (vrouwelijk mv.)","أَنْتُنَّ","بَيْتُكُنَّ (baitoekoenna)","ذَهَبْتُنَّ (dhahabtoenna)"],["Jullie (mannelijk mv.)","أَنْتُمْ","بَيْتُكُمْ (baitoekoem)","ذَهَبْتُمْ (dhahabtoem)"]]},"ex":[{"ar":"مَنْ أَنْتُنَّ يَا أَخَوَاتِي؟ نَحْنُ بَنَاتُ الْإِمَامِ.","nl":"Wie zijn jullie, o mijn zussen? Wij zijn de dochters van de imam."},{"ar":"أَيْنَ بَيْتُكُنَّ يَا سَيِّدَاتُ؟ بَيْتُنَا قَرِيبٌ مِنَ الْمَسْجِدِ.","nl":"Waar is jullie huis, o dames? Ons huis is dicht bij de moskee."},{"ar":"أَيْنَ ذَهَبْتُنَّ يَا أَخَوَاتُ؟","nl":"Waar zijn jullie naartoe gegaan, o zusters?"}]},{"sec":"4) قَبْلَ & بَعْدَ en 5) رَجَعَ (blz. 71)","lead":"4) Tijdsbepalingen قَبْلَ («vóór») en بَعْدَ («na») + 5) رَجَعَ («hij keerde terug»):","ps":["4) قَبْلَ betekent «vóór» en بَعْدَ betekent «na». Ze zijn altijd Moedaaf en het naamwoord erna is daarom genitief (Madjroer op -ie).","5) رَجَعَ betekent «hij keerde terug» (رَجَعْتُ = ik keerde terug, رَجَعَتْ = zij keerde terug)."],"ex":[{"ar":"ذَهَبْتُ إِلَى الْمَسْجِدِ قَبْلَ الْأَذَانِ وَرَجَعْتُ بَعْدَ الصَّلَاةِ.","nl":"Ik ging naar de moskee vóór de Adhaan en ik keerde terug na het gebed."},{"ar":"أَرَجَعَ الْإِمَامُ مِنَ الْمَسْجِدِ؟","nl":"Is de imam teruggekeerd van de moskee?"},{"ar":"مَتَى الِاخْتِبَارُ؟ الِاخْتِبَارُ بَعْدَ أُسْبُوعٍ.","nl":"Wanneer is het examen? Het examen is over (na) een week."}]},{"sec":"Woordenlijst van Les 15 (blz. 72)","lead":"Woordenlijst van Les 15 (8 woorden)","ps":["أَنْتُنَّ jullie (v. mv.) · ذَهَبْتِ jij ging (v. enk.) · ذَهَبْتُنَّ jullie gingen (v. mv.) · قَبْلَ vóór · بَعْدَ na · رَجَعَ hij keerde terug · الدَّرْسُ de les · الْأُسْبُوعُ de week · الِاخْتِبَارُ het examen"],"ex":[]}],"examples":[{"ar":"مَتَى رَجَعْتِ مِنَ الْمَدْرَسَةِ يَا آمِنَةُ؟ رَجَعْتُ بَعْدَ الظُّهْرِ.","nl":"Wanneer ben jij teruggekeerd van school, o Aaminah? Ik ben na het middaggebed teruggekeerd."},{"ar":"أَذَهَبْتُنَّ إِلَى الطَّبِيبَةِ يَا بَنَاتُ؟ نَعَمْ، ذَهَبْنَا.","nl":"Zijn jullie naar de vrouwelijke arts gegaan, o meisjes? Ja, wij zijn gegaan."},{"ar":"فَتَحْتُ النَّافِذَةَ قَبْلَ الدَّرْسِ.","nl":"Ik opende het raam vóór de les."}],"exercises":[{"q":"Hoe vraag je aan een groep zusters (vrouwelijk meervoud): «Waar zijn jullie naartoe gegaan, o zusters?»","options":["أَيْنَ ذَهَبْتُنَّ يَا أَخَوَاتُ؟","أَيْنَ ذَهَبْتُمْ يَا أَخَوَاتُ؟","أَيْنَ ذَهَبْنَ يَا أَخَوَاتُ؟","أَيْنَ ذَهَبْتِ يَا أَخَوَاتُ؟"],"answer":0,"explain":"Tegen een groep vrouwen gebruik je ذَهَبْتُنَّ («jullie عَ (blz. 71)"},{"p":"4) Tijdsbepalingen قَبْلَ («vóór») en بَعْدَ («na») + 5) رَجَعَ («hij keerde terug»):"},{"p":"4) قَبْلَ betekent «vóór» en بَعْدَ betekent «na». Ze zijn altijd Moedaaf en het naamwoord erna is daarom genitief (Madjroer op -ie)."},{"p":"5) رَجَعَ betekent «hij keerde terug» (رَجَعْتُ = ik keerde terug, رَجَعَتْ = zij keerde terug)."},{"ar":"ذَهَبْتُ إِلَى الْمَسْجِدِ قَبْلَ الْأَذَانِ وَرَجَعْتُ بَعْدَ الصَّلَاةِ.","nl":"Ik ging naar de moskee vóór de Adhaan en ik keerde terug na het gebed."},{"ar":"أَرَجَعَ الْإِمَامُ مِنَ الْمَسْجِدِ؟","nl":"Is de imam teruggekeerd van de moskee?"},{"ar":"مَتَى الِاخْتِبَارُ؟ الِاخْتِبَارُ بَعْدَ أُسْبُوعٍ.","nl":"Wanneer is het examen? Het examen is over (na) een week."},{"h":"Woordenlijst van Les 15 (blz. 72)"},{"p":"Woordenlijst van Les 15 (8 woorden)"},{"p":"أَنْتُنَّ jullie (v. mv.) · ذَهَبْتِ jij ging (v. enk.) · ذَهَبْتُنَّ jullie gingen (v. mv.) · قَبْلَ vóór · بَعْدَ na · رَجَعَ hij keerde terug · الدَّرْسُ de les · الْأُسْبُوعُ de week · الِاخْتِبَارُ het examen"}]},"16":{"title":"Rationeel vs. Irrationeel Meervoud (عَاقِلٌ وَغَيْرُ عَاقِلٍ) · Patroon مَفَاعِلُ","summary":"Les 16 uit het Grammaticaboek Medina-methode Deel 1 (blz. 73–75) — het meervoud van niet-verstandhebbende naamwoorden wordt behandeld als vrouwelijk enkelvoud (هَذِهِ كُتُبٌ جَدِيدَةٌ) + het meervoudspatroon مَفَاعِلُ.","points":["1) Naamwoorden worden ingedeeld in rationeel («met verstand», عَاقِلٌ: mensen, engelen, djinn) en irrationeel («zonder verstand», غَيْرُ عَاقِلٍ: dingen, dieren, begrippen).","Het meervoud van irrationele naamwoorden wordt grammaticaal behandeld als VROUWELIJK ENKELVOUD: هَذِهِ كُتُبٌ جَدِيدَةٌ، هِيَ صَغِيرَةٌ en الْكِلَابُ خَرَجَتْ.","2) Nieuw gebroken meervoudspatroon مَفَاعِلُ (zonder Tanwien!): مَسْجِدٌ → مَسَاجِدُ en دَفْتَرٌ → دَفَاتِرُ."],"cards":[{"sec":"1) Rationeel vs. Irrationeel Meervoud (blz. 73–74)","lead":"Gouden regel: Het meervoud van irrationele naamwoorden (غَيْرُ عَاقِلٍ) is vrouwelijk enkelvoud!","ps":["In het Arabisch worden naamwoorden geclassificeerd als (1) rationeel («met verstand», عَاقِلٌ: mensen, engelen, duivels) en (2) irrationeel («zonder verstand», غَيْرُ عَاقِلٍ: dingen, dieren en concepten).","In het enkelvoud is er geen verschil tussen deze twee groepen. Maar in het meervoud wordt het meervoud van irrationele naamwoorden behandeld als VROUWELIJK ENKELVOUD (dus met هَذِهِ، تِلْكَ، هِيَ en een vrouwelijk enkelvoudig bijvoeglijk naamwoord of werkwoord)!"],"table":{"headers":["Groep","Enkelvoud","Meervoud (let op het verschil!)"],"rows":[["Met verstand (عَاقِلٌ)","هَذَا طَالِبٌ جَدِيدٌ، هُوَ صَغِيرٌ.","هَؤُلَاءِ طُلَّابٌ جُدُدٌ، هُمْ صِغَارٌ."],["Zonder verstand (غَيْرُ عَاقِلٍ)","هَذَا كِتَابٌ جَدِيدٌ، هُوَ صَغِيرٌ.","هَذِهِ كُتُبٌ جَدِيدَةٌ، هِيَ صَغِيرَةٌ."],["Werkwoord (mensen vs. dieren)","الطَّالِبُ خَرَجَ.","الطُّلَّابُ خَرَجُوا vs. الْكِلَابُ خَرَجَتْ."]]},"ex":[{"ar":"هَذِهِ كُتُبٌ جَدِيدَةٌ، هِيَ صَغِيرَةٌ.","nl":"Dit zijn nieuwe boeken, zij zijn klein."},{"ar":"الطُّلَّابُ خَرَجُوا، وَالْكِلَابُ خَرَجَتْ.","nl":"De studenten gingen naar buiten, en de honden gingen naar buiten."}]},{"sec":"2) Gebroken meervoudspatroon مَفَاعِلُ (blz. 74)","lead":"2) Nieuw meervoudspatroon مَفَاعِلُ (diptoot: krijgt géén Tanwien!):","ps":["Het gebroken meervoudspatroon مَفَاعِلُ krijgt géén Tanwien (het eindigt op één enkele Dammah -oe in plaats van -oen):"],"table":{"headers":["Enkelvoud","Meervoud (patroon مَفَاعِلُ)","Uitspraak & Betekenis"],"rows":[["مَسْجِدٌ (masdjidoe-n)","مَسَاجِدُ (NIET مَسَاجِدٌ)","masaadjid-oe — moskeeën"],["دَفْتَرٌ (daftaroe-n)","دَفَاتِرُ","dafaatir-oe — schriften"],["فُنْدُقٌ (foendoeqoe-n)","فَنَادِقُ","fanaadiq-oe — hotels"],["مَكْتَبٌ (maktaboe-n)","مَكَاتِبُ","makaatib-oe — bureaus / kantoren"]]},"ex":[{"ar":"هَذِهِ مَسَاجِدُ جَمِيلَةٌ.","nl":"Dit zijn mooie moskeeën."},{"ar":"فِي هَذِهِ الْمَدِينَةِ فَنَادِقُ كَبِيرَةٌ.","nl":"In deze stad zijn grote hotels."}]},{"sec":"Woordenlijst van Les 16 (blz. 75)","le ) in langere zinnen."},{"p":"Merk op dat het meervoud van حِمَارٌ («ezel») twee vormen kent: حُمُرٌ (hoemoeroen) en حَمِيرٌ (hamieroen) «ezels»."},{"table":{"headers":["Enkelvoud","Meervoud","Voorbeeld in het meervoud (als vr. enk.!)"],"rows":[["بَابٌ (deur)","أَبْوَابٌ","أَبْوَابُ الْمَسْجِدِ مَفْتُوحَةٌ (De deuren van de moskee zijn open)"],["قَمِيصٌ (hemd)","قُمْصَانٌ","الْقُمْصَانُ نَظِيفَةٌ (De hemden zijn schoon)"],["حِمَارٌ (ezel)","حُمُرٌ / حَمِيرٌ","الْحَمِيرُ صَغِيرَةٌ (De ezels zijn klein)"],["سَيَّارَةٌ (auto)","سَيَّارَاتٌ","السَّيَّارَاتُ الْيَابَانِيَّةُ رَخِيصَةٌ (De Japanse auto's zijn goedkoop)"]]}},{"ar":"أَبْوَابُ الْمَسْجِدِ مَفْتُوحَةٌ.","nl":"De deuren van de moskee zijn open."},{"ar":"لِمَنْ هَذِهِ الْبُيُوتُ الْجَدِيدَةُ؟ هِيَ لِمُدِيرِ الشَّرِكَةِ.","nl":"Van wie zijn deze nieuwe huizen? Zij zijn van de directeur van het bedrijf."},{"ar":"هَذِهِ الْقُمْصَانُ رَخِيصَةٌ جِدًّا.","nl":"Deze hemden zijn erg goedkoop."},{"h":"Woordenlijst van Les 17 (blz. 77)"},{"p":"Woordenlijst van Les 17"},{"p":"رَخِيصٌ goedkoop · الشَّرِكَةُ de firma, het bedrijf · الْقَمِيصُ het hemd · قُمْصَانٌ hemden · يَابَانِيَّةٌ Japans (v) · مُدِيرُ الشَّرِكَةِ de directeur van het bedrijf · حُمُرٌ ezels"}]},"18":{"title":"Het Tweevoud (الْمُثَنَّى: ـَانِ) · هَذَانِ، هَاتَانِ، هُمَا · كَمْ + Mansoeb (ـًا)","summary":"Les 18 uit het Grammaticaboek Medina-methode Deel 1 (blz. 78–80) — de tweevoudsvorm op «-aani» (ـَانِ), هَذَانِ/هَاتَانِ/هُمَا en het vraagwoord كَمْ («hoeveel?») gevolgd door enkelvoud accusatief (Mansoeb).","points":["1) Het Arabisch kent drie getallen: enkelvoud, tweevoud (الْمُثَنَّى) en meervoud. Het tweevoud eindigt op «-aani» (ـَانِ): بَيْتٌ → بَيْتَانِ (twee huizen), يَدٌ → يَدَانِ (twee handen).","Het tweevoud van هَذَا is هَذَانِ (m.), van هَذِهِ is هَاتَانِ (v.), en van هُوَ/هِيَ is هُمَا («zij tweeën»).","2) كَمْ betekent «hoeveel?». Het naamwoord na كَمْ staat in het ENKELVOUD en is accusatief (Mansoeb, مَنْصُوبٌ op -an): كَمْ كِتَابًا؟ en كَمْ سَيَّارَةً؟.","Bij Tanwien-Mansoeb (ـًا) komt er een extra Alief aan het eind (كِتَابًا), behalve wanneer het woord op een Taa' Marboetah (ة) eindigt (سَيَّارَةً)."],"cards":[{"sec":"1) Het Tweevoud (الْمُثَنَّى) op «-aani» (blz. 78–79)","lead":"1) Het Tweevoud: بَيْتَانِ، هَذَانِ، هَاتَانِ en هُمَا:","ps":["In tegenstelling tot het Nederlands kent het Arabisch drie grammaticale getallen: enkelvoud (1), tweevoud (2) en meervoud (3 of meer). De tweevoudsvorm eindigt op «-aani» (ـَانِ).","Het bijvoeglijk naamwoord dat een tweevoudig naamwoord beschrijft, staat óók in het tweevoud (طَالِبَانِ جَدِيدَانِ)."],"table":{"headers":["Categorie","Enkelvoud","Tweevoud (الْمُثَنَّى)","Betekenis"],"rows":[["Mannelijk naamwoord","بَيْتٌ / كِتَابٌ","بَيْتَانِ / كِتَابَانِ","twee huizen / twee boeken"],["Vrouwelijk naamwoord","يَدٌ / سَيَّارَةٌ","يَدَانِ / سَيَّارَتَانِ","twee handen / twee auto's"],["Aanwijzend (m / v)","هَذَا (m) / هَذِهِ (v)","هَذَانِ (m) / هَاتَانِ (v)","deze twee (m / v)"],["Persoonlijk voornaamwoord","هُوَ (hij) / هِيَ (zij)","هُمَا (voor m én v!)","zij tweeën"]]},"ex":[{"ar":"هَذَانِ كِتَابَانِ وَهَاتَانِ سَيَّارَتَانِ.","nl":"Dit zijn twee boeken en dit zijn twee auto's."},{"ar":"مَنْ هَذَانِ الْوَلَدَانِ؟ هُمَا طَالِبَانِ جَدِيدَانِ.","nl":"Wie zijn deze twee jongens? Zij zijn twee nieuwe studenten."},{"ar":"أَيْنَ الْأُخْتَانِ؟ هُمَا فِي الْغُرْفَةِ.","nl":"Waar zijn de twee zussen? Zij zijn in de kamer."}]},{"sec":"2) كَمْ («hoeveel?») + Enkelvoud Mansoeb (blz. 79)","lead":"2) كَمْ («hoeveel?») wordt gevolgd door enkelvoud in de accusatief (Mansoeb, ـًا):","ps":["Het woord كَمْ betekent «hoeveel?». Merk op dat het naamwoord dat na كَمْ komt in het ENKELVOUD staat en accusatief (Mansoeb / مَنْصُوبٌ op «-an») is!","Een naamwoord met Tanwien in de Mansoeb-positie krijgt een extra Alief aan het eind (كِتَابًا), behalve als het woord eindigt op een Taa' Marboetah ة (سَيَّارَةً — zonder Alief)."],"table":{"headers":["Nominatief (Marfoe')","Genitief (Madjroe eevoud: كَمْ كِتَابَانِ؟","Enkelvoud en Madjroer: كَمْ كِتَابٍ؟"],"answer":0,"explain":"Na كَمْ staat het naamwoord in het enkelvoud en is het Mansoeb (-an) (blz. 79)."},{"q":"Waarom krijgt كِتَابًا wel een Alief aan het eind en سَيَّارَةً niet?","options":["Omdat een woord dat eindigt op Taa' Marboetah (ة) geen extra Alief krijgt bij Tanwien-fath","Omdat سَيَّارَةً meervoud is","Omdat كِتَابًا bepaald is","Omdat سَيَّارَةً een diptoot is"],"answer":0,"explain":"Woorden op ة krijgen geen Alief na de dubbele Fathah: سَيَّارَةً (blz. 79)."},{"q":"Welk voornaamwoord gebruik je voor «zij tweeën» (zowel mannelijk als vrouwelijk)?","options":["هُمَا","هُمْ","هُنَّ","هَذَانِ"],"answer":0,"explain":"Het tweevoud van zowel هُوَ als هِيَ is هُمَا (blz. 78)."}],"fullText":[{"h":"1) Het Tweevoud (الْمُثَنَّى) op «-aani» (blz. 78–79)"},{"p":"1) Het Tweevoud: بَيْتَانِ، هَذَانِ، هَاتَانِ en هُمَا:"},{"p":"In tegenstelling tot het Nederlands kent het Arabisch drie grammaticale getallen: enkelvoud (1), tweevoud (2) en meervoud (3 of meer). De tweevoudsvorm eindigt op «-aani» (ـَانِ)."},{"p":"Het bijvoeglijk naamwoord dat een tweevoudig naamwoord beschrijft, staat óók in het tweevoud (طَالِبَانِ جَدِيدَانِ)."},{"table":{"headers":["Categorie","Enkelvoud","Tweevoud (الْمُثَنَّى)","Betekenis"],"rows":[["Mannelijk naamwoord","بَيْتٌ / كِتَابٌ","بَيْتَانِ / كِتَابَانِ","twee huizen / twee boeken"],["Vrouwelijk naamwoord","يَدٌ / سَيَّارَةٌ","يَدَانِ / سَيَّارَتَانِ","twee handen / twee auto's"],["Aanwijzend (m / v)","هَذَا (m) / هَذِهِ (v)","هَذَانِ (m) / هَاتَانِ (v)","deze twee (m / v)"],["Persoonlijk voornaamwoord","هُوَ (hij) / هِيَ (zij)","هُمَا (voor m én v!)","zij tweeën"]]}},{"ar":"هَذَانِ كِتَابَانِ وَهَاتَانِ سَيَّارَتَانِ.","nl":"Dit zijn twee boeken en dit zijn twee auto's."},{"ar":"مَنْ هَذَانِ الْوَلَدَانِ؟ هُمَا طَالِبَانِ جَدِيدَانِ.","nl":"Wie zijn deze twee jongens? Zij zijn twee nieuwe studenten."},{"ar":"أَيْنَ الْأُخْتَانِ؟ هُمَا فِي الْغُرْفَةِ.","nl":"Waar zijn de het naamwoord als bijvoeglijk naamwoord: كِتَابٌ وَاحِدٌ (één boek), كِتَابَانِ اثْنَانِ (twee boeken).","De getallen 3 t/m 10 worden als Moedaaf gebruikt vóór het getelde woord (de Ma'doed / مَعْدُودٌ). De Ma'doed staat altijd in het MEERVOUD en is Madjroer (genitief): ثَلَاثَةُ كُتُبٍ، أَرْبَعَةُ بُيُوتٍ، خَمْسَةُ أَقْلَامٍ، عَشَرَةُ رِجَالٍ.","Bij een mannelijke Ma'doed krijgen de getallen 3 t/m 10 een Taa' Marboetah (ة)!","In «كَمْ ثَمَنُ هَذَا؟» (Wat is de prijs hiervan?) is het woord رِيَالًا weggelaten (eigenlijk: كَمْ رِيَالًا ثَمَنُ هَذَا؟)."],"cards":[{"sec":"Getallen 1 t/m 10 met mannelijke Ma'doed (blz. 81–82)","lead":"Getallen 3 t/m 10 zijn Moedaaf; het getelde woord (الْمَعْدُودُ) staat in het meervoud en is Madjroer:","ps":["• Voor 1 en 2 staat het telwoord achter het naamwoord als een bijvoeglijk naamwoord: كِتَابٌ وَاحِدٌ (één boek), كِتَابَانِ اثْنَانِ (twee boeken).","• De getallen 3 t/m 10 worden gebruikt als Moedaaf (zonder الْ en zonder Tanwien). Het getelde naamwoord heet Ma'doed (مَعْدُودٌ): dit staat in het MEERVOUD en is altijd Madjroer (-in) omdat het Moedaaf Ilaih is!","• Het getal zelf kan in elke naamval staan: خَرَجَ ثَلَاثَةُ طُلَّابٍ (-oe), فِي أَرْبَعَةِ بُيُوتٍ (-i), رَأَيْتُ خَمْسَةَ رِجَالٍ (-a)."],"table":{"headers":["Getal","Met mannelijke Ma'doed (in meervoud Madjroer!)","Betekenis"],"rows":[["1 & 2","كِتَابٌ وَاحِدٌ · كِتَابَانِ اثْنَانِ","één boek · twee boeken"],["3 & 4","ثَلَاثَةُ كُتُبٍ · أَرْبَعَةُ بُيُوتٍ","drie boeken · vier huizen"],["5 & 6","خَمْسَةُ أَقْلَامٍ · سِتَّةُ أَبْوَابٍ","vijf pennen · zes deuren"],["7 & 8","سَبْعَةُ أَيَّامٍ · ثَمَانِيَةُ طُلَّابٍ","zeven dagen · acht studenten"],["9 & 10","تِسْعَةُ قُرُوشٍ · عَشَرَةُ رِجَالٍ","negen qirsh · tien mannen"]]},"ex":[{"ar":"خَرَجَ ثَلَاثَةُ طُلَّابٍ.","nl":"Drie studenten gingen naar buiten."},{"ar":"فِي أَرْبَعَةِ بُيُوتٍ.","nl":"In vier huizen."},{"ar":"كَمْ ثَمَنُ هَذَا الْكِتَابِ؟ ثَمَنُهُ سَبْعَةُ رِيَالَاتٍ وَنِصْفٌ.","nl":"Wat is de prijs van dit boek?
