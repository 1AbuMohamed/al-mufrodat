    if(pauseBtn) pauseBtn.style.display=window._dlgListening?'':'none';
    if(resumeBtn) resumeBtn.style.display=window._dlgListening?'none':'';
  };

  const showMenu=()=>{
    window._dlgListening=false;
    paintLive();
  };
  window._dlgShowMenu=showMenu;

  const finish=()=>{
    if(stopped)return;
    stopped=true;
    window._dlgListening=false;
    window._dlgPracticeFinish=null;
    window._dlgResume=null;
    window._dlgRestart=null;
    window._dlgRetryLine=null;
    try{rec.onend=null;rec.onresult=null;rec.onerror=null}catch(e){}
    safeRecStop(rec);
    recActive=null;
    lastSaid=saidNow();
    freezeClip().then(()=>{
    const said=lastSaid;
    if(!said){
      if(resultEl){
        resultEl.className='speak-result bad';
        resultEl.innerHTML='Niets gehoord.<br><button type="button" class="btn btn-primary btn-sm" data-act="dlg-restart" style="margin-top:8px">↻ Helemaal opnieuw</button>';
      }
      stopRoll();
      return;
    }
    const g=gradeDialogueLines(lines, said, false, lockCount);
    if(resultEl){
      resultEl.style.display='block';
      resultEl.className='speak-result '+(g.pct>=55?'ok':'bad');
      resultEl.innerHTML=
        '<div class="dlg-score"><span class="pct">'+g.pct+'%</span> · '+g.wordsOk+'/'+g.wordsTotal+' woorden · '+g.linesOk+'/'+g.linesTotal+' zinnen</div>'+
        '<div class="said-live">Tik een rood of oranje woord: jij vs juist</div>'+
        tarteelLeg()+
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'+
          '<button type="button" class="btn btn-primary btn-sm" data-act="dlg-restart">↻ Helemaal opnieuw</button>'+
          '<button type="button" class="btn btn-secondary btn-sm" data-act="dlg-retry-line">↺ Deze zin opnieuw</button>'+
        '</div>';
    }
    if(g.pct>=55)try{playOk()}catch(e){}
    else try{playNo()}catch(e){}
    stopRoll();
    });
  };

  const bindAndStart=()=>{
    if(stopped || window._dlgSession!==sessionId)return;
    window._dlgListening=true;
    rec.lang='ar-SA';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=3;
    rec.onresult=(ev)=>{
      if(stopped || window._dlgSession!==sessionId)return;
      interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const t=ev.results[i][0].transcript||'';
        if(ev.results[i].isFinal){
          if(t) finalText=(finalText?finalText+' ':'')+t;
        } else {
          interim+=(interim?' ':'')+t;
        }
      }
      paintLive();
    };
    rec.onerror=(ev)=>{
      if(ev.error==='not-allowed'){
        window._dlgListening=false;
        stopped=true;
        if(resultEl){resultEl.className='speak-result bad';resultEl.textContent='Microfoon geblokkeerd (https + 1× toestaan).';}
      }
    };
    rec.onend=()=>{
      recActive=null;
      if(stopped || window._dlgSession!==sessionId){ if(!stopped) finish(); return; }
      showMenu();
    };
    recActive=rec;
    if(!safeRecStart(rec)){
      setTimeout(()=>{ if(!stopped && window._dlgSession===sessionId) safeRecStart(rec); }, 400);
    }
    paintLive();
  };

  window._dlgResume=()=>{
    if(window._dlgSession!==sessionId)return;
    stopped=false;
    interim='';
    bindAndStart();
  };

  window._dlgRestart=()=>{
    finalText='';
    interim='';
    checkpoints=[''];
    currentLine=0;
    lockCount=0;
    stopped=false;
    document.querySelectorAll('.book-line').forEach(el=>el.classList.remove('line-ok','line-bad','line-mid','line-active'));
    document.querySelectorAll('.book-line .ar').forEach((ar,idx)=>{
      if(lines[idx]){ ar.classList.add('ar-mark'); ar.innerHTML=markAr(lines[idx].ar,'wait'); }
    });
    bindAndStart();
  };

  /** Deze zin opnieuw: terug naar checkpoint van currentLine, wis fouten van die zin */
  window._dlgRetryLine=()=>{
    if(window._dlgSession!==sessionId) return;
    const lineIdx=Math.max(0, currentLine|0);
    lockCount=lineIdx;
    currentLine=lineIdx;
    finalText='';
    interim='';
    stopped=false;
    const els=document.querySelectorAll('.book-dialogue .book-line');
    els.forEach((el,idx)=>{
      if(idx<lineIdx){
        el.classList.add('line-ok');
        el.classList.remove('line-bad','line-mid','line-active');
      } else {
        el.classList.remove('line-ok','line-bad','line-mid','line-active');
        const ar=el.querySelector('.ar');
        if(ar && lines[idx]){ ar.classList.add('ar-mark'); ar.innerHTML=markAr(lines[idx].ar,'wait'); }
      }
    });
    window._dlgListening=false;
    try{rec.onend=null}catch(e){}
    safeRecStop(rec);
    recActive=null;
    if(resultEl){
      resultEl.style.display='block';
      const st=resultEl.querySelector('.dlg-status');
      if(st) st.textContent='Zeg zin '+(lineIdx+1)+' opnieuw';
    }
    setTimeout(()=>bindAndStart(), 280);
  };

window._dlgPracticeFinish=finish;
  bindAndStart();
}

function startSpeakPractice(expected, who, resultEl){
  const rec=getSharedRec();
  if(!rec){
    if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='Spraakherkenning: Chrome op https.';}
    return;
  }
  try{rec.onend=null;rec.onresult=null;rec.onerror=null}catch(e){}
  safeRecStop(rec);
  unlockAudio();
  const t0=Date.now();
  window._spkUntil=t0+LISTEN_MS;
  window._spkDone=false;
  const left=()=>Math.max(0, Math.ceil((window._spkUntil-Date.now())/1000));
  const stillOn=()=>!window._spkDone && Date.now()<=window._spkUntil;
  if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='🎤 Blijf zeggen tot het groen is — tot 1 minuut'}
  document.querySelectorAll('.mic-btn').forEach(b=>b.classList.remove('listening'));
  const btn=document.querySelector('.mic-btn.listening-target');
  if(btn)btn.classList.add('listening');

  const finishOk=(said, g)=>{
    if(window._spkDone) return;
    window._spkDone=true;
    const harakaFail=false;
    const d=diffArHtml(expected, said, harakaFail);
    if(resultEl){
      resultEl.className='speak-result ok';
      resultEl.innerHTML=zegOkHtml(g)+' · <span class="ar-diff ar-mark">'+d.html+'</span>';
    }
    try{playOk()}catch(e){}
    hideCompare();
    freezeClip().then(()=>{
      stopRoll();
      try{rec.onend=null}catch(e){}
      safeRecStop(rec);
      recActive=null;
      document.querySelectorAll('.mic-btn').forEach(b=>b.classList.remove('listening','listening-target'));
    });
  };
  const finishTimeout=()=>{
    if(window._spkDone) return;
    window._spkDone=true;
    const said=lastSaid||'';
    const snap=rollSamples(2.4);
    freezeClip().then(()=>{
      const g=gradeUtterance(expected, said, null, snap);
      if(g.ok){ window._spkDone=false; finishOk(said, g); return; }
      document.querySelectorAll('.mic-btn').forEach(b=>b.classList.remove('listening','listening-target'));
      if(resultEl){
        const harakaFail=!!(said && g.needEnd);
        const d=diffArHtml(expected, said, harakaFail);
        if(!said){ resultEl.className='speak-result hint'; resultEl.textContent='Niets gehoord.'; }
        else if(harakaFail){
          resultEl.className='speak-result bad';
          resultEl.innerHTML='✗ Uitgang: gehoord <b>'+esc(endLabel(g.end.heard))+'</b>, juist <b>'+esc(endLabel(g.end.cls))+'</b>.';
          showCompare(expected, said, 'haraka', g.end.hint||'', {ar:expected}, g.end);
        }else{
          resultEl.className='speak-result bad';
          resultEl.innerHTML='✗ Verkeerd woord.<br><span class="ar-diff ar-mark">'+d.html+'</span>';
          showCompare(expected, said, 'word', 'Zeg het woord opnieuw.', {ar:expected}, g.end);
        }
      }
      try{playNo()}catch(e){}
      try{speakWord({ar:expected}, true)}catch(e){}
      stopRoll();
      recActive=null;
    });
  };

  startRoll().then(()=>{
    const bind=()=>{
      if(!stillOn()){ if(!window._spkDone) finishTimeout(); return; }
      rec.lang='ar-SA';
      rec.continuous=true;
      rec.interimResults=true;
      rec.maxAlternatives=5;
      rec.onresult=(ev)=>{
        if(!stillOn()) return;
        let lastFinal='', interim='';
        for(let i=0;i<ev.results.length;i++){
          const t=ev.results[i][0].transcript||'';
          if(ev.results[i].isFinal) lastFinal=t;
          else interim=t;
        }
        const said=(lastFinal||interim||'').trim();
        lastSaid=said;
        if(resultEl && said){
          const d=diffArHtml(expected, said);
          resultEl.className='speak-result hint';
          resultEl.innerHTML='Nog '+left()+'s · <span class="ar-diff ar-mark">'+(d.html||'')+'</span>';
        }
        if(lastFinal){
          const snap=rollSamples(2.4);
          const g=gradeUtterance(expected, lastFinal, null, snap);
          if(g.ok) finishOk(lastFinal, g);
        }
      };
      rec.onerror=(ev)=>{
        if(resultEl && ev.error==='not-allowed'){
          resultEl.className='speak-result bad';
          resultEl.textContent='Microfoon toestaan via slotje (gebruik https).';
          window._spkDone=true;
        }
      };
      rec.onend=()=>{
        recActive=null;
        if(!stillOn()){ if(!window._spkDone) finishTimeout(); return; }
        setTimeout(()=>{ if(stillOn()) bind(); }, 80);
      };
      recActive=rec;
      safeRecStart(rec);
    };
    setTimeout(bind, 180);
  });
}

function speakDialogueLine(text, who, onDone){
  const t=String(text||'').trim();
  if(!t){if(onDone)onDone(false);return}
  unlockAudio();
  stopAudio();
  const myGen=audioGen;
  const g=genderOf(who);
  const v=pickVoiceFor(who||'');
  const finish=(ok)=>{if(myGen!==audioGen)return; if(onDone)onDone(!!ok)};
  let usedLocal=false;
  const fallback=()=>{
    if(usedLocal||myGen!==audioGen)return;
    speakProxyPitched(t, g, who, ok1=>{
      if(usedLocal||myGen!==audioGen)return;
      if(ok1){finish(true);return}
      speakGooglePitched(t, g, who, ok2=>{
        if(usedLocal||myGen!==audioGen)return;
        if(ok2){finish(true);return}
        const w=speakWebWithVoice(t, v, g, who);
        if(!w)finish(false);
        else {
          const wait=Math.min(9000, Math.max(1500, t.length*95));
          setTimeout(()=>finish(true), wait);
        }
      });
    });
  };
  const local=localLineSrc(t, who);
  const legacy=localLineSrcLegacy(t, who);
  if(!local){fallback();return}
  const tryFile=(src, next)=>{
    if(!src){if(next)next();return}
    speakFile(src, ok=>{
      if(myGen!==audioGen)return;
      if(ok||usedLocal){finish(true);return}
      if(next)next(); else fallback();
    }, ()=>{usedLocal=true});
  };
  tryFile(local, ()=>{
    if(legacy && legacy!==local) tryFile(legacy, fallback);
    else fallback();
  });
}

function speakProxyPitched(text, gender, who, done){
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://tts-api.netlify.app/?text='+q+'&lang=ar';
  fetch(url,{mode:'cors',credentials:'omit',cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlobPitched(blob, gender, done, who);
    })
    .catch(()=>{if(done)done(false)});
}
function speakGooglePitched(text, gender, who, done){
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ar&q='+q;
  fetch(url,{referrerPolicy:'no-referrer',mode:'cors',credentials:'omit'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlobPitched(blob, gender, done, who);
    })
    .catch(()=>{if(done)done(false)});
}
function speakWebWithVoice(text, voice, gender, who){
  if(!('speechSynthesis' in window))return false;
  try{
    primeVoices();
    refreshArVoices();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(ttsSpell(text));
    const prof=profileForSpeaker(who||'', gender);
    let v=voice;
    if(!v){
      const pool=gender==='f'?(femaleArVoices.length?femaleArVoices:allArVoices):(maleArVoices.length?maleArVoices:allArVoices);
      if(pool.length)v=pool[prof.idx % pool.length];
      else if(arabicVoice)v=arabicVoice;
    }
    if(v){u.voice=v;u.lang=v.lang||'ar-SA'}
    else u.lang='ar-SA';
    // Elk personage: tempo + toonhoogte ver uit elkaar
    u.rate = Math.min(1.35, Math.max(0.55, prof.rate));
    u.pitch = gender==='f' ? (0.95 + (prof.idx%6)*0.22) : (0.45 + (prof.idx%6)*0.20);
    u.volume=1;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false}
}

function tone(type,from,to,g,dur){
  unlockAudio();
  if(!audioCtx)return;
  try{
    const now=audioCtx.currentTime,o=audioCtx.createOscillator(),gn=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(to,now+dur*.7);
    gn.gain.setValueAtTime(.0001,now);gn.gain.exponentialRampToValueAtTime(g,now+.01);gn.gain.exponentialRampToValueAtTime(.0001,now+dur);
    o.connect(gn);gn.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.02);
  }catch(e){}
}
function playOk(){if(!autoSpeak)return;tone('sine',880,1320,.14,.2)}
function playNo(){if(!autoSpeak)return;tone('sawtooth',280,180,.1,.18)}

function renderSidebar(){
  const path = currentPath();

  const totalItems = totalW + gKeys.length * 10;

  const convOpen = sbOpenMenu === 'conv' || path === 'conv';

    const num = String(n).padStart(2,'0');

  }).join('');

  const convLinks = Object.entries(CONVERSATIONS).map(([u, c]) => {
    const active = state.view==='conv-unit' && String(state.convUnit)===String(u);
    const num = String(u).padStart(2,'0');
    return `<button type="button" class="${active?'active':''}" data-act="open-conv" data-u="${u}"><span>${num}</span>${esc(c.titleNl)}</button>`;

        <span>Medina Arabisch · Deel 1</span>

      </button>
    </div>

    <div class="sb-label">Jouw leerpad</div>
    <nav class="sb-nav">
      <button type="button" class="sbn ${state.view==='home'?'active':''}" data-act="nav" data-v="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        <span>Overzicht</span>

      <button type="button" class="sbn ${path==='vocab'&&state.view!=='words'&&state.view!=='home'?'active':''}" data-act="nav" data-v="vocab">

      <button type="button" class="sbn sbn-course ${path==='grammar'?'active':''}" data-act="sb-menu" data-menu="gram" aria-expanded="${gramOpen}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>

function tabbar(){

function nextLesson(){
  for(const n of lessonNums()){
    const ws=wordsFor(n);
    if(mastered(ws)<ws.length)return n;
  }
  return 'all';
}


function renderVocabHub(){
  const total=ALL.length, m=mastered(ALL), pct=total?Math.round(100*m/total):0;
  let lessons='';
  for(const n of lessonNums()){
    const ws=wordsFor(n); const mm=mastered(ws); const p=ws.length?Math.round(100*mm/ws.length):0;
    const stt=p>=100?'done':p>0?'busy':'new';
    const lab=p>=100?'Beheerst':p>0?'Bezig · '+p+'%':'Nieuw';
    const title=(LESSON_META[n]||['',''])[0];
    const sub=(LESSON_META[n]||['',''])[1]||'';
    lessons+=`<div class="lesson path-lesson ${stt}">
      <div class="path-num">${n}</div>
      <div class="path-body">
        <div class="status ${stt}">${lab} · ${mm}/${ws.length} woorden</div>
        <h3>${esc(hoofdstuk(n))} · ${esc(title)}</h3>
        <div class="blurb">${esc(sub)}</div>
        <div class="progress"><i style="width:${p}%"></i></div>
        <button class="btn btn-primary btn-sm" data-act="start-learn" data-l="${n}">${p>=100?'Herhaal hoofdstuk':'Start oefenen'}</button>
        <div class="path-alts">
          <button type="button" data-act="start-flash" data-l="${n}">🗂 Kaarten</button>
          <button type="button" data-act="start-zeg" data-l="${n}">🎤 Zeg & Harakaat</button>
          <button type="button" data-act="open-book" data-l="${n}">📖 Grammatica</button>
        </div>
      </div>
    </div>`;
  }
  return`<div class="desktop-page">
    <div class="sh">
      <div class="sh-main">
        <div class="sh-eyebrow">Woordenschat · ${m} / ${total} beheerst</div>
        <h1>Woorden per hoofdstuk</h1>
        <p>Oefen de woorden uit het Medina-boek met flashcards, meerkeuze, schrijfvragen en live uitspraakcontrole op de tanwīn en korte klinkers.</p>
      </div>
      <div class="sh-progress-box">
        <div class="sh-progress-label">Beheersing</div>
        <div class="sh-progress-pct">${pct}%</div>
        <div class="sh-progress-bar"><div class="sh-progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>

    <div class="hub-toolbar" style="margin-bottom:16px">
      <button class="btn btn-sm ${quizDir==='ar2nl'?'btn-primary':'btn-secondary'}" data-act="set-quiz-dir" data-d="ar2nl">AR → NL</button>
      <button class="btn btn-sm ${quizDir==='nl2ar'?'btn-primary':'btn-secondary'}" data-act="set-quiz-dir" data-d="nl2ar">NL → AR</button>
      <button class="btn btn-sm ${quizDir==='mix'?'btn-primary':'btn-secondary'}" data-act="set-quiz-dir" data-d="mix">Gemengd</button>
      <span class="grow"></span>
      <button class="btn btn-sm ${showPics?'btn-primary':'btn-secondary'}" data-act="toggle-pics">${showPics?'🖼 Foto\'s aan':'🖼 Foto\'s uit'}</button>
      <button class="btn btn-secondary btn-sm" data-act="nav" data-v="words">📋 Woordenlijst</button>
      <button class="btn btn-secondary btn-sm" data-act="nav" data-v="add">+ Eigen woord</button>
    </div>

    <div class="desktop-grid-2">
      ${lessons}
    </div>

    <div class="card" style="margin-top:18px">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <h3 style="font-size:16px;font-weight:700;margin-bottom:2px">Alles door elkaar oefenen</h3>
          <p style="font-size:13px;color:var(--muted)">Test jezelf over alle ${total} woorden uit hoofdstuk 1 t/m 10 tegelijk.</p>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn btn-primary btn-sm" data-act="start-learn" data-l="all">Mix oefenen</button>
          <button class="btn btn-secondary btn-sm" data-act="start-flash" data-l="all">Mix kaarten</button>
          <button class="btn btn-secondary btn-sm" data-act="start-zeg" data-l="all">Mix Zeg</button>
          ${mistakes.length?`<button class="btn btn-secondary btn-sm" data-act="start-zeg" data-l="fouten">Fouten (${mistakeStats().length})</button>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function startZegListen(w, resultEl){
  const rec=getSharedRec();
  if(!rec){
    if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='Chrome op https nodig voor microfoon.';}
    return;
  }
  const wordId=w && w.id;
  if(window._zegLock && window._zegLock===wordId) return;
  try{rec.onend=null;rec.onresult=null;rec.onerror=null}catch(e){}
  safeRecStop(rec);
  unlockAudio();
  const mush=document.querySelector('.zeg-mushaf');
  if(mush) mush.innerHTML=wrapTash(w.ar, hideText?'wait':'now');
  window._zegUntil=Date.now()+LISTEN_MS;
  window._zegDone=false;
  if(resultEl){resultEl.className='speak-result hint';resultEl.textContent='🎤 Blijf zeggen tot het groen is — tot 1 minuut'}
  const left=()=>Math.max(0, Math.ceil((window._zegUntil-Date.now())/1000));
  const stillOn=()=>!window._zegDone && state.view==='zeg' && state.current && state.current.id===wordId && !state.answered && Date.now()<=window._zegUntil;

  const succeed=(g)=>{
    if(window._zegDone) return;
    window._zegDone=true;
    try{clearTimeout(window._zegRegrade)}catch(e){}
    window._zegLock=wordId;
    state.answered=true;
    if(mush) mush.innerHTML=wrapTash(w.ar,'ok');
    if(resultEl){
      resultEl.className='speak-result ok';
      resultEl.innerHTML=zegOkHtml(g);
    }
    try{playOk()}catch(e){}
    hideCompare();
    freezeClip().then(()=>{
      stopRoll();
      try{rec.onend=null}catch(e){}
      safeRecStop(rec);
      recActive=null;
      setTimeout(()=>{ window._zegLock=null; nextZeg(true); }, 700);
    });
  };

  const timeoutFail=()=>{
    if(window._zegDone || state.view!=='zeg' || state.answered) return;
    window._zegDone=true;
    const said=lastSaid||'';
    const snap=rollSamples(2.4);
    freezeClip().then(()=>{
      const g=gradeUtterance(w.ar, said, w.id, snap, window._zegAlts||null);
      if(g.uitspraak==='juist'){ window._zegDone=false; succeed(g); return; }
      if(said && g.needEnd){
        if(mush) mush.innerHTML=wrapTash(w.ar,'haraka');
        logMistake(w,'haraka', said);
        if(resultEl){
          resultEl.className='speak-result bad';
          resultEl.innerHTML='✗ Uitgang: gehoord <b>'+esc(endLabel(g.end.heard))+'</b>, juist <b>'+esc(endLabel(g.end.cls))+'</b>. Tik Zeg en probeer opnieuw.';
        }
        showCompare(w.ar, said, 'haraka', g.end.hint||'', w, g.end);
      } else if(said){
        if(mush) mush.innerHTML=wrapTash(w.ar,'bad');
        logMistake(w,'word', said);
        if(resultEl){resultEl.className='speak-result bad'; resultEl.innerHTML='✗ Verkeerd woord — zeg <b>'+esc(w.translit||'')+'</b>. Tik Zeg.';}
        showCompare(w.ar, said, 'word', 'Zeg het hele woord, met de uitgang.', w, g.end);
      } else {
        if(mush) mush.innerHTML=wrapTash(w.ar,'wait');
        if(resultEl){resultEl.className='speak-result hint'; resultEl.textContent='Niets gehoord. Tik Zeg en lees voor.';}
      }
      try{playNo()}catch(e){}
      try{speakWord(w, true)}catch(e){}
      stopRoll();
      recActive=null;
    });
  };

  startRoll().then(()=>{
    const bind=()=>{
      if(!stillOn()){
        if(!window._zegDone && state.view==='zeg' && !state.answered) timeoutFail();
        return;
      }
      rec.lang='ar-SA';
      rec.continuous=false;
      rec.interimResults=true;
      rec.maxAlternatives=8;
      rec.onresult=(ev)=>{
        if(!stillOn()) return;
        const alts=collectAlts(ev);
        const said=(pickSaid(ev, w.ar, w) || (ev.results[ev.results.length-1]&&ev.results[ev.results.length-1][0]&&ev.results[ev.results.length-1][0].transcript) || '').trim();
        lastSaid=said;
        window._zegAlts=alts;
        const apply=()=>{
          if(!stillOn() || window._zegDone) return false;
          const snap=rollSamples(2.4);
          const g=gradeUtterance(w.ar, lastSaid, w.id, snap, window._zegAlts||alts);
          if(mush) mush.innerHTML=wrapTash(w.ar, g.uitspraak==='juist'?'ok':g.uitspraak==='fout-klank'?'haraka':g.uitspraak==='fout-woord'?'bad':'now');
          const live=document.querySelector('.said-live');
          if(live){
            if(g.uitspraak==='juist') live.textContent='klank goed';
            else if(g.uitspraak==='fout-klank' && g.heard) live.textContent='gehoord '+endLabel(g.heard);
            else if(g.uitspraak==='onzeker') live.textContent='nog niet zeker van de uitgang';
            else live.textContent='🎤 nog '+left()+'s';
          }
          if(g.uitspraak==='juist'){ succeed(g); return true; }
          if(resultEl){
            resultEl.className='speak-result hint';
            const tip=esc(w.translit||'het woord');
            if(g.uitspraak==='fout-klank') resultEl.innerHTML='Nog '+left()+'s · gehoord <b>'+esc(endLabel(g.heard))+'</b>, juist <b>'+esc(endLabel(g.want))+'</b>';
            else if(g.uitspraak==='fout-woord') resultEl.innerHTML='Nog '+left()+'s · zeg <b>'+tip+'</b>';
            else resultEl.innerHTML='Nog '+left()+'s · ik hoor het woord. Zeg de uitgang nog eens: <b>'+tip+'</b>';
          }
          return false;
        };
        if(apply()) return;
        try{clearTimeout(window._zegRegrade)}catch(e){}
        window._zegRegrade=setTimeout(()=>{ apply(); }, 380);
      };
      rec.onerror=(ev)=>{
        if(resultEl && ev.error==='not-allowed'){
          resultEl.className='speak-result bad';
          resultEl.textContent='Microfoon toestaan via het slotje (https).';
          window._zegDone=true;
        }
      };
      rec.onend=()=>{
        recActive=null;
        if(window._zegDone) return;
        const finishEnd=()=>{
          if(window._zegDone) return;
          const said=lastSaid||'';
          const snap=rollSamples(2.4);
          const g=gradeUtterance(w.ar, said, w.id, snap, window._zegAlts||null);
          if(g.uitspraak==='juist'){ succeed(g); return; }
          if(!stillOn()){
            if(!window._zegDone && state.view==='zeg' && !state.answered) timeoutFail();
            return;
          }
          if(resultEl){
            resultEl.className='speak-result hint';
            resultEl.textContent='🎤 Nog '+left()+'s — zeg het woord met de uitgang';
          }
          setTimeout(()=>{ if(stillOn()) bind(); }, 60);
        };
        try{clearTimeout(window._zegRegrade)}catch(e){}
        window._zegRegrade=setTimeout(finishEnd, 220);
      };
      recActive=rec;
      safeRecStart(rec);
    };
    setTimeout(bind, 180);
  });
}
function startZeg(sel){
  unlockAudio();
  hideCompare();
  state.path='vocab';
  state.lesson=sel==='all'?'all':(sel==='fouten'?sel:parseInt(sel));
  let all;
  if(sel==='fouten'){
    const ids=mistakeStats().map(m=>m.id).filter(Boolean);
    all=ids.map(id=>ALL.find(w=>w.id===id)).filter(Boolean);
    if(!all.length){ toast('Nog geen fouten om te oefenen.'); return; }
  }else{
    all=wordsFor(state.lesson);
  }
  state.queue=shuffle(all.slice()).slice(0, Math.min(SESSION, all.length));
  if(sel==='fouten' && state.queue.length<4){
    const extra=[];
    while(extra.length+state.queue.length<Math.min(6, SESSION) && all.length){
      extra.push(all[extra.length%all.length]);
    }
    state.queue=state.queue.concat(extra);
  }
  state.sessionLen=state.queue.length;
  state.asked=0;state.correct=0;state.answered=false;
  state.view='zeg';
  state.current=state.queue[0]||null;
  render();
}

function startLearn(sel){
  unlockAudio();
  state.path='vocab';
  state.lesson=sel==='all'?'all':parseInt(sel);
  const all=wordsFor(state.lesson);
  const fresh=all.filter(w=>getP(w.id).box<MASTERY);
  state.review=fresh.length===0;
  const src=state.review?all:fresh;
  state.queue=shuffle(src).slice(0,Math.min(SESSION,src.length));
  state.sessionLen=state.queue.length;
  state.asked=0;state.correct=0;state.answered=false;
  state.view='learn';
  if(!state.queue.length){state.view='summary';render();return}
  nextQ();
  if(autoSpeak&&state.current)speakWord(state.current);
}

function nextQ(){
  if(state.asked>=state.sessionLen||!state.queue.length){
    const t=today();
    if(streak.last!==t){
      const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
      streak.count=streak.last===y?streak.count+1:1;
      streak.last=t;saveS();
    }
    state.view='summary';render();return;
  }
  const w=state.queue[0];
  const box=getP(w.id).box;
  // Direction from user preference (mix / nl2ar / ar2nl)
  let dir=quizDir;
  if(dir==='mix')dir=Math.random()<0.5?'nl2ar':'ar2nl';
  // box 0: mostly MC, box 1+: more typed
  let type, options=null;
  if(box===0 || Math.random()<0.55){
    type = dir==='nl2ar' ? 'mc-nl2ar' : 'mc-ar2nl';
    const pool=wordsFor(state.lesson);
    const src=pool.length>=4?pool:ALL;
    const dist=shuffle(src.filter(x=>x.id!==w.id)).slice(0,3);
    options=shuffle([w,...dist]);
  }else{
    type = dir==='nl2ar' ? 'typed-nl2ar' : 'typed-ar2nl';
  }
  state.current=w;
  state.q={type,options,dir};
  state.answered=false;
  render();
  if(type && String(type).indexOf('ar2nl')>=0) setTimeout(()=>speakWord(w), 200);
}

function showFb(ok,text){
  const bar=document.getElementById('fb');const txt=document.getElementById('fb-txt');const btn=document.getElementById('fb-btn');
  if(!bar)return;
  txt.textContent=text;
  bar.className='feedback show '+(ok?'ok':'no');
  if(ok){btn.style.display='none';setTimeout(()=>continueLearn(),480)}
  else{btn.style.display='inline-flex'}
}

function handleAnswer(ok){
  if(state.answered)return;state.answered=true;
  const w=state.current;const p=getP(w.id);p.seen++;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.dataset.id===w.id)b.classList.add('correct');
    b.disabled=true;
  });
  if(ok){p.box=Math.min(MASTERY,p.box+1);p.correct++;state.correct++;playOk()}
  else{p.box=Math.max(0,p.box-1);playNo(); setTimeout(()=>speakWord(w), 280)}
  saveP();
  const msg = ok
    ? (p.box>=MASTERY?'Beheerst':'Goed')
    : w.ar+'  ·  '+w.nl;
  showFb(ok,msg);
}

function handleTyped(){
  if(state.answered)return;
  const input=document.getElementById('type-in');if(!input)return;
  state.answered=true;input.disabled=true;
  const w=state.current;
  const qtype=(state.q&&state.q.type)||'';
  const ok = qtype==='typed-nl2ar'
    ? matchAns(input.value,w.ar)
    : matchAns(input.value,w.nl,w.en);
  const p=getP(w.id);p.seen++;
  if(ok){p.box=Math.min(MASTERY,p.box+1);p.correct++;state.correct++;playOk()}
  else{p.box=Math.max(0,p.box-1);playNo()}
  saveP();
  showFb(ok,ok?(p.box>=MASTERY?'Goed — woord beheerst!':'Goed zo!'):`Juist: ${w.ar} · ${w.nl}`);
}

function handleDontKnow(){
  if(state.answered)return;state.answered=true;
  const w=state.current;const p=getP(w.id);p.seen++;p.box=Math.max(0,p.box-1);saveP();
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.id===w.id)b.classList.add('correct');b.disabled=true});
  const input=document.getElementById('type-in');if(input)input.disabled=true;
  playNo();
  showFb(false,`Juist: ${w.ar} · ${w.nl}`);
}

function continueLearn(){
  const bar=document.getElementById('fb');if(bar)bar.classList.remove('show');
  state.queue.shift();state.asked++;
  nextQ();
  if(autoSpeak&&state.current&&state.view==='learn')speakWord(state.current);
}

function romanizeAr(s){
  const map={'ا':'ā','أ':'a','إ':'i','آ':'ā','ب':'b','ت':'t','ث':'th','ج':'j','ح':'ḥ','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'ā','ة':'a','ء':'ʾ','َ':'a','ِ':'i','ُ':'u','ً':'an','ٍ':'in','ٌ':'un','ْ':'','ّ':''};
  let out='', i=0; const t=String(s||'');
  while(i<t.length){
    const ch=t[i];
    if(ch==='\u0651' && out){ // shadda: double last consonant-ish
      const last=out[out.length-1];
      out+=last; i++; continue;
    }
    out += (map[ch]!==undefined?map[ch]:(/[\s؟?،,]/.test(ch)?ch:''));
    i++;
  }
  return out.replace(/āw/g,'ū').replace(/āy/g,'ī').replace(/\s+/g,' ').trim();
}

function parseTasksFor(n){
  const k=String(n);
  if(PARSE_TASKS[k]&&PARSE_TASKS[k].length) return PARSE_TASKS[k];
  if(PARSE_TASKS[n]&&PARSE_TASKS[n].length) return PARSE_TASKS[n];
  const g=GRAMMAR[n]||GRAMMAR[k];
  const ex=(g&&g.examples)||[];
  return ex.slice(0,4).map(e=>{
    const bits=String(e.ar||'').split(/\s+/).filter(Boolean);
    return {
      ar:e.ar, nl:e.nl||'',
      parts: bits.map((t,i)=>({t, role:'w'+i, lab:(i===0?'1e woord':'woord '+(i+1))}))
    };
  }).filter(t=>t.parts.length>=2);
}

function renderParsePane(n){
  n=n||state.bookLesson;
  const tasks=parseTasksFor(n);
  if(!tasks.length){
    return `<div class="card"><p>Nog geen zinsontleding voor dit hoofdstuk.</p></div>`;
  }
  if(state.parseLesson!==n){state.parseLesson=n;state.parseI=0;state.parsePick=null;state.parseMap={};state.parseWhy=null;state.parseInfo=null;state.parseShowSent=false;}
  if(state.parseI>=tasks.length)state.parseI=0;
  const task=tasks[state.parseI];
  const map=state.parseMap||{};
  const used=new Set(Object.values(map));
  const slots=task.parts.map((p,i)=>{
    const filled=map[p.role];
    const tok=filled!=null?task.parts[filled]:null;
    const ph=tok?romanizeAr(tok.t):'';
    return `<button type="button" class="parse-slot ${tok?'filled':''} ${state.parsePick!=null?'drop':''}" data-act="parse-slot" data-role="${p.role}">
      <span class="parse-lab">${esc(p.lab)} <span class="parse-info" data-act="parse-info" data-role="${p.role}">?</span></span>
      <span class="ar parse-tok">${tok?esc(tok.t):'—'}</span>
    </button>`;
  }).join('');
  const bank=task.parts.map((p,i)=>{
    if(used.has(i)) return '';
    return `<button type="button" class="parse-chip ${state.parsePick===i?'on':''}" data-act="parse-pick" data-i="${i}">
      <span class="ar">${esc(p.t)}</span>
    </button>`;
  }).join('');
  const complete=Object.keys(map).length===task.parts.length;
  let ok=false, why='';
  if(complete){
    ok=task.parts.every((p,i)=>map[p.role]===i);
    if(!ok){
      const bits=[];
      task.parts.forEach((p,i)=>{
        const got=map[p.role];
        if(got!==i){
          const g=task.parts[got];
          bits.push(`<b>${esc(g?g.t: '?')}</b> (${esc(g?romanizeAr(g.t):'')}) hoort niet bij «${esc(p.lab)}». Juist: <b>${esc(p.t)}</b> · ${esc(p.lab)}.`);
        }
      });
      why=bits.join('<br>');
    }
  }
  let info='';
  if(state.parseInfo){
    const role=state.parseInfo;
    const part=task.parts.find(p=>p.role===role)||task.parts.find(p=>p.role.replace(/[0-9]/g,'')===role.replace(/[0-9]/g,''));
    const filled=map[role];
    const placed=filled!=null?task.parts[filled]:null;
    const term=ROLE_PH[role]||ROLE_PH[role.replace(/[0-9]/g,'')]||role;
    const lines=roleLines(role);
    const tw=tanweenLines();
    info=`<div class="parse-explain">
      <div class="ar" style="font-size:20px">${esc(lines[1]||'')}</div>
      <div class="who-phon">${esc(lines[0]||'')}</div>
      ${part?`<p class="parse-line"><span class="ar">${esc(part.t)}</span> · ${esc(romanizeAr(part.t))}</p>`:''}
      ${lines.slice(2).map(l=>`<p class="parse-line">${esc(l)}</p>`).join('')}
      <p class="parse-line parse-h">Tanwīn</p>
      ${tw.map(l=>`<p class="parse-line">${esc(l)}</p>`).join('')}
      <button type="button" class="btn btn-sm btn-ghost" data-act="parse-info-close">Sluiten</button>
    </div>`;
  } else if(state.parsePick!=null && task.parts[state.parsePick]){
    const p=task.parts[state.parsePick];
    const term=ROLE_PH[p.role]||'';
    const lines=roleLines(p.role);
    const tw=tanweenLines();
    info=`<div class="parse-explain">
      <div class="ar" style="font-size:24px">${esc(p.t)}</div>
      <div class="who-phon">${esc(romanizeAr(p.t))}</div>
      <p class="parse-line">${esc(lines[1]||'')} · ${esc(lines[0]||'')}</p>
      ${lines.slice(2).map(l=>`<p class="parse-line">${esc(l)}</p>`).join('')}
      <p class="parse-line parse-h">Tanwīn</p>
      ${tw.map(l=>`<p class="parse-line">${esc(l)}</p>`).join('')}
    </div>`;
  }
  return `
    <p class="mvp-sub">Kies een woord en plaats het in het juiste vak. Via <b>?</b> zie je de uitleg van dat zinsdeel.</p>
    <div class="card" style="margin-bottom:10px;width:100%;text-align:center">
      <button type="button" data-act="parse-sent" style="width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer">
        <div class="mvp-kicker">Zin ${state.parseI+1}/${tasks.length} · tik voor vertaling</div>
        <div class="ar ar-mark" lang="ar" style="font-size:26px;margin:8px 0">${markAr(task.ar,'plain')}</div>
      </button>
      <button type="button" class="icon-btn" data-act="speak-text" data-text="${esc(task.ar)}" aria-label="Afspelen" style="margin:0 auto 8px">${GL_ICO_SPK}</button>
      ${state.parseShowSent?`<div class="who-phon">${esc(romanizeAr(task.ar))}</div><div style="color:var(--muted);font-size:14px;margin-top:4px">${esc(task.nl)}</div>`:''}
    </div>
    ${info}
    <div class="parse-slots">${slots}</div>
    <div class="parse-bank">${bank||'<span class="blurb">Alle woorden geplaatst</span>'}</div>
    ${complete?`<div class="speak-result ${ok?'ok':'bad'}" style="display:block;margin-top:10px">${ok?'<b>Correct ontleed</b>':('<b>Nog niet juist</b><br>'+why)}</div>`:''}
    <div class="mvp-actions" style="margin-top:12px">
      <button class="btn btn-secondary btn-sm" data-act="parse-reset">Leegmaken</button>
      ${ok?`<button class="btn btn-primary btn-sm" data-act="parse-next">${state.parseI>=tasks.length-1?'Ontleden afronden ✓':'Volgende zin'}</button>`:''}
    </div>
  `;
}

/* ===== GRAMMATICA LEERPAD (stap-voor-stap) ===== */
const GL_STEPS=[
  {k:'start',l:'Overzicht'},
  {k:'uitleg',l:'Leren'},
  {k:'voorbeelden',l:'Luisteren'},
  {k:'oefenen',l:'Oefenen'},
  {k:'ontleed',l:'Ontleden'},
  {k:'klaar',l:'Afronden'}
];
const GL_TAB_LABEL={start:'Overzicht',uitleg:'Leren',voorbeelden:'Luisteren',oefenen:'Oefenen',ontleed:'Ontleden',klaar:'Afronden'};
const GL_ICO_SPK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>';
const GL_ICO_OK='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const gl2=i=>String(i).padStart(2,'0');

function glSteps(n){const gp=getGram(n);if(!gp.steps)gp.steps={};return gp.steps}

function gramPct(n){
  const g=GRAMMAR[n]; if(!g) return 0;
  const gp=getGram(n), st=gp.steps||{};
  const parts=[];
  if(glCards(n).length) parts.push(st.uitleg?1:0);
  if((g.examples||[]).length) parts.push(st.voorbeelden?1:0);
  const total=g.exercises?g.exercises.length:0;
  if(total) parts.push(Math.min(1,Object.keys(gp.answers||{}).length/total));
  if(parseTasksFor(n).length) parts.push(st.ontleed?1:0);
  if(!parts.length) return 0;
  return Math.round(100*parts.reduce((a,b)=>a+b,0)/parts.length);
}

function glMark(n,k){
  glSteps(n)[k]=true;
  getGram(n).done=gramPct(n)>=100;
  saveG();
}

function glGoto(tab){
  const n=state.bookLesson;
  state.bookTab=tab; state.view='book-lesson';
  if(tab==='ontleed') state.parseLesson=null;
  state.glRev=false;
  if(tab==='oefenen'){
    const g=GRAMMAR[n]; const t=g&&g.exercises?g.exercises.length:0;
    state.gramView=(t&&Object.keys(state.gramAnswers||{}).length>=t)?'result':'q';
  }
  if(n){const gp=getGram(n);gp.tab=tab;lastGrammar=n;saveG()}
}

const _glCache={};
function glCards(n){
  if(_glCache[n]) return _glCache[n];
  const g=GRAMMAR[n]; if(!g) return [];
  const isEx=t=>/^voorbeeld/i.test(t);
  const cards=[]; let cur=null, sec='';
  for(const b of (g.fullText||[])){
    if(b.h){ sec=/^hoofdstuk/i.test(b.h)?'':b.h; continue; }
    if(b.p){
      const t=String(b.p);
      if(cur && glPureAr(t) && !glIsVocab(t)){ cur.ps.push(t); continue; }
      const needNew=!cur || cur.ex.length>0 || (!isEx(t) && cur.ps.length>0 && !/[:：]\s*$/.test(cur.ps[cur.ps.length-1]));
      if(needNew){ cur={sec,ps:[t],ex:[]}; cards.push(cur); } else cur.ps.push(t);
    }else if(b.ar){
      if(!cur){ cur={sec,ps:[],ex:[]}; cards.push(cur); }
      cur.ex.push({ar:b.ar,nl:b.nl||''});
    }
  }
  if(!cards.length){
    (g.points||[]).forEach(p=>cards.push({sec:'',ps:[String(p)],ex:[]}));
  }
  _glCache[n]=cards;
  return cards;
}

function glIsVocab(t){return (String(t||'').match(/·/g)||[]).length>=4}
function glSplit(c){
  const t=c.ps[0]||'';
  if(glIsVocab(t)){
    const ix=t.search(/[\u0600-\u06FF]/);
    const intro=(ix>0?t.slice(0,ix):'').trim().replace(/[:：]\s*$/,'');
    const nWords=t.split('·').length;
    return {lead:(intro||'Woordenlijst')+' ('+nWords+' woorden)', rest:'', vocab:true};
  }
  const mk=t.match(/^\s*(?:\d+|[a-zA-Z])[.)]\s+/);
  const pre=mk?mk[0]:'';
  const body=t.slice(pre.length);
  const m=body.match(/^[\s\S]*?[.!?؟](?=\s|$)/);
  const lead=(pre+(m?m[0]:body)).trim();
  return {lead, rest:t.slice(pre.length+(m?m[0].length:body.length)).trim()};
}
/** Woordenlijst "ar nl · ar nl" als aanklikbare items met audio */
function glVocab(t,skipIntro){
  const ix=t.search(/[\u0600-\u06FF]/);
  const intro=ix>0?t.slice(0,ix).trim():'';
  const list=(ix>=0?t.slice(ix):t).split('·').map(s=>s.trim()).filter(Boolean);
  const chips=list.map(it=>{
    const m=it.match(/^((?:[\u0600-\u06FF\u0750-\u077F]+\s*)+)(\S[\s\S]*)?$/);
    if(!m) return `<span class="gl-chip"><small>${glMix(it)}</small></span>`;
    const ar=m[1].trim(), nl=(m[2]||'').trim();
    return `<button type="button" class="gl-chip" data-act="speak-text" data-text="${esc(ar)}" title="Afspelen"><span class="ar ar-mark" lang="ar">${markAr(ar,'plain')}</span>${nl?`<small>${glMix(nl)}</small>`:''}</button>`;
  }).join('');
  return (!skipIntro&&intro?`<p class="gl-body">${glMix(intro)}</p>`:'')+`<div class="gl-vocab">${chips}</div>`;
}
function glPara(p){
  if(glIsVocab(p)) return glVocab(p,false);
  if(glPureAr(p)) return `<div class="gl-arlist ar" lang="ar">${esc(p)}</div>`;
  return `<p class="gl-body">${glMix(p)}</p>`;
}

/** Veilig HTML maken en Arabische stukken in tekst groter/duidelijker tonen */
function glMix(s){
  return esc(String(s||'')).replace(/[\u0600-\u06FF\u0750-\u077F]+(?:[\s،؟]+[\u0600-\u06FF\u0750-\u077F]+)*/g,m=>'<span class="ar gl-ar" lang="ar">'+m+'</span>');
}
function glHasAr(s){return /[\u0600-\u06FF]/.test(String(s||''))}
function glPureAr(s){return glHasAr(s)&&!/[a-zA-Z]{2,}/.test(String(s||''))}
function glFmt(s){
  const str=String(s||'');
  if(glPureAr(str)) return `<span class="ar ar-mark" lang="ar" style="font-size:24px">${markAr(str,'plain')}</span>`;
  return glMix(str);
}

function glAvail(n){
  const g=GRAMMAR[n]||{};
  return GL_STEPS.map(s=>s.k).filter(k=>(k!=='voorbeelden'||(g.examples||[]).length)&&(k!=='oefenen'||(g.exercises||[]).length)&&(k!=='ontleed'||parseTasksFor(n).length));
}
function glNextTab(n,tab){const a=glAvail(n);const i=a.indexOf(tab);return a[Math.min(a.length-1,i+1)]||'klaar'}
function glPrevTab(n,tab){const a=glAvail(n);const i=a.indexOf(tab);return a[Math.max(0,i-1)]||'start'}

function glStepper(n,tab){
  const g=GRAMMAR[n]||{};
  const gp=getGram(n), st=gp.steps||{};
  const total=g.exercises?g.exercises.length:0;
  const answered=Object.keys(gp.answers||{}).length;
  const done={
    start:!!(st.uitleg||st.voorbeelden||answered),
    uitleg:!!st.uitleg,
    voorbeelden:!!st.voorbeelden,
    oefenen:total>0&&answered>=total,
    ontleed:!!st.ontleed,
    klaar:gramPct(n)>=100
  };
  const avail=glAvail(n);
  const list=GL_STEPS.filter(s=>avail.indexOf(s.k)>=0);
  return `<nav class="gl-steps" aria-label="Leerstappen">${list.map((s,i)=>`<button type="button" class="gl-step ${tab===s.k?'on':''} ${done[s.k]?'done':''}" data-act="book-tab" data-tab="${s.k}" ${tab===s.k?'aria-current="step"':''}><span class="gl-step-n">${gl2(i+1)}</span><span class="gl-step-l">${s.l}</span><span class="gl-step-ok">${done[s.k]?GL_ICO_OK:''}</span></button>`).join('')}</nav>`;
}

/** Gesegmenteerde voortgangsbalk (klikbaar) */
function glSegs(total,cur,act,cls){
  let out='';
  for(let i=0;i<total;i++){
    const c=cls&&cls[i]?cls[i]:(i<cur?'past':'');
    out+=`<button type="button" class="gl-seg ${i===cur?'on':''} ${c}" data-act="${act}" data-dir="set" data-i="${i}" data-iq="${i}" aria-label="Onderdeel ${i+1}"></button>`;
  }
  return `<div class="gl-segs">${out}</div>`;
}

/* ---------- Stap 0: Overzicht ---------- */
function renderGlStart(n,g,cards){
  const gp=getGram(n), st=glSteps(n);
  const exs=(g.examples||[]).length, total=g.exercises?g.exercises.length:0, parse=parseTasksFor(n).length;
  const mins=Math.max(3,Math.round(cards.length*0.8+exs*0.3+total*0.4+parse*0.5));
  const started=!!(st.uitleg||(gp.card|0)>0);
  const goals=cards.map((c,i)=>{
    let t=glSplit(c).lead||c.sec||('Voorbeelden '+(i+1));
    if(t.length>150) t=t.slice(0,147).trim()+'…';
    return `<li><button type="button" data-act="gl-card" data-dir="set" data-i="${i}"><span class="gl-goal-n">${gl2(i+1)}</span><span class="gl-goal-t">${glMix(t)}</span><span class="gl-goal-go">→</span></button></li>`;
  }).join('');
  const road=[
    ['Leren',cards.length+' regelkaarten'],
    exs?['Luisteren',exs+' voorbeelden']:null,
    total?['Oefenen',total+' vragen']:null,
    parse?['Ontleden',parse+' zinnen']:null
  ].filter(Boolean).map((r,i)=>`<div class="gl-road-item"><span class="gl-road-n">${gl2(i+1)}</span><b>${r[0]}</b><small>${esc(r[1])}</small></div>`).join('');
  const full=(g.fullText||[]).map(b=>{
    if(b.h) return `<h3 class="gl-full-h">${esc(b.h)}</h3>`;
    if(b.ar) return `<div class="ex"><div><div class="ar ar-mark" lang="ar">${markAr(b.ar,'plain')}</div><div class="nl">${esc(b.nl||'')}</div></div><button class="icon-btn" data-act="speak-text" data-text="${esc(b.ar)}" aria-label="Afspelen">${GL_ICO_SPK}</button></div>`;
    if(b.p) return glPara(String(b.p));
    return '';
  }).join('');
  return `<div class="gl-panel">
    <div class="gl-kicker">Lesoverzicht</div>
    <h2 class="gl-h">Inhoud van deze les</h2>
    <div class="gl-meta"><span>Circa ${mins} min</span><span>${cards.length} regels</span>${exs?`<span>${exs} voorbeelden</span>`:''}${total?`<span>${total} vragen</span>`:''}</div>
    <ol class="gl-goals">${goals}</ol>
    <div class="gl-sub">Leerpad</div>
    <div class="gl-road">${road}</div>
    <div class="gl-actions">
      <button type="button" class="btn btn-primary" data-act="book-tab" data-tab="uitleg" data-gl="next">${started?'Verder met leren':'Start de les'} →</button>
    </div>
    <button type="button" class="gl-fulltoggle" data-act="gl-full">${state.glFull?'Volledige lestekst verbergen':'Volledige lestekst weergeven'}</button>
    ${state.glFull?`<div class="gl-full">${full}</div>`:''}
  </div>`;
}

/* ---------- Stap 1: Leren (regelkaarten) ---------- */
function renderGlLearn(n,g,cards){
  if(!cards.length) return `<div class="gl-panel"><div class="empty">Geen uitleg beschikbaar.</div></div>`;
  let i=Math.max(0,Math.min(cards.length-1,state.glCard|0));
  const c=cards[i];
  const sp=glSplit(c);
  const last=i>=cards.length-1;
  const extra=c.ps.slice(1).map(glPara).join('');
  const ex=c.ex.map(e=>`<div class="ex">
      <div><div class="ar ar-mark" lang="ar">${markAr(e.ar,'plain')}</div>${e.nl?`<div class="nl">${glMix(e.nl)}</div>`:''}</div>
      <button class="icon-btn" data-act="speak-text" data-text="${esc(e.ar)}" aria-label="Afspelen">${GL_ICO_SPK}</button>
    </div>`).join('');
  return `<div class="gl-panel">
    <div class="gl-topline"><span class="gl-kicker">Regel ${i+1} van ${cards.length}${c.sec?' · '+esc(c.sec):''}</span></div>
    ${glSegs(cards.length,i,'gl-card')}
    <article class="gl-card">
      ${sp.lead?`<div class="gl-lead">${glMix(sp.lead)}</div>`:''}
      ${sp.vocab?glVocab(c.ps[0],true):''}
      ${sp.rest?`<p class="gl-body">${glMix(sp.rest)}</p>`:''}
      ${extra}
      ${ex?`<div class="gl-exlist">${ex}</div>`:''}
    </article>
    <div class="gl-actions">
      <button type="button" class="btn btn-secondary" data-act="gl-card" data-dir="prev" data-gl="prev">← ${i===0?'Overzicht':'Vorige'}</button>
      <button type="button" class="btn btn-primary" data-act="gl-card" data-dir="next" data-gl="next">${last?'Verder naar '+(GL_TAB_LABEL[glNextTab(n,'uitleg')]||'afronden').toLowerCase():'Volgende regel'} →</button>
    </div>
    <p class="gl-hint"><kbd>←</kbd> <kbd>→</kbd> navigeren</p>
  </div>`;
}

/* ---------- Stap 2: Luisteren (voorbeelden) ---------- */
function renderGlListen(n,g){
  const exs=g.examples||[];
  if(!exs.length) return `<div class="gl-panel"><div class="empty">Geen voorbeelden.</div></div>`;
  const i=Math.max(0,Math.min(exs.length-1,state.glEx|0));
  const e=exs[i];
  const rev=!!state.glRev;
  const last=i>=exs.length-1;
  return `<div class="gl-panel">
    <div class="gl-topline"><span class="gl-kicker">Voorbeeld ${i+1} van ${exs.length}</span></div>
    ${glSegs(exs.length,i,'gl-ex')}
    <div class="gl-ex-card">
      <div class="ar ar-mark gl-ex-ar" lang="ar">${markAr(e.ar,'plain')}</div>
      <button type="button" class="btn btn-secondary btn-sm gl-play" data-act="speak-text" data-text="${esc(e.ar)}">${GL_ICO_SPK}<span>Afspelen</span></button>
      <div class="gl-ex-reveal">
      ${rev
        ? `<div class="gl-ex-tr">${esc(romanizeAr(e.ar))}</div><div class="gl-ex-nl">${glMix(e.nl||'')}</div>`
        : `<button type="button" class="gl-reveal" data-act="gl-ex" data-dir="reveal" data-gl="reveal">Vertaling tonen</button>`}
      </div>
    </div>
    <div class="gl-actions">
      <button type="button" class="btn btn-secondary" data-act="gl-ex" data-dir="prev" data-gl="prev">← ${i===0?'Leren':'Vorige'}</button>
      <button type="button" class="btn ${rev?'btn-primary':'btn-secondary'}" data-act="gl-ex" data-dir="next" data-gl="next">${last?'Verder naar '+(GL_TAB_LABEL[glNextTab(n,'voorbeelden')]||'afronden').toLowerCase():'Volgend voorbeeld'} →</button>
    </div>
    <p class="gl-hint">Luister eerst, probeer de zin te begrijpen en toon dan de vertaling (<kbd>Spatie</kbd>).</p>
  </div>`;
}

/* ---------- Stap 3: Oefenen ---------- */
function renderGramResult(n,exercises,answers,correct){
  const total=exercises.length, pct=Math.round(100*correct/total);
  const wrong=exercises.map((e,i)=>({e,i,a:answers[i]})).filter(x=>x.a&&!x.a.ok);
  const nextTab=glNextTab(n,'oefenen');
  const verdict=pct>=80?'Beheerst':pct>=50?'Voldoende, herhaling aanbevolen':'Herhaling nodig';
  return `<div class="gl-panel gl-result">
    <div class="gl-kicker">Resultaat oefeningen</div>
    <div class="gl-score">${correct}<span>/${total}</span></div>
    <h2 class="gl-h" style="margin-bottom:4px">${verdict}</h2>
    <p class="gl-body" style="margin-bottom:18px">${pct}% correct${wrong.length?` · ${wrong.length} ${wrong.length===1?'vraag':'vragen'} om te herhalen`:' · geen fouten'}</p>
    ${wrong.length?`<div class="gl-sub">Te herhalen</div><div class="gl-wrong">${wrong.map(x=>`<button type="button" class="gl-wrong-row" data-act="gram-goto" data-i="${x.i}">
        <span class="gl-wrong-n">Vraag ${x.i+1}</span>
        <span class="gl-wrong-q">${glFmt(x.e.q)}</span>
        <span class="gl-wrong-e">${glMix(x.e.explain||'')}</span>
      </button>`).join('')}</div>`:''}
    <div class="gl-actions">
      ${wrong.length?`<button type="button" class="btn btn-secondary" data-act="gram-retry">Fouten herhalen (${wrong.length})</button>`:`<button type="button" class="btn btn-secondary" data-act="gram-goto" data-i="0">Vragen bekijken</button>`}
      <button type="button" class="btn btn-primary" data-act="book-tab" data-tab="${nextTab}" data-gl="next">Verder naar ${(GL_TAB_LABEL[nextTab]||'afronden').toLowerCase()} →</button>
    </div>
    ${wrong.length?`<button type="button" class="gl-fulltoggle" data-act="book-tab" data-tab="uitleg">Uitleg opnieuw doorlezen</button>`:''}

}

function renderGramExercise(n){
  const g=GRAMMAR[n];
  const exercises=(g&&g.exercises)||[];
  const total=exercises.length;
  if(!total)return '';
  const answers=state.gramAnswers||{};
  const answeredCount=Object.keys(answers).length;
  const correctCount=Object.values(answers).filter(a=>a.ok).length;
  if(state.gramView==='result' && answeredCount>=total) return renderGramResult(n,exercises,answers,correctCount);
  if(state.gramIdx==null||state.gramIdx<0)state.gramIdx=0;
  if(state.gramIdx>=total)state.gramIdx=total-1;
  const gi=state.gramIdx;
  const ex=exercises[gi];
  const ans=answers[gi];
  const needPic = ex.type==='pic' || !!ex.emoji;
  const pic = (needPic||showPics) ? (ex.emoji ? picHtml(ex.emoji, true) : picFromText((ex.q||'')+' '+(ex.explain||'')+' '+(ex.options||[]).join(' '), needPic)) : '';
  const arPart=(String(ex.q||'').match(/[\u0600-\u06FF][\u0600-\u06FF\u064B-\u065F\u0670\s،؟.]*/g)||[]).join(' ').trim();
  const optsHtml=ex.options.map((o,j)=>{
    const isAnswer=j===ex.answer;
    const isPicked=ans&&j===ans.oi;
    const isOptAr=glPureAr(o);
    let cls='opt'+(isOptAr?'':' opt-nl');
    if(ans){if(isAnswer)cls+=' correct';else if(isPicked)cls+=' wrong'}
    const inner=isOptAr?`<span class="ar-mark">${markAr(o,'plain')}</span>`:glFmt(o);
    return `<button class="${cls}" data-act="gram-answer" data-qi="${gi}" data-oi="${j}" data-ok="${isAnswer}" ${ans?'disabled':''}><span class="opt-key">${j+1}</span>${inner}</button>`;
  }).join('');
  const isLast=gi>=total-1;
  const allDone=answeredCount>=total;
  const nextLbl=!isLast?(ans?'Volgende vraag':'Overslaan'):(allDone?'Resultaat bekijken':'Naar onbeantwoorde vraag');
  const segCls=exercises.map((_,k)=>{const a=answers[k];return a?(a.ok?'ok':'bad'):''});
  const segsHtml=glSegs(total,gi,'gram-goto',segCls).replace(/data-act="gram-goto" data-dir="set" data-i="(\d+)" data-iq="\d+"/g,'data-act="gram-goto" data-i="$1"');
  return `<div class="gl-panel">
    <div class="gl-topline">
      <span class="gl-kicker">Vraag ${gi+1} van ${total}</span>
      <span class="gl-score-mini">${correctCount} van ${answeredCount} correct</span>
    </div>
    ${segsHtml}
    <div class="gl-q">
      ${pic?`<div class="q-pic gram-pic">${pic}</div>`:''}
      <div class="gl-q-text">
        <span>${glFmt(ex.q)}</span>
        ${arPart?`<button type="button" class="icon-btn" data-act="speak-text" data-text="${esc(arPart)}" aria-label="Afspelen">${GL_ICO_SPK}</button>`:''}
      </div>
      <div class="options" style="grid-template-columns:1fr">${optsHtml}</div>
      ${ans?`<div class="gl-fb ${ans.ok?'ok':'no'}"><b>${ans.ok?'Correct':'Onjuist'}</b><span>${glMix(ex.explain||'')}</span>${ans.ok?'':`<button type="button" class="gl-link" data-act="book-tab" data-tab="uitleg">Uitleg herlezen</button>`}</div>`:''}
    </div>
    <div class="gl-actions">
      <button type="button" class="btn btn-secondary" data-act="gram-prev" data-gl="prev" ${gi===0?'disabled':''}>← Vorige</button>
      <button type="button" class="btn btn-primary" data-act="gram-next" data-gl="next">${nextLbl} →</button>
    </div>
    <div class="gl-toolbar"><span>Afbeeldingen bij vragen</span><button type="button" class="gl-switch ${showPics?'on':''}" data-act="toggle-pics" role="switch" aria-checked="${showPics?'true':'false'}" aria-label="Afbeeldingen"><i></i></button></div>
    <p class="gl-hint"><kbd>1</kbd>–<kbd>4</kbd> antwoord kiezen · <kbd>Enter</kbd> volgende</p>
  </div>`;
}

/* ---------- Stap 5: Afronden ---------- */
function renderGlDone(n,g,cards){
  const gp=getGram(n), st=glSteps(n);
  const pct=gramPct(n);
  const total=g.exercises?g.exercises.length:0;
  const answers=gp.answers||{};
  const answered=Object.keys(answers).length;
  const correct=Object.values(answers).filter(a=>a.ok).length;
  const nums=lessonNums(); const idx=nums.indexOf(Number(n));
  const nextN=(idx>=0&&idx<nums.length-1)?nums[idx+1]:null;
  const hasParse=parseTasksFor(n).length>0;
  const rows=[
    cards.length?['uitleg','Regels doorgenomen',!!st.uitleg,st.uitleg?cards.length+' kaarten':'nog niet afgerond']:null,
    (g.examples||[]).length?['voorbeelden','Voorbeelden beluisterd',!!st.voorbeelden,st.voorbeelden?(g.examples.length+' voorbeelden'):'nog niet afgerond']:null,
    total?['oefenen','Oefeningen',answered>=total,answered>=total?(correct+' van '+total+' correct'):(answered+' van '+total+' beantwoord')]:null,
    hasParse?['ontleed','Zinsontleding',!!st.ontleed,st.ontleed?'afgerond':'nog niet afgerond']:null
  ].filter(Boolean).map(r=>`<button type="button" class="gl-check ${r[2]?'done':''}" data-act="book-tab" data-tab="${r[0]}"><span class="gl-check-ic">${r[2]?GL_ICO_OK:''}</span><span class="gl-check-t">${r[1]}</span><span class="gl-check-m">${esc(r[3])}</span></button>`).join('');
  const recap=cards.map(c=>glSplit(c).lead).filter(Boolean).map(t=>`<li>${glMix(t.length>180?t.slice(0,177).trim()+'…':t)}</li>`).join('');
  return `<div class="gl-panel gl-done">
    <div class="gl-kicker">${pct>=100?'Les voltooid':'Voortgang van deze les'}</div>
    <div class="gl-score">${pct}<span>%</span></div>
    <h2 class="gl-h" style="margin-bottom:16px">${pct>=100?esc(hoofdstuk(n))+' is afgerond':'Nog niet volledig afgerond'}</h2>
    <div class="gl-checks">${rows}</div>
    ${recap?`<div class="gl-sub">Samenvatting van ${esc(hoofdstuk(n))}</div><ol class="gl-recap">${recap}</ol>`:''}
    <div class="gl-actions">
      <button type="button" class="btn btn-secondary" data-act="start-learn" data-l="${n}">Woorden oefenen (H${n})</button>
      ${nextN?`<button type="button" class="btn btn-primary" data-act="open-book" data-l="${nextN}" data-tab="start" data-gl="next">Volgende les: ${esc(hoofdstuk(nextN))} →</button>`:`<button type="button" class="btn btn-primary" data-act="book-list" data-gl="next">Alle hoofdstukken</button>`}
    </div>
  </div>`;
}

  else if(tab==='uitleg') panel=renderGlLearn(n,g,cards);

function render(){
  const app=document.getElementById('app');
  document.body.classList.remove('hide-tab');
  let html='';
  if(state.view==='home')html=renderHome();
  else if(state.view==='flash')html=renderFlash();
  else if(state.view==='learn')html=renderLearn();
  else if(state.view==='zeg')html=renderZeg();
  else if(state.view==='summary')html=renderSummary();
  else if(state.view==='words')html=renderWords();
  else if(state.view==='add')html=renderAdd();
  else if(state.view==='book')html=renderBook();
  else if(state.view==='book-lesson')html=renderBookLesson();
  else if(state.view==='vocab')html=renderVocabHub();
  else if(state.view==='conv')html=renderConv();
  else if(state.view==='conv-unit')html=renderConvUnit();
  else if(state.view==='settings')html=renderSettings();
  else if(state.view==='mistakes')html=renderMistakes();
  app.innerHTML=appHeader()+html+((state.view==='vocab'||state.view==='book'||state.view==='conv')?`<button type="button" class="theme-fab" data-act="toggle-theme" aria-label="Thema">${darkMode?'☀️':'🌙'}</button>`:'');
  const sbHost=document.getElementById('sidebar-host');
  if(sbHost) sbHost.innerHTML=renderSidebar();
  const tbHost=document.getElementById('topbar-host');
  if(tbHost) tbHost.innerHTML=renderTopbar();
  const host=document.getElementById('tabbar-host');
  if(host) host.innerHTML=tabbar();
  if(state.view==='zeg') setTimeout(autoZegListen, 400);
  if(state.view==='flash' && state.pool && state.pool[state.idx] && (state.flipped?(flashDir==='nl2ar'):(flashDir!=='nl2ar'))) setTimeout(()=>speakWord(state.pool[state.idx]), 180);
  // Remove leftover focus/caret from previous view
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}catch(e){}
  if(state.view==='learn'){
    const input=document.getElementById('type-in');
    if(input && !state.answered){
      // only focus when user should type — prevents caret flash on MC questions
      setTimeout(()=>{try{input.focus()}catch(e){}},30);
      input.addEventListener('keydown',e=>{if(e.key==='Enter')handleTyped()});
    }
  }
  if(state.view==='words'){
    const s=document.getElementById('wl-q');
    if(s){
      s.addEventListener('input',()=>{
        state.searchQ=s.value;
        clearTimeout(window._wlT);
        window._wlT=setTimeout(()=>{
          const keep=document.getElementById('wl-q');
          const pos=keep?keep.selectionStart:null;
          render();
          const s2=document.getElementById('wl-q');
          if(s2){
            s2.focus();
            if(pos!=null){try{s2.setSelectionRange(pos,pos)}catch(e){}}
          }
        },180);
      });
    }
  }
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape'){
    const cmp=document.getElementById('cmp-host');
    if(cmp&&cmp.innerHTML){hideCompare();return}
    if(state.view==='flash'||state.view==='learn'||state.view==='zeg'||state.view==='words'||state.view==='add'){
      stopAllMedia();state.view='vocab';state.path='vocab';render();return;
    }
    if(state.view==='book-lesson'){
      stopAllMedia();state.view='book';state.path='grammar';state.bookLesson=null;render();return;
    }
    if(state.view==='conv-unit'){
      stopAllMedia();state.view='conv';state.path='conv';state.convUnit=null;render();return;
    }
  }
  if(state.view==='flash'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();state.flipped=!state.flipped;render();return}
    if(e.key==='ArrowRight'){state.idx=Math.min(state.pool.length-1,state.idx+1);state.flipped=false;render();return}
    if(e.key==='ArrowLeft'){state.idx=Math.max(0,state.idx-1);state.flipped=false;render();return}
    if(e.key==='r'||e.key==='R'){if(state.pool&&state.pool[state.idx])speakWord(state.pool[state.idx],true);return}
  }
  if(state.view==='learn'){
    const bar=document.getElementById('fb');
    if(e.key==='Enter' && bar && bar.classList.contains('show')){e.preventDefault();continueLearn();return}
    if(!state.answered && ['1','2','3','4'].includes(e.key)){
      const opts=document.querySelectorAll('.qcard .opt');
      const btn=opts[parseInt(e.key,10)-1];
      if(btn && !btn.disabled){e.preventDefault();btn.click();return}
    }
    if(e.key==='r'||e.key==='R'){if(state.current)speakWord(state.current,true);return}
  }
  if(state.view==='book-lesson' && state.bookTab==='oefenen'){
    if(['1','2','3','4'].includes(e.key)){
      const opts=document.querySelectorAll('.lesson-pane.active .opt');
      const btn=opts[parseInt(e.key,10)-1];
      if(btn && !btn.disabled){e.preventDefault();btn.click();return}
    }
    if(e.key==='ArrowRight'){
      const nextBtn=document.querySelector('[data-act="gram-next"]:not(:disabled)');
      if(nextBtn){e.preventDefault();nextBtn.click();return}
    }
    if(e.key==='ArrowLeft'){
      const prevBtn=document.querySelector('[data-act="gram-prev"]:not(:disabled)');
      if(prevBtn){e.preventDefault();prevBtn.click();return}
    }
  }
  if(state.view==='book-lesson'){
    const onBtn=e.target&&e.target.closest&&e.target.closest('button');
    if(!(onBtn&&(e.key==='Enter'||e.key===' '))){
      const q=sel=>document.querySelector(sel);
      if(e.key==='ArrowRight'||e.key==='Enter'){const nb=q('.gl-panel [data-gl="next"]:not(:disabled)');if(nb){e.preventDefault();nb.click();return}}
      if(e.key==='ArrowLeft'){const pb=q('.gl-panel [data-gl="prev"]:not(:disabled)');if(pb){e.preventDefault();pb.click();return}}
      if(e.key===' '&&state.bookTab==='voorbeelden'){const rb=q('[data-gl="reveal"]');if(rb){e.preventDefault();rb.click();return}}
    }
  }
});

/* ===== SWIPE NAVIGATION (mobiel) ===== */
let touchStartX=0, touchStartY=0, touchStartTime=0, touchTracking=false, touchSwiping=false;

function onSwipe(dir){
  if(state.view==='flash'){
    const pool=state.pool;if(!pool||!pool.length)return;
    if(dir==='left'){
      if(state.idx<pool.length-1){state.idx++;state.flipped=false;render();if(autoSpeak&&pool[state.idx])speakWord(pool[state.idx])}
    }else{
      if(state.idx>0){state.idx--;state.flipped=false;render();if(autoSpeak&&pool[state.idx])speakWord(pool[state.idx])}
    }
  }else if(state.view==='book-lesson'){
    const g=GRAMMAR[state.bookLesson];
    if(state.bookTab==='oefenen'){
      const total=g&&g.exercises?g.exercises.length:0;
      if(!total)return;
      if(dir==='left'){if((state.gramIdx||0)<total-1){state.gramIdx=(state.gramIdx||0)+1;render()}}
      else{if((state.gramIdx||0)>0){state.gramIdx=(state.gramIdx||0)-1;render()}}
    }else if(state.bookTab==='uitleg'||state.bookTab==='voorbeelden'){
      const sb=document.querySelector('.gl-panel [data-gl="'+(dir==='left'?'next':'prev')+'"]');
      if(sb) sb.click();
    }
  }
}

document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const v=state&&state.view;
  if(v!=='flash' && v!=='learn' && v!=='book-lesson'){touchTracking=false;return}
  const t=e.touches[0];
  touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now();
  touchTracking=true;touchSwiping=false;
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!touchTracking)return;
  const t=e.touches[0];
  const dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
  if(!touchSwiping && Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.3){
    touchSwiping=true;
  }
},{passive:true});

document.addEventListener('touchend',e=>{
  const wasSwipe=touchSwiping;
  touchTracking=false;touchSwiping=false;
  if(!wasSwipe)return;
  const target=e.target;
  if(target&&target.closest&&target.closest('input,textarea,select,.type-row,.lesson-tabs,.tabbar,.app-header'))return;
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  if(dt>900)return;
  if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy))return;
  onSwipe(dx<0?'left':'right');
},{passive:true});

load();primeVoices();render();
</script>
