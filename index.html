const GRAMMAR = {"1":{"title":"هَذَا · tanwien · vragen met أَ","summary":"Hoofdstuk 1 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het volgende:","1. Het woord هَذَا wordt uitgesproken als «haadhaa», maar dit woord wordt zonder de eerste alif geschreven. Het woord هَذَا betekent «dit» of «deze».","2. Het Arabisch heeft geen woord dat overeenkomt met het Nederlandse woord «is», dat wil zeggen dat het Arabisch dit koppelwerkwoord niet heeft.","3. Er is geen woord in het Arabisch dat overeenkomt met het Nederlandse woord «een», zoals in de zin: «Dit is een boek.»","De n-klank aan het eind van het Arabische naamwoord (kitaabu-n, baytu-n, masjidu-n) is het Arabische onbepaald lidwoord dat overeenkomt met het Nederlandse onbepaald lidwoord «een». Deze n-klank wordt tanwien genoemd.","4. Een zin verandert in een vraag wanneer het partikel أَ aan het begin van de zin staat.","نَجْمٌ een ster · قِطٌّ een kat · سَرِيرٌ een bed · حِمَارٌ een ezel · قَلَمٌ een pen · رَجُلٌ een man · بَيْتٌ een huis · دِيكٌ een haan · بَابٌ een deur · كَلْبٌ een hond · كُرْسِيٌّ een stoel · حِصَانٌ een paard · كِتَابٌ een boek · مُدَرِّسٌ een leraar · قَمِيصٌ een hemd · جَمَلٌ een kameel · طَبِيبٌ een dokter · طَالِبٌ een student · مِفْتَاحٌ een sleutel · مِنْدِيلٌ een zakdoek · مَكْتَبٌ een bureau · تَاجِرٌ een handelaar · مَسْجِدٌ een moskee · وَلَدٌ een kind, jongen"],"examples":[{"ar":"مَا هَذَا؟","nl":"Wat is dit?"},{"ar":"هَذَا كِتَابٌ.","nl":"Dit is een boek."},{"ar":"أَهَذَا بَيْتٌ؟","nl":"Is dit een huis?"},{"ar":"نَعَمْ، هَذَا بَيْتٌ.","nl":"Ja, dit is een huis."},{"ar":"لَا، هَذَا مَسْجِدٌ.","nl":"Nee, dit is een moskee."},{"ar":"مَنْ هَذَا؟","nl":"Wie is dit?"}],"exercises":[{"type":"pic","emoji":"🏠","q":"مَا هَذَا؟","options":["هَذَا بَيْتٌ","هَذَا مَسْجِدٌ","هَذَا بَابٌ","هَذَا كِتَابٌ"],"answer":0,"explain":"هَذَا بَيْتٌ = Dit is een huis."},{"type":"pic","emoji":"🕌","q":"مَا هَذَا؟","options":["هَذَا بَيْتٌ","هَذَا مَسْجِدٌ","هَذَا ق plain":"لَا = nee."},{"q":"Welke zin is correct voor «Dit is een moskee»?","options":["هَذَا مَسْجِدٌ","مَسْجِدٌ هَذَا","أَهَذَا مَسْجِدٌ","مَا مَسْجِدٌ"],"answer":0,"explain":"هَذَا + naamwoord met tanwien."},{"q":"مَنْ هَذَا؟ vraag je als je…","options":["naar een ding wijst","naar een persoon vraagt","een ja/nee-vraag stelt","«en» wilt zeggen"],"answer":1,"explain":"مَنْ = wie."}],"fullText":[{"h":"Hoofdstuk 1"},{"p":"In deze les leren we het volgende:"},{"ar":"مَا هَذَا؟","nl":"Wat is dit?"},{"ar":"هَذَا كِتَابٌ.","nl":"Dit is een boek."},{"ar":"أَهَذَا بَيْتٌ؟","nl":"Is dit een huis?"},{"ar":"نَعَمْ، هَذَا بَيْتٌ.","nl":"Ja, dit is een huis."},{"ar":"لَا، هَذَا مَسْجِدٌ.","nl":"Nee, dit is een moskee."},{"ar":"مَنْ هَذَا؟","nl":"Wie is dit?"},{"h":"Merk op"},{"p":"1. Het woord هَذَا wordt uitgesproken als «haadhaa», maar dit woord wordt zonder de eerste alif geschreven. Het woord هَذَا betekent «dit» of «deze»."},{"p":"2. Het Arabisch heeft geen woord dat overeenkomt met het Nederlandse woord «is», dat wil zeggen dat het Arabisch dit koppelwerkwoord niet heeft."},{"p":"3. Er is geen woord in het Arabisch dat overeenkomt met het Nederlandse woord «een», zoals in de zin: «Dit is een boek.»"},{"p":"De n-klank aan het eind van het Arabische naamwoord (kitaabu-n, baytu-n, masjidu-n) is het Arabische onbepaald lidwoord dat overeenkomt met het Nederlandse onbepaald lidwoord «een». Deze n-klank wordt tanwien genoemd."},{"p":"4. Een zin verandert in een vraag wanneer het partikel أَ aan het begin van de zin staat."},{"p":"Voorbeeld:"},{"ar":"هَذَا بَيْتٌ.","nl":"Dit is een huis."},{"ar":"أَهَذَا بَيْتٌ؟","nl":"Is dit een huis?"},{"h":"Woordenlijst van hoofdstuk 1"},{"p":"نَجْمٌ een ster · قِطٌّ een kat · سَرِيرٌ een bed · حِمَارٌ een ezel · قَلَمٌ een pen · رَجُلٌ een man · بَيْتٌ een huis · دِيكٌ een haan · بَابٌ een deur · كَلْبٌ een hond · كُرْسِيٌّ een stoel · حِصَانٌ een paard · كِتَابٌ een boek · مُدَرِّسٌ een leraar · قَمِيصٌ een hemd · جَمَلٌ een kameel · طَبِيبٌ een dokter · طَالِبٌ een student · مِفْتَاحٌ een sleutel · مِنْدِيلٌ een zakdoek · مَكْتَبٌ een bureau · تَاجِرٌ een handelaar · مَسْجِدٌ een moskee · وَلَدٌ een kind, jongen"}]},"2":{"title":"ذَلِكَ · وَ","summary":"Hoofdstuk 2 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het gebruik van ذَلِكَ en وَ.","Het woord ذَلِكَ betekent: «die», «dat».","Het woord وَ betekent: «en».","1. Het woord ذَلِكَ wordt uitgesproken als «dhaalika». Maar dit woord wordt zonder de eerste alif geschreven.","2. Het woord وَ wordt vlak bij het volgende woord geschreven. Met andere woorden: er komt geen spatie na het woord وَ.","حَجَرٌ een steen · سُكَّرٌ suiker · إِمَامٌ een imam · لَبَنٌ melk, yoghurt"],"examples":[{"ar":"هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ.","nl":"Dit is een huis en dat is een moskee."},{"ar":"هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ.","nl":"Dit is een pen en dat is een boek."},{"ar":"أَذَلِكَ مِفْتَاحٌ؟","nl":"Is dat een sleutel?"},{"ar":"مَا ذَلِكَ؟","nl":"Wat is dat?"}],"exercises":[{"type":"pic","emoji":"🏠","q":"هَذَا بَيْتٌ وَ… مَسْجِدٌ. Wat past?","options":["هَذَا","ذَلِكَ","مَا","نَعَمْ"],"answer":1,"explain":"Verder weg → ذَلِكَ مَسْجِدٌ."},{"type":"pic","emoji":"🖊️","q":"«Dit is een pen en dat is een boek»","options":["هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ","هَذَا كِتَابٌ وَذَلِكَ قَلَمٌ","ذَلِكَ قَلَمٌ وَهَذَا كِتَابٌ","هَذَا قَلَمٌ هَذَا كِتَابٌ"],"answer":0,"explain":"هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ."},{"q":"Welk woord gebruik je voor «dat» (verder weg, mannelijk)?","options":["هَذَا","ذَلِكَ","هَذِهِ","تِلْكَ"],"answer":1,"explain":"ذَلِكَ = die/dat (m, verder)."},{"q":"Hoe schrijf je «en» in het Arabisch?","options":["Los woord met spaties eromheen","وَ vast tegen het volgende woord","Alleen aan het eind van de zin","Met tanwien"],"answer":1,"explain":"وَ plakt vast aan het volgende woord."},{"q":"هَذَا is voor iets…","options":["verder weg","dichtbij","vrouwelijks","meervoud"],"answer":1,"explain":"هَذَا = dichtbij (m)."},{"q":"ذَلِكَ is voor iets…","options":["dichtbij","verder weg","alleen mensen","alleen vragen"],"answer":1,"explain":"ذَلِكَ = verder weg (m)."},{"q":"Welke zin klopt?","options":["هَذَا بَيْتٌ وَ ذَلِكَ مَسْجِدٌ (met spatie na وَ)","هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ","هَذَا بَيْتٌ ذَلِكَ مَسْجِدٌ","وَهَذَا بَيْتٌ ذَلِكَ"],"answer":1,"explain":"وَ plakt vast: وَذَلِكَ."},{"q":"وَ betekent…","options":["of","maar","en","in"],"answer":2,"explain":"وَ = en."},{"q":"Wat betekent: هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ؟","options":["Dit is een moskee en dat is een huis.","Dit is een huis en dat is een moskee.","Dit is een huis en dit is een moskee.","Dat is een huis en dat is een moskee."],"answer":1,"explain":"هَذَا (dit) بَيْتٌ (een huis) وَ (en) ذَلِكَ (dat) مَسْجِدٌ (een moskee)."},{"q":"Wat betekent: هَذَا قَلَمٌ وَذَلِكَ كِتَابٌ؟","options":["Dit is een pen en dat is een boek.","Dit is een boek en dat is een pen.","Dat is een pen en dit is een boek.","Dit is een sleutel en dat is een deur."],"answer":0,"explain":"هَذَا قَلَمٌ = dit is een pen, وَذَلِكَ كِتَابٌ = en dat is een boek."},{"q":"Wat betekent: أَذَلِكَ مِفْتَاحٌ؟","options":["Wat is dat?","Is dit een sleutel?","Is dat een sleutel?","Ja, dat is een sleutel."],"answer":2,"explain":"أَ (vraagpartikel) + ذَلِكَ (dat) + مِفْتَاحٌ (een sleutel) = Is dat een sleutel?"},{"q":"Wat betekent: نَعَمْ، ذَلِكَ مِفْتَاحٌ؟","options":["Nee, dat is een pen.","Ja, dit is een sleutel.","Is dat een sleutel?","Ja, dat is een sleutel."],"answer":3,"explain":"نَعَمْ = ja, ذَلِكَ مِفْتَاحٌ = dat is een sleutel."}],"fullText":[{"h":"Hoofdstuk 2"},{"p":"In deze les leren we het gebruik van ذَلِكَ en وَ."},{"p":"Het woord ذَلِكَ betekent: «die», «dat»."},{"p":"Het woord وَ betekent: «en»."},{"p":"Voorbeeld:"},{"ar":"هَذَا بَيْتٌ وَذَلِكَ مَسْجِدٌ.","nl":"Dit is een huis en dat is een moskee."},{"h":"Merk op"},{"p":"1. Het woord ذَلِكَ wordt uitgesproken als «dhaalika». Maar dit woord wordt zonder de eerste alif geschreven."},{"p":"2. Het woord وَ wordt vlak bij het volgende woord geschreven. Met andere woorden: er komt geen spatie na het woord وَ."},{"h":"Woordenlijst van hoofdstuk 2"},{"p":"حَجَرٌ een steen · سُكَّرٌ suiker · إِمَامٌ een imam · لَبَنٌ melk, yoghurt"}]},"3":{"title":"ال · zonne- en maanletters","summary":"Hoofdstuk 3 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het gebruik van het Arabische bepaald lidwoord «al» (ال) dat overeenkomt met de Nederlandse lidwoorden «de» en «het». Wanneer het bepaald lidwoord «al» voorafgaat aan een naamwoord, dan vervalt het onbepaald lidwoord «-n».","Het Arabische alfabet bestaat uit 28 letters. Hiervan worden 14 letters zonneletters genoemd, en de overige 14 worden maanletters genoemd. Bij het uitspreken van de zonneletters wordt de punt van de tong gebruikt, zoals bij t, n, r, s. De punt van de tong speelt geen enkele rol bij het uitspreken van de maanletters, zoals bij b, w, m, k.","Wanneer «al» (ال) voorafgaat aan het begin van een naamwoord dat met een zonneletter begint, dan assimileert de «l» van «al» aan de zonneletter.","Een dergelijke assimilatie vindt niet plaats bij de maanletters.","Meer voorbeelden van de assimilatie van de «l» van «al» aan de zonneletters:","Merk op dat de «a» van «al» alleen wordt uitgesproken wanneer het niet vooraf wordt gegaan door een ander woord. De «a» van «al» wordt achterwege gelaten wanneer «al» vooraf wordt gegaan door een woord, alhoewel het in schrift blijft staan.","Om deze weglating in de uitspraak aan te geven, wordt het teken (ٱ) boven de hamzah geplaatst. De eerste klinker (a, i of u) die wordt weggelaten wanneer het vooraf wordt gegaan door een woord, wordt hamzat al-waṣl (هَمْزَةُ الْوَصْلِ) — de hamzah van de verbinding — genoemd.","We hebben geleerd dat de tanwien het onbepaald lidwoord is. Het bepaald lidwoord is «al». Een naamwoord is ofwel bepaald ofwel onbepaald. Het kan niet beide tegelijk zijn.","ت ث د ذ ر ز س ش ص ض ط ظ ل ن","أ ب ج ح خ ع غ ف ق ك م و ه ي","Antoniemen (× = tegengestelde): غَنِيٌّ rijk × فَقِيرٌ arm · طَوِيلٌ lang × قَصِيرٌ kort · خَفِيفٌ licht × ثَقِيلٌ zwaar · صَغِيرٌ klein × كَبِيرٌ groot · بَارِدٌ koud × حَارٌّ heet · جَالِسٌ zittend × وَاقِفٌ staand · نَظِيفٌ schoon × وَسِخٌ vies · قَرِيبٌ dichtbij × بَعِيدٌ ver · جَدِيدٌ nieuw × قَدِيمٌ oud · جَمِيلٌ mooi · الْمَاءُ het water · حُلْوٌ zoet · الدُّكَّانُ de winkel · التُّفَّاحُ de appel · الْوَرَقُ het papier"],"examples":[{"ar":"بَيْتٌ → الْبَيْتُ","nl":"een huis → het huis"},{"ar":"الشَّمْسُ","nl":"de zon (ash-shams)"},{"ar":"الْقَمَرُ","nl":"de maan (al-qamar)"},{"ar":"الرَّجُلُ","nl":"de man (ar-rajul)"},{"ar":"الْبَابُ مَفْتُوحٌ.","nl":"De deur is open."},{"ar":"الْقَلَمُ مَكْسُورٌ.","nl":"De pen is gebroken."}],"exercises":[{"type":"pic","emoji":"🏠","q":"«een huis» → «het huis»","options":["بَيْتٌ → الْبَيْتُ","بَيْتٌ → بَيْتُ ال","الْبَيْتُ → بَيْتٌ","بَيْتٌ → بَيْتٌ"],"answer":0,"explain":"ال + tanwien weg."},{"type":"pic","emoji":"☀️","q":"الشَّمْسُ spreek je uit als…","options":["al-shams","ash-shams","as-shams zonder sh","shams"],"answer":1,"explain":"Zonneletter ش → ash-shams."},{"type":"pic","emoji":"🌙","q":"الْقَمَرُ spreek je uit als…","options":["aq-qamar","al-qamar","ar-qamar","qamar"],"answer":1,"explain":"Maanletter → al-qamar."},{"q":"Wat gebeurt er met de tanwien als je ال zet?","options":["Niets","De tanwien verdwijnt","De tanwien verdubbelt","Hij wordt een fathah"],"answer":1,"explain":"ال vervangt de tanwien: بَيْتٌ → الْبَيْتُ."},{"q":"Bij een zonneletter…","options":["blijft de ل hoorbaar","smelt de ل samen (shaddah)","valt ال helemaal weg","komt er tanwien bij"],"answer":1,"explain":"Bij zonneletters assimileert ل: ash-shams."},{"q":"Wat betekent: الْبَابُ مَفْتُوحٌ؟","options":["De deur is gesloten.","De deur is open.","Een open deur.","Het huis is nieuw."],"answer":1,"explain":"الْبَابُ (de deur) + مَفْتُوحٌ (is open)."},{"q":"بَيْتٌ met ال wordt…","options":["بَيْتٌ ال","الْبَيْتُ","الْبَيْتٌ","بَيْتُ ال"],"answer":1,"explain":"ال + woord, tanwien weg: الْبَيْتُ."},{"q":"Wat betekent: الْقَلَمُ مَكْسُورٌ؟","options":["De pen is nieuw.","Een gebroken pen.","De pen is gebroken.","Het boek is oud."],"answer":2,"explain":"الْقَلَمُ (de pen) + مَكْسُورٌ (is gebroken)."},{"q":"الرَّجُلُ (zonneletter ر) spreek je uit als…","options":["al-rajul","ar-rajul","a-rajul","rajul"],"answer":1,"explain":"Zonneletter ر → ar-rajul."},{"q":"Na وَ valt de a van ال in de uitspraak weg. Klopt dat?","options":["Ja","Nee"],"answer":0,"explain":"Ja: wal-bayt, niet wa al-bayt."},{"q":"Welke letter is een zonneletter?","options":["ب","م","ش","ك"],"answer":2,"explain":"ش is een zonneletter (ash-…)."}],"fullText":[{"h":"Hoofdstuk 3"},{"p":"In deze les leren we het gebruik van het Arabische bepaald lidwoord «al» (ال) dat overeenkomt met de Nederlandse lidwoorden «de» en «het». Wanneer het bepaald lidwoord «al» voorafgaat aan een naamwoord, dan vervalt het onbepaald lidwoord «-n»."},{"p":"Voorbeeld:"},{"ar":"بَيْتٌ → الْبَيْتُ","nl":"baitun → al-baytu"},{"p":"Het Arabische alfabet bestaat uit 28 letters. Hiervan worden 14 letters zonneletters genoemd, en de overige 14 worden maanletters genoemd. Bij het uitspreken van de zonneletters wordt de punt van de tong gebruikt, zoals bij t, n, r, s. De punt van de tong speelt geen enkele rol bij het uitspreken van de maanletters, zoals bij b, w, m, k."},{"p":"Wanneer «al» (ال) voorafgaat aan het begin van een naamwoord dat met een zonneletter begint, dan assimileert de «l» van «al» aan de zonneletter."},{"p":"Voorbeeld: al-shamsu (de zon) wordt uitgesproken als ash-shamsu. In de spelling vindt er geen verandering plaats: الشَّمْسُ. De assimilatie wordt aangegeven met de shaddah op de eerste letter van het naamwoord."},{"p":"Een dergelijke assimilatie vindt niet plaats bij de maanletters."},{"p":"Voorbeeld: al-qamaru (de maan) wordt uitgesproken als al-qamaru: الْقَمَرُ."},{"p":"Meer voorbeelden van de assimilatie van de «l» van «al» aan de zonneletters:"},{"ar":"النَّجْمُ","nl":"an-najmu (de ster)"},{"ar":"الرَّجُلُ","nl":"ar-rajulu (de man)"},{"ar":"الدِّيكُ","nl":"ad-dīku (de haan)"},{"ar":"السَّمَكُ","nl":"as-samaku (de vis)"},{"p":"Merk op dat de «a» van «al» alleen wordt uitgesproken wanneer het niet vooraf wordt gegaan door een ander woord. De «a» van «al» wordt achterwege gelaten wanneer «al» vooraf wordt gegaan door een woord, alhoewel het in schrift blijft staan."},{"p":"Voorbeeld: al-baytu — hier wordt de «a» uitgesproken. Maar als het vooraf wordt gegaan door «wa» (وَ), dat «en» betekent, dan wordt de «a» achterwege gelaten. De woorden worden dan uitgesproken als wal-baytu, en niet als: wa al-baytu."},{"p":"Om deze weglating in de uitspraak aan te geven, wordt het teken (ٱ) boven de hamzah geplaatst. De eerste klinker (a, i of u) die wordt weggelaten wanneer het vooraf wordt gegaan door een woord, wordt hamzat al-waṣl (همزة الوصل) — de hamzah van de verbinding — genoemd."},{"p":"Voorbeelden:"},{"ar":"الْبَابُ مَفْتُوحٌ.","nl":"De deur is open."},{"ar":"الْقَلَمُ مَكْسُورٌ.","nl":"De pen is gebroken."},{"p":"We hebben geleerd dat de tanwien het onbepaald lidwoord is. Het bepaald lidwoord is «al». Een naamwoord is ofwel bepaald ofwel onbepaald. Het kan niet beide tegelijk zijn."},{"h":"De zonneletters"},{"p":"ت ث د ذ ر ز س ش ص ض ط ظ ل ن"},{"h":"De maanletters"},{"p":"أ ب ج ح خ ع غ ف ق ك م و ه ي"},{"h":"Woordenlijst van hoofdstuk 3"},{"p":"Antoniemen (× = tegengestelde): غَنِيٌّ rijk × فَقِيرٌ arm · طَوِيلٌ lang × قَصِيرٌ kort · خَفِيفٌ licht × ثَقِيلٌ zwaar · صَغِيرٌ klein × كَبِيرٌ groot · بَارِدٌ koud × حَارٌّ heet · جَالِسٌ zittend × وَاقِفٌ staand · نَظِيفٌ schoon × وَسِخٌ vies · قَرِيبٌ dichtbij × بَعِيدٌ ver · جَدِيدٌ nieuw × قَدِيمٌ oud · جَمِيلٌ mooi · الْمَاءُ het water · حُلْوٌ zoet · الدُّكَّانُ de winkel · التُّفَّاحُ de appel · الْوَرَقُ het papier"}]},"4":{"title":"Voorzetsels · هُوَ هِيَ · أَنَا أَنْتَ","summary":"Hoofdstuk 4a en 4b uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het gebruik van de voorzetsels (حُرُوفُ الْجَرِّ).","1) Arabische naamwoorden hebben verschillende uitgangen om zo hun functie in de zin te laten zien. De normale uitgang is de «-u» (ḍammah) zoals in:","Over een naamwoord met de normale uitgang wordt er gezegd dat het nominatief is. In het Arabisch wordt dit marfūʿ (مَرْفُوعٌ) genoemd.","Na een voorzetsel (ḥarf jarr) verandert deze uitgang in «-i» (kasrah).","Over een naamwoord dat vooraf wordt gegaan door een voorzetsel wordt er gezegd dat het genitief is. In het Arabisch wordt dit majrūr (مَجْرُورٌ) genoemd.","In het Arabisch: ḥurūf al-jarr (حُرُوفُ الْجَرِّ). Het enkelvoud ervan is: ḥarf jarr.","Het woord فِي heeft een lange «ī». Maar wanneer het gevolgd wordt door «al-», dan wordt de «ī» korter omdat lange klinkers in het Arabisch niet gevolgd worden door een klinkerloze medeklinker (fī + al → fi l-).","2) In deze les leren we ook twee voornaamwoorden:","هُوَ «hij», «het»;","هِيَ «zij», «het».","In het Arabisch zijn alle naamwoorden mannelijk of vrouwelijk. Een mannelijk naamwoord wordt aangeduid met het persoonlijk voornaamwoord هُوَ, ongeacht of het een mens, een dier of een ding is. Een vrouwelijk naamwoord wordt aangeduid met هِيَ.","أَنَا = ik. أَنْتَ = jij (mannelijk enkelvoud)."],"examples":[{"ar":"هُوَ فِي الْمَسْجِدِ.","nl":"Hij is in de moskee."},{"ar":"الْقَلَمُ عَلَى الْمَكْتَبِ.","nl":"De pen is op het bureau."},{"ar":"ذَهَبَ إِلَى الْمَسْجِدِ.","nl":"Hij ging naar de moskee."},{"ar":"خَرَجَ مِنَ الْبَيْتِ.","nl":"Hij ging het huis uit."},{"ar":"أَيْنَ الْكِتَابُ؟","nl":"Waar is het boek?"},{"ar":"أَنَا مُحَمَّدٌ.","nl":"Ik ben Mohammed."}],"exercises":[{"type":"pic","emoji":"🕌","q":"«Hij is in de moskee»","options":["هُوَ فِي الْمَسْجِدِ","هُوَ عَلَى الْمَسْجِدِ","هِيَ فِي الْمَسْجِدِ","هُوَ إِلَى الْمَسْجِدِ"],"answer":0,"explain":"هُوَ فِي الْمَسْجِدِ."},{"type":"pic","emoji":"🛏️","q":"«Zij/het is op het bed»","options":["هِيَ عَلَى السَّرِيرِ","هُوَ فِي السَّرِيرِ","هِيَ فِي السَّرِيرِ","هُوَ عَلَى السَّرِيرِ"],"answer":0,"explain":"هِيَ عَلَى السَّرِيرِ."},{"type":"pic","emoji":"🕌","q":"«Hij ging naar de moskee»","options":["ذَهَبَ إِلَى الْمَسْجِدِ","خَرَجَ مِنْ الْمَسْجِدِ","هُوَ فِي الْمَسْجِدِ","أَنَا إِلَى الْمَسْجِدِ"],"answer":0,"explain":"ذَهَبَ إِلَى الْمَسْجِدِ."},{"q":"Na فِي krijgt het naamwoord welke uitgang?","options":["-u (nominatief)","-i (genitief)","-a (accusatief)","altijd tanwien"],"answer":1,"explain":"Na een voorzetsel → genitief (-i)."},{"q":"هِيَ gebruik je voor…","options":["alleen vrouwen","alles wat grammaticaal vrouwelijk is","alleen dieren","meervoud"],"answer":1,"explain":"Ook voor vrouwelijke dingen, zoals een auto."},{"q":"Wat betekent: خَرَجَ مِنَ الْبَيْتِ؟","options":["Hij ging naar het huis.","Hij ging het huis uit.","Hij is in het huis.","Waar is het huis?"],"answer":1,"explain":"خَرَجَ = hij ging naar buiten, مِنْ = uit/van."},{"q":"فِي betekent…","options":["op","in","naar","van"],"answer":1,"explain":"فِي = in."},{"q":"عَلَى betekent…","options":["in","onder","op","met"],"answer":2,"explain":"عَلَى = op."},{"q":"إِلَى betekent…","options":["van","naar","in","onder"],"answer":1,"explain":"إِلَى = naar."},{"q":"هُوَ gebruik je voor…","options":["alleen mannen","mannelijke woorden (ook dingen)","alleen vrouwen","meervoud"],"answer":1,"explain":"Ook voor mannelijke dingen, bijv. een boek."},{"q":"أَنَا betekent…","options":["jij","hij","ik","wij"],"answer":2,"explain":"أَنَا = ik."},{"q":"ذَهَبَ إِلَى الْمَسْجِدِ = …","options":["Hij kwam uit de moskee","Hij ging naar de moskee","Hij is in de moskee","Waar is de moskee?"],"answer":1,"explain":"ذَهَبَ = ging, إِلَى = naar."}],"fullText":[{"h":"Hoofdstuk 4a — Voorzetsels"},{"p":"In deze les leren we het gebruik van de voorzetsels (حروف الجر)."},{"p":"1) Arabische naamwoorden hebben verschillende uitgangen om zo hun functie in de zin te laten zien. De normale uitgang is de «-u» (ḍammah) zoals in:"},{"ar":"الْبَيْتُ جَدِيدٌ.","nl":"Het huis is nieuw. (al-baytu jadīdun)"},{"p":"Over een naamwoord met de normale uitgang wordt er gezegd dat het nominatief is. In het Arabisch wordt dit marfūʿ (مرفوع) genoemd."},{"p":"Na een voorzetsel (ḥarf jarr) verandert deze uitgang in «-i» (kasrah)."},{"p":"Voorbeelden:"},{"ar":"الْبَيْتُ","nl":"het huis (al-baytu)"},{"ar":"فِي الْبَيْتِ","nl":"in het huis (fī l-bayti)"},{"ar":"بَيْتٌ","nl":"een huis (baytun)"},{"ar":"فِي بَيْتٍ","nl":"in een huis (fī baytin)"},{"ar":"الْمَكْتَبُ","nl":"het bureau"},{"ar":"عَلَى الْمَكْتَبِ","nl":"op het bureau"},{"p":"Over een naamwoord dat vooraf wordt gegaan door een voorzetsel wordt er gezegd dat het genitief is. In het Arabisch wordt dit majrūr (مجرور) genoemd."},{"p":"In het Arabisch: ḥurūf al-jarr (حروف الجر). Het enkelvoud ervan is: ḥarf jarr."},{"p":"Het woord فِي heeft een lange «ī». Maar wanneer het gevolgd wordt door «al-», dan wordt de «ī» korter omdat lange klinkers in het Arabisch niet gevolgd worden door een klinkerloze medeklinker (fī + al → fi l-)."},{"h":"Voornaamwoorden"},{"p":"2) In deze les leren we ook twee voornaamwoorden:"},{"p":"هُوَ «hij», «het»;"},{"p":"هِيَ «zij», «het»."},{"p":"In het Arabisch zijn alle naamwoorden mannelijk of vrouwelijk. Een mannelijk naamwoord wordt aangeduid met het persoonlijk voornaamwoord هُوَ, ongeacht of het een mens, een dier of een ding is. Een vrouwelijk naamwoord wordt aangeduid met هِيَ."},{"h":"Hoofdstuk 4b — أَنَا، أَنْتَ en werkwoorden"},{"p":"أَنَا = ik. أَنْتَ = jij (mannelijk enkelvoud)."},{"p":"ذَهَبَ = hij ging. خَرَجَ = hij ging naar buiten."},{"p":"أَيْنَ = waar?"},{"ar":"أَيْنَ الْكِتَابُ؟","nl":"Waar is het boek?"},{"ar":"الْكِتَابُ عَلَى الْمَكْتَبِ.","nl":"Het boek is op het bureau."},{"ar":"ذَهَبَ بِلَالٌ إِلَى الْمَسْجِدِ.","nl":"Bilāl ging naar de moskee."},{"ar":"خَرَجَ مِنَ الْبَيْتِ.","nl":"Hij ging het huis uit."},{"ar":"أَنَا طَالِبٌ.","nl":"Ik ben student."},{"ar":"أَنْتَ مُدَرِّسٌ.","nl":"Jij bent leraar."}]},"5":{"title":"Bezitsconstructie · تَحْتَ · يَا","summary":"Hoofdstuk 5 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we de bezitsconstructie (الْإِضَافَةُ), het woord تَحْتَ en de aanspreekvorm يَا.","Bezit zeg je zo:","Eerste woord = muḍāf (het bezit). Tweede woord = muḍāf ilayh (de bezitter).","Regel: de muḍāf krijgt géén ال en géén tanwien. Dus niet: الْكِتَابُ بِلَالٍ.","Het tweede woord staat in de genitief (-i): بِلَالٍ، الْإِمَامِ.","تَحْتَ = onder.","يَا gebruik je om iemand aan te spreken:","Na يَا: één ḍammah (-u), geen tanwien: يَا بِلَالُ (niet يَا بِلَالٌ)."],"examples":[{"ar":"كِتَابُ بِلَالٍ","nl":"het boek van Bilāl"},{"ar":"بَيْتُ الْإِمَامِ","nl":"het huis van de imam"},{"ar":"تَحْتَ الْمَكْتَبِ","nl":"onder het bureau"},{"ar":"يَا بِلَالُ","nl":"O Bilāl!"},{"ar":"كِتَابُ مَنْ؟","nl":"Wiens boek?"}],"exercises":[{"type":"pic","emoji":"📖","q":"«het boek van Bilāl»","options":["كِتَابُ بِلَالٍ","بِلَالُ كِتَابٍ","الْكِتَابُ بِلَالٍ","كِتَابٌ بِلَالٌ"],"answer":0,"explain":"كِتَابُ بِلَالٍ."},{"type":"pic","emoji":"🖥️","q":"«onder het bureau»","options":["تَحْتَ الْمَكْتَبِ","عَلَى الْمَكْتَبِ","فِي الْمَكْتَبِ","مِنْ الْمَكْتَبِ"],"answer":0,"explain":"تَحْتَ الْمَكْتَبِ."},{"q":"In كِتَابُ بِلَالٍ is كِتَابُ de…","options":["bezitter (muḍāf ilayh)","het bezit (muḍāf)","een voorzetsel","een werkwoord"],"answer":1,"explain":"Muḍāf = het bezit (hier: boek)."},{"q":"Mag de muḍāf ال of tanwien hebben?","options":["Ja, allebei","Alleen ال","Nee, geen van beide","Alleen tanwien"],"answer":2,"explain":"Muḍāf: geen ال en geen tanwien."},{"q":"Welke uitgang krijgt een naam na يَا?","options":["tanwien -un","één ḍammah -u","kasrah -i","sukūn"],"answer":1,"explain":"Na يَا: één ḍammah."},{"q":"كِتَابُ بِلَالٍ = …","options":["Bilāl is een boek","het boek van Bilāl","een boek en Bilāl","Bilāl las een boek"],"answer":1,"explain":"Iḍāfa: bezit + bezitter."},{"q":"Welke uitgang krijgt het tweede woord (muḍāf ilayh) in een bezitsconstructie?","options":["Nominatief (-u / -un)","Accusatief (-a / -an)","Genitief (-i / -in)","Sukūn (geen klinker)"],"answer":2,"explain":"De muḍāf ilayh staat altijd in de genitief (majrūr: -i of -in)."},{"q":"تَحْتَ betekent…","options":["boven","naast","onder","in"],"answer":2,"explain":"تَحْتَ = onder."},{"q":"يَا بِلَالُ zeg je om…","options":["naar Bilāl te vragen","Bilāl aan te spreken","Bilāl te beschrijven","Bilāl te tellen"],"answer":1,"explain":"يَا = o… (roepvorm)."},{"q":"بَيْتُ الْإِمَامِ = …","options":["een huis en een imam","het huis van de imam","de imam is een huis","in het huis van de imam"],"answer":1,"explain":"Iḍāfa met bepaald tweede deel."}],"fullText":[{"h":"Hoofdstuk 5"},{"p":"In deze les leren we de bezitsconstructie (الإضافة), het woord تَحْتَ en de aanspreekvorm يَا."},{"p":"Bezit zeg je zo:"},{"ar":"كِتَابُ بِلَالٍ","nl":"het boek van Bilāl"},{"p":"Eerste woord = muḍāf (het bezit). Tweede woord = muḍāf ilayh (de bezitter)."},{"p":"Regel: de muḍāf krijgt géén ال en géén tanwien. Dus niet: الْكِتَابُ بِلَالٍ."},{"p":"Het tweede woord staat in de genitief (-i): بِلَالٍ، الْإِمَامِ."},{"ar":"بَيْتُ الْإِمَامِ","nl":"het huis van de imam"},{"ar":"قَلَمُ الطَّالِبِ","nl":"de pen van de student"},{"ar":"بَابُ الْبَيْتِ","nl":"de deur van het huis"},{"p":"تَحْتَ = onder."},{"ar":"تَحْتَ الْمَكْتَبِ","nl":"onder het bureau"},{"p":"يَا gebruik je om iemand aan te spreken:"},{"ar":"يَا بِلَالُ","nl":"O Bilāl!"},{"p":"Na يَا: één ḍammah (-u), geen tanwien: يَا بِلَالُ (niet يَا بِلَالٌ)."},{"ar":"كِتَابُ مَنْ؟","nl":"Wiens boek?"}]},"6":{"title":"هَذِهِ · tāʾ marbūṭa","summary":"Hoofdstuk 6 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we هَذِهِ (de vrouwelijke vorm van هَذَا) en de tāʾ marbūṭa (ة).","هَذِهِ is de vrouwelijke vorm van هَذَا. Gebruik het bij vrouwelijke woorden.","Veel woorden maak je vrouwelijk met ة (tāʾ marbūṭa):","De letter vóór de ة krijgt een fathah (a-klank).","Sommige woorden hebben een eigen vrouwelijke vorm:","Elk Arabisch naamwoord is mannelijk of vrouwelijk. Leer het geslacht meteen mee.","Ook dingen kunnen vrouwelijk zijn:"],"examples":[{"ar":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","nl":"Dit is een jongen en dit is een meisje."},{"ar":"هَذِهِ سَيَّارَةٌ.","nl":"Dit is een auto."},{"ar":"هَذِهِ طَبِيبَةٌ.","nl":"Dit is een dokter (vrouw)."},{"ar":"أَهَذِهِ حَقِيبَةٌ؟","nl":"Is dit een tas?"}],"exercises":[{"type":"pic","emoji":"👦","q":"«Dit is een jongen en dit is een meisje»","options":["هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ","هَذَا وَلَدٌ وَهَذَا بِنْتٌ","هَذِهِ وَلَدٌ وَهَذَا بِنْتٌ","هَذَا بِنْتٌ وَهَذِهِ وَلَدٌ"],"answer":0,"explain":"هَذَا (m) وَ هَذِهِ (v)."},{"type":"pic","emoji":"👨‍🏫","q":"مُدَرِّسٌ → vrouwelijk","options":["مُدَرِّسَةٌ","مُدَرِّسُونَ","مُدَرِّسِينَ","الْمُدَرِّسُ"],"answer":0,"explain":"مُدَرِّسَةٌ."},{"q":"Wat is de vrouwelijke vorm van «dit»?","options":["هَذَا","هَذِهِ","ذَلِكَ","تِلْكَ"],"answer":1,"explain":"هَذِهِ = dit (vrouwelijk)."},{"q":"مُدَرِّسٌ wordt vrouwelijk…","options":["مُدَرِّسُونَ","مُدَرِّسَةٌ","مُدَرِّسَاتٌ","مُدَرِّسِينَ"],"answer":1,"explain":"Voeg ة toe: مُدَرِّسَةٌ."},{"q":"هَذِهِ gebruik je bij…","options":["mannelijke woorden","vrouwelijke woorden","alleen meervoud","alleen vragen"],"answer":1,"explain":"هَذِهِ = dit (v)."},{"q":"Wat is de vrouwelijke vorm van أَخٌ (broer)?","options":["أَخَةٌ","بِنْتٌ","أُخْتٌ","أُمٌّ"],"answer":2,"explain":"أَخٌ (broer) → أُخْتٌ (zus)."},{"q":"اِبْنٌ (zoon) → vrouwelijk is…","options":["اِبْنَةٌ altijd","بِنْتٌ","أُخْتٌ","وَلَدٌ"],"answer":1,"explain":"بِنْتٌ = dochter/meisje."},{"q":"Moet je bij elk nieuw woord het geslacht leren?","options":["Nee, alleen bij mensen","Ja","Alleen bij dieren","Nee, altijd mannelijk"],"answer":1,"explain":"Ja — elk naamwoord is m of v."},{"q":"Wat betekent: هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ؟","options":["Dit is een man en dit is een vrouw.","Dit is een jongen en dit is een meisje.","Dat is een jongen en dat is een meisje.","Dit is een meisje en dit is een jongen."],"answer":1,"explain":"هَذَا وَلَدٌ = dit is een jongen, وَهَذِهِ بِنْتٌ = en dit is een meisje."},{"q":"Wat betekent: أَهَذِهِ حَقِيبَةٌ؟","options":["Dit is een tas.","Wat is deze tas?","Is dit een tas?","Is dat een auto?"],"answer":2,"explain":"أَ + هَذِهِ حَقِيبَةٌ = Is dit een tas?"},{"q":"Wat betekent: هَذِهِ سَيَّارَةٌ؟","options":["Dit is een auto.","Dat is een auto.","Dit is een fiets.","De auto is snel."],"answer":0,"explain":"هَذِهِ (dit, vr.) + سَيَّارَةٌ (een auto)."},{"q":"Wat betekent: هَذِهِ طَبِيبَةٌ؟","options":["Dit is een dokter (man).","Dit is een verpleegster.","Dat is een dokter (vrouw).","Dit is een dokter (vrouw)."],"answer":3,"explain":"هَذِهِ طَبِيبَةٌ = Dit is een dokter (vrouw)."}],"fullText":[{"h":"Hoofdstuk 6"},{"p":"In deze les leren we هَذِهِ (de vrouwelijke vorm van هَذَا) en de tāʾ marbūṭa (ة)."},{"p":"هَذِهِ is de vrouwelijke vorm van هَذَا. Gebruik het bij vrouwelijke woorden."},{"p":"Veel woorden maak je vrouwelijk met ة (tāʾ marbūṭa):"},{"ar":"مُدَرِّسٌ → مُدَرِّسَةٌ","nl":"leraar → lerares"},{"p":"De letter vóór de ة krijgt een fathah (a-klank)."},{"p":"Sommige woorden hebben een eigen vrouwelijke vorm:"},{"ar":"اِبْنٌ → بِنْتٌ","nl":"zoon → dochter / meisje"},{"ar":"أَخٌ → أُخْتٌ","nl":"broer → zus"},{"p":"Elk Arabisch naamwoord is mannelijk of vrouwelijk. Leer het geslacht meteen mee."},{"p":"Ook dingen kunnen vrouwelijk zijn:"},{"ar":"هَذِهِ سَيَّارَةٌ.","nl":"Dit is een auto."},{"ar":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","nl":"Dit is een jongen en dit is een meisje."},{"ar":"أَهَذِهِ مُدَرِّسَةٌ؟","nl":"Is dit een lerares?"}]},"7":{"title":"تِلْكَ · overzicht aanwijzers","summary":"Hoofdstuk 7 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we تِلْكَ en het overzicht van de aanwijzende voornaamwoorden.","تِلْكَ = die / dat voor vrouwelijke woorden die verder weg zijn.","Complete set dichtbij: هَذَا (mannelijk) en هَذِهِ (vrouwelijk).","Complete set verder weg: ذَلِكَ (mannelijk) en تِلْكَ (vrouwelijk).","Kies altijd op geslacht én afstand."],"examples":[{"ar":"هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ.","nl":"Dit is Bilāl en dat is Ḥāmid."},{"ar":"هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ.","nl":"Dit is Āmina en dat is Maryam."},{"ar":"تِلْكَ طَبِيبَةٌ.","nl":"Dat is een dokter (vrouw)."},{"ar":"أَتِلْكَ سَيَّارَةٌ؟","nl":"Is dat een auto?"}],"exercises":[{"q":"«Die» (vrouwelijk, verder weg) is…","options":["هَذِهِ","تِلْكَ","ذَلِكَ","هَذَا"],"answer":1,"explain":"تِلْكَ = die/dat (v, verder)."},{"q":"Welk paar is mannelijk?","options":["هَذِهِ / تِلْكَ","هَذَا / ذَلِكَ","هُوَ / هِيَ","أَنَا / أَنْتَ"],"answer":1,"explain":"Mannelijk: هَذَا (dicht) / ذَلِكَ (ver)."},{"q":"تِلْكَ hoort bij…","options":["mannelijk dichtbij","vrouwelijk verder weg","mannelijk verder weg","vrouwelijk dichtbij"],"answer":1,"explain":"تِلْكَ = v, verder weg."},{"q":"هَذِهِ hoort bij…","options":["mannelijk dichtbij","vrouwelijk dichterbij","mannelijk verder","alleen dieren"],"answer":1,"explain":"هَذِهِ = v, dichtbij."},{"q":"Welk aanwijzend voornaamwoord past bij مَدْرَسَةٌ (verder weg)?","options":["هَذَا","ذَلِكَ","هَذِهِ","تِلْكَ"],"answer":3,"explain":"مَدْرَسَةٌ is vrouwelijk (ة) en verder weg → تِلْكَ مَدْرَسَةٌ."},{"q":"Complete set vrouwelijk is…","options":["هَذَا / ذَلِكَ","هَذِهِ / تِلْكَ","مَا / مَنْ","فِي / عَلَى"],"answer":1,"explain":"v: هَذِهِ (dicht) / تِلْكَ (ver)."},{"q":"Wat betekent: هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ؟","options":["Dit is Ḥāmid en dat is Bilāl.","Dit is Bilāl en dat is Ḥāmid.","Dit zijn Bilāl en Ḥāmid.","Waar zijn Bilāl en Ḥāmid?"],"answer":1,"explain":"هَذَا بِلَالٌ (dit is Bilāl) وَذَلِكَ حَامِدٌ (en dat is Ḥāmid)."},{"q":"Wat betekent: هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ؟","options":["Dit is Āmina en dat is Maryam.","Dit is Maryam en dat is Āmina.","Dat is Āmina en dit is Maryam.","Āmina en Maryam zijn studentes."],"answer":0,"explain":"هَذِهِ آمِنَةُ (dit is Āmina) وَتِلْكَ مَرْيَمُ (en dat is Maryam)."},{"q":"Wat betekent: تِلْكَ طَبِيبَةٌ؟","options":["Dit is een dokter (vrouw).","Die man is een dokter.","Dat is een dokter (vrouw).","Dat is een verpleegster."],"answer":2,"explain":"تِلْكَ (dat/die, vr.) + طَبِيبَةٌ (een vrouwelijke arts)."},{"q":"Wat betekent: أَتِلْكَ سَيَّارَةٌ؟","options":["Is dit een auto?","Dat is een auto.","Wat is die auto?","Is dat een auto?"],"answer":3,"explain":"أَ + تِلْكَ سَيَّارَةٌ = Is dat een auto?"}],"fullText":[{"h":"Hoofdstuk 7"},{"p":"In deze les leren we تِلْكَ en het overzicht van de aanwijzende voornaamwoorden."},{"p":"تِلْكَ = die / dat voor vrouwelijke woorden die verder weg zijn."},{"p":"Complete set dichtbij: هَذَا (mannelijk) en هَذِهِ (vrouwelijk)."},{"p":"Complete set verder weg: ذَلِكَ (mannelijk) en تِلْكَ (vrouwelijk)."},{"p":"Kies altijd op geslacht én afstand."},{"ar":"هَذَا بِلَالٌ وَذَلِكَ حَامِدٌ.","nl":"Dit is Bilāl en dat is Ḥāmid."},{"ar":"هَذِهِ آمِنَةُ وَتِلْكَ مَرْيَمُ.","nl":"Dit is Āmina en dat is Maryam."},{"ar":"تِلْكَ طَبِيبَةٌ.","nl":"Dat is een dokter (vrouw)."},{"ar":"أَتِلْكَ سَيَّارَةٌ؟","nl":"Is dat een auto?"}]},"8":{"title":"Aanwijzer + bepaald lidwoord","summary":"Hoofdstuk 8 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het verschil tussen «dit is een boek» en «dit boek».","Hetzelfde patroon werkt met ذَلِكَ، هَذِهِ en تِلْكَ.","Kort: zonder ال + tanwien ≈ «dit is een…». Met ال ≈ «dit …» (nog aanvullen met een predicaat)."],"examples":[{"ar":"هَذَا الْكِتَابُ جَدِيدٌ.","nl":"Dit boek is nieuw."},{"ar":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.","nl":"Die man is een ingenieur."},{"ar":"هَذِهِ السَّاعَةُ جَمِيلَةٌ.","nl":"Dit horloge is mooi."},{"ar":"تِلْكَ الْبِنْتُ طَالِبَةٌ.","nl":"Dat meisje is studente."}],"exercises":[{"q":"هَذَا كِتَابٌ is…","options":["alleen een woordgroep","een volledige zin","fout Arabisch","alleen een vraag"],"answer":1,"explain":"Met tanwien: «Dit is een boek» = zin."},{"q":"هَذَا الْكِتَابُ betekent…","options":["Dit is een boek","Dit boek (nog geen complete zin)","Dat boek","Mijn boek"],"answer":1,"explain":"Aanwijzend + bepaald = «dit boek»."},{"q":"Hoe zeg je «Deze auto is mooi»?","options":["هَذِهِ سَيَّارَةٌ جَمِيلَةٌ","هَذِهِ السَّيَّارَةُ جَمِيلَةٌ","هَذَا السَّيَّارَةُ جَمِيلَةٌ","تِلْكَ السَّيَّارَةُ جَمِيلَةٌ"],"answer":1,"explain":"«Deze auto» = هَذِهِ السَّيَّارَةُ + predicaat جَمِيلَةٌ."},{"q":"Wat is het verschil tussen هَذَا كِتَابٌ en هَذَا الْكِتَابُ؟","options":["Er is geen verschil","هَذَا كِتَابٌ = «Dit is een boek», هَذَا الْكِتَابُ = «dit boek»","هَذَا الْكِتَابُ is een vraag","هَذَا كِتَابٌ is meervoud"],"answer":1,"explain":"Zonder ال is كِتَابٌ het gezegde («Dit is een boek»); met ال hoort الْكِتَابُ bij هَذَا («dit boek»)."},{"q":"Maak een complete zin: هَذَا الْكِتَابُ …","options":["فَقَطْ","جَدِيدٌ","مَا","وَ"],"answer":1,"explain":"Bijv. هَذَا الْكِتَابُ جَدِيدٌ."},{"q":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ = …","options":["Deze man is student","Die man is ingenieur","Dit is een man","Waar is de man?"],"answer":1,"explain":"ذَلِكَ + bepaald + predicaat."},{"q":"Wat betekent: هَذَا الْكِتَابُ جَدِيدٌ؟","options":["Dit is een nieuw boek.","Dit boek is nieuw.","Dat boek is nieuw.","Het nieuwe boek."],"answer":1,"explain":"هَذَا الْكِتَابُ (dit boek) + جَدِيدٌ (is nieuw)."},{"q":"Wat betekent: ذَلِكَ الرَّجُلُ مُهَنْدِسٌ؟","options":["Deze man is een ingenieur.","Dat is een man en een ingenieur.","Die man is een ingenieur.","Die ingenieur is een man."],"answer":2,"explain":"ذَلِكَ الرَّجُلُ (die man) + مُهَنْدِسٌ (is een ingenieur)."},{"q":"Wat betekent: هَذِهِ السَّاعَةُ جَمِيلَةٌ؟","options":["Dit horloge is mooi.","Dit is een mooi horloge.","Dat horloge is mooi.","Deze auto is mooi."],"answer":0,"explain":"هَذِهِ السَّاعَةُ (dit horloge) + جَمِيلَةٌ (is mooi)."},{"q":"Wat betekent: تِلْكَ الْبِنْتُ طَالِبَةٌ؟","options":["Dit meisje is studente.","Dat is een meisje.","Die lerares is nieuw.","Dat meisje is studente."],"answer":3,"explain":"تِلْكَ الْبِنْتُ (dat meisje) + طَالِبَةٌ (is studente)."}],"fullText":[{"h":"Hoofdstuk 8"},{"p":"In deze les leren we het verschil tussen «dit is een boek» en «dit boek»."},{"ar":"هَذَا كِتَابٌ.","nl":"Dit is een boek. (volledige zin, tanwien op كِتَابٌ)"},{"ar":"هَذَا الْكِتَابُ","nl":"dit boek (bepaald; nog geen complete zin zonder predicaat)"},{"ar":"هَذَا الْكِتَابُ جَدِيدٌ.","nl":"Dit boek is nieuw."},{"p":"Hetzelfde patroon werkt met ذَلِكَ، هَذِهِ en تِلْكَ."},{"p":"Kort: zonder ال + tanwien ≈ «dit is een…». Met ال ≈ «dit …» (nog aanvullen met een predicaat)."},{"ar":"هَذِهِ السَّيَّارَةُ جَمِيلَةٌ.","nl":"Deze auto is mooi."},{"ar":"ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.","nl":"Die man is een ingenieur."},{"ar":"أَهَذَا الْقَلَمُ جَدِيدٌ؟","nl":"Is deze pen nieuw?"}]},"9":{"title":"Bijvoeglijk naamwoord (naʿt)","summary":"Hoofdstuk 9a en 9b uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In het Nederlands: «een nieuw huis». In het Arabisch: بَيْتٌ جَدِيدٌ (het bijvoeglijk naamwoord komt ná het zelfstandig naamwoord).","Het bijvoeglijk naamwoord (naʿt / نَعْتٌ) komt overeen in vier dingen:","a. Geslacht — mannelijk of vrouwelijk.","b. Bepaaldheid — beide bepaald of beide onbepaald.","c. Naamval — het bijvoeglijk naamwoord heeft dezelfde naamval als het zelfstandig naamwoord.","d. Aantal/getal — enkelvoud, dualis of meervoud komen overeen.","2) Bijvoeglijke naamwoorden die eindigen op «-ān» (ان) krijgen geen tanwien.","الْقَاهِرَةُ Caïro · اللُّغَةُ de taal · الْمَدِينَةُ de stad · صَعْبٌ moeilijk · سَهْلٌ makkelijk · مَشْهُورٌ beroemd · مُجْتَهِدٌ hardwerkend, ijverig · الْعَرَبِيَّةُ het Arabisch · الْإِنْجِلِيزِيَّةُ het Engels"],"examples":[{"ar":"بَيْتٌ جَدِيدٌ","nl":"een nieuw huis"},{"ar":"بِنْتٌ صَغِيرَةٌ","nl":"een klein meisje"},{"ar":"الْبَيْتُ الْكَبِيرُ","nl":"het grote huis"},{"ar":"هَذَا كِتَابٌ مُفِيدٌ.","nl":"Dit is een nuttig boek."}],"exercises":[{"q":"Waar staat het bijvoeglijk naamwoord in het Arabisch?","options":["Voor het zelfstandig naamwoord","Na het zelfstandig naamwoord","Alleen aan het eind van de zin","Met أَ ervoor"],"answer":1,"explain":"Altijd ná: بَيْتٌ جَدِيدٌ."},{"q":"Waarom heeft صَغِيرَةٌ een ة in بِنْتٌ صَغِيرَةٌ?","options":["Toeval","Het komt overeen in geslacht (vrouwelijk)","Omdat het een vraag is","Verplicht bij alle bijvoeglijke naamwoorden"],"answer":1,"explain":"Naʿt komt overeen in geslacht."},{"q":"Welke uitgang krijgen bijvoeglijke naamwoorden op -ān (zoals عَطْشَانُ «dorstig»)?","options":["Altijd tanwien (-un)","Eén ḍammah (-u), géén tanwien","Altijd kasrah (-i)","Sukūn"],"answer":1,"explain":"Bijvoeglijke naamwoorden op -ān (فَعْلَانُ) zoals عَطْشَانُ en كَسْلَانُ krijgen geen tanwien."},{"q":"بَيْتٌ جَدِيدٌ = …","options":["nieuw is een huis","een nieuw huis","het nieuwe huis","grote huis"],"answer":1,"explain":"Onbepaald + adj met tanwien."},{"q":"الْبَيْتُ الْكَبِيرُ = …","options":["een groot huis","het grote huis","groot is het huis","huis groot"],"answer":1,"explain":"Beide met ال = bepaald."},{"q":"Hoe vertaal je «in een nieuw huis»?","options":["فِي بَيْتٍ جَدِيدٌ","فِي بَيْتٍ جَدِيدٍ","فِي الْبَيْتِ الْجَدِيدِ","فِي جَدِيدٍ بَيْتٍ"],"answer":1,"explain":"Na فِي staat بَيْتٍ in de genitief, dus het bijvoeglijk naamwoord جَدِيدٍ krijgt ook genitief met tanwien."},{"q":"Het bijvoeglijk naamwoord moet overeenkomen in…","options":["alleen geslacht","geslacht, getal, bepaaldheid en naamval","alleen bepaaldheid","alleen uitspraak"],"answer":1,"explain":"Vier punten van overeenkomst."},{"q":"Hoe zeg je «een nieuwe auto» in het Arabisch?","options":["سَيَّارَةٌ جَدِيدٌ","جَدِيدَةٌ سَيَّارَةٌ","سَيَّارَةٌ جَدِيدَةٌ","السَّيَّارَةُ الْجَدِيدَةُ"],"answer":2,"explain":"سَيَّارَةٌ is vrouwelijk en onbepaald → سَيَّارَةٌ جَدِيدَةٌ."},{"q":"Wat betekent: بِنْتٌ صَغِيرَةٌ؟","options":["het kleine meisje","een klein meisje","Het meisje is klein.","een grote dochter"],"answer":1,"explain":"Beide onbepaald en vrouwelijk: een klein meisje."},{"q":"Wat betekent: هَذَا كِتَابٌ مُفِيدٌ؟","options":["Dit boek is nuttig.","Dit is een nuttig boek.","Dat is een nieuw boek.","Een nuttig boek."],"answer":1,"explain":"هَذَا (dit is) + كِتَابٌ مُفِيدٌ (een nuttig boek)."},{"q":"Wat betekent: الْعَرَبِيَّةُ لُغَةٌ سَهْلَةٌ؟","options":["Het Arabisch is een moeilijke taal.","De Arabische taal is mooi.","Het Arabisch is een makkelijke taal.","Engels is een makkelijke taal."],"answer":2,"explain":"الْعَرَبِيَّةُ (het Arabisch) + لُغَةٌ سَهْلَةٌ (is een makkelijke taal)."}],"fullText":[{"h":"Hoofdstuk 9a — Het bijvoeglijk naamwoord"},{"p":"In het Nederlands: «een nieuw huis». In het Arabisch: بَيْتٌ جَدِيدٌ (het bijvoeglijk naamwoord komt ná het zelfstandig naamwoord)."},{"p":"Het bijvoeglijk naamwoord (naʿt / نعت) komt overeen in vier dingen:"},{"p":"a. Geslacht — mannelijk of vrouwelijk."},{"ar":"بَيْتٌ جَدِيدٌ","nl":"een nieuw huis (m)"},{"ar":"بِنْتٌ صَغِيرَةٌ","nl":"een klein meisje (v)"},{"p":"b. Bepaaldheid — beide bepaald of beide onbepaald."},{"ar":"الْبَيْتُ الْكَبِيرُ","nl":"het grote huis"},{"p":"c. Naamval — het bijvoeglijk naamwoord heeft dezelfde naamval als het zelfstandig naamwoord."},{"ar":"هَذَا بَيْتٌ جَدِيدٌ.","nl":"Dit is een nieuw huis. (beide nominatief)"},{"ar":"فِي بَيْتٍ جَدِيدٍ","nl":"in een nieuw huis (beide genitief)"},{"p":"d. Aantal/getal — enkelvoud, dualis of meervoud komen overeen."},{"p":"2) Bijvoeglijke naamwoorden die eindigen op «-ān» (ان) krijgen geen tanwien."},{"ar":"كَسْلَانُ","nl":"lui"},{"ar":"جَوْعَانُ","nl":"hongerig"},{"ar":"عَطْشَانُ","nl":"dorstig"},{"ar":"غَضْبَانُ","nl":"boos"},{"ar":"مَلْآنُ","nl":"vol"},{"h":"Woordenlijst van hoofdstuk 9a (selectie)"},{"p":"الْقَاهِرَةُ Caïro · اللُّغَةُ de taal · الْمَدِينَةُ de stad · صَعْبٌ moeilijk · سَهْلٌ makkelijk · مَشْهُورٌ beroemd · مُجْتَهِدٌ hardwerkend, ijverig · الْعَرَبِيَّةُ het Arabisch · الْإِنْجِلِيزِيَّةُ het Engels"}]},"10":{"title":"Bezittelijke achtervoegsels","summary":"Hoofdstuk 10 uit het Medina-boek (Deel 1) — volledige grammaticatekst.","points":["In deze les leren we het volgende:","1) De bezittelijke voornaamwoorden: -كَ «jouw», -هُ «zijn», -هَا «haar» en -ي «mijn».","Deze bezittelijke voornaamwoorden zijn geen volwaardige woorden. Ze zijn als achtervoegsels die verbonden worden aan de naamwoorden.","2) Het woord voor «vader» is أَبٌ en voor «broer» is أَخٌ.","«Jouw broer» is أَخُوكَ, en niet أَخُكَ. Een extra wāw (و) dient tussen de muḍāf en de muḍāf ilayh te worden toegevoegd. Op dezelfde manier: «zijn vader» is أَبُوهُ, niet أَبُهُ.","Let op het volgende:","«Mijn vader» en «mijn broer» krijgen geen extra wāw: أَبِي، أَخِي.","Er zijn vijf woorden die deze extra wāw krijgen wanneer ze muḍāf zijn. Je hebt er nu twee geleerd en je zult de andere drie in de toekomst leren, in shāʾ Allāh.","3) We hebben geleerd dat het woord عِنْدَ «bij» betekent. Het wordt ook gebruikt om het idee van «hebben» uit te drukken.","4) We hebben geleerd dat het voorzetsel لِ «behoort tot/aan», «van» of «voor» betekent. Wanneer het geconnecteerd wordt aan de voornaamwoorden, dan krijgt het een fathah:","لِي أَخٌ betekent: «Ik heb een broer.» Letterlijk: «Een broer behoort aan mij.»","Het is verkeerd om عِنْدِي أَخٌ te zeggen voor familie/lichaamsdelen, omdat عِنْدَ gebruikt wordt voor dingen die scheidbaar zijn; relaties en lichaamsdelen zijn niet van deze aard."],"examples":[{"ar":"كِتَابِي","nl":"mijn boek"},{"ar":"كِتَابُكَ","nl":"jouw boek"},{"ar":"كِتَابُهُ","nl":"zijn boek"},{"ar":"كِتَابُهَا","nl":"haar boek"},{"ar":"أَخُوكَ","nl":"jouw broer"},{"ar":"أَهَذَا كِتَابُكَ؟","nl":"Is dit jouw boek?"},{"ar":"نَعَمْ، هَذَا كِتَابِي.","nl":"Ja, dit is mijn boek."},{"ar":"مَا اسْمُكَ؟","nl":"Wat is jouw naam?"}],"exercises":[{"q":"«Mijn boek» is…","options":["كِتَابُكَ","كِتَابِي","كِتَابُهُ","كِتَابُهَا"],"answer":1,"explain":"ـِي = mijn."},{"q":"«Haar boek» is…","options":["كِتَابُهُ","كِتَابُهَا","كِتَابُكَ","كِتَابِي"],"answer":1,"explain":"ـهَا = haar."},{"q":"كِتَابِي = …","options":["jouw boek","mijn boek","zijn boek","haar boek"],"answer":1,"explain":"ـِي = mijn."},{"q":"كِتَابُكَ = …","options":["mijn boek","jouw boek","zijn boek","haar boek"],"answer":1,"explain":"ـُكَ = jouw (m)."},{"q":"كِتَابُهُ = …","options":["mijn boek","jouw boek","zijn boek","haar boek"],"answer":2,"explain":"ـُهُ = zijn."},{"q":"كِتَابُهَا = …","options":["mijn boek","jouw boek","zijn boek","haar boek"],"answer":3,"explain":"ـهَا = haar."},{"q":"أَخُوكَ = …","options":["mijn broer","jouw broer","zijn broer","haar broer"],"answer":1,"explain":"أَخٌ + و + كَ = jouw broer."},{"q":"Hoe schrijf je «zijn vader» in het Arabisch?","options":["أَبُهُ","أَبُوهُ","أَبِيهُ","أَبَاهُ"],"answer":1,"explain":"أَبٌ en أَخٌ krijgen een extra wāw (و) wanneer ze muḍāf zijn (behalve bij «mijn»): أَبُوهُ."},{"q":"Hoe zeg je «Ik heb een broer»?","options":["عِنْدِي أَخٌ","لِي أَخٌ","مَعِي أَخٌ","أَنَا أَخٌ"],"answer":1,"explain":"Voor familieleden en lichaamsdelen gebruik je لِي (niet عِنْدِي): لِي أَخٌ."},{"q":"Wanneer gebruik je عِنْدِي (bijv. عِنْدِي سَيَّارَةٌ)?","options":["Voor familieleden zoals broer en zus","Voor dingen die je kunt bezitten (scheidbaar bezit)","Alleen in ontkennende zinnen","Alleen voor werkwoorden"],"answer":1,"explain":"عِنْدَ / عِنْدِي gebruik je voor scheidbare bezittingen (auto, boek, pen)."},{"q":"Wat betekent: مَا اسْمُكَ؟","options":["Hoe gaat het met je?","Waar kom je vandaan?","Wat is jouw naam?","Wie is jouw vader?"],"answer":2,"explain":"مَا (wat) + اسْمُكَ (jouw naam) = Wat is jouw naam?"}],"fullText":[{"h":"Hoofdstuk 10"},{"p":"In deze les leren we het volgende:"},{"p":"1) De bezittelijke voornaamwoorden: -كَ «jouw», -هُ «zijn», -هَا «haar» en -ي «mijn»."},{"ar":"كِتَابُكَ","nl":"jouw boek (mannelijk enkelvoud)"},{"ar":"كِتَابُهُ","nl":"zijn boek"},{"ar":"كِتَابُهَا","nl":"haar boek"},{"ar":"كِتَابِي","nl":"mijn boek"},{"p":"Deze bezittelijke voornaamwoorden zijn geen volwaardige woorden. Ze zijn als achtervoegsels die verbonden worden aan de naamwoorden."},{"p":"2) Het woord voor «vader» is أَبٌ en voor «broer» is أَخٌ."},{"p":"«Jouw broer» is أَخُوكَ, en niet أَخُكَ. Een extra wāw (و) dient tussen de muḍāf en de muḍāf ilayh te worden toegevoegd. Op dezelfde manier: «zijn vader» is أَبُوهُ, niet أَبُهُ."},{"p":"Let op het volgende:"},{"ar":"بَيْتُ مُحَمَّدٍ","nl":"het huis van Mohammed"},{"ar":"أَبُو مُحَمَّدٍ","nl":"de vader van Mohammed"},{"ar":"أَخُو مُحَمَّدٍ","nl":"de broer van Mohammed"},{"p":"«Mijn vader» en «mijn broer» krijgen geen extra wāw: أَبِي، أَخِي."},{"p":"Er zijn vijf woorden die deze extra wāw krijgen wanneer ze muḍāf zijn. Je hebt er nu twee geleerd en je zult de andere drie in de toekomst leren, in shāʾ Allāh."},{"p":"3) We hebben geleerd dat het woord عِنْدَ «bij» betekent. Het wordt ook gebruikt om het idee van «hebben» uit te drukken."},{"ar":"أَعِنْدَكَ قَلَمٌ؟","nl":"Heb jij een pen? (letterlijk: is er een pen bij jou?)"},{"p":"4) We hebben geleerd dat het voorzetsel لِ «behoort tot/aan», «van» of «voor» betekent. Wanneer het geconnecteerd wordt aan de voornaamwoorden, dan krijgt het een fathah:"},{"ar":"لَكَ","nl":"van jou"},{"ar":"لَهُ","nl":"van hem"},{"ar":"لَهَا","nl":"van haar"},{"ar":"لِي","nl":"van mij (met kasrah)"},{"p":"لِي أَخٌ betekent: «Ik heb een broer.» Letterlijk: «Een broer behoort aan mij.»"},{"p":"Het is verkeerd om عِنْدِي أَخٌ te zeggen voor familie/lichaamsdelen, omdat عِنْدَ gebruikt wordt voor dingen die scheidbaar zijn; relaties en lichaamsdelen zijn niet van deze aard."},{"p":"5–9) Verdere notities uit het boek: مَعَ betekent «met». مَا kan ook als ontkennend partikel gebruikt worden: مَا لِي سَيَّارَةٌ = «Ik heb geen auto.»"},{"h":"Woordenlijst van hoofdstuk 10 (selectie)"},{"p":"الْوَلَدُ het kind · الزَّمِيلُ de collega, de klasgenoot · الشَّابُّ de jongeman · الزَّوْجُ / الزَّوْجَةُ de echtgenoot / de echtgenote"}]}};

function picHtml(emoji, force){
  if((!force&&!showPics)||!emoji) return '';
  let key=null;
  if(EMOJI_PIC[emoji]) key=EMOJI_PIC[emoji];
  else{
    for(const [em,k] of Object.entries(EMOJI_PIC)){
      if(emoji.includes(em)){key=k;break}
    }
  }
  const url=(key&&PHOTO_URLS[key])||PHOTO_URLS.generic;
  return `<div class="pic-frame pic-photo"><img src="${url}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`;
}
function picFromText(text, force){
  if((!force&&!showPics)||!text)return '';
  const t=String(text);
  // Arabic stems (without harakat)
  const ar=t.replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  const map=[
    ['بيت','house'],['مسجد','mosque'],['باب','door'],['كتاب','book'],['قلم','pen'],['مفتاح','key'],
    ['مكتب','desk'],['سرير','bed'],['كرسي','chair'],['نجم','star'],['قميص','shirt'],['طبيب','doctor'],
    ['ولد','boy'],['طالب','student'],['رجل','man'],['تاجر','merchant'],['كلب','dog'],['قط','cat'],
    ['حمار','donkey'],['فرس','horse'],['حصان','horse'],['جمل','camel'],['ديك','rooster'],
    ['شمس','sun'],['قمر','moon'],['بنت','girl'],['مدرس','teacher'],['سياره','car'],['حقيبه','bag'],
    ['ماء','water'],['تفاح','apple'],['مدرسة','school'],['ساعة','clock']
  ];
  for(const [k,v] of map){if(ar.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  // Dutch hints in explain
  const n=t.toLowerCase();
  const nl=[['huis','house'],['moskee','mosque'],['boek','book'],['pen','pen'],['deur','door'],['jongen','boy'],['meisje','girl'],['man','man'],['leraar','teacher']];
  for(const [k,v] of nl){if(n.includes(k)&&PHOTO_URLS[v])return `<div class="pic-frame pic-photo"><img src="${PHOTO_URLS[v]}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"/></div>`}
  return '';
}

function logMistake(w, kind, said){
  const id=w&&w.id, ar=(w&&w.ar)||'';
  if(!ar) return;
  mistakes.unshift({id:id||'', ar, kind:kind||'word', said:said||'', t:Date.now()});
  mistakes=mistakes.slice(0,80);
  saveMk();
}
function mistakeStats(){
  const map={};
  mistakes.forEach(m=>{
    const k=m.id||m.ar;
    if(!k) return;
    if(!map[k]) map[k]={id:m.id||'', ar:m.ar, word:0, haraka:0, n:0, last:0, said:''};
    map[k].n++;
    if(m.kind==='haraka') map[k].haraka++; else map[k].word++;
    if(m.t>map[k].last) map[k].last=m.t;
    if(m.said) map[k].said=m.said;
  });
  return Object.values(map).sort((a,b)=>b.n-a.n);
}
function heatOf(id){
  if(!id) return '';
  const n=mistakes.filter(m=>m.id===id).length;
  if(n>=3) return 'hot';
  if(n>=1) return 'warm';
  return '';
}

function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function normalize(s){return(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\([^)]*\)/g,'').replace(/[^\p{L}\p{N}\s/]/gu,'').trim().replace(/\s+/g,' ')}
function stripAr(s){
  return String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'').trim();
}
function matchAns(typed,...acc){
  const t=normalize(typed);if(!t)return false;
  // Dutch/English path
  if(acc.flatMap(s=>String(s).split('/')).map(normalize).filter(Boolean).includes(t))return true;

function primeVoices(){

  const pick=()=>{
    try{
      const v=speechSynthesis.getVoices()||[];
      if(!v.length)return;
      voicesReady=true;
      const ar=v.filter(x=>/^ar(?:[-_]|$)/i.test(x.lang||'')||/arabic/i.test(x.name||''));
      if(ar.length){
        const pref=[/google/i,/microsoft/i,/enhanced/i,/premium/i,/natural/i,/maged/i,/tarik/i,/naayf/i];
        for(const re of pref){const f=ar.find(x=>re.test(x.name||''));if(f){arabicVoice=f;return}}

      }
    }catch(e){}
  };
  pick();

}

function unlockAudio(){ audioMuted=false;

  try{speechSynthesis.onvoiceschanged=()=>{refreshArVoices();primeVoices()};refreshArVoices()}catch(e){}
      speechSynthesis.cancel();
      if(speechSynthesis.resume)speechSynthesis.resume();
    }
  }catch(e){}
  if(!unlocked){

// Unieke stem-profielen per spreker (vast voor die naam)
const SPEAKER_PROFILES = {};
const MALE_PROFILES = [
  {rate:0.72, label:'m1'},
  {rate:0.95, label:'m2'},
  {rate:0.80, label:'m3'},
  {rate:1.08, label:'m4'},
  {rate:0.76, label:'m5'},
  {rate:1.00, label:'m6'},
];
const FEMALE_PROFILES = [
  {rate:0.92, label:'f1'},
  {rate:1.18, label:'f2'},
  {rate:1.02, label:'f3'},
  {rate:1.32, label:'f4'},
  {rate:0.96, label:'f5'},
  {rate:1.24, label:'f6'},
];
function profileForSpeaker(who, gender){
  const key=String(who||'onbekend');
  if(SPEAKER_PROFILES[key])return SPEAKER_PROFILES[key];
  const g=gender==='f'?'f':'m';
  const pool=g==='f'?FEMALE_PROFILES:MALE_PROFILES;
  // stabiele index uit naam
  let h=0;
  for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
  // unieke slot: prefer unused profile index
  const used=new Set(Object.values(SPEAKER_PROFILES).filter(p=>p.gender===g).map(p=>p.idx));
  let idx=h%pool.length;
  for(let k=0;k<pool.length;k++){
    const tryIdx=(idx+k)%pool.length;
    if(!used.has(tryIdx)){idx=tryIdx;break}
  }
  const base=pool[idx];
  const prof={rate:base.rate, gender:g, idx, label:base.label};
  SPEAKER_PROFILES[key]=prof;
  return prof;
}
function playBlobPitched(blob, gender, done, who){
  const myGen=audioGen;
  const prof=profileForSpeaker(who, gender);
  const url=URL.createObjectURL(blob);
  const a=getSharedAudio();
  try{a.pause()}catch(e){}
  a.onended=null;a.onerror=null;
  a.src=url;
  // Grote contrasten per spreker (fallback)
  const maleRates=[0.78,0.92,1.08,0.84,1.00,1.16];
  const femaleRates=[0.94,1.10,1.28,1.02,1.18,1.34];
  a.playbackRate=prof.gender==='f'?femaleRates[prof.idx%6]:maleRates[prof.idx%6];
  a.onended=()=>{try{URL.revokeObjectURL(url)}catch(e){}; if(myGen===audioGen&&done)done(true)};
  a.onerror=()=>{try{URL.revokeObjectURL(url)}catch(e){}; if(myGen===audioGen&&done)done(false)};
  activeAudio=a;
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{if(myGen===audioGen&&done)done(false)});
}


function playUrl(src,done){
  try{
    if(audioMuted){if(done)done(false);return}
    stopAudio();
    const a=new Audio();
    activeAudio=a;
    try{a.referrerPolicy='no-referrer'}catch(e){}
    a.setAttribute('referrerpolicy','no-referrer');
    a.setAttribute('playsinline','');
    a.setAttribute('webkit-playsinline','');
    a.preload='auto';
    let settled=false;
    const finish=ok=>{if(settled)return;settled=true;if(done)done(ok)};
    a.onended=()=>finish(true);
    a.onerror=()=>finish(false);
    a.src=src;
    const p=a.play();
    if(p&&p.catch)p.catch(()=>finish(false));
    setTimeout(()=>{if(!settled&&a.paused)finish(false)},4000);
  }catch(e){if(done)done(false)}
}

function playBlob(blob,done){
  try{
    const url=URL.createObjectURL(blob);
    playUrl(url,ok=>{
      try{URL.revokeObjectURL(url)}catch(e){}
      if(done)done(ok);
    });
  }catch(e){if(done)done(false)}
}

/* CORS-friendly Google TTS proxy (works on GitHub Pages) */
function ttsSpell(s){
  // Force audible i'rab: tanween ٌ/ٍ/ً → vowel + nūn
  let o='', t=String(s||'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(c==='ٌ') o+='ُنْ';
    else if(c==='ٍ') o+='ِنْ';
    else if(c==='ً'){
      o+='َنْ';
      if(t[i+1]==='ا') i++;
    }else o+=c;
  }
  return o;
}
function speakProxy(text,done){
  if(audioMuted){if(done)done(false);return}
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const url='https://tts-api.netlify.app/?text='+q+'&lang=ar';
  fetch(url,{mode:'cors',credentials:'omit',cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
    .then(blob=>{
      if(myGen!==audioGen){if(done)done(false);return}
      if(!blob||blob.size<400)throw new Error('empty');
      playBlob(blob,done);
    })
    .catch(()=>{
      if(myGen!==audioGen){if(done)done(false);return}
      playUrl(url,done);
    });
}

function speakGoogle(text,done){
  if(audioMuted){if(done)done(false);return}
  const myGen=audioGen;
  const q=encodeURIComponent(ttsSpell(text));
  const urls=[
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=ar&q='+q,
    'https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q='+q
  ];
  let i=0;
  function next(){
    if(myGen!==audioGen){if(done)done(false);return}
    if(i>=urls.length){if(done)done(false);return}
    const src=urls[i++];
    fetch(src,{referrerPolicy:'no-referrer',mode:'cors',credentials:'omit'})
      .then(r=>{if(!r.ok)throw new Error('http');return r.blob()})
      .then(blob=>{
        if(myGen!==audioGen){if(done)done(false);return}
        if(!blob||blob.size<400)throw new Error('empty');
        playBlob(blob,done);
      })
      .catch(()=>{
        if(myGen!==audioGen){if(done)done(false);return}
        playUrl(src,ok=>{if(myGen!==audioGen)return; if(ok){if(done)done(true)}else next()});
      });
  }
  next();
}

function namePhonetic(who){
  if(!who)return '';
  if(NAME_TRANSLIT[who])return NAME_TRANSLIT[who];
  const strip=String(who).replace(/[\u064B-\u065F\u0670\u0640]/g,'');
  if(NAME_TRANSLIT[strip])return NAME_TRANSLIT[strip];
  for(const [k,v] of Object.entries(NAME_TRANSLIT)){
    if(k.replace(/[\u064B-\u065F\u0670]/g,'')===strip)return v;
  }
  return '';
}
function genderOf(who){
  if(!who)return 'm';
  const raw=String(who);
  const w=raw.replace(/[\u064B-\u065F\u0670\u0640]/g,'').trim();
  for(const f of FEMALE_NAMES){
    const fn=String(f).replace(/[\u064B-\u065F\u0670\u0640]/g,'').trim();
    if(fn && w===fn) return 'f';
  }
  if(/ة$/.test(w) || /ى$/.test(w)) return 'f';
  return 'm';
}
let maleArVoices=[], femaleArVoices=[], allArVoices=[];
function refreshArVoices(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices()||[];
  allArVoices=vs.filter(v=>/ar[-_]?/i.test(v.lang||'')||/arab/i.test(v.name||''));
  femaleArVoices=allArVoices.filter(v=>/female|woman|zira|samantha|hedda|naayf|mouna|salma|laila|hala|noura|female/i.test(v.name));
  maleArVoices=allArVoices.filter(v=>/male|man|david|mark|naayf|maged|fahed|talal|male/i.test(v.name));
  // If no gendered names, split list: first half male preference, second female
  if(!femaleArVoices.length && !maleArVoices.length && allArVoices.length){
    maleArVoices=allArVoices.slice(0, Math.ceil(allArVoices.length/2));
    femaleArVoices=allArVoices.slice(Math.floor(allArVoices.length/2));
  }
  if(!maleArVoices.length)maleArVoices=allArVoices.slice();
  if(!femaleArVoices.length)femaleArVoices=allArVoices.slice();
  if(allArVoices.length && !arabicVoice)arabicVoice=allArVoices[0];
}
const speakerVoiceIndex={};
function pickVoiceFor(who){
  refreshArVoices();
  const g=genderOf(who);
  const pool=g==='f'?(femaleArVoices.length?femaleArVoices:allArVoices):(maleArVoices.length?maleArVoices:allArVoices);
  if(!pool.length)return null;
  // stable voice per speaker name
  if(speakerVoiceIndex[who]==null){
    speakerVoiceIndex[who]=Object.keys(speakerVoiceIndex).length % pool.length;
  }
  return pool[speakerVoiceIndex[who] % pool.length];
}

function localLineSrc(text, who){
  const t=String(text||'').trim();
  if(!t) return '';
  const w=String(who||'').trim();
  // unieke stem per persoon (naam + zin)
  if(w) return 'audio/l/'+fnv1a(w+'\t'+t)+'.mp3?'+AUDIO_VER;
  return 'audio/l/'+fnv1a(genderOf(w)+'\t'+t)+'.mp3?'+AUDIO_VER;
}
function localLineSrcLegacy(text, who){
  const t=String(text||'').trim();
  if(!t) return '';
  return 'audio/l/'+fnv1a(genderOf(who||'')+'\t'+t)+'.mp3?'+AUDIO_VER;
}
function speakFile(src, done, onStart){
  if(!src){if(done)done(false);return}
  const myGen=audioGen;
  try{
    const a=new Audio();
    try{a.referrerPolicy='no-referrer'}catch(e){}
    a.setAttribute('playsinline','');
    a.setAttribute('webkit-playsinline','');
    a.preload='auto';
    let settled=false, started=false;
    const finish=ok=>{
      if(settled||myGen!==audioGen)return;
      settled=true;
      clearTimeout(tm);
      clearInterval(poll);
      try{a.onended=null;a.onerror=null;a.onplaying=null;a.ontimeupdate=null}catch(e){}
      if(done)done(!!ok);
    };
    const markStarted=()=>{
      if(started||myGen!==audioGen)return;
      started=true;
      clearTimeout(tm);
      try{if(onStart)onStart()}catch(e){}
    };
    a.onplaying=markStarted;
    a.ontimeupdate=()=>{if(a.currentTime>0.02)markStarted()};
    a.onended=()=>finish(true);
    a.onerror=()=>{if(!started)finish(false)};
    activeAudio=a;
    a.src=src;
    const p=a.play();
    if(p&&p.then)p.catch(()=>{if(!started)finish(false)});
    const poll=setInterval(()=>{
      if(myGen!==audioGen){clearInterval(poll);return}
      if(!a.paused&&a.currentTime>0.02)markStarted();
    },80);
    const tm=setTimeout(()=>{if(!started)finish(false)},2800);
  }catch(e){if(done)done(false)}
}

function speakWord(word,force){
  if(audioMuted && !force)return;
  if(!autoSpeak && !force)return;
  audioMuted=false;
  const t=String(word&&word.ar||word||'').trim();
  if(!t)return;
  unlockAudio();
  stopAudio();
  const myGen=audioGen;
  let usedLocal=false;
  const fallback=()=>{
    if(usedLocal||myGen!==audioGen)return;
    speakProxy(t,ok1=>{
      if(usedLocal||myGen!==audioGen)return;
      if(ok1)return;
      speakGoogle(t,ok2=>{
        if(usedLocal||myGen!==audioGen)return;
        if(ok2)return;
        speakWeb(t);
      });
    });
  };
  const local=localWordSrc(word);
  if(!local){fallback();return}
  speakFile(local, ok=>{
    if(usedLocal||myGen!==audioGen)return;
    if(ok)return;
    fallback();
  }, ()=>{usedLocal=true});
}

function playLines(lines,i){
  const gen=playLinesGen;
  if(audioMuted)return;
  if(gen!==playLinesGen)return;
  if(!lines||i>=lines.length)return;
  const item=lines[i];
  const t=String(item&&item.ar!=null?item.ar:item||'').trim();
  const who=item&&item.who||'';
  if(!t){playLines(lines,i+1);return}
  if(i+1<lines.length){
    const nxt=lines[i+1];
    const src=localLineSrc(String(nxt&&nxt.ar!=null?nxt.ar:nxt||'').trim(), nxt&&nxt.who||'');
    if(src){try{const pre=new Audio(); pre.preload='auto'; pre.src=src}catch(e){}}
  }
  speakDialogueLine(t, who, ()=>{
    if(gen!==playLinesGen)return;
    playLinesTimer=setTimeout(()=>{
      if(gen!==playLinesGen)return;
      playLines(lines,i+1);
    }, 70);
  });
}

function normAr(s){
  return String(s||'')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function arTokensRaw(s){
  return String(s||'').replace(/[؟?!.،,؛:…]+/g,' ').split(/\s+/).filter(Boolean);
}
function arTokens(s){
  return normAr(s).split(/\s+/).filter(Boolean);
}
function endingClass(s){
  let t=String(s||'').replace(/[؟?!.،,؛:…«»"'\s]+$/g,'');
  if(!t)return '';
  if(/ًا$/.test(t) || (t.endsWith('ا') && t.length>=2 && t.slice(-3,-1).indexOf('ً')>=0)) return 'an';
  let i=t.length-1, marks='';
  while(i>=0 && /[\u064B-\u065F\u0670]/.test(t[i])){ marks=t[i]+marks; i--; }
  if(marks.indexOf('ٌ')>=0) return 'un';
  if(marks.indexOf('ٍ')>=0) return 'in';
  if(marks.indexOf('ً')>=0) return 'an';
  if(marks.indexOf('ُ')>=0) return 'u';
  if(marks.indexOf('ِ')>=0) return 'i';
  if(marks.indexOf('َ')>=0) return 'a';
  if(marks.indexOf('ْ')>=0) return 'sukun';
  return '';
}

  }[cls]||'');
}
function splitTash(raw){
  let t=String(raw||'');
  let punct='';
  const pm=t.match(/[؟?!.،,؛:…]+$/);
  if(pm){ punct=pm[0]; t=t.slice(0, -punct.length); }
  if(/ًا$/.test(t)) return {stem:t.slice(0,-2), tash:'ًا', punct};
  let i=t.length-1, marks='';
  while(i>=0 && /[\u064B-\u065F\u0670]/.test(t[i])){ marks=t[i]+marks; i--; }
  if(!marks && t.endsWith('ا') && t.length>=3 && t[t.length-2]==='ً'){
    return {stem:t.slice(0,-2), tash:t.slice(-2), punct};
  }
  return {stem:t.slice(0,i+1), tash:marks, punct};
}
function wrapTash(raw, kind){
  const s=splitTash(raw);
  const inner=esc(s.stem)+(s.tash?('<span class="tash">'+esc(s.tash)+'</span>'):'')+esc(s.punct);
  const k=kind||'wait';
  const tap=k!=='plain';
  return '<span class="tok-'+k+'"'+(tap?(' data-act="tok-tap" data-ar="'+esc(raw)+'"'):'')+'>'+inner+'</span>';
}
function markAr(s, kind){
  return arTokensRaw(s).map(t=>wrapTash(t, kind||'plain')).join(' ');
}

function foldAr(s){
  return normAr(s)
    .replace(/ط/g,'ت')
    .replace(/ض/g,'د')
    .replace(/ص/g,'س')
    .replace(/ظ/g,'ز')
    .replace(/ق/g,'ك')
    .replace(/[ءئؤ]/g,'');
}
function foldLat(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z]/g,'')
    .replace(/oen/g,'un').replace(/oun/g,'un').replace(/uen/g,'un')
    .replace(/oe/g,'u')
    .replace(/aa/g,'a').replace(/ee/g,'i').replace(/ii/g,'i')
    .replace(/uu/g,'u').replace(/oo/g,'u').replace(/ou/g,'u')
    .replace(/kh/g,'k').replace(/th/g,'t').replace(/dh/g,'d')
    .replace(/sh/g,'s').replace(/gh/g,'g')
    .replace(/q/g,'k');
}
function latinScore(said, expected, word){
  const raw=String(said||'');
  if(!/[a-zA-Z]/.test(raw)) return 0;
  const a0=foldLat(raw);
  if(a0.length<2) return 0;
  const vars=[a0, a0.replace(/e/g,'i'), a0.replace(/e/g,'a')];
  const cands=[];
  if(word&&word.translit) cands.push(word.translit);
  cands.push(romanizeAr(expected||(word&&word.ar)||''));
  let best=0;
  for(const a of vars){
  for(const c of cands){
    const b=foldLat(c);
    if(!b) continue;
    if(a===b) best=Math.max(best,1);
    else if(a===b+'n'||a===b+'un'||a===b+'in'||a===b+'an') best=Math.max(best,0.96);
    else if(b===a+'n'||b===a+'un'||b===a+'in') best=Math.max(best,0.9);
    else if(b.startsWith(a) && a.length>=Math.max(3, b.length-3)) best=Math.max(best,0.88);
    else if(a.startsWith(b) && b.length>=3 && a.length<=b.length+3) best=Math.max(best,0.88);
    else {
      const grams=s=>{const g=new Set(); for(let i=0;i<Math.max(0,s.length-1);i++)g.add(s.slice(i,i+2)); return g};
      const A=grams(a), B=grams(b);
      if(A.size&&B.size){
        let inter=0; for(const x of A) if(B.has(x)) inter++;
        best=Math.max(best, 2*inter/(A.size+B.size));
      }
    }
  }
  }
  return best;
}
function arScore(said, expected, word){
  const a0=normAr(said), b0=normAr(expected);
  const a=foldAr(said), b=foldAr(expected);
  let s=0;
  if(a&&b){
    if(a0===b0 || a===b) s=1;
    else if(a===b+'ن'||a===b+'ون'||a===b+'ين'||a===b+'ان'||a===b+'و'||a===b+'ا') s=0.95;
    else if(b===a+'ن'||b===a+'ون'||b===a+'ا'||a===b.slice(0,-1)||b===a.slice(0,-1)) s=0.9;
    else if(a.indexOf(b)>=0 || b.indexOf(a)>=0){
      const shorter=a.length<b.length?a:b, longer=a.length<b.length?b:a;
      if(shorter.length>=3) s=Math.max(s, 0.72+0.18*(shorter.length/longer.length));
    }
    else {
      const grams=x=>{const g=new Set(); for(let i=0;i<Math.max(0,x.length-1);i++)g.add(x.slice(i,i+2)); return g};
      const A=grams(a), B=grams(b);
      if(A.size&&B.size){
        let inter=0; for(const g of A) if(B.has(g)) inter++;
        s=2*inter/(A.size+B.size);
      }
      const ac=a.replace(/[اويىه]/g,''), bc=b.replace(/[اويىه]/g,'');
      if(ac&&bc&&(ac===bc || ac.indexOf(bc)>=0 || bc.indexOf(ac)>=0)) s=Math.max(s,0.82);
    }
  }
  const lat=latinScore(said, expected, word);
  return Math.max(s, lat);
}

function endLabel(cls){
  return ({
    un:'-un ٌ', in:'-in ٍ', an:'-an ً',
    u:'-u ُ', i:'-i ِ', a:'-a َ',
    sukun:'sukūn ْ', drop:'geen uitgang', tan:'tanwīn -n',
    '':'onzeker'
  })[cls]||cls||'onzeker';
}
function splitLatEnd(s){
  const a0=foldLat(s);
  const vars=[a0];
  if(a0){
    const ei=a0.replace(/e/g,'i'); if(ei!==a0) vars.push(ei);
  }
  for(const a of vars){
    if(!a) continue;
    for(const e of ['un','in','an']){
      if(a.endsWith(e) && a.length>e.length+1) return {stem:a.slice(0,-e.length), end:e};
    }
    for(const e of ['u','i']){
      if(a.endsWith(e) && a.length>e.length+1) return {stem:a.slice(0,-e.length), end:e};
    }
  }
  return {stem:a0, end:''};
}
function textHeardEnd(said, expected, word){
  const raw=String(said||'');
  if(!raw.trim()) return {cls:'', conf:0, src:''};
  const want=endingClass(expected);
  const fam=endingFamily(want);
  const tail=raw.replace(/[؟?!.،,؛:\s]+$/g,'');
  if(/ٌ/.test(tail.slice(-2))) return {cls:'un', conf:1, src:'tash'};
  if(/ٍ/.test(tail.slice(-2))) return {cls:'in', conf:1, src:'tash'};
  if(/ً/.test(tail.slice(-3))) return {cls:'an', conf:1, src:'tash'};
  if(/ُ/.test(tail.slice(-1))) return {cls:'u', conf:0.95, src:'tash'};
  if(/ِ/.test(tail.slice(-1))) return {cls:'i', conf:0.95, src:'tash'};
  if(/َ/.test(tail.slice(-1))) return {cls:'a', conf:0.95, src:'tash'};
  if(/[a-zA-Z]/.test(raw)){
    const got=splitLatEnd(raw);
    if(got.end){
      // iOS waqf/pause often yields latin -a for a correct -un. Ignore that.
      if(got.end==='a' && fam==='tan') return {cls:'', conf:0.12, src:'lat'};
      const tanEnd=isTan(got.end);
      const conf=tanEnd?0.93:0.84;
      return {cls:got.end, conf, src:'lat'};
    }
    const wantLat=foldLat((word&&word.translit)||'');
    const saidLat=foldLat(raw);
    if(wantLat && saidLat===wantLat && wantLat.length>=3 && want){

let rollStream=null, rollCtx=null, rollProc=null, rollSrc=null, rollGain=null, rollWork=null, rollAn=null, rollRaf=0;
let rollBuf=null, rollPos=0, rollSr=16000, rollFilled=0;
async function startRoll(){

    rollStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    const AC=window.AudioContext||window.webkitAudioContext;

    rollSr=rollCtx.sampleRate||16000;
    rollBuf=new Float32Array(Math.floor(rollSr*2.8));
    rollPos=0; rollFilled=0;
    rollSrc=rollCtx.createMediaStreamSource(rollStream);
    const push=d=>{
      if(!d||!d.length||!rollBuf) return;
      for(let i=0;i<d.length;i++){
        rollBuf[rollPos]=d[i];
        rollPos=(rollPos+1)%rollBuf.length;
        if(rollFilled<rollBuf.length) rollFilled++;
      }
    };
    let started=false;
    if(rollCtx.audioWorklet){
      try{
        const code='class Cap extends AudioWorkletProcessor{process(i){const x=i[0]&&i[0][0];if(x)this.port.postMessage(x);return true}}registerProcessor("alm-cap",Cap)';
        const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
        await rollCtx.audioWorklet.addModule(url);
        try{URL.revokeObjectURL(url)}catch(e){}
        rollWork=new AudioWorkletNode(rollCtx,'alm-cap');
        rollWork.port.onmessage=e=>push(e.data);
        rollSrc.connect(rollWork);
        rollGain=rollCtx.createGain(); rollGain.gain.value=0.0001;
        rollWork.connect(rollGain); rollGain.connect(rollCtx.destination);
        started=true;
      }catch(e){ started=false; }
    }
    if(!started && rollCtx.createScriptProcessor){
      rollProc=rollCtx.createScriptProcessor(4096,1,1);
      rollProc.onaudioprocess=e=>push(e.inputBuffer.getChannelData(0));
      rollGain=rollCtx.createGain(); rollGain.gain.value=0.0001;
      rollSrc.connect(rollProc); rollProc.connect(rollGain); rollGain.connect(rollCtx.destination);
      started=true;
    }
    if(!started){
      rollAn=rollCtx.createAnalyser();
      rollAn.fftSize=2048;
      rollSrc.connect(rollAn);
      const tmp=new Float32Array(rollAn.fftSize);
      const hop=Math.max(64, Math.floor(rollSr*0.02));
      const tick=()=>{
        if(!rollAn) return;
        try{rollAn.getFloatTimeDomainData(tmp)}catch(e){return}
        push(tmp.subarray(Math.max(0,tmp.length-hop)));
        rollRaf=requestAnimationFrame(tick);
      };
      tick();
    }
    startClip(rollStream);
    const t0=Date.now();
    while(rollFilled<(rollSr*0.04) && Date.now()-t0<900){
      await new Promise(r=>setTimeout(r,40));
    }

  }catch(e){ stopRoll(); return false; }

function stopRoll(){

  rollRaf=0;
  try{if(rollWork){rollWork.port.onmessage=null;rollWork.disconnect()}}catch(e){}
  try{if(rollAn) rollAn.disconnect()}catch(e){}
  try{if(rollProc){rollProc.onaudioprocess=null;rollProc.disconnect()}}catch(e){}
  try{if(rollSrc)rollSrc.disconnect()}catch(e){}
  try{if(rollGain)rollGain.disconnect()}catch(e){}

function rollSamples(sec){

function downsample16k(x, sr){
  const target=16000;
  if(Math.abs(sr-target)<80) return {x:x, sr:sr};
  const ratio=sr/target;
  const n=Math.max(8, Math.floor(x.length/ratio));
  const y=new Float32Array(n);
  for(let i=0;i<n;i++){

    y[i]=a+(b-a)*f;

function bandE(w, sr, f0, f1){

  let s=0;
  const step=N>2400?2:1;
  for(let k=k0;k<=k1;k++){
    let re=0, im=0;
    const w0=2*Math.PI*k/N;
    for(let n=0;n<N;n+=step){
      const hann=0.5-0.5*Math.cos(2*Math.PI*n/N);
      const v=w[n]*hann;
      re+=v*Math.cos(w0*n);
      im-=v*Math.sin(w0*n);
    }

    const expRaw=arTokensRaw(lines[idx].ar);
    const exp=expRaw.map(normAr);
    wordsTotal+=exp.length;
    const parts=[];
    let localOk=0;

    if(idx<lockCount){
      expRaw.forEach(w=>parts.push(wrapTash(w,'ok')));
      localOk=exp.length; wordsOk+=localOk; linesOk++;
      results.push({parts, localOk, ratio:1, state:'ok'});
      continue;
    }

    if(idx>reached){
      expRaw.forEach(w=>parts.push(wrapTash(w,'wait')));
      results.push({parts, localOk:0, ratio:0, state:'wait'});
      continue;
    }

    let c=cursor;
    let placedNow=false;
    for(let i=0;i<exp.length;i++){
      const w=exp[i];
      const raw=expRaw[i];
      let found=-1;
      for(let j=c;j<Math.min(got.length, c+4);j++){
        if(got[j]===w || arScore(got[j],w)>=0.8){found=j;break}
      }
      if(found>=0){
        parts.push(wrapTash(raw,'ok'));
        localOk++;
        c=found+1;
      }else if(live && c>=got.length){
        parts.push(wrapTash(raw, placedNow?'wait':'now'));
        placedNow=true;
      }else{
        parts.push(wrapTash(raw,'bad'));
        if(!live && localOk===0 && i===0) logMistake({ar:raw},'word', said);
      }
    }
    cursor=c;
    let ratio=exp.length?localOk/exp.length:0;
    if(ratio>=0.85 && !live){
      const last=expRaw[expRaw.length-1];
      const es=endingScoreFromRoll(last, said);
      if(es && es.cls && !es.skipped && !es.ok){
        parts[parts.length-1]=wrapTash(last,'haraka');
        localOk=Math.max(0, localOk-1);
        ratio=exp.length?localOk/exp.length:0;
        logMistake({ar:last},'haraka', said);
      }
    }
    wordsOk+=localOk;
    let state='bad';
    if(ratio>=0.85){state='ok'; linesOk++}
    else if(ratio>=0.4) state='mid';
    else if(live && localOk===0) state='wait';
    else state='bad';

    // Pas volgende zin openen als deze grotendeels klopt
    if(ratio>=0.7 || localOk===exp.length){
      reached=Math.max(reached, idx+1);
    }
    results.push({parts, localOk, ratio, state});
  }

  results.forEach((r, idx)=>{
    const el=lineEls[idx];
    if(!el)return;
    el.classList.remove('line-ok','line-bad','line-mid','line-active');
    if(r.state==='ok') el.classList.add('line-ok');
    else if(r.state==='mid') el.classList.add('line-mid');
    else if(r.state==='bad') el.classList.add('line-bad');
    // huidige zin = laatste bereikte die nog niet ok is, of de active
    if(live && idx===Math.min(reached, lines.length-1)) el.classList.add('line-active');
    const ar=el.querySelector('.ar');
    if(ar){ ar.classList.add('ar-mark'); ar.innerHTML=r.parts.join(' '); }
  });

  const pct=wordsTotal?Math.round(100*Math.min(wordsOk,wordsTotal)/wordsTotal):0;
  return {linesOk, linesTotal:lines.length, wordsOk:Math.min(wordsOk,wordsTotal), wordsTotal, pct, reached};
}

  let interim='';
  let stopped=false;
  let sessionId=Date.now();
  // checkpoint[i] = finalText nadat zin i-1 goed was (startpunt voor zin i)
  let checkpoints=['']; // index 0 = begin
  let currentLine=0;
  let lockCount=0;

  window._dlgSession=sessionId;
  window._dlgListening=true;
  window._dlgLines=lines;
  window._dlgResultEl=resultEl;

  const saidNow=()=>(finalText+' '+interim).trim();

  /** Bepaal welke zin de gebruiker nu moet zeggen (eerste niet-ok). */
  const firstOpenLine=(g)=>{
    // reached = hoogste open index; als zin reached-1 nog niet ok, die hernemen
    for(let i=0;i<lines.length;i++){
      // schat via DOM classes
      const el=document.querySelectorAll('.book-line')[i];
      if(!el || !el.classList.contains('line-ok')) return i;
    }
    return Math.max(0, lines.length-1);
  };

  const updateCheckpoints=(g)=>{
    // Als een zin ok is, sla checkpoint op voor de volgende
    const els=document.querySelectorAll('.book-line');
    let done=0;
    for(let i=0;i<els.length;i++){
      if(els[i].classList.contains('line-ok')){
        done=i+1;
        if(checkpoints.length<=done){
          // tekst tot nu (alleen finals) als start voor volgende zin
          checkpoints[done]=finalText.trim();
        }
      } else break;
    }
    currentLine=Math.max(lockCount, done);
  };

  const paintLive=()=>{
    if(stopped || window._dlgSession!==sessionId)return;
    lastSaid=saidNow();

          '<button type="button" class="btn btn-secondary btn-sm" data-act="dlg-peek">👁 Kijk</button>'+

      status=resultEl.querySelector('.dlg-status');

    if(status) status.textContent=window._dlgListening?('🎤 Zeg zin '+zin+(hideText?' · tekst verborgen':'')):'⏸️ Gepauzeerd';
