const MEDINA_INTRO = {"title":"Uitleg van bepaalde grammaticale termen en symbolen","subtitle":"Grammaticaboek Medina-methode · Deel 1 · blz. 11","items":[{"term":"Fathah (فَتْحَة)","sym":"بَ","ar":"بَ","tr":"ba","desc":"Een schuin streepje boven een letter; het staat voor een korte «a»."},{"term":"Kasrah (كَسْرَة)","sym":"بِ","ar":"بِ","tr":"bie","desc":"Een schuin streepje onder een letter; het staat voor een korte «ie»."},{"term":"Dammah (ضَمَّة)","sym":"بُ","ar":"بُ","tr":"boe","desc":"Een symbool dat lijkt op een komma boven een letter; het staat voor een korte «oe»."},{"term":"Soekoen (سُكُون)","sym":"بْ","ar":"بْ","tr":"b","desc":"Geeft aan dat een letter klinkerloos is."},{"term":"Shaddah (شَدَّة)","sym":"بَّ","ar":"بَّ","tr":"bba","desc":"Staat voor een verdubbeling van een letter."},{"term":"Tanwien (تَنْوِين)","sym":"بٌ / بٍ / بً","ar":"كِتَابٌ","tr":"kitaaboe-n","desc":"Dubbele klinker aan het einde van een naamwoord (-oen, -ien, -an); staat voor het onbepaald lidwoord «een»."}]};
const READER_8_INFO = {"title":"Verdieping · Madinah Arabic Reader – Deel 8 (Dr. V. Abdur Rahim)","subtitle":"Bonus-oefeningen uit het tweede PDF-bestand: الظُّرُوف (المَفْعُولُ فِيهِ) & vergevorderde Medina-constructies","desc":"In jouw Downloads-map staat naast Deel 1 ook «Madinah Arabic Reader - 8 (2019)». Dat is het gevorderde deel (Les 1 behandeld o.a. المَفْعُولُ فِيهِ — bijwoorden van tijd en plaats zoals أَمَامَ، خَلْفَ، تَحْتَ، الْآنَ، الْيَوْمَ die je in Les 5, 8 en 9 al bent tegengekomen!). Hieronder kun je de kernregels uit Reader 8 direct raadplegen.","rules":[{"term":"المَفْعُولُ فِيهِ (Zarf Zamaan & Zarf Makaan)","ar":"جَلَسَ الطَّالِبُ أَمَامَ الْمُدَرِّسِ الْيَوْمَ","nl":"Woorden van plaats (ظَرْفُ مَكَانٍ zoals أَمَامَ vóór, خَلْفَ achter, تَحْتَ onder, عِنْدَ bij) en tijd (ظَرْفُ زَمَانٍ zoals الْيَوْمَ vandaag, الْآنَ nu, لَيْلًا 's nachts) staan zelf in de Mansoeb-vorm (-a) en maken het naamwoord erna Madjroer (-ie)."},{"term":"لَوْ الشَّرْطِيَّة (Voorwaardelijke zin met لَوْ)","ar":"لَوْ اجْتَهَدْتَ لَنَجَحْتَ","nl":"In Reader 8 (Les 1) leer je ook لَوْ («als… zou…»): een niet-vervulde voorwaarde in het verleden, waarbij het antwoord vaak begint met لَـ (bijv. «Als je hard had gestudeerd, was je geslaagd»)."},{"term":"اسْمُ الْآلَةِ (Werktuignaam: مِفْعَالٌ / مِفْعَلَةٌ)","ar":"مِفْتَاحٌ · مِلْعَقَةٌ · مِكْوَاةٌ · مِرْوَحَةٌ","nl":"Veel voorwerpen uit Deel 1 (Les 1, 6 en 9) volgen het Medina-patroon voor werktuigen (Ism al-Aalah): مِفْتَاحٌ (sleutel, van فَتَحَ openen), مِلْعَقَةٌ (lepel), مِكْوَاةٌ (strijkijzer) en مِرْوَحَةٌ (ventilator)."}]};
const GRAMMAR = {"1":{"title":"هَذَا · Tanwien (-n) · Vragen met أَ · مَا en مَنْ","summary":"Les 1 uit het Grammaticaboek Medina-methode Deel 1 (blz. 13–14) — aanwijzend voornaamwoord هَذَا, onbepaald lidwoord (tanwien) en vraagzinnen.","points":["In deze les leren we: مَا هَذَا؟ (Wat is dit?), هَذَا كِتَابٌ (Dit is een boek), أَهَذَا بَيْتٌ؟ (Is dit een huis?), نَعَمْ / لَا en مَنْ هَذَا؟ (Wie is dit?).","1. Het woord هَذَا wordt uitgesproken als هَاذَا (haadhaa), maar wordt geschreven zonder de eerste Alief.","2. Het Arabisch heeft geen koppelwerkwoord dat overeenkomt met het Nederlandse «is».","3. De n-klank aan het eind van een Arabisch naamwoord (kitaaboe-n, baitoe-n, masdjidoe-n) is het Arabische onbepaald lidwoord («een») en heet Tanwien.","4. Een zin verandert in een ja/nee-vraag wanneer het partikel أَ aan het begin van de zin wordt geplaatst. Gebruik مَا voor dingen/dieren en مَنْ voor personen."],"cards":[{"sec":"Kern van Les 1 (blz. 13)","lead":"In deze les leren we de basisvragen en aanwijzende zinnen met هَذَا («dit»):","ps":["Bestudeer en beluister de zes kernzinnen uit het boek. Let op de eindklank «-oen» (tanwien) bij elk zelfstandig naamwoord."],"ex":[{"ar":"مَا هَذَا؟","nl":"Wat is dit? (voor dingen en dieren)"},{"ar":"هَذَا كِتَابٌ.","nl":"Dit is een boek."},{"ar":"أَهَذَا بَيْتٌ؟","nl":"Is dit een huis?"},{"ar":"نَعَمْ، هَذَا بَيْتٌ.","nl":"Ja, dit is een huis."},{"ar":"لَا، هَذَا مَسْجِدٌ.","nl":"Nee, dit is een moskee."},{"ar":"مَنْ هَذَا؟","nl":"Wie is dit? (voor verstandhebbende wezens / personen)"}]},{"sec":"Merk op · Regel 1 & 2 (blz. 13)","lead":"1. Uitspraak van هَذَا en het ontbreken van «is»:","ps":["1. Het woord هَذَا betekent «dit». Het wordt uitgesproken als هَاذَا (haadhaa), met een lange aa-klank na de هـ, maar het wordt geschreven zonder de eerste Alief.","2. Het Arabisch heeft geen woord dat overeenkomt met het Nederlandse koppelwerkwoord «is». Tussen het onderwerp (هَذَا) en het gezegde (كِتَابٌ) staat dus geen extra woord."], ,"nl":"Wie is dit? (voor verstandhebbende wezens / personen)"},{"h":"Merk op · Regel 1 & 2 (blz. 13)"},{"p":"1. Uitspraak van هَذَا en het ontbreken van «is»:"},{"p":"1. Het woord هَذَا betekent «dit». Het wordt uitgesproken als هَاذَا (haadhaa), met een lange aa-klank na de هـ, maar het wordt geschreven zonder de eerste Alief."},{"p":"2. Het Arabisch heeft geen woord dat overeenkomt met het Nederlandse koppelwerkwoord «is». Tussen het onderwerp (هَذَا) en het gezegde (كِتَابٌ) staat dus geen extra woord."},{"ar":"هَذَا بَيْتٌ.","nl":"Dit [is] een huis. (haadhaa baitoen)"},{"ar":"هَذَا مَسْجِدٌ.","nl":"Dit [is] een moskee. (haadhaa masdjidoen)"},{"ar":"هَذَا بَابٌ.","nl":"Dit [is] een deur."},{"h":"Merk op · Regel 3 (blz. 13)"},{"p":"3. Tanwien (ـٌ): het Arabische onbepaald lidwoord («een»):"},{"p":"Er is geen apart woord in het Arabisch dat overeenkomt met het Nederlandse woord «een», zoals in «een boek»."},{"p":"De n-klank aan het eind van het Arabische naamwoord (kitaaboe-n, baitoe-n, masdjidoe-n) is het Arabische onbepaald lidwoord. Deze n-klank wordt in het Arabisch Tanwien (تَنْوِين) genoemd en wordt genoteerd met een dubbele Dammah (ـٌ)."},{"ar":"كِتَابٌ","nl":"kitaaboe-n — een boek"},{"ar":"بَيْتٌ","nl":"baitoe-n — een huis"},{"ar":"مَسْجِدٌ","nl":"masdjidoe-n — een moskee"},{"h":"Merk op · Regel 4 (blz. 13)"},{"p":"4. Vraagzinnen maken met أَ, مَا en مَنْ:"},{"p":"Een bevestigende zin verandert in een ja/nee-vraag wanneer het vraagpartikel أَ (hamzatoel-istifhaam) aan het begin van de zin wordt geplaatst."},{"p":"Voor open vragen gebruik je مَا («wat?», voor niet-verstandhebbenden zoals voorwerpen en dieren) en مَنْ («wie?», voor mensen)."},{"table":{"headers":["Bevestigende zin / Vraagwoord","Arabisch voorbeeld","Betekenis"],"rows":[["Mededelende zin","هَذَا بَيْتٌ.","Dit is een huis."],["Ja/nee-vraag met أَ","أَهَذَا بَيْتٌ؟","Is dit een huis?"],["Vraag naar dingen/dieren (مَا)","مَا هَذَا؟ هَذَا قَلَمٌ.","Wat is dit? Dit is een pen."],["Vraag naar personen (مَنْ)","مَنْ هَذَا؟ هَذَا طَبِيبٌ.","Wie is dit? Dit is een dokter."]]}},{"ar":"أَهَذَا قَلَمٌ؟ لَا، هَذَا مِفْتَاحٌ.","nl":"Is dit een pen? Nee, dit is een sleutel."},{"ar":"مَنْ هَذَا؟ هَذَا مُدَرِّسٌ.","nl":"Wie is dit? Dit is een leraar."},{"h":"Woordenlijst van Les 1 (blz. 14)"},{"p":"Woordenlijst van Les 1 (24 woorden)"},{"p":"نَجْمٌ een ster · قِطٌّ een kat · سَرِيرٌ een bed · حِمَارٌ een ezel · قَلَمٌ een pen · رَجُلٌ een man · بَيْتٌ een huis · دِيكٌ een haan · بَابٌ een deur · كَلْبٌ een hond · كُرْسِيٌّ een stoel · حِصَانٌ een paard · كِتَابٌ een boek · مُدَرِّسٌ een leraar · قَمِيصٌ een hemd · جَمَلٌ een kameel · طَبِيبٌ een dokter · طَالِبٌ een student · مِفْتَاحٌ een sleutel · مِنْدِيلٌ een zakdoek · مَكْتَبٌ een bureau · تَاجِرٌ een handelaar · مَسْجِدٌ een moskee · وَلَدٌ een kind, jongen"}]},"2":{"title":"ذَلِكَ (die/dat) · Voegwoord وَ (en)","summary":"Les 2 uit het Grammaticaboek Medina-methode Deel 1 (blz. 15–16) — verwijzen naar iets op afstand met ذَلِكَ en zinnen verbinden met وَ.","points":["In deze les leren we het gebruik van ذَلِكَ («die» of «dat») en وَ («en»).","1. ذَلِكَ wordt uitgesproken als ذَالِكَ (dhaalika), maar wordt geschreven zonder Alief.","2. Het woord وَ («en») wordt altijd vastgeschreven aan het volgende woord, zonder spatie erna."],"cards":[{"sec":"Kern van Les 2 (blz. 15)","lead":"In deze les leren we het gebruik van ذَلِكَ («die», «dat») en وَ («en»):","ps":["Waar هَذَا wijst naar iets dat dichtbij is («dit»), wijst ذَلِكَ naar iets dat verder weg is («dat» of «die», mannelijk enkelvoud)."],"table":{"headers":["Aanwijzend voornaamwoord","Uitspraak","Afstand","Voorbeeld"],"rows":[["هَذَا","haadhaa (هَاذَا)","Dichtbij («dit / deze»)","هَذَا بَيْتٌ (Dit is een huis)"],["ذَلِكَ","dhaalika (ذَالِكَ)","Veraf («dat / die»)","وَذَلِكَ مَسْجِدٌ (en dat is een moskee)"]]},"ex":[{"ar":"هَذَا بَيْتٌ، وَذَلِكَ مَسْجِدٌ.","nl":"Dit is een huis en dat is een moskee."},{"ar":"مَا ذَلِكَ؟ ذَلِكَ نَجْمٌ.","nl":"Wat is dat? Dat is een ster."}]},{"sec":"Merk op · Regel 1 & 2 (blz. 15)","lead":"Uitspraak van ذَلِكَ en schrijfwijze van وَ:","ps":["1. ذَلِكَ wordt uitgesproken als ذَالِكَ (dhaalika), maar dit woord wordt zonder de Alief geschreven.","2. Het woord وَ («en») wordt vlak bij het volgende woord geschreven; er staat dus geen spatie na وَ (bijv. وَذَلِكَ, niet وَ ذَلِكَ)."],"ex":[{"ar":"مَنْ هَذَا وَمَنْ ذَلِكَ؟","nl":"Wie is dit en wie is dat?"},{"ar":"هَذَا مُدَرِّسٌ وَذَلِكَ إِمَامٌ.","nl":"Dit is een leraar en dat is een imam."},{"ar":"مَا هَذَا؟ هَذَا حَجَرٌ.","nl":"Wat is dit? Dit is een steen."},{"ar":"هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ.","nl":"Dit is suiker en dat is melk."}]},{"sec":"Woordenlijst van Les 2 (blz. 16)","lead":"Woordenlijst van Les 2 (4 nieuwe woorden)","ps":["حَجَرٌ een steen · إِمَامٌ een imam · سُكَّرٌ suiker · لَبَنٌ melk, yoghurt · ذَلِكَ dat / die (m.) · وَ en"],"ex":[]}],"examples":[{"ar":"مَا ذَلِكَ؟ ذَلِكَ نَجْمٌ.","nl":"Wat is dat? Dat is een ster."},{"ar":"هَذَا مَسْجِدٌ وَذَلِكَ بَيْتٌ.","nl":"Dit is een moskee en dat is een huis."},{"ar":"هَذَا حِصَانٌ وَذَلِكَ حِمَارٌ.","nl":"Dit is een paard en dat is een ezel."},{"ar":"أَذَلِكَ كَلْبٌ؟ لَا، ذَلِكَ قِطٌّ.","nl":"Is dat een hond? Nee, dat is een kat."},{"ar":"مَا ذَلِكَ؟ ذَلِكَ سَرِيرٌ.","nl":"Wat is dat? Dat is een bed."},{"ar":"مَنْ هَذَا وَمَنْ ذَلِكَ؟ هَذَا مُدَرِّسٌ وَذَلِكَ إِمَامٌ.","nl":"Wie is dit en wie is dat? Dit is een leraar en dat is een imam."},{"ar":"مَا ذَلِكَ؟ ذَلِكَ حَجَرٌ.","nl":"Wat is dat? Dat is een steen."},{"ar":"هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ.","nl":"Dit is suiker en dat is melk."}],"exercises":[{"q":"Hoe wordt ذَلِكَ uitgesproken volgens blz. 15?","options":["Als ذَالِكَ (dhaalika), met een lange aa-klank na de ذ","Als «dhalika» met een korte a","Als «dhoelika»","Als «tilka»"],"answer":0,"explain":"ذَلِكَ wordt uitgesproken als ذَالِكَ (dhaalika), maar zonder Alief geschreven."},{"q":"Hoe wordt het voegwoord وَ («en») in het Arabisch geschreven?","options":["Vast aan het volgende woord, zonder spatie erna (bijv. وَذَلِكَ)","Los met een spatie voor en na","Vast aan het vorige woord","Alleen aan het einde van een zin"],"answer":0,"explain":"Het woord وَ wordt altijd direct vastgeschreven aan het woord dat erop volgt."},{"q":"Vul aan: هَذَا مُدَرِّسٌ ... إِمَامٌ (Dit is een leraar en dat is een imam).","options":["وَذَلِكَ","وَهَذَا","أَذَلِكَ","مَا ذَلِكَ"],"answer":0,"explain":"وَذَلِكَ verbindt het tweede deel («en dat is…»)."},{"q":"Wat betekent: هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ.","options":["Dit is suiker en dat is melk.","Dit is melk en dat is suiker.","Dit is een steen en dat is suiker.","Dat is suiker en dit is water."],"answer":0,"explain":"سُكَّرٌ = suiker, لَبَنٌ = melk / yoghurt."},{"q":"Hoe vraag je in het Arabisch: «Is dat een kat?»","options":["أَذَلِكَ قِطٌّ؟","أَهَذَا قِطٌّ؟","مَا ذَلِكَ قِطٌّ؟","مَنْ ذَلِكَ؟"],"answer":0,"explain":"अَ (vraagpartikel) + ذَلِكَ (dat) + قِطٌّ (een kat) = أَذَلِكَ قِطٌّ؟."},{"q":"Wat betekent het woord حَجَرٌ?","options":["een steen","een imam","suiker","een paard"],"answer":0,"explain":"حَجَرٌ betekent «een steen» (blz. 16)."}],"fullText":[{"h":"Kern van Les 2 (blz. 15)"},{"p":"In deze les leren we het gebruik van ذَلِكَ («die», «dat») en وَ («en»):"},{"p":"Waar هَذَا wijst naar iets dat dichtbij is («dit»), wijst ذَلِكَ naar iets dat verder weg is («dat» of «die», mannelijk enkelvoud)."},{"table":{"headers":["Aanwijzend voornaamwoord","Uitspraak","Afstand","Voorbeeld"],"rows":[["هَذَا","haadhaa (هَاذَا)","Dichtbij («dit / deze»)","هَذَا بَيْتٌ (Dit is een huis)"],["ذَلِكَ","dhaalika (ذَالِكَ)","Veraf («dat / die»)","وَذَلِكَ مَسْجِدٌ (en dat is een moskee)"]]}},{"ar":"هَذَا بَيْتٌ، وَذَلِكَ مَسْجِدٌ.","nl":"Dit is een huis en dat is een moskee."},{"ar":"مَا ذَلِكَ؟ ذَلِكَ نَجْمٌ.","nl":"Wat is dat? Dat is een ster."},{"h":"Merk op · Regel 1 & 2 (blz. 15)"},{"p":"Uitspraak van ذَلِكَ en schrijfwijze van وَ:"},{"p":"1. ذَلِكَ wordt uitgesproken als ذَالِكَ (dhaalika), maar dit woord wordt zonder de Alief geschreven."},{"p":"2. Het woord وَ («en») wordt vlak bij het volgende woord geschreven; er staat dus geen spatie na وَ (bijv. وَذَلِكَ, niet وَ ذَلِكَ)."},{"ar":"مَنْ هَذَا وَمَنْ ذَلِكَ؟","nl":"Wie is dit en wie is dat?"},{"ar":"هَذَا مُدَرِّسٌ وَذَلِكَ إِمَامٌ.","nl":"Dit is een leraar en dat is een imam."},{"ar":"مَا هَذَا؟ هَذَا حَجَرٌ.","nl":"Wat is dit? Dit is een steen."},{"ar":"هَذَا سُكَّرٌ وَذَلِكَ لَبَنٌ.","nl":"Dit is suiker en dat is melk."},{"h":"Woordenlijst van Les 2 (blz. 16)"},{"p":"Woordenlijst van Les 2 (4 nieuwe woorden)"},{"p":"حَجَرٌ een steen · إِمَامٌ een imam · سُكَّرٌ suiker · لَبَنٌ melk, yoghurt · ذَلِكَ dat / die (m.) · وَ en"}]},"3":{"title":"Bepaald lidwoord الْ · Zonne- & Maanletters · Hamzatoel Wasl","summary":"Les 3 uit het Grammaticaboek Medina-methode Deel 1 (blz. 17–20) — bepaald lidwoord الْ, wegvallen van tanwien, 14 zonneletters en 14 maanletters.","points":["Het bepaald lidwoord in het Arabisch is الْ («al» = de/het). Wanneer الْ voor een naamwoord komt, valt de Tanwien (-n) aan het eind weg: بَيْتٌ → الْبَيْتُ.","Het Arabische alfabet heeft 28 letters: 14 Zonneletters (الْحُرُوفُ الشَّمْسِيَّةُ) waarbij de «l» van الْ assimileert (met Shaddah), en 14 Maanletters (الْحُرُوفُ الْقَمَرِيَّةُ) waarbij de «l» duidelijk hoorbaar blijft.","De «a» van الْ is een Hamzatoel Wasl (ٱ): zij wordt alleen aan het begin van een zin uitgesproken en valt weg in de uitspraak wanneer er een woord aan voorafgaat (وَالْبَيْتُ = wal-baitoe).","Bijvoeglijke naamwoorden die als gezegde dienen krijgen Tanwien, maar die vertaal je in het Nederlands niet met «een» (الْبَابُ مَفْتُوحٌ = De deur is open)."],"cards":[{"sec":"Kern van Les 3 (blz. 17)","lead":"Het bepaald lidwoord الْ («al») en het wegvallen van de Tanwien:","ps":["In deze les leren we het gebruik van het Arabische bepaald lidwoord «al» (الْ), dat overeenkomt met het Nederlandse «de» of «het».","Wanneer het bepaald lidwoord «al» vóór een naamwoord staat, valt de n-klank (de Tanwien) aan het eind van dat naamwoord weg. Een woord kan dus nooit tegelijk الْ én Tanwien hebben!"],"table":{"headers":["Onbepaald (met Tanwien)","Uitspraak","Bepaald (met الْ)","Uitspraak"],"rows":[["بَيْتٌ (een huis)","baitoe-n","الْبَيْتُ (het huis)","al-baitoe"],["كِتَابٌ (een boek)","kitaaboe-n","الْكِتَابُ (het boek)","al-kitaaboe"],["قَلَمٌ (een pen)","qalamoe-n","الْقَلَمُ (de pen)","al-qalamoe"],["جَمَلٌ (een kameel)","djamaloe-n","الْجَمَلُ (de kameel)","al-djamaloe"]]},"ex":[{"ar":"الْقَلَمُ مَكْسُورٌ.","nl":"De pen is gebroken."},{"ar":"الْبَابُ مَفْتُوحٌ.","nl":"De deur is open."},{"ar":"الْوَلَدُ جَالِسٌ، وَالْمُدَرِّسُ وَاقِفٌ.","nl":"De jongen zit en de leraar staat."}]},{"sec":"Zonneletters & Maanletters (blz. 17–18)","lead":"De 28 letters: 14 Zonneletters (الشَّمْسِيَّة) en 14 Maanletters (الْقَمَرِيَّة):","ps":["Het Arabische alfabet bestaat uit 28 letters. Hiervan zijn er 14 zonneletters en 14 maanletters.","Bij het uitspreken van de zonneletters raakt de punt van de tong het gehemelte of de voortanden. Wanneer «al» (ال) voorafgaat aan een zonneletter, wordt de «l» van «al» geassimileerd aan de eerste letter van het naamwoord. Op die eerste letter komt een Shaddah (ـّ).","Bij de 14 maanletters vindt géén assimilatie plaats: de «l» van الْ blijft duidelijk hoorbaar (zoals in الْقَمَرُ al-qamaroe)."],"ex":[{"ar":"الشَّمْسُ","nl":"ash-shamsoe (de zon — NIET al-shamsoe)"},{"ar":"النَّجْمُ","nl":"an-nadjmoe (de ster)"},{"ar":"الرَّجُلُ","nl":"ar-radjoeloe (de man)"},{"ar":"الدِّيكُ","nl":"ad-diekoe (de haan)"},{"ar":"السَّمَكُ","nl":"as-samakoe (de vis)"},{"ar":"الْقَمَرُ","nl":"al-qamaroe (de maan — maanletter, de l wordt uitgesproken)"}]},{"sec":"Overzichtstabel (blz. 19)","lead":"Volledige tabel van alle 14 Zonneletters en 14 Maanletters uit het boek:","ps":["Bestudeer het overzicht op blz. 19 van het boek: links de 14 zonneletters (met Shaddah na ال) en rechts de 14 maanletters (met Soekoen op de لْ)."],"table":{"headers":["Zonneletter (الشَّمْسِيَّة)","Voorbeeldwoord","Maanletter (الْقَمَرِيَّة)","Voorbeeldwoord"],"rows":[["ت","التَّاجِرُ (de handelaar)","أ","الْأَبُ (de vader)"],["ث","الثَّوْبُ (het kledingstuk)","ب","الْبَابُ (de deur)"],["د","الدِّيكُ (de haan)","ج","الْجَنَّةُ (het paradijs / de tuin)"],["ذ","الذَّهَبُ (het goud)","ح","الْحِمَارُ (de ezel)"],["ر","الرَّجُلُ (de man)","خ","الْخُبْزُ (het brood)"],["ز","الزَّهْرَةُ (de bloem)","ع","الْعَيْنُ (het oog)"],["س","السَّمَكُ (de vis)","غ","الْغَدَاءُ (de lunch)"],["ش","الشَّمْسُ (de zon)","ف","الْفَمُ (de mond)"],["ص","الصَّدْرُ (de borst)","ق","الْقَمَرُ (de maan)"],["ض","الضَّيْفُ (de gast)","ك","الْكَلْبُ (de hond)"],["ط","الطَّالِبُ (de student)","م","الْمَاءُ (het water)"],["ظ","الظُّهْرُ (het middaggebed)","و","الْوَلَدُ (de jongen)"],["ل","اللَّحْمُ (het vlees)","هـ","الْهَوَاءُ (de lucht)"],["ن","النَّجْمُ (de ster)","ي","الْيَدُ (de hand)"]]},"ex":[]},{"sec":"Hamzatoel Wasl & Bijvoeglijke naamwoorden (blz. 18)","lead":"Hamzatoel Wasl (ٱ) en de vertaling van bijvoeglijke naamwoorden:","ps":["Merk op dat de «a» van «al» alleen wordt uitgesproken wanneer het woord aan het begin van een zin staat. Als er een woord aan voorafgaat (zoals وَ), valt de «a» weg in de uitspraak, al blijft ze wel geschreven. Deze Hamzah heet Hamzatoel Wasl (هَمْزَةُ الْوَصْلِ, teken ٱ).","We hebben geleerd dat de Tanwien het onbepaald lidwoord is («een»). Dit geldt echter niet voor bijvoeglijke naamwoorden zoals مَفْتُوحٌ («open») en مَكْسُورٌ («gebroken»): الْبَابُ مَفْتُوحٌ betekent «De deur is open» (en niet «een open»)."],"ex":[{"ar":"الْبَيْتُ جَدِيدٌ وَالْمَسْجِدُ قَدِيمٌ.","nl":"al-baitoe djadiedoen wal-masdjidoe qadiemoen (Het huis is nieuw en de moskee is oud)."},{"ar":"الْبَيْتُ وَالْمَسْجِدُ","nl":"al-baitoe wal-masdjidoe (en niet: wa al-masdjidoe)"}]},{"sec":"Woordenlijst van Les 3 · Antoniemen (blz. 20)","lead":"Woordenlijst van Les 3: Tegenstellingen (× = antoniem) en nieuwe woorden","ps":["غَنِيٌّ rijk · فَقِيرٌ arm · طَوِيلٌ lang · قَصِيرٌ kort · بَارِدٌ r)"],["ث","الثَّوْبُ (het kledingstuk)","ب","الْبَابُ (de deur)"],["د","الدِّيكُ (de haan)","ج","الْجَنَّةُ (het paradijs / de tuin)"],["ذ","الذَّهَبُ (het goud)","ح","الْحِمَارُ (de ezel)"],["ر","الرَّجُلُ (de man)","خ","الْخُبْزُ (het brood)"],["ز","الزَّهْرَةُ (de bloem)","ع","الْعَيْنُ (het oog)"],["س","السَّمَكُ (de vis)","غ","الْغَدَاءُ (de lunch)"],["ش","الشَّمْسُ (de zon)","ف","الْفَمُ (de mond)"],["ص","الصَّدْرُ (de borst)","ق","الْقَمَرُ (de maan)"],["ض","الضَّيْفُ (de gast)","ك","الْكَلْبُ (de hond)"],["ط","الطَّالِبُ (de student)","م","الْمَاءُ (het water)"],["ظ","الظُّهْرُ (het middaggebed)","و","الْوَلَدُ (de jongen)"],["ل","اللَّحْمُ (het vlees)","هـ","الْهَوَاءُ (de lucht)"],["ن","النَّجْمُ (de ster)","ي","الْيَدُ (de hand)"]]}},{"h":"Hamzatoel Wasl & Bijvoeglijke naamwoorden (blz. 18)"},{"p":"Hamzatoel Wasl (ٱ) en de vertaling van bijvoeglijke naamwoorden:"},{"p":"Merk op dat de «a» van «al» alleen wordt uitgesproken wanneer het woord aan het begin van een zin staat. Als er een woord aan voorafgaat (zoals وَ), valt de «a» weg in de uitspraak, al blijft ze wel geschreven. Deze Hamzah heet Hamzatoel Wasl (هَمْزَةُ الْوَصْلِ, teken ٱ)."},{"p":"We hebben geleerd dat de Tanwien het onbepaald lidwoord is («een»). Dit geldt echter niet voor bijvoeglijke naamwoorden zoals مَفْتُوحٌ («open») en مَكْسُورٌ («gebroken»): الْبَابُ مَفْتُوحٌ betekent «De deur is open» (en niet «een open»)."},{"ar":"الْبَيْتُ جَدِيدٌ وَالْمَسْجِدُ قَدِيمٌ.","nl":"al-baitoe djadiedoen wal-masdjidoe qadiemoen (Het huis is nieuw en de moskee is oud)."},{"ar":"الْبَيْتُ وَالْمَسْجِدُ","nl":"al-baitoe wal-masdjidoe (en niet: wa al-masdjidoe)"},{"h":"Woordenlijst van Les 3 · Antoniemen (blz. 20)"},{"p":"Woordenlijst van Les 3: Tegenstellingen (× = antoniem) en nieuwe woorden"},{"p":"غَنِيٌّ rijk · فَقِيرٌ arm · طَوِيلٌ lang · قَصِيرٌ kort · بَارِدٌ koud · حَارٌّ heet · جَالِسٌ zittend · وَاقِفٌ staand · جَدِيدٌ nieuw · قَدِيمٌ oud · قَرِيبٌ dichtbij · بَعِيدٌ ver · نَظِيفٌ schoon · وَسِخٌ vies · صَغِيرٌ klein · كَبِيرٌ groot · خَفِيفٌ licht · ثَقِيلٌ zwaar · الْوَرَقُ het papier · مَكْسُورٌ gebroken · الْمَاءُ het water · مَفْتُوحٌ open · التُّفَّاحُ de appel · حُلْوٌ zoet · جَمِيلٌ mooi · مَرِيضٌ ziek · الدُّكَّانُ de winkel"}]},"4":{"title":"Voorzetsels (Les 4a & 4b) · المَرْفُوع وَالمَجْرُور · Voornaamwoorden & Werkwoorden","summary":"Les 4a en 4b uit het Grammaticaboek Medina-methode Deel 1 (blz. 21–26) — voorzetsels (فِي، عَلَى، مِنْ، إِلَى), naamvallen (Marfoe' & Madjroer), vrouwelijke eigennamen, هُوَ/هِيَ/أَنَا/أَنْتَ en ذَهَبَ/خَرَجَ.","points":["Les 4a · 1) Voorzetsels (حُرُوفُ الْجَرِّ): een naamwoord heeft normaal de uitgang «-oe» (Dammah) en heet dan Marfoe' (مَرْفُوعٌ, nominatief). Na een voorzetsel verandert de uitgang in «-ie» (Kasrah) en heet het woord Madjroer (مَجْرُورٌ, genitief).","Les 4a · 2) Voornaamwoorden: هُوَ («hij» of «het» voor mannelijke dingen) en هِيَ («zij» of «het» voor vrouwelijke dingen).","Les 4a · Merk op: Mannelijke eigennamen krijgen Tanwien (مُحَمَّدٌ، حَامِدٌ، بِلَالٌ), maar vrouwelijke eigennamen krijgen géén Tanwien en eindigen op één Dammah (آمِنَةُ، زَيْنَبُ، فَاطِمَةُ).","Les 4b: Nieuwe voorzetsels مِنْ («van/uit», wordt مِنَ vóór الْ) en إِلَى («naar»), voornaamwoorden أَنَا («ik») en أَنْتَ («jij», m.), en de werkwoorden ذَهَبَ («hij ging») en خَرَجَ («hij ging naar buiten»)."],"cards":[{"sec":"Les 4a · Voorzetsels: Marfoe' vs. Madjroer (blz. 21–22)","lead":"1) Voorzetsels (حُرُوفُ الْجَرِّ): van «-oe» (Marfoe') naar «-ie» (Madjroer):","ps":["Arabische naamwoorden hebben verschillende uitgangen om hun functie in de zin te laten zien. De normale uitgang is de «-oe» (Dammah): over zo'n naamwoord wordt gezegd dat het nominatief is, in het Arabisch Marfoe' (مَرْفُوعٌ).","Na een voorzetsel (Harf Djarr / حَرْفُ جَرٍّ) verandert deze uitgang in «-ie» (Kasrah). Over een naamwoord dat vooraf wordt gegaan door een voorzetsel wordt gezegd dat het genitief is, in het Arabisch Madjroer (مَجْرُورٌ).","Let op bij فِي («in»): wanneer فِي gevolgd wordt door الْ, wordt de lange «ie» in de uitspraak kort (fie l-baiti)."],"table":{"headers":["Normaal: Marfoe' (مَرْفُوعٌ op -oe)","Met voorzetsel: Madjroer (مَجْرُورٌ op -ie)","Betekenis"],"rows":[["الْبَيْتُ (al-bait-oe)","فِي الْبَيْتِ (fie l-bait-ie)","in het huis"],["بَيْتٌ (bait-oe-n)","فِي بَيْتٍ (fie bait-ie-n)","in een huis"],["الْمَكْتَبُ (al-maktab-oe)","عَلَى الْمَكْتَبِ ('ala l-maktab-ie)","op het bureau"]]},"ex":[{"ar":"الْمُدَرِّسُ فِي الْفَصْلِ.","nl":"De leraar is in het klaslokaal."},{"ar":"الْكِتَابُ عَلَى الْمَكْتَبِ.","nl":"Het boek ligt op het bureau."}]},{"sec":"Les 4a · Voornaamwoorden هُوَ en هِيَ (blz. 22–23)","lead":"2) Persoonlijke voornaamwoorden هُوَ («hij/het») en هِيَ («zij/het»):","ps":["In het Arabisch zijn alle zelfstandige naamwoorden mannelijk of vrouwelijk (er is geen onzijdig).","Een mannelijk naamwoord wordt aangeduid met هُوَ («hij» of «het»), ongeacht of het een mens, een dier of een ding is.","Een vrouwelijk naamwoord (vaak herkenbaar aan de uitgang ة) wordt aangeduid met هِيَ («zij» of «het»)."],"ex":[{"ar":"أَيْنَ الْوَلَدُ؟ هُوَ فِي الْمَسْجِدِ.","nl":"Waar is de jongen? Hij is in de moskee."},{"ar":"أَيْنَ الْكِتَابُ؟ هُوَ عَلَى الْمَكْتَبِ.","nl":"Waar is het boek? Het ligt op het bureau. (كِتَابٌ is mannelijk → هُوَ)"},{"ar":"أَيْنَ آمِنَةُ؟ هِيَ فِي الْبَيْتِ.","nl":"Waar is Aaminah? Zij is in het huis."},{"ar":"أَيْنَ السَّاعَةُ؟ هِيَ عَلَى السَّرِيرِ.","nl":"Waar is het horloge? Het ligt op het bed. (السَّاعَةُ is vrouwelijk → هِيَ)"}]},{"sec":"Les 4a · Merk op: Mannelijke en vrouwelijke eigennamen (blz. 23)","lead":"Merk op: Vrouwelijke eigennamen krijgen géén Tanwien!","ps":["1. Mannelijke eigennamen krijgen Tanwien (bijv. حَامِدٌ Haamied, مُحَمَّدٌ Moehammad, بِلَالٌ Bilaal), maar worden uiteraard niet met «een» vertaald.","2. Vrouwelijke eigennamen krijgen géén Tanwien: zij eindigen op één enkele Dammah (-oe), en na een voorzetsel op een Fathah (-a) in plaats van een Kasrah."],"table":{"headers":["Mannelijke eigennaam (wel Tanwien)","Vrouwelijke eigennaam (géén Tanwien)"],"rows":[["مُحَمَّدٌ (Moehammadoen)","آمِنَةُ (Aaminatoe — NIET آمِنَةٌ)"],["حَامِدٌ (Haamidoen)","زَيْنَبُ (Zainaboe — NIET زَيْنَبٌ)"],["بِلَالٌ (Bilaaloen)","فَاطِمَةُ (Faatimatoe — NIET فَاطِمَةٌ)"]]},"ex":[{"ar":"أَيْنَ مُحَمَّدٌ؟ هُوَ فِي الْغُرْفَةِ.","nl":"Waar is Moehammad? Hij is in de kamer."},{"ar":"أَيْنَ يَاسِرٌ؟ هُوَ فِي الْحَمَّامِ.","nl":"Waar is Yaasir? Hij is in de badkamer."},{"ar":"أَيْنَ آمِنَةُ؟ هِيَ فِي الْمَطْبَخِ.","nl":"Waar is Aaminah? Zij is in de keuken."}]},{"sec":"Les 4b · مِنْ، إِلَى، أَنَا، أَنْتَ en ذَهَبَ / خَرَجَ (blz. 25)","lead":"Les 4b: Voorzetsels مِنْ («uit/van») en إِلَى («naar»), en werkwoorden ذَهَبَ en خَرَجَ:","ps":["1) Twee nieuwe voorzetsels: مِنْ («van», «uit») en إِلَى («naar»). Let op: wanneer مِنْ gevolgd wordt door الْ, verandert de Soekoen in een Fathah om twee opeenvolgende klinkerloze letters te vermijden: مِنَ الْبَيْتِ (mina l-baiti).","2) Twee nieuwe voornaamwoorden: أَنَا («ik», voor zowel mannelijk als vrouwelijk) en أَنْتَ («jij», mannelijk enkelvoud).","3) Twee werkwoorden in de verleden tijd: ذَهَبَ («hij ging») en خَرَجَ («hij ging naar buiten / vertrok»)."],"ex":[{"ar":"مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنَ الْيَابَانِ.","nl":"Waar kom jij vandaan? Ik kom uit Japan."},{"ar":"أَيْنَ بِلَالٌ؟ ذَهَبَ إِلَى الْمَسْجِدِ.","nl":"Waar is Bilaal? Hij is naar de moskee gegaan."},{"ar":"خَرَجَ الْمُدِيرُ مِنَ الْمَدْرَسَةِ.","nl":"De directeur ging de school uit."},{"ar":"ذَهَبَ حَامِدٌ إِلَى السُّوقِ.","nl":"Haamied ging naar de markt."}]},{"sec":"Woordenlijst van Les 4a & 4b (blz. 24 & 26)","lead":"Woordenlijst van Les 4a en 4b (25 woorden)","ps":["فِي in · عَلَى op · مِنْ van, uit · إِلَى naar · أَيْنَ waar · هُوَ hij, het (m) · هِيَ zij, het (v) · أَنَا ik · أَنْتَ jij (m) · ذَهَبَ hij ging · خَرَجَ hij ging naar buiten · السَّمَاءُ de hemel, lucht · الْمَطْبَخُ de keuken · غُرْفَةٌ een kamer · الْحَمَّامُ de badkamer · الْمِرْحَاضُ het toilet · الْفَصْلُ het klaslokaal · الْهِنْدُ India · الْيَابَانُ Japan · الصِّينُ China · الْفِلِبِّينُ de Filipijnen · الْجَامِعَةُ de universiteit · السُّوقُ de markt · الْمَدْرَسَةُ de school · الْمُدِيرُ de directeur"],"ex":[]}],"examples":[{"ar":"الْكِتَابُ عَلَى الْمَكْتَبِ.","nl":"Het boek ligt op het bureau."},{"ar":"أَيْنَ مُحَمَّدٌ؟ هُوَ فِي الْغُرْفَةِ.","nl":"Waar is Moehammad? Hij is in de kamer."},{"ar":"أَيْنَ آمِنَةُ؟ هِيَ فِي الْمَطْبَخِ.","nl":"Waar is Aaminah? Zij is in de keuken."},{"ar":"أَيْنَ السَّاعَةُ؟ هِيَ عَلَى السَّرِيرِ.","nl":"Waar is het horloge? Het ligt op het bed."},{"ar":"مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنَ الْيَابَانِ.","nl":"Waar kom jij vandaan? Ik kom uit Japan."},{"ar":"وَمِنْ أَيْنَ عَمَّارٌ؟ هُوَ مِنَ الصِّينِ.","nl":"En waar komt 'Ammaar vandaan? Hij komt uit China."},{"ar":"أَيْنَ ذَهَبَ عَبَّاسٌ؟ ذَهَبَ إِلَى الْمُدِيرِ.","nl":"Waar is 'Abbaas naartoe gegaan? Hij is naar de directeur gegaan."},{"ar":"خَرَجَ مُحَمَّدٌ مِنَ الْبَيْتِ وَذَهَبَ إِلَى السُّوقِ.","nl":"Moehammad ging het huis uit en ging naar de markt."}],"exercises":[{"q":"Hoe noem je in het Arabisch een naamwoord waarvan de uitgang door een voorzetsel in «-ie» (Kasrah) is veranderd?","options":["Madjroer (مَجْرُورٌ)","Marfoe' (مَرْفُوعٌ)","Tanwien (تَنْوِين)","Moedaaf (مُضَاف)"],"answer":0,"explain":"Normaal is een naamwoord Marfoe' (-oe); na een voorzetsel (Harf Djarr) wordt het Madjroer (-ie)."},{"q":"Kies de juiste schrijfwijze van de vrouwelijke eigennaam «Zainab»:","options":["زَيْنَبُ","زَيْنَبٌ","الزَّيْنَبُ","زَيْنَبٍ"],"answer":0,"explain":"Vrouwelijke eigennamen (آمِنَةُ، زَيْنَبُ، فَاطِمَةُ) krijgen géén Tanwien."},{"q":"Welk voornaamwoord vul je in: أَيْنَ الْكِتَابُ؟ ... عَلَى الْمَكْتَبِ.","options":["هُوَ","هِيَ","أَنْتَ","أَنَا"],"answer":0,"explain":"الْكِتَابُ is mannelijk in het Arabisch, dus verwijs je ernaar met هُوَ («het/hij»)."},{"q":"Welk voornaamwoord vul je in: أَيْنَ السَّاعَةُ؟ ... عَلَى السَّرِيرِ.","options":["هِيَ","هُوَ","أَنْتَ","ذَلِكَ"],"answer":0,"explain":"السَّاعَةُ (het horloge) eindigt op ة en is vrouwelijk, dus verwijs je ernaar met هِيَ."},{"q":"Kies de juiste vorm na de voorzetsels: خَرَجَ مِنَ ... وَذَهَبَ إِلَى ...","options":["الْبَيْتِ / الْمَسْجِدِ","الْبَيْتُ / الْمَسْجِدُ","الْبَيْتٌ / الْمَسْجِدٌ","بَيْتُ / مَسْجِدُ"],"answer":0,"explain":"Zowel مِنْ als إِلَى zijn voorzetsels (Hoeroef al-Djarr); de naamwoorden erna zijn Madjroer en eindigen op -ie (Kasrah)."},{"q":"Waarom krijgt مِنْ een Fathah in «مِنَ الْبَيْتِ»?","options":["Om twee klinkerloze medeklinkers achter elkaar te vermijden vóór الْ","Omdat الْبَيْتِ vrouwelijk is","Omdat مِنْ altijd مِنَ is","Omdat het een vraagzin is"],"answer":0,"explain":"Vóór الْ verandert de Soekoen op مِنْ in een Fathah: مِنَ الْبَيْتِ (mina l-baiti)."},{"q":"Wat betekent: أَيْنَ آمِنَةُ؟ هِيَ فِي الْمَطْبَخِ.","options":["Waar is Aaminah? Zij is in de keuken.","Waar is Aaminah? Zij is in de badkamer.","Waar is Aaminah? Zij is in het klaslokaal.","Waar is Aaminah? Zij ging naar de markt."],"answer":0,"explain":"الْمَطْبَخُ = de keuken (الْحَمَّامُ = badkamer, الْفَصْلُ = klaslokaal)."},{"q":"Wat betekent het werkwoord خَرَجَ in «خَرَجَ الْمُدَرِّسُ مِنَ الْفَصْلِ»?","options":["hij ging naar buiten / verliet","hij ging naar binnen","hij zat","hij schreef"],"answer":0,"explain":"خَرَجَ betekent «hij ging naar buiten» (ذَهَبَ = «hij ging»)."}],"fullText":[{"h":"Les 4a · Voorzetsels: Marfoe' vs. Madjroer (blz. 21–22)"},{"p":"1) Voorzetsels (حُرُوفُ الْجَرِّ): van «-oe» (Marfoe') naar «-ie» (Madjroer):"},{"p":"Arabische naamwoorden hebben verschillende uitgangen om hun functie in de zin te laten zien. De normale uitgang is de «-oe» (Dammah): over zo'n naamwoord wordt gezegd dat het nominatief is, in het Arabisch Marfoe' (مَرْفُوعٌ)."},{"p":"Na een voorzetsel (Harf Djarr / حَرْفُ جَرٍّ) verandert deze uitgang in «-ie» (Kasrah). Over een naamwoord dat vooraf wordt gegaan door een voorzetsel wordt gezegd dat het genitief is, in het Arabisch Madjroer (مَجْرُورٌ)."},{"p":"Let op bij فِي («in»): wanneer فِي gevolgd wordt door الْ, wordt de lange «ie» in de uitspraak kort (fie l-baiti)."},{"table":{"headers":["Normaal: Marfoe' (مَرْفُوعٌ op -oe)","Met voorzetsel: Madjroer (مَجْرُورٌ op -ie)","Betekenis"],"rows":[["الْبَيْتُ (al-bait-oe)","فِي الْبَيْتِ (fie l-bait-ie)","in het huis"],["بَيْتٌ (bait-oe-n)","فِي بَيْتٍ (fie bait-ie-n)","in een huis"],["الْمَكْتَبُ (al-maktab-oe)","عَلَى الْمَكْتَبِ ('ala l-maktab-ie)","op het bureau"]]}},{"ar":"الْمُدَرِّسُ فِي الْفَصْلِ.","nl":"De leraar is in het klaslokaal."},{"ar":"الْكِتَابُ عَلَى الْمَكْتَبِ.","nl":"Het boek ligt op het bureau."},{"h":"Les 4a · Voornaamwoorden هُوَ en هِيَ (blz. 22–23)"},{"p":"2) Persoonlijke voornaamwoorden هُوَ («hij/het») en هِيَ («zij/het»):"},{"p":"In het Arabisch zijn alle zelfstandige naamwoorden mannelijk of vrouwelijk (er is geen onzijdig)."},{"p":"Een mannelijk naamwoord wordt aangeduid met هُوَ («hij» of «het»), ongeacht of het een mens, een dier of een ding is."},{"p":"Een vrouwelijk naamwoord (vaak herkenbaar aan de uitgang ة) wordt aangeduid met هِيَ («zij» of «het»)."},{"ar":"أَيْنَ الْوَلَدُ؟ هُوَ فِي الْمَسْجِدِ.","nl":"Waar is de jongen? Hij is in de moskee."},{"ar":"أَيْنَ الْكِتَابُ؟ هُوَ عَلَى الْمَكْتَبِ.","nl":"Waar is het boek? Het ligt op het bureau. (كِتَابٌ is mannelijk → هُوَ)"},{"ar":"أَيْنَ آمِنَةُ؟ هِيَ فِي الْبَيْتِ.","nl":"Waar is Aaminah? Zij is in het huis."},{"ar":"أَيْنَ السَّاعَةُ؟ هِيَ عَلَى السَّرِيرِ.","nl":"Waar is het horloge? Het ligt op het bed. (السَّاعَةُ is vrouwelijk → هِيَ)"},{"h":"Les 4a · Merk op: Mannelijke en vrouwelijke eigennamen (blz. 23)"},{"p":"Merk op: Vrouwelijke eigennamen krijgen géén Tanwien!"},{"p":"1. Mannelijke eigennamen krijgen Tanwien (bijv. حَامِدٌ Haamied, مُحَمَّدٌ Moehammad, بِلَالٌ Bilaal), maar worden uiteraard niet met «een» vertaald."},{"p":"2. Vrouwelijke eigennamen krijgen géén Tanwien: zij eindigen op één enkele Dammah (-oe), en na een voorzetsel op een Fathah (-a) in plaats van een Kasrah."},{"table":{"headers":["Mannelijke eigennaam (wel Tanwien)","Vrouwelijke eigennaam (géén Tanwien)"],"rows":[["مُحَمَّدٌ (Moehammadoen)","آمِنَةُ (Aaminatoe — NIET آمِنَةٌ)"],["حَامِدٌ (Haamidoen)","زَيْنَبُ (Zainaboe — NIET زَيْنَبٌ)"],["بِلَالٌ (Bilaaloen)","فَاطِمَةُ (Faatimatoe — NIET فَاطِمَةٌ)"]]}},{"ar":"أَيْنَ مُحَمَّدٌ؟ هُوَ فِي الْغُرْفَةِ.","nl":"Waar is Moehammad? Hij is in de kamer."},{"ar":"أَيْنَ يَاسِرٌ؟ هُوَ فِي الْحَمَّامِ.","nl":"Waar is Yaasir? Hij is in de badkamer."},{"ar":"أَيْنَ آمِنَةُ؟ هِيَ فِي الْمَطْبَخِ.","nl":"Waar is Aaminah? Zij is in de keuken."},{"h":"Les 4b · مِنْ، إِلَى، أَنَا، أَنْتَ en ذَهَبَ / خَرَجَ (blz. 25)"},{"p":"Les 4b: Voorzetsels مِنْ («uit/van») en إِلَى («naar»), en werkwoorden ذَهَبَ en خَرَجَ:"},{"p":"1) Twee nieuwe voorzetsels: مِنْ («van», «uit») en إِلَى («naar»). Let op: wanneer مِنْ gevolgd wordt door الْ, verandert de Soekoen in een Fathah om twee opeenvolgende klinkerloze letters te vermijden: مِنَ الْبَيْتِ (mina l-baiti)."},{"p":"2) Twee nieuwe voornaamwoorden: أَنَا («ik», voor zowel mannelijk als vrouwelijk) en أَنْتَ («jij», mannelijk enkelvoud)."},{"p":"3) Twee werkwoorden in de verleden tijd: ذَهَبَ («hij ging») en خَرَجَ («hij ging naar buiten / vertrok»)."},{"ar":"مِنْ أَيْنَ أَنْتَ؟ أَنَا مِنَ الْيَابَانِ.","nl":"Waar kom jij vandaan? Ik kom uit Japan."},{"ar":"أَيْنَ بِلَالٌ؟ ذَهَبَ إِلَى الْمَسْجِدِ.","nl":"Waar is Bilaal? Hij is naar de moskee gegaan."},{"ar":"خَرَجَ الْمُدِيرُ مِنَ الْمَدْرَسَةِ.","nl":"De directeur ging de school uit."},{"ar":"ذَهَبَ حَامِدٌ إِلَى السُّوقِ.","nl":"Haamied ging naar de markt."},{"h":"Woordenlijst van Les 4a & 4b (blz. 24 & 26)"},{"p":"Woordenlijst van Les 4a en 4b (25 woorden)"},{"p":"فِي in · عَلَى op · مِنْ van, uit · إِلَى naar · أَيْنَ waar · هُوَ hij, het (m) · هِيَ zij, het (v) · أَنَا ik · أَنْتَ jij (m) · ذَهَبَ hij ging · خَرَجَ hij ging naar buiten · السَّمَاءُ de hemel, lucht · الْمَطْبَخُ de keuken · غُرْفَةٌ een kamer · الْحَمَّامُ de badkamer · الْمِرْحَاضُ het toilet · الْفَصْلُ het klaslokaal · الْهِنْدُ India · الْيَابَانُ Japan · الصِّينُ China · الْفِلِبِّينُ de Filipijnen · الْجَامِعَةُ de universiteit · السُّوقُ de markt · الْمَدْرَسَةُ de school · الْمُدِيرُ de directeur"}]},"5":{"title":"Bezitsconstructie (الْمُضَافُ وَالْمُضَافُ إِلَيْهِ) · تَحْتَ · يَا · اِسْمٌ & اِبْنٌ","summary":"Les 5 uit het Grammaticaboek Medina-methode Deel 1 (blz. 27–29) — de Idaafah (Moedaaf & Moedaaf Ilaih), voorzetsel/bijwoord تَحْتَ, vocatief يَا en woorden met Hamzatoel Wasl.","points":["1) Bezitsconstructie (Idaafah): het eerste woord heet Moedaaf (الْمُضَافُ, het bezit) en krijgt géén الْ en géén Tanwien (كِتَابُ بِلَالٍ). Het tweede woord heet Moedaaf Ilaih (الْمُضَافُ إِلَيْهِ, de bezitter) en is altijd Madjroer (-ie / -ien).","2) تَحْتَ («onder»): het naamwoord na تَحْتَ is altijd Madjroer (تَحْتَ الْمَكْتَبِ).","3) Vocatief partikel يَا («O…!»): het naamwoord na يَا krijgt slechts één Dammah en géén Tanwien (يَا بِلَالُ، يَا أُسْتَاذُ).","4) De woorden اِسْمٌ («naam») en اِبْنٌ («zoon») beginnen met een Hamzatoel Wasl: midden in een zin valt hun i-klank in de uitspraak weg."],"cards":[{"sec":"1) Moedaaf & Moedaaf Ilaih (blz. 27)","lead":"De bezitsconstructie (الْمُضَافُ وَالْمُضَافُ إِلَيْهِ): «het boek van Bilaal»:","ps":["In «كِتَابُ بِلَالٍ» (het boek van Bilaal) is het eerste woord (كِتَابُ) het ding dat in bezit is: dit heet Moedaaf (مُضَاف). Het tweede woord (بِلَالٍ) is de bezitter: dit heet Moedaaf Ilaih (مُضَاف إِلَيْهِ).","a. De Moedaaf krijgt géén bepaald lidwoord الْ en ook géén Tanwien (dus كِتَابُ en nooit الْكِتَابُ of كِتَابٌ). Hij is wel bepaald door zijn positie!","b. De Moedaaf Ilaih is altijd Madjroer (genitief): hij eindigt op Kasrah (-ie bij الْ, of -ien zonder الْ)."],"table":{"headers":["Arabisch (Idaafah)","Moedaaf (bezit)","Moedaaf Ilaih (bezitter)","Vertaling"],"rows":[["كِتَابُ بِلَالٍ","كِتَابُ (geen الْ, geen tanwien)","بِلَالٍ (Madjroer op -in)","het boek van Bilaal"],["بَيْتُ الْإِمَامِ","بَيْتُ (geen الْ, geen tanwien)","الْإِمَامِ (Madjroer op -i)","het huis van de imam"],["عَلَى مَكْتَبِ الْمُدَرِّسِ","مَكْتَبِ (Madjroer na عَلَى)","الْمُدَرِّسِ (Madjroer)","op het bureau van de leraar"],["كِتَابُ مَنْ هَذَا؟","كِتَابُ (Moedaaf)","مَنْ (onverbuigbaar)","Wiens boek is dit?"]]},"ex":[{"ar":"أَهَذَا كِتَابُ مُحَمَّدٍ؟ لَا، هَذَا كِتَابُ حَامِدٍ.","nl":"Is dit het boek van Moehammad? Nee, dit is het boek van Haamied."},{"ar":"أَيْنَ دَفْتَرُ عَمَّارٍ؟ هُوَ عَلَى مَكْتَبِ الْمُدَرِّسِ.","nl":"Waar is het schrift van 'Ammaar? Het ligt op het bureau van de leraar."}]},{"sec":"2) تَحْتَ en 3) Vocatief يَا (blz. 28)","lead":"2) تَحْتَ («onder») en 3) Het aanroeppartikel يَا («O…!»):","ps":["2) تَحْتَ betekent «onder». Het zelfstandig naamwoord dat na تَحْتَ komt, is Moedaaf Ilaih en dus altijd Madjroer (eindigt op -ie): تَحْتَ الْمَكْتَبِ (onder het bureau).","3) يَا is een vocatief partikel (Harf an-Nidaa' / aanroeppartikel). Een enkelvoudig naamwoord dat na يَا staat, krijgt slechts één Dammah (-oe) en géén Tanwien!"],"table":{"headers":["Zonder يَا (met Tanwien)","Na يَا (slechts één Dammah!)","Betekenis"],"rows":[["بِلَالٌ","يَا بِلَالُ! (NIET يَا بِلَالٌ)","O Bilaal!"],["أُسْتَاذٌ","يَا أُسْتَاذُ!","O leraar / professor!"],["شَيْخٌ","يَا شَيْخُ!","O shaykh!"],["عَلِيٌّ","يَا عَلِيُّ!","O 'Alie!"]]},"ex":[{"ar":"الْحَقِيبَةُ تَحْتَ الْمَكْتَبِ.","nl":"De tas ligt onder het bureau."},{"ar":"أَيْنَ قَلَمُكَ يَا عَلِيُّ؟","nl":"Waar is jouw pen, o 'Alie?"}]},{"sec":"4) اِسْمٌ en اِبْنٌ met Hamzatoel Wasl (blz. 28)","lead":"4) De woorden اِسْمٌ («naam») en اِبْنٌ («zoon») beginnen met een Hamzatoel Wasl:","ps":["De eerste letter (Alief) van اِسْمٌ («naam») en اِبْنٌ («zoon») is een Hamzatoel Wasl. Wanneer zij aan het begin van een zin staan, spreek je de «i» uit (ismoe, ibnoe).","Wanneer er echter een woord aan voorafgaat (zoals وَ of أَيْنَ), valt de «i» in de uitspraak volledig weg!"],"ex":[{"ar":"اِسْمُ الْوَلَدِ بِلَالٌ، وَاسْمُ الْبِنْتِ آمِنَةُ.","nl":"ismoe l-waladi Bilaaloen, wasmoe l-binti Aaminatoe (De naam van de jongen is Bilaal, en de naam van het meisje is Aaminah)."},{"ar":"اِبْنُ الْمُدَرِّسِ طَبِيبٌ، وَابْنُ الْإِمَامِ تَاجِرٌ.","nl":"ibnoe l-moedarrisi tabieboen, wabnoe l-imaami taadjiroen (De zoon van de leraar is dokter, en de zoon van de imam is handelaar)."},{"ar":"أَيْنَ ابْنُ حَامِدٍ؟","nl":"ayna bnoe Haamidin? (Waar is de zoon van Haamied?)"}]},{"sec":"Woordenlijst van Les 5 (blz. 29)","lead":"Woordenlijst van Les 5 (15 woorden)","ps":["الرَّسُولُ de Boodschapper · الْكَعْبَةُ de Ka'bah · تَحْتَ onder · الْحَقِيبَةُ de tas · الْبِنْتُ de dochter, het meisje · الْعَمُّ de oom (vaderszijde) · الْخَالُ de oom (moederszijde) · هُنَا hier · هُنَاكَ daar · السَّيَّارَةُ de auto · الْاِبْنُ de zoon · مُغْلَقٌ gesloten · الشَّارِعُ de straat, de weg · الْاِسْمُ de naam · يَا o! (vocatief)"],"ex":[]}],"examples":[{"ar":"كِتَابُ مُحَمَّدٍ عَلَى الْمَكْتَبِ.","nl":"Het boek van Moehammad ligt op het bureau."},{"ar":"قَلَمُ حَامِدٍ عَلَى مَكْتَبِ الْمُدَرِّسِ.","nl":"De pen van Haamied ligt op het bureau van de leraar."},{"ar":"حَقِيبَةُ مَنْ تَحْتَ الْمَكْتَبِ؟","nl":"Wiens tas ligt er onder het bureau?"},{"ar":"بَابُ الْمَدْرَسَةِ مُغْلَقٌ.","nl":"De deur van de school is gesloten."},{"ar":"خَرَجَ الْمُدَرِّسُ مِنْ غُرْفَةِ الْمُدِيرِ.","nl":"De leraar kwam uit de kamer van de directeur."},{"ar":"سَيَّارَةُ مَنْ هَذِهِ؟ هَذِهِ سَيَّارَةُ الْمُدِيرِ.","nl":"Wiens auto is dit? Dit is de auto van de directeur."},{"ar":"اِبْنُ الْمُدَرِّسِ فِي الْفَصْلِ.","nl":"De zoon van de leraar is in het klaslokaal."},{"ar":"بَيْتُ خَالِدٍ قَرِيبٌ وَبَيْتُ حَامِدٍ بَعِيدٌ.","nl":"Het huis van Chaalid is dichtbij en het huis van Haamied is ver."}],"exercises":[{"q":"Hoe schrijf je correct «het boek van Bilaal» (Idaafah)?","options":["كِتَابُ بِلَالٍ","الْكِتَابُ بِلَالٍ","كِتَابٌ بِلَالٍ","كِتَابُ بِلَالٌ"],"answer":0,"explain":"De Moedaaf (كِتَابُ) krijgt geen الْ en geen Tanwien; de Moedaaf Ilaih (بِلَالٍ) is Madjroer (-in)."},{"q":"Hoe schrijf je correct «de sleutel van het huis»?","options":["مِفْتَاحُ الْبَيْتِ","الْمِفْتَاحُ الْبَيْتِ","مِفْتَاحٌ الْبَيْتِ","مِفْتَاحُ الْبَيْتُ"],"answer":0,"explain":"مِفْتَاحُ (Moedaaf zonder الْ/Tanwien) + الْبَيْتِ (Moedaaf Ilaih, Madjroer op -i)."},{"q":"Wat gebeurt er met de Moedaaf wanneer er een voorzetsel (zoals عَلَى of مِنْ) vóór staat?","options":["De Moedaaf wordt zelf Madjroer (-i): عَلَى مَكْتَبِ الْمُدَرِّسِ","De Moedaaf blijft altijd op -oe eindigen","De Moedaaf krijgt dan wel الْ","De Moedaaf krijgt Tanwien"],"answer":0,"explain":"Door het voorzetsel عَلَى verandert de uitgang van de Moedaaf (مَكْتَبُ) in een Kasrah: عَلَى مَكْتَبِ الْمُدَرِّسِ (blz. 27, regel d)."},{"q":"Kies de juiste vorm na het vocatief partikel يَا («O…!»):","options":["يَا بِلَالُ","يَا بِلَالٌ","يَا الْبِلَالُ","يَا بِلَالٍ"],"answer":0,"explain":"Na het aanroeppartikel يَا krijgt een naamwoord slechts één Dammah en géén Tanwien (blz. 28)."},{"q":"Waarom verandert مَنْ («wie») niet van uitgang in «كِتَابُ مَنْ هَذَا؟» (Wiens boek is dit)?","options":["Omdat مَنْ onverbuigbaar (mabnie) is","Omdat مَنْ hier geen Moedaaf Ilaih is","Omdat مَنْ een werkwoord is","Omdat مَنْ vrouwelijk is"],"answer":0,"explain":"مَنْ is wel Moedaaf Ilaih, maar is onverbuigbaar en houdt daarom altijd dezelfde vorm (blz. 27, regel c)."},{"q":"Welk woord betekent «de oom van vaderszijde» en welk woord «de oom van moederszijde»?","options":["الْعَمُّ (vaderszijde) en الْخَالُ (moederszijde)","الْخَالُ (vaderszijde) en الْعَمُّ (moederszijde)","الْاِبْنُ en الْبِنْتُ","الْأَبُ en الْأَخُ"],"answer":0,"explain":"الْعَمُّ = oom van vaderszijde, الْخَالُ = oom van moederszijde (blz. 29)."},{"q":"Kies de juiste vorm na تَحْتَ («onder»): الْحَقِيبَةُ تَحْتَ ...","options":["الْمَكْتَبِ","الْمَكْتَبُ","الْمَكْتَبٌ","مَكْتَبُ"],"answer":0,"explain":"Het naamwoord na تَحْتَ is Madjroer en eindigt dus op een Kasrah (-i): تَحْتَ الْمَكْتَبِ."},{"q":"Hoe wordt «وَاسْمُ الْبِنْتِ» uitgesproken?","options":["«wasmoe l-binti» (de i van اِسْمُ valt weg)","«wa-ismoe l-binti»","«wasmoe l-bintoe»","«wa-asmoe l-binti»"],"answer":0,"explain":"De Alief van اِسْمٌ en اِبْنٌ is een Hamzatoel Wasl: midden in een zin valt de i-klank weg in de uitspraak."}],"fullText":[{"h":"1) Moedaaf & Moedaaf Ilaih (blz. 27)"},{"p":"De bezitsconstructie (الْمُضَافُ وَالْمُضَافُ إِلَيْهِ): «het boek van Bilaal»:"},{"p":"In «كِتَابُ بِلَالٍ» (het boek van Bilaal) is het eerste woord (كِتَابُ) het ding dat in bezit is: dit heet Moedaaf (مُضَاف). Het tweede woord (بِلَالٍ) is de bezitter: dit heet Moedaaf Ilaih (مُضَاف إِلَيْهِ)."},{"p":"a. De Moedaaf krijgt géén bepaald lidwoord الْ en ook géén Tanwien (dus كِتَابُ en nooit الْكِتَابُ of كِتَابٌ). Hij is wel bepaald door zijn positie!"},{"p":"b. De Moedaaf Ilaih is altijd Madjroer (genitief): hij eindigt op Kasrah (-ie bij الْ, of -ien zonder الْ)."},{"table":{"headers":["Arabisch (Idaafah)","Moedaaf (bezit)","Moedaaf Ilaih (bezitter)","Vertaling"],"rows":[["كِتَابُ بِلَالٍ","كِتَابُ (geen الْ, geen tanwien)","بِلَالٍ (Madjroer op -in)","het boek van Bilaal"],["بَيْتُ الْإِمَامِ","بَيْتُ (geen الْ, geen tanwien)","الْإِمَامِ (Madjroer op -i)","het huis van de imam"],["عَلَى مَكْتَبِ الْمُدَرِّسِ","مَكْتَبِ (Madjroer na عَلَى)","الْمُدَرِّسِ (Madjroer)","op het bureau van de leraar"],["كِتَابُ مَنْ هَذَا؟","كِتَابُ (Moedaaf)","مَنْ (onverbuigbaar)","Wiens boek is dit?"]]}},{"ar":"أَهَذَا كِتَابُ مُحَمَّدٍ؟ لَا، هَذَا كِتَابُ حَامِدٍ.","nl":"Is dit het boek van Moehammad? Nee, dit is het boek van Haamied."},{"ar":"أَيْنَ دَفْتَرُ عَمَّارٍ؟ هُوَ عَلَى مَكْتَبِ الْمُدَرِّسِ.","nl":"Waar is het schrift van 'Ammaar? Het ligt op het bureau van de leraar."},{"h":"2) تَحْتَ en 3) Vocatief يَا (blz. 28)"},{"p":"2) تَحْتَ («onder») en 3) Het aanroeppartikel يَا («O…!»):"},{"p":"2) تَحْتَ betekent «onder». Het zelfstandig naamwoord dat na تَحْتَ komt, is Moedaaf Ilaih en dus altijd Madjroer (eindigt op -ie): تَحْتَ الْمَكْتَبِ (onder het bureau)."},{"p":"3) يَا is een vocatief partikel (Harf an-Nidaa' / aanroeppartikel). Een enkelvoudig naamwoord dat na يَا staat, krijgt slechts één Dammah (-oe) en géén Tanwien!"},{"table":{"headers":["Zonder يَا (met Tanwien)","Na يَا (slechts één Dammah!)","Betekenis"],"rows":[["بِلَالٌ","يَا بِلَالُ! (NIET يَا بِلَالٌ)","O Bilaal!"],["أُسْتَاذٌ","يَا أُسْتَاذُ!","O leraar / professor!"],["شَيْخٌ","يَا شَيْخُ!","O shaykh!"],["عَلِيٌّ","يَا عَلِيُّ!","O 'Alie!"]]}},{"ar":"الْحَقِيبَةُ تَحْتَ الْمَكْتَبِ.","nl":"De tas ligt onder het bureau."},{"ar":"أَيْنَ قَلَمُكَ يَا عَلِيُّ؟","nl":"Waar is jouw pen, o 'Alie?"},{"h":"4) اِسْمٌ en اِبْنٌ met Hamzatoel Wasl (blz. 28)"},{"p":"4) De woorden اِسْمٌ («naam») en اِبْنٌ («zoon») beginnen met een Hamzatoel Wasl:"},{"p":"De eerste letter (Alief) van اِسْمٌ («naam») en اِبْنٌ («zoon») is een Hamzatoel Wasl. Wanneer zij aan het begin van een zin staan, spreek je de «i» uit (ismoe, ibnoe)."},{"p":"Wanneer er echter een woord aan voorafgaat (zoals وَ of أَيْنَ), valt de «i» in de uitspraak volledig weg!"},{"ar":"اِسْمُ الْوَلَدِ بِلَالٌ، وَاسْمُ الْبِنْتِ آمِنَةُ.","nl":"ismoe l-waladi Bilaaloen, wasmoe l-binti Aaminatoe (De naam van de jongen is Bilaal, en de naam van het meisje is Aaminah)."},{"ar":"اِبْنُ الْمُدَرِّسِ طَبِيبٌ، وَابْنُ الْإِمَامِ تَاجِرٌ.","nl":"ibnoe l-moedarrisi tabieboen, wabnoe l-imaami taadjiroen (De zoon van de leraar is dokter, en de zoon van de imam is handelaar)."},{"ar":"أَيْنَ ابْنُ حَامِدٍ؟","nl":"ayna bnoe Haamidin? (Waar is de zoon van Haamied?)"},{"h":"Woordenlijst van Les 5 (blz. 29)"},{"p":"Woordenlijst van Les 5 (15 woorden)"},{"p":"الرَّسُولُ de Boodschapper · الْكَعْبَةُ de Ka'bah · تَحْتَ onder · الْحَقِيبَةُ de tas · الْبِنْتُ de dochter, het meisje · الْعَمُّ de oom (vaderszijde) · الْخَالُ de oom (moederszijde) · هُنَا hier · هُنَاكَ daar · السَّيَّارَةُ de auto · الْاِبْنُ de zoon · مُغْلَقٌ gesloten · الشَّارِعُ de straat, de weg · الْاِسْمُ de naam · يَا o! (vocatief)"}]},"6":{"title":"هَذِهِ (dit, v.) · Taa' Marboetah (ة) · Lichaamsdelen · لِ · أَيْضًا · جِدًّا","summary":"Les 6 uit het Grammaticaboek Medina-methode Deel 1 (blz. 30–33) — het vrouwelijk aanwijzend voornaamwoord هَذِهِ, de vrouwelijke uitgang ة, het geslacht van lichaamsdelen, voorzetsel لِ en de woorden أَيْضًا en جِدًّا.","points":["1) هَذِهِ (uitgesproken als هَاذِهِ haadhihi) is het vrouwelijk van هَذَا: هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","2) Naamwoorden en bijvoeglijke naamwoorden worden vrouwelijk gemaakt door een Taa' Marboetah (ة / ـة, voorafgegaan door een Fathah) toe te voegen: مُدَرِّسٌ → مُدَرِّسَةٌ.","3) Lichaamsdelen waarvan het lichaam er twee heeft zijn meestal vrouwelijk (يَدٌ hand, رِجْلٌ been, عَيْنٌ oog, أُذُنٌ oor); lichaamsdelen waarvan je er één hebt zijn mannelijk (رَأْسٌ hoofd, أَنْفٌ neus, فَمٌ mond, وَجْهٌ gezicht).","4) Voorzetsel لِ («van / behoort toe aan»): het naamwoord erna is Madjroer (لِبِلَالٍ، لِلَّهِ، لِمَنْ هَذَا؟). Plus أَيْضًا («ook») en جِدًّا («heel, erg, zeer»)."],"cards":[{"sec":"1) هَذِهِ en 2) Taa' Marboetah (blz. 30)","lead":"1) هَذِهِ («dit/deze», v.) en 2) Vrouwelijke vorm met Taa' Marboetah (ة):","ps":["1) هَذِهِ wordt uitgesproken als هَاذِهِ (haadhihi), maar geschreven zonder de eerste Alief. Het is het vrouwelijk van هَذَا.","2) Naamwoorden en bijvoeglijke naamwoorden worden vrouwelijk gemaakt door een ة (Taa' Marboetah) aan het einde toe te voegen. De laatste letter vóór deze ة krijgt altijd een Fathah (-a-):","Sommige zelfstandige naamwoorden hebben een geheel aparte vrouwelijke vorm zonder verwante stam."],"table":{"headers":["Mannelijk","Vrouwelijk","Betekenis"],"rows":[["مُدَرِّسٌ (moedarris-oe-n)","مُدَرِّسَةٌ (moedarris-a-toe-n)","een leraar → een lerares"],["طَالِبٌ (taalib-oe-n)","طَالِبَةٌ (taalib-a-toe-n)","een student → een studente"],["جَدِيدٌ / جَمِيلٌ","جَدِيدَةٌ / جَمِيلَةٌ","nieuw (m/v) · mooi (m/v)"],["اِبْنٌ (ibnoen)","بِنْتٌ (bintoen)","een zoon → een dochter / meisje"],["أَخٌ (achoen)","أُخْتٌ (oechtoen)","een broer → een zus"]]},"ex":[{"ar":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","nl":"Dit is een jongen en dit is een meisje."},{"ar":"هَذِهِ سَاعَةُ عَلِيٍّ. هِيَ جَمِيلَةٌ جِدًّا.","nl":"Dit is het horloge van 'Alie. Het is erg mooi."}]},{"sec":"Lichaamsdelen: Dubbel = Vrouwelijk, Enkel = Mannelijk (blz. 31)","lead":"Gouden regel uit het boek (blz. 31): Het geslacht van lichaamsdelen!","ps":["Alle zelfstandige naamwoorden in het Arabisch zijn óf mannelijk óf vrouwelijk.","Lichaamsdelen die in paren voorkomen (waarvan je er twee hebt) zijn meestal vrouwelijk (ook al eindigen ze niet op ة!), terwijl lichaamsdelen waarvan je er maar één hebt mannelijk zijn:"],"table":{"headers":["VROUWELIJK (dubbele lichaamsdelen: هَذِهِ)","MANNELIJK (enkele lichaamsdelen: هَذَا)"],"rows":[["يَدٌ (yadoen) — hand → هَذِهِ يَدٌ","رَأْسٌ (ra'soen) — hoofd → هَذَا رَأْسٌ"],["رِجْلٌ (ridjloen) — been / voet → هَذِهِ رِجْلٌ","أَنْفٌ (anfoen) — neus → هَذَا أَنْفٌ"],["عَيْنٌ ('ainoen) — oog → هَذِهِ عَيْنٌ","فَمٌ (famoen) — mond → هَذَا فَمٌ"],["أُذُنٌ (oedhoenoen) — oor → هَذِهِ أُذُنٌ","وَجْهٌ (wadjhoen) — gezicht → هَذَا وَجْهٌ"]]},"ex":[{"ar":"هَذِهِ يَدٌ وَهَذِهِ رِجْلٌ.","nl":"Dit is een hand en dit is een voet/been."},{"ar":"هَذَا أَنْفٌ وَهَذَا فَمٌ.","nl":"Dit is een neus en dit is een mond."},{"ar":"هَذِهِ عَيْنٌ وَهَذِهِ أُذُنٌ.","nl":"Dit is een oog en dit is een oor."}]},{"sec":"3) Voorzetsel لِ, 4) أَيْضًا en 5) جِدًّا (blz. 31–32)","lead":"3) لِ («van/voor»), 4) أَيْضًا («ook») en 5) جِدًّا («heel, erg, zeer»):","ps":["3) لِ is een voorzetsel dat «behoort tot/aan, van, voor» betekent. Het wordt direct aan het volgende woord vastgeschreven en maakt dat woord Madjroer (-ie). Let op: لِمَنْ betekent «van wie?». Vóór الْ verandert de Soekoen van مَنْ in een Kasrah: لِمَنِ الْكِتَابُ؟ (limani l-kitaaboe).","4) أَيْضًا betekent «ook».","5) جِدًّا betekent «heel», «erg» of «zeer» en staat altijd achter het bijvoeglijk naamwoord."],"ex":[{"ar":"هَذَا لِبِلَالٍ وَذَلِكَ لِحَامِدٍ.","nl":"Dit is van Bilaal en dat is van Haamied."},{"ar":"الْحَمْدُ لِلَّهِ.","nl":"Alle lof behoort aan Allah."},{"ar":"لِمَنْ هَذَا؟ هَذَا لِيَاسِرٍ.","nl":"Van wie is dit? Dit is van Yaasir."},{"ar":"لِمَنِ السَّاعَةُ؟ هِيَ لِعَبَّاسٍ.","nl":"Van wie is het horloge? Het is van 'Abbaas."},{"ar":"هَذَا جَمِيلٌ، وَذَلِكَ أَيْضًا جَمِيلٌ.","nl":"Dit is mooi, en dat is ook mooi."},{"ar":"هَذَا كَبِيرٌ جِدًّا.","nl":"Dit is heel groot."}]},{"sec":"Woordenlijst van Les 6 (blz. 33)","lead":"Woordenlijst van Les 6 (25 woorden)","ps":["الْمِكْوَاةُ het strijkijzer · الدَّرَّاجَةُ de fiets · الْمِلْعَقَةُ de lepel · الْقِدْرُ de kookpot (v) · الْبَقَرَةُ de koe · الْفَلَّاحُ de boer · الْأَنْفُ de neus · الْفَمُ de mond · الْأُذُنُ het oor · الْيَدُ de hand · الرِّجْلُ het been, de voet · الشَّايُ de thee · الْأُمُّ de moeder · الثَّلَّاجَةُ de koelkast · الْقَهْوَةُ de koffie · سَرِيعٌ snel · النَّافِذَةُ het raam · جِدًّا heel, erg, zeer · أَيْضًا ook · الشَّرْقُ het oosten · الْمَغْرِبُ het westen · الرَّأْسُ het hoofd · الْعَيْنُ het oog · الْوَجْهُ het gezicht · الْحَدِيدُ het ijzer"],"ex":[]}],"examples":[{"ar":"هَذَا يَاسِرٌ وَهَذِهِ آمِنَةُ.","nl":"Dit is Yaasir en dit is Aaminah."},{"ar":"هَذَا ابْنُ الْمُدِيرِ وَهَذِهِ بِنْتُ الْمُدَرِّسِ.","nl":"Dit is de zoon van de directeur en dit is de dochter van de leraar."},{"ar":"لِمَنْ هَذِهِ السَّيَّارَةُ؟ هِيَ لِلْمُدِيرِ.","nl":"Van wie is deze auto? Zij is van de directeur."},{"ar":"مَا هَذِهِ؟ هَذِهِ مِكْوَاةٌ.","nl":"Wat is dit? Dit is een strijkijzer."},{"ar":"أَهَذِهِ دَرَّاجَةُ أَنَسٍ؟ لَا، هَذِهِ دَرَّاجَةُ عَمَّارٍ. هِيَ جَدِيدَةٌ.","nl":"Is dit de fiets van Anas? Nee, dit is de fiets van 'Ammaar. Zij is nieuw."},{"ar":"هَذِهِ يَدٌ وَهَذَا فَمٌ.","nl":"Dit is een hand en dit is een mond."},{"ar":"الشَّايُ حَارٌّ وَالْقَهْوَةُ أَيْضًا حَارَّةٌ.","nl":"De thee is heet en de koffie is ook heet."},{"ar":"الْمَسْجِدُ بَعِيدٌ جِدًّا.","nl":"De moskee is erg ver."}],"exercises":[{"q":"Welk aanwijzend voornaamwoord gebruik je bij يَدٌ («een hand») en waarom?","options":["هَذِهِ يَدٌ — want lichaamsdelen die in paren voorkomen zijn vrouwelijk","هَذَا يَدٌ — want er staat geen ة aan het eind","ذَلِكَ يَدٌ","هُوَ يَدٌ"],"answer":0,"explain":"Lichaamsdelen waarvan je er twee hebt (يَدٌ، رِجْلٌ، عَيْنٌ، أُذُنٌ) zijn vrouwelijk in het Arabisch (blz. 31)."},{"q":"Welk van deze lichaamsdelen is MANNELIJK (en krijgt dus هَذَا)?","options":["أَنْفٌ (neus)","عَيْنٌ (oog)","أُذُنٌ (oor)","رِجْلٌ (been/voet)"],"answer":0,"explain":"Je hebt één neus (أَنْفٌ), één mond (فَمٌ), één hoofd (رَأْسٌ) en één gezicht (وَجْهٌ): die zijn mannelijk."},{"q":"Maak de zin vrouwelijk: «هَذَا طَالِبٌ جَدِيدٌ» (Dit is een nieuwe student).","options":["هَذِهِ طَالِبَةٌ جَدِيدَةٌ.","هَذَا طَالِبَةٌ جَدِيدٌ.","هَذِهِ طَالِبٌ جَدِيدَةٌ.","تِلْكَ طَالِبٌ جَدِيدٌ."],"answer":0,"explain":"هَذَا → هَذِهِ, en zowel naamwoord als bijvoeglijk naamwoord krijgen Taa' Marboetah (ة): طَالِبَةٌ جَدِيدَةٌ."},{"q":"Waarom krijgt مَنْ een Kasrah in «لِمَنِ الْكِتَابُ؟» (Van wie is het boek)?","options":["Omdat na de Soekoen van مَنْ de Hamzatoel Wasl van الْ volgt","Omdat مَنْ hier vrouwelijk is","Omdat الْكِتَابُ Madjroer is","Omdat لِ wegvalt"],"answer":0,"explain":"Vóór الْ verandert de Soekoen op مَنْ in een Kasrah (لِمَنِ الْكِتَابُ — limani l-kitaaboe, blz. 32)."},{"q":"Wat betekent: هَذِهِ مِكْوَاةٌ وَهَذِهِ قِدْرٌ.","options":["Dit is een strijkijzer en dit is een kookpot.","Dit is een lepel en dit is een koelkast.","Dit is een fiets en dit is een auto.","Dit is een raam en dit is een deur."],"answer":0,"explain":"مِكْوَاةٌ = strijkijzer, قِدْرٌ = kookpot (ook vrouwelijk zonder ة!)."},{"q":"Hoe zeg je in het Arabisch: «Dit is erg mooi»?","options":["هَذَا جَمِيلٌ جِدًّا.","هَذَا جِدًّا جَمِيلٌ.","هَذَا جَمِيلٌ أَيْضًا.","هَذَا كَبِيرٌ جِدًّا."],"answer":0,"explain":"جِدًّا («heel, erg, zeer») komt na het bijvoeglijk naamwoord: جَمِيلٌ جِدًّا."},{"q":"Wat betekenen de woorden الشَّرْقُ en الْمَغْرِبُ uit de woordenlijst van Les 6?","options":["het oosten en het westen","de ochtend en de avond","de thee en de koffie","het ijzer en het goud"],"answer":0,"explain":"الشَّرْقُ = het oosten, الْمَغْرِبُ = het westen (blz. 33)."},{"q":"Kies de juiste vorm: هَذِهِ السَّاعَةُ ... (Dit horloge is van Aaminah).","options":["لِآمِنَةَ / لِبِلَالٍ","بِلَالٌ","فِي بِلَالٌ","مِنْ بِلَالٌ"],"answer":0,"explain":"Het voorzetsel لِ geeft bezit aan («van / behoort toe aan»)."}],"fullText":[{"h":"1) هَذِهِ en 2) Taa' Marboetah (blz. 30)"},{"p":"1) هَذِهِ («dit/deze», v.) en 2) Vrouwelijke vorm met Taa' Marboetah (ة):"},{"p":"1) هَذِهِ wordt uitgesproken als هَاذِهِ (haadhihi), maar geschreven zonder de eerste Alief. Het is het vrouwelijk van هَذَا."},{"p":"2) Naamwoorden en bijvoeglijke naamwoorden worden vrouwelijk gemaakt door een ة (Taa' Marboetah) aan het einde toe te voegen. De laatste letter vóór deze ة krijgt altijd een Fathah (-a-):"},{"p":"Sommige zelfstandige naamwoorden hebben een geheel aparte vrouwelijke vorm zonder verwante stam."},{"table":{"headers":["Mannelijk","Vrouwelijk","Betekenis"],"rows":[["مُدَرِّسٌ (moedarris-oe-n)","مُدَرِّسَةٌ (moedarris-a-toe-n)","een leraar → een lerares"],["طَالِبٌ (taalib-oe-n)","طَالِبَةٌ (taalib-a-toe-n)","een student → een studente"],["جَدِيدٌ / جَمِيلٌ","جَدِيدَةٌ / جَمِيلَةٌ","nieuw (m/v) · mooi (m/v)"],["اِبْنٌ (ibnoen)","بِنْتٌ (bintoen)","een zoon → een dochter / meisje"],["أَخٌ (achoen)","أُخْتٌ (oechtoen)","een broer → een zus"]]}},{"ar":"هَذَا وَلَدٌ وَهَذِهِ بِنْتٌ.","nl":"Dit is een jongen en dit is een meisje."},{"ar":"هَذِهِ سَاعَةُ عَلِيٍّ. هِيَ جَمِيلَةٌ جِدًّا.","nl":"Dit is het horloge van 'Alie. Het is erg mooi."},{"h":"Lichaamsdelen: Dubbel = Vrouwelijk, Enkel = Mannelijk (blz. 31)"},{"p":"Gouden regel uit het boek (blz. 31): Het geslacht van lichaamsdelen!"},{"p":"Alle zelfstandige naamwoorden in het Arabisch zijn óf mannelijk óf vrouwelijk."},{"p":"Lichaamsdelen die in paren voorkomen (waarvan لْمِكْوَاةُ het strijkijzer · الدَّرَّاجَةُ de fiets · الْمِلْعَقَةُ de lepel · الْقِدْرُ de kookpot (v) · الْبَقَرَةُ de koe · الْفَلَّاحُ de boer · الْأَنْفُ de neus · الْفَمُ de mond · الْأُذُنُ het oor · الْيَدُ de hand · الرِّجْلُ het been, de voet · الشَّايُ de thee · الْأُمُّ de moeder · الثَّلَّاجَةُ de koelkast · الْقَهْوَةُ de koffie · سَرِيعٌ snel · النَّافِذَةُ het raam · جِدًّا heel, erg, zeer · أَيْضًا ook · الشَّرْقُ het oosten · الْمَغْرِبُ het westen · الرَّأْسُ het hoofd · الْعَيْنُ het oog · الْوَجْهُ het gezicht · الْحَدِيدُ het ijzer"}]},"7":{"title":"تِلْكَ (dat/die, vrouwelijk) · Overzicht Aanwijzende Voornaamwoorden","summary":"Les 7 uit het Grammaticaboek Medina-methode Deel 1 (blz. 34–35) — het vrouwelijk aanwijzend voornaamwoord voor afstand تِلْكَ tegenover ذَلِكَ, هَذَا en هَذِهِ.","points":["تِلْكَ betekent «dat» of «die» en is het vrouwelijk van ذَلِكَ (voor personen en dingen op afstand).","Overzicht enkelvoud: Dichtbij mannelijk = هَذَا, Dichtbij vrouwelijk = هَذِهِ, Veraf mannelijk = ذَلِكَ, Veraf vrouwelijk = تِلْكَ."],"cards":[{"sec":"Kern van Les 7 (blz. 34)","lead":"In deze les leren we het gebruik van تِلْكَ («dat / die», vrouwelijk):","ps":["Waar ذَلِكَ verwijst naar iets mannelijks op afstand («dat/die»), gebruik je تِلْكَ voor een vrouwelijk persoon, dier of voorwerp op afstand.","Hiermee ken je nu alle vier de aanwijzende voornaamwoorden voor het enkelvoud (अسْمَاءُ الْإِشَارَةِ):"],"table":{"headers":["Afstand","Mannelijk enkelvoud","Vrouwelijk enkelvoud"],"rows":[["Dichtbij («dit / deze»)","هَذَا بِلَالٌ (Dit is Bilaal)","هَذِهِ آمِنَةُ (Dit is Aaminah)"],["Veraf («dat / die»)","ذَلِكَ حَامِدٌ (Dat is Haamied)","تِلْكَ مَرْيَمُ (Dat is Maryam)"],["Voorwerpen","هَذَا كِتَابٌ وَذَلِكَ قَلَمٌ","هَذِهِ سَيَّارَةٌ وَتِلْكَ دَرَّاجَةٌ"]]},"ex":[{"ar":"مَنْ تِلْكَ؟ تِلْكَ آمِنَةُ.","nl":"Wie is dat (v.)? Dat is Aaminah."},{"ar":"هَذِهِ طَبِيبَةٌ وَتِلْكَ مُمَرِّضَةٌ.","nl":"Dit is een vrouwelijke arts en dat is een verpleegster."},{"ar":"هَذَا جَمَلٌ وَتِلْكَ نَاقَةٌ.","nl":"Dit is een (mannetjes)kameel en dat is een vrouwtjeskameel."},{"ar":"هَذِهِ بَطَّةٌ وَتِلْكَ دَجَاجَةٌ.","nl":"Dit is een eend en dat is een kip."}]},{"sec":"Woordenlijst van Les 7 (blz. 35)","lead":"Woordenlijst van Les 7 (7 woorden + alle 4 aanwijzers)","ps":["النَّاقَةُ de vrouwtjeskameel · الْبَطَّةُ de eend · الْمُمَرِّضَةُ de verpleegster · الْبَيْضَةُ het ei · الدَّجَاجَةُ de kip, de hen · الْمُؤَذِّنُ de gebedsomroeper (moe'adhdhin) · هَذَا dit (m) · هَذِهِ dit (v) · ذَلِكَ dat (m) · تِلْكَ dat (v)"],"ex":[]}],"examples":[{"ar":"مَا تِلْكَ؟ تِلْكَ حَدِيقَةٌ.","nl":"Wat is dat? Dat is een tuin."},{"ar":"هَذِهِ سَاعَةُ بِلَالٍ وَتِلْكَ سَاعَةُ حَامِدٍ.","nl":"Dit is het horloge van Bilaal en dat is het horloge van Haamied."},{"ar":"أَتِلْكَ دَجَاجَةٌ؟ لَا، تِلْكَ بَطَّةٌ.","nl":"Is dat een kip? Nee, dat is een eend."},{"ar":"ذَلِكَ مُؤَذِّنٌ وَتِلْكَ مُمَرِّضَةٌ.","nl":"Dat is een gebedsomroeper en dat is een verpleegster."},{"ar":"هَذِهِ بَيْضَةٌ كَبِيرَةٌ.","nl":"Dit is een groot ei."},{"ar":"هَذَا دِيكٌ وَتِلْكَ دَجَاجَةٌ.","nl":"Dit is een haan en dat is een kip."}],"exercises":[{"q":"Welk aanwijzend voornaamwoord gebruik je voor iets VROUWELIJKS op afstand («dat/die»)?","options":["تِلْكَ","ذَلِكَ","هَذِهِ","هَذَا"],"answer":0,"explain":"تِلْكَ is de vrouwelijke vorm van ذَلِكَ (blz. 34)."},{"q":"Vul aan: هَذَا جَمَلٌ وَ... نَاقَةٌ (Dit is een kameel en dat is een vrouwtjeskameel).","options":["تِلْكَ","ذَلِكَ","هَذَا","هُوَ"],"answer":0,"explain":"نَاقَةٌ (vrouwtjeskameel) is vrouwelijk, dus voor afstand gebruik je تِلْكَ."},{"q":"Kies het juiste woord voor een voorwerp op afstand: ... بَيْضَةٌ (Dat is een ei).","options":["تِلْكَ","ذَلِكَ","هَذَا","هُوَ"],"answer":0,"explain":"بَيْضَةٌ eindigt op ة en is vrouwelijk → تِلْكَ بَيْضَةٌ."},{"q":"Kies het juiste woord voor een mannelijk persoon op afstand: ... مُؤَذِّنٌ (Dat is een gebedsomroeper).","options":["ذَلِكَ","تِلْكَ","هَذِهِ","هِيَ"],"answer":0,"explain":"مُؤَذِّنٌ is mannelijk → ذَلِكَ مُؤَذِّنٌ."},{"q":"Wat betekent: أَتِلْكَ دَجَاجَةٌ؟ لَا، تِلْكَ بَطَّةٌ.","options":["Is dat een kip? Nee, dat is een eend.","Is dat een eend? Nee, dat is een kip.","Is dit een vrouwtjeskameel? Nee, dat is een paard.","Is dat een ei? Nee, dat is een appel."],"answer":0,"explain":"دَجَاجَةٌ = kip/hen, بَطَّةٌ = eend (blz. 35)."},{"q":"Welke reeks bevat alle 4 enkelvoudige aanwijzende voornaamwoorden in de volgorde: dichtbij (m), dichtbij (v), veraf (m), veraf (v)?","options":["هَذَا · هَذِهِ · ذَلِكَ · تِلْكَ","هَذَا · ذَلِكَ · هَذِهِ · تِلْكَ","هُوَ · هِيَ · أَنَا · أَنْتَ","تِلْكَ · ذَلِكَ · هَذِهِ · هَذَا"],"answer":0,"explain":"Dichtbij: هَذَا (m) / هَذِهِ (v). Veraf: ذَلِكَ (m) / تِلْكَ (v)."}],"fullText":[{"h":"Kern van Les 7 (blz. 34)"},{"p":"In deze les leren we het gebruik van تِلْكَ («dat / die», vrouwelijk):"},{"p":"Waar ذَلِكَ verwijst naar iets mannelijks op afstand («dat/die»), gebruik je تِلْكَ voor een vrouwelijk persoon, dier of voorwerp op afstand."},{"p":"Hiermee ken je nu alle vier de aanwijzende voornaamwoorden voor het enkelvoud (अسْمَاءُ الْإِشَارَةِ):"},{"table":{"headers":["Afstand","Mannelijk enkelvoud","Vrouwelijk enkelvoud"],"rows":[["Dichtbij («dit / deze»)","هَذَا بِلَالٌ (Dit is Bilaal)","هَذِهِ آمِنَةُ (Dit is Aaminah)"],["Veraf («dat / die»)","ذَلِكَ حَامِدٌ (Dat is Haamied)","تِلْكَ مَرْيَمُ (Dat is Maryam)"],["Voorwerpen","هَذَا كِتَابٌ وَذَلِكَ قَلَمٌ","هَذِهِ سَيَّارَةٌ وَتِلْكَ دَرَّاجَةٌ"]]}},{"ar":"مَنْ تِلْكَ؟ تِلْكَ آمِنَةُ.","nl":"Wie is dat (v.)? Dat is Aaminah."},{"ar":"هَذِهِ طَبِيبَةٌ وَتِلْكَ مُمَرِّضَةٌ.","nl":"Dit is een vrouwelijke arts en dat is een verpleegster."},{"ar":"هَذَا جَمَلٌ وَتِلْكَ نَاقَةٌ.","nl":"Dit is een (mannetjes)kameel en dat is een vrouwtjeskameel."},{"ar":"هَذِهِ بَطَّةٌ وَتِلْكَ دَجَاجَةٌ.","nl":"Dit is een eend en dat is een kip."},{"h":"Woordenlijst van Les 7 (blz. 35)"},{"p":"Woordenlijst van Les 7 (7 woorden + alle 4 aanwijzers)"},{"p":"النَّاقَةُ de vrouwtjeskameel · الْبَطَّةُ de eend · الْمُمَرِّضَةُ de verpleegster · الْبَيْضَةُ het ei · الدَّجَاجَةُ de kip, de hen · الْمُؤَذِّنُ de gebedsomroeper (moe'adhdhin) · هَذَا dit (m) · هَذِهِ dit (v) · ذَلِكَ dat (m) · تِلْكَ dat (v)"}]},"8":{"title":"هَذَا الْكِتَابُ (dit boek…) · Woorden op -a · خَلْفَ & أَمَامَ · جَلَسَ","summary":"Les 8 uit het Grammaticaboek Medina-methode Deel 1 (blz. 36–38) — het verschil tussen «Dit is een boek» (هَذَا كِتَابٌ) en «Dit boek is…» (هَذَا الْكِتَابُ ...), onveranderlijke woorden op -a, en de plaatsbepalingen خَلْفَ en أَمَامَ.","points":["1) هَذَا كِتَابٌ betekent «Dit is een boek» (volledige zin). Maar wanneer na هَذَا een woord met الْ volgt (هَذَا الْكِتَابُ = «dit boek»), vormen zij samen één zinsdeel (Badal) en is het géén volledige zin totdat er een gezegde volgt: هَذَا الْكِتَابُ جَدِيدٌ (Dit boek is nieuw).","2) Naamwoorden die eindigen op een lange «-aa» (zoals أَمْرِيكَا، أَلْمَانِيَا، إِنْكِلْتِرَا، سُوِيسَرَا، الْمُسْتَشْفَى) hebben in alle naamvallen exact dezelfde uitgang.","3) خَلْفَ («achter») en أَمَامَ («vóór»): het naamwoord erna is altijd Madjroer (-ie): خَلْفَ الْمَسْجِدِ، أَمَامَ الْمُدَرِّسِ.","4) جَلَسَ betekent «hij zat / ging zitten»."],"cards":[{"sec":"1) هَذَا كِتَابٌ vs. هَذَا الْكِتَابُ (blz. 36)","lead":"1) Het cruciale verschil tussen «هَذَا كِتَابٌ» en «هَذَا الْكِتَابُ جَدِيدٌ»:","ps":["We hebben in Les 1 geleerd dat هَذَا كِتَابٌ betekent: «Dit is een boek» (een volledige zin).","Maar wanneer er direct na هَذَا (of ذَلِكَ، هَذِهِ، تِلْكَ) een woord met het bepaald lidwoord الْ staat, zoals هَذَا الْكِتَابُ, dan betekent dit «dit boek». Dit is nog géén volledige zin! Er moet nog een gezegde (predicaat / khabar) volgen om de zin compleet te maken."],"table":{"headers":["Zonder الْ (volledige zin)","Met الْ + gezegde (Badal + Khabar)","Betekenis"],"rows":[["هَذَا كِتَابٌ (Dit is een boek)","هَذَا الْكِتَابُ جَدِيدٌ.","Dit boek is nieuw."],["ذَلِكَ رَجُلٌ (Dat is een man)","ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.","Die man is een ingenieur."],["هَذِهِ سَاعَةٌ (Dit is een horloge)","هَذِهِ السَّاعَةُ جَمِيلَةٌ.","Dit horloge is mooi."],["تِلْكَ مُمَرِّضَةٌ (Dat is een verpleegster)","تِلْكَ الْمُمَرِّضَةُ مِنَ الْيَابَانِ.","Die verpleegster komt uit Japan."]]},"ex":[{"ar":"لِمَنْ هَذَا الْكِتَابُ؟ هَذَا الْكِتَابُ لِمُحَمَّدٍ.","nl":"Van wie is dit boek? Dit boek is van Moehammad."},{"ar":"أَذَلِكَ الْبَيْتُ لِلْمُدِيرِ؟","nl":"Is dat huis van de directeur?"}]},{"sec":"2) Onveranderlijke woorden op lange «-aa» (blz. 37)","lead":"2) Naamwoorden die eindigen op een lange «-a» blijven onveranderd:","ps":["Naamwoorden die eindigen op een lange «-a» (Alief of Alief Maqsoerah, zoals أَمْرِيكَا Amerika, أَلْمَانِيَا Duitsland, إِنْكِلْتِرَا Engeland, سُوِيسَرَا Zwitserland en الْمُسْتَشْفَى het ziekenhuis) hebben geen zichtbare naamvalsuitgangen.","Zij blijven onveranderd, zowel wanneer zij Marfoe' (nominatief) als wanneer zij Madjroer (genitief na een voorzetsel of als Moedaaf Ilaih) zijn!"],"table":{"headers":["Functie in de zin","Arabisch voorbeeld","Toelichting"],"rows":[["Nominatief (Marfoe')","هَذَا أَمْرِيكَا.","Dit is Amerika. (geen -oe zichtbaar)"],["Na voorzetsel (Madjroer)","أَنَا مِنْ أَمْرِيكَا.","Ik kom uit Amerika. (geen -ie zichtbaar)"],["Als Moedaaf Ilaih (Madjroer)","هُوَ رَئِيسُ أَمْرِيكَا.","Hij is de president van Amerika."],["Met Alief Maqsoerah (ى)","ذَهَبَ إِلَى الْمُسْتَشْفَى.","Hij ging naar het ziekenhuis. (blijft الْمُسْتَشْفَى)"]]},"ex":[{"ar":"هَذَا الطَّبِيبُ مِنْ إِنْكِلْتِرَا وَذَلِكَ مِنْ سُوِيسَرَا.","nl":"Deze arts komt uit Engeland en die komt uit Zwitserland."},{"ar":"هَذِهِ السَّيَّارَةُ مِنْ أَلْمَانِيَا.","nl":"Deze auto komt uit Duitsland."}]},{"sec":"3) خَلْفَ en أَمَامَ · 4) جَلَسَ (blz. 37)","lead":"3) Plaatsbepalingen خَلْفَ («achter») en أَمَامَ («vóór»), en 4) جَلَسَ («hij zat»):","ps":["3) خَلْفَ betekent «achter» en أَمَامَ betekent «vóór» (plaatsbepaling / Zarf Makaan). Het zelfstandig naamwoord dat na deze woorden komt, is Moedaaf Ilaih en eindigt daarom altijd op «-ie» (Madjroer).","4) جَلَسَ betekent «hij zat / ging zitten»."],"ex":[{"ar":"الْبَيْتُ خَلْفَ الْمَسْجِدِ.","nl":"Het huis staat achter de moskee."},{"ar":"حَامِدٌ أَمَامَ الْمُدَرِّسِ.","nl":"Haamied staat/zit vóór de leraar."},{"ar":"أَيْنَ جَلَسَ مُحَمَّدٌ؟ جَلَسَ أَمَامَ الْمُدَرِّسِ.","nl":"Waar ging Moehammad zitten? Hij ging vóór de leraar zitten."}]},{"sec":"Woordenlijst van Les 8 (blz. 38)","lead":"Woordenlijst van Les 8 (11 woorden)","ps":["أَمْرِيكَا Amerika · أَلْمَانِيَا Duitsland · الْعِرَاقُ Irak · إِنْكِلْتِرَا Engeland · سُوِيسَرَا Zwitserland · السِّكِّينُ het mes · الْمُسْتَشْفَى het ziekenhuis · الْمُهَنْدِسُ de ingenieur · خَلْفَ achter · أَمَامَ voor · جَلَسَ hij zat"],"ex":[]}],"examples":[{"ar":"هَذَا الرَّجُلُ تَاجِرٌ وَذَلِكَ الرَّجُلُ طَبِيبٌ.","nl":"Deze man is handelaar en die man is dokter."},{"ar":"هَذَا الْوَلَدُ ابْنُ الْمُدَرِّسِ وَذَلِكَ الْوَلَدُ ابْنُ الْمُدِيرِ.","nl":"Deze jongen is de zoon van de leraar en die jongen is de zoon van de directeur."},{"ar":"لِمَنْ هَذَا الْبَيْتُ؟ هَذَا الْبَيْتُ لِلتَّاجِرِ.","nl":"Van wie is dit huis? Dit huis is van de handelaar."},{"ar":"سَيَّارَةُ الطَّبِيبِ أَمَامَ الْمُسْتَشْفَى.","nl":"De auto van de dokter staat vóór het ziekenhuis."},{"ar":"بَيْتُ الْإِمَامِ خَلْفَ الْمَسْجِدِ.","nl":"Het huis van de imam ligt achter de moskee."},{"ar":"جَلَسَ حَامِدٌ خَلْفَ مَحْمُودٍ.","nl":"Haamied ging achter Mahmoed zitten."}],"exercises":[{"q":"Hoe vertaal je «Dit boek is nieuw» in het Arabisch?","options":["هَذَا الْكِتَابُ جَدِيدٌ.","هَذَا كِتَابٌ جَدِيدٌ.","هَذَا الْكِتَابُ الْجَدِيدُ.","ذَلِكَ كِتَابٌ جَدِيدٌ."],"answer":0,"explain":"«Dit boek» = هَذَا الْكِتَابُ (met الْ direct na هَذَا), gevolgd door het onbepaalde gezegde جَدِيدٌ."},{"q":"Wat betekent «هَذَا الْبَيْتُ» zonder een woord erna?","options":["«dit huis» (nog géén volledige zin)","«Dit is een huis»","«Dat is het huis»","«In dit huis»"],"answer":0,"explain":"Wanneer na هَذَا een woord met الْ volgt, vormen zij samen «dit huis» en ontbreekt het gezegde nog (blz. 36)."},{"q":"Wat gebeurt er met het woord الْمُسْتَشْفَى («het ziekenhuis») of أَمْرِيكَا na een voorzetsel zoals إِلَى of مِنْ?","options":["Het blijft onveranderd (إِلَى الْمُسْتَشْفَى / مِنْ أَمْرِيكَا)","Het krijgt een zichtbare Kasrah (-ie)","Het krijgt Tanwien (-in)","De laatste letter valt weg"],"answer":0,"explain":"Naamwoorden die eindigen op een lange «-a» blijven onveranderd in alle naamvallen (blz. 37)."},{"q":"Kies de juiste vorm na خَلْفَ en أَمَامَ: الْبَيْتُ خَلْفَ ... وَالسَّيَّارَةُ أَمَامَ ...","options":["الْمَسْجِدِ / الْمَدْرَسَةِ","الْمَسْجِدُ / الْمَدْرَسَةُ","الْمَسْجِدٌ / الْمَدْرَسَةٌ","مَسْجِدُ / مَدْرَسَةُ"],"answer":0,"explain":"Na خَلْفَ en أَمَامَ is het naamwoord altijd Madjroer (-ie): خَلْفَ الْمَسْجِدِ en أَمَامَ الْمَدْرَسَةِ."},{"q":"Hoe zeg je: «Die verpleegster komt uit Duitsland»?","options":["تِلْكَ الْمُمَرِّضَةُ مِنْ أَلْمَانِيَا.","ذَلِكَ الْمُمَرِّضَةُ مِنْ أَلْمَانِيَا.","تِلْكَ مُمَرِّضَةٌ مِنْ أَلْمَانِيَا.","هَذِهِ الْمُمَرِّضَةُ مِنْ أَلْمَانِيَا."],"answer":0,"explain":"«Die verpleegster» (vrouwelijk, veraf + الْ) = تِلْكَ الْمُمَرِّضَةُ."},{"q":"Wat betekent: أَيْنَ جَلَسَ مُحَمَّدٌ؟ جَلَسَ أَمَامَ الْمُدَرِّسِ.","options":["Waar ging Moehammad zitten? Hij ging vóór de leraar zitten.","Waar ging Moehammad heen? Hij ging achter de leraar staan.","Waar is Moehammad? Hij is bij de directeur.","Waar zat de leraar? Hij zat achter Moehammad."],"answer":0,"explain":"جَلَسَ = hij zat / ging zitten, أَمَامَ = vóór."}],"fullText":[{"h":"1) هَذَا كِتَابٌ vs. هَذَا الْكِتَابُ (blz. 36)"},{"p":"1) Het cruciale verschil tussen «هَذَا كِتَابٌ» en «هَذَا الْكِتَابُ جَدِيدٌ»:"},{"p":"We hebben in Les 1 geleerd dat هَذَا كِتَابٌ betekent: «Dit is een boek» (een volledige zin)."},{"p":"Maar wanneer er direct na هَذَا (of ذَلِكَ، هَذِهِ، تِلْكَ) een woord met het bepaald lidwoord الْ staat, zoals هَذَا الْكِتَابُ, dan betekent dit «dit boek». Dit is nog géén volledige zin! Er moet nog een gezegde (predicaat / khabar) volgen om de zin compleet te maken."},{"table":{"headers":["Zonder الْ (volledige zin)","Met الْ + gezegde (Badal + Khabar)","Betekenis"],"rows":[["هَذَا كِتَابٌ (Dit is een boek)","هَذَا الْكِتَابُ جَدِيدٌ.","Dit boek is nieuw."],["ذَلِكَ رَجُلٌ (Dat is een man)","ذَلِكَ الرَّجُلُ مُهَنْدِسٌ.","Die man is een ingenieur."],["هَذِهِ سَاعَةٌ (Dit is een horloge)","هَذِهِ السَّاعَةُ جَمِيلَةٌ.","Dit horloge is mooi."],["تِلْكَ مُمَرِّضَةٌ (Dat is een verpleegster)","تِلْكَ الْمُمَرِّضَةُ مِنَ الْيَابَانِ.","Die verpleegster komt uit Japan."]]}},{"ar":"لِمَنْ هَذَا الْكِتَابُ؟ هَذَا الْكِتَابُ لِمُحَمَّدٍ.","nl":"Van wie is dit boek? Dit boek is van Moehammad."},{"ar":"أَذَلِكَ الْبَيْتُ لِلْمُدِيرِ؟","nl":"Is dat huis van de directeur?"},{"h":"2) Onveranderlijke woorden op lange «-aa» (blz. 37)"},{"p":"2) Naamwoorden die eindigen op een lange «-a» blijven onveranderd:"},{"p":"Naamwoorden die eindigen op een lange «-a» (Alief of Alief Maqsoerah, zoals أَمْرِيكَا Amerika, أَلْمَانِيَا Duitsland, إِنْكِلْتِرَا Engeland, سُوِيسَرَا Zwitserland en الْمُسْتَشْفَى het ziekenhuis) hebben geen zichtbare naamvalsuitgangen."},{"p":"Zij blijven onveranderd, zowel wanneer zij Marfoe' (nominatief) als wanneer zij Madjroer (genitief na een voorzetsel of als Moedaaf Ilaih) zijn!"},{"table":{"headers":["Functie in de zin","Arabisch voorbeeld","Toelichting"],"rows":[["Nominatief (Marfoe')","هَذَا أَمْرِيكَا.","Dit is Amerika. (geen -oe zichtbaar)"],["Na voorzetsel (Madjroer)","أَنَا مِنْ أَمْرِيكَا.","Ik kom uit Amerika. (geen -ie zichtbaar)"],["Als Moedaaf Ilaih (Madjroer)","هُوَ رَئِيسُ أَمْرِيكَا.","Hij is de president van Amerika."],["Met Alief Maqsoerah (ى)","ذَهَبَ إِلَى الْمُسْتَشْفَى.","Hij ging naar het ziekenhuis. (blijft الْمُسْتَشْفَى)"]]}},{"ar":"هَذَا الطَّبِيبُ مِنْ إِنْكِلْتِرَا وَذَلِكَ مِنْ سُوِيسَرَا.","nl":"Deze arts komt uit Engeland en die komt uit Zwitserland."},{"ar":"هَذِهِ السَّيَّارَةُ مِنْ أَلْمَانِيَا.","nl":"Deze auto komt uit Duitsland."},{"h":"3) خَلْفَ en أَمَامَ · 4) جَلَسَ (blz. 37)"},{"p":"3) Plaatsbepalingen خَلْفَ («achter») en أَمَامَ («vóór»), en 4) جَلَسَ («hij zat»):"},{"p":"3) خَلْفَ betekent «achter» en أَمَامَ betekent «vóór» (plaatsbepaling / Zarf Makaan). Het zelfstandig naamwoord dat na deze woorden komt, is Moedaaf Ilaih en eindigt daarom altijd op «-ie» (Madjroer)."},{"p":"4) جَلَسَ betekent «hij zat / ging zitten»."},{"ar":"الْبَيْتُ خَلْفَ الْمَسْجِدِ.","nl":"Het huis staat achter de moskee."},{"ar":"حَامِدٌ أَمَامَ الْمُدَرِّسِ.","nl":"Haamied staat/zit vóór de leraar."},{"ar":"أَيْنَ جَلَسَ مُحَمَّدٌ؟ جَلَسَ أَمَامَ الْمُدَرِّسِ.","nl":"Waar ging Moehammad zitten? Hij ging vóór de leraar zitten."},{"h":"Woordenlijst van Les 8 (blz. 38)"},{"p":"Woordenlijst van Les 8 (11 woorden)"},{"p":"أَمْرِيكَا Amerika · أَلْمَانِيَا Duitsland · الْعِرَاقُ Irak · إِنْكِلْتِرَا Engeland · سُوِيسَرَا Zwitserland · السِّكِّينُ het mes · الْمُسْتَشْفَى het ziekenhuis · الْمُهَنْدِسُ de ingenieur · خَلْفَ achter · أَمَامَ voor · جَلَسَ hij zat"}]},"9":{"title":"Bijvoeglijk naamwoord (Les 9a & 9b) · النَّعْتُ وَالْمَنْعُوتُ · woorden op -aan · الَّذِي · لِلْـ · عِنْدَ","summary":"Les 9a en 9b uit het Grammaticaboek Medina-methode Deel 1 (blz. 39–44) — Na't & Man'oet (overeenkomst in 4 zaken), bijvoeglijke naamwoorden op -aan zonder Tanwien, betrekkelijk voornaamwoord الَّذِي, voorzetsel لِ + الْ en عِنْدَ.","points":["Les 9a · 1) In het Arabisch komt het bijvoeglijk naamwoord (Na't / نَعْتٌ) ná het zelfstandig naamwoord (Man'oet / مَنْعُوتٌ) en komt ermee overeen in 4 zaken: a. Geslacht, b. Bepaaldheid (الْ of Tanwien), c. Naamval (-oe/-ie), d. Aantal/Getal.","Les 9a · 2) Bijvoeglijke naamwoorden die eindigen op «-aan» (ـَانُ) krijgen géén Tanwien: كَسْلَانُ (lui), جَوْعَانُ (hongerig), عَطْشَانُ (dorstig), غَضْبَانُ (boos), مَلْآنُ (vol).","Les 9b · 2) الَّذِي betekent «die, dat, wie, welk» (betrekkelijk voornaamwoord m. enkelvoud).","Les 9b · 3 & 4) Wanneer لِ vóór الْ komt, valt de Alief van الْ weg: لِلْإِمَامِ، لِلْمُدَرِّسِ. En عِنْدَ («bij») maakt het volgende woord Madjroer (عِنْدَ الْمُدِيرِ)."],"cards":[{"sec":"Les 9a · 1) Na't & Man'oet: De 4 overeenkomsten (blz. 39–41)","lead":"1) Het bijvoeglijk naamwoord (نَعْتٌ) volgt ná het naamwoord (مَنْعُوتٌ) en stemt overeen in 4 dingen:","ps":["In het Nederlands staat het bijvoeglijk naamwoord vóór het zelfstandig naamwoord («een nieuw huis»). In het Arabisch komt het bijvoeglijk naamwoord (Na't) altijd ná het zelfstandig naamwoord (Man'oet): بَيْتٌ جَدِيدٌ.","De Na't moet in vier opzichten precies overeenkomen met de Man'oet:"],"table":{"headers":["Overeenkomst","Voorbeeld 1","Voorbeeld 2","Uitleg"],"rows":[["a. Geslacht (m / v)","وَلَدٌ صَغِيرٌ (een kleine jongen)","بِنْتٌ صَغِيرَةٌ (een klein meisje)","Mannelijk bij m., vrouwelijk (ة) bij v."],["b. Bepaaldheid","بِلَالٌ مُدَرِّسٌ جَدِيدٌ (een nieuwe leraar)","الْمُدَرِّسُ الْجَدِيدُ فِي الْفَصْلِ (De nieuwe leraar…)","Beide onbepaald óf beide met الْ!"],["c. Naamval (I'raab)","هَذَا بَيْتٌ جَدِيدٌ (Marfoe' -oen)","أَنَا فِي بَيْتٍ جَدِيدٍ / فِي الْبَيْتِ الْجَدِيدِ (Madjroer)","Beide Marfoe' óf beide Madjroer!"],["d. Aantal / Getal","مُدَرِّسٌ جَدِيدٌ (enkelvoud)","مُدَرِّسَانِ جَدِيدَانِ / مُدَرِّسُونَ جُدُدٌ","Enkelvoud, tweevoud of meervoud."]]},"ex":[{"ar":"أَيْنَ الْمُدَرِّسُ الْجَدِيدُ؟ هُوَ فِي الْفَصْلِ.","nl":"Waar is de nieuwe leraar? Hij is in het klaslokaal."},{"ar":"مَنْ فِي الْبَيْتِ الْجَدِيدِ؟","nl":"Wie is er in het nieuwe huis?"}]},{"sec":"Les 9a · 2) Bijvoeglijke naamwoorden op «-aan» (ان) zonder Tanwien (blz. 41)","lead":"2) Bijvoeglijke naamwoorden op «-aan» (ـَانُ) krijgen géén Tanwien:","ps":["Bijvoeglijke naamwoorden die eindigen op «-aan» (فَعْلَانُ) zijn diptoten (mamnoe' mina s-sarf): zij krijgen géén Tanwien en eindigen op één enkele Dammah (-oe), ook als ze onbepaald zijn!"],"table":{"headers":["Arabisch (géén Tanwien!)","Uitspraak","Betekenis","Voorbeeldzin"],"rows":[["كَسْلَانُ (NIET كَسْلَانٌ)","kaslaanoe","lui","هَذَا الْوَلَدُ كَسْلَانُ."],["جَوْعَانُ","djaw'aanoe","hongerig","أَنَا جَوْعَانُ. (Ik heb honger)"],["عَطْشَانُ","'atshaanoe","dorstig","أَأَنْتَ عَطْشَانُ؟ (Heb jij dorst?)"],["غَضْبَانُ","ghadbaanoe","boos","لِمَاذَا الْمُدَرِّسُ غَضْبَانُ الْيَوْمَ؟"],["مَلْآنُ","mal'aanoe","vol","الْكُوبُ مَلْآنُ. (De beker is vol)"]]},"ex":[{"ar":"عَبَّاسٌ تَاجِرٌ غَنِيٌّ، وَبِلَالٌ مُدَرِّسٌ جَدِيدٌ.","nl":"'Abbaas is een rijke handelaar en Bilaal is een nieuwe leraar."},{"ar":"اللُّغَةُ الْعَرَبِيَّةُ سَهْلَةٌ وَجَمِيلَةٌ.","nl":"De Arabische taal is gemakkelijk en mooi."}]},{"sec":"Les 9b · الَّذِي, لِلْـ en عِنْدَ (blz. 43–44)","lead":"Les 9b: Betrekkelijk voornaamwoord الَّذِي («die/dat»), لِ + الْ → لِلْـ en عِنْدَ («bij»):","ps":["1) الَّذِي (alladhie) betekent «die», «dat», «wie» of «welk» en verwijst naar een mannelijk enkelvoudig naamwoord.","2) Merk op dat wanneer het voorzetsel لِ voorafgaat aan een woord met الْ, de Hamzah (Alief) van الْ helemaal wegvalt in de schrijfwijze: لِ + الْإِمَامُ → لِلْإِمَامِ (voor/van de imam).","3) عِنْدَ betekent «bij». Het zelfstandig naamwoord dat erop volgt is Moedaaf Ilaih en heeft daarom de uitgang «-ie» (Madjroer)."],"ex":[{"ar":"الرَّجُلُ الَّذِي خَرَجَ مِنَ الْمَسْجِدِ الْآنَ تَاجِرٌ شَهِيرٌ.","nl":"De man die nu uit de moskee kwam, is een beroemde handelaar."},{"ar":"الْبَيْتُ الَّذِي أَمَامَ الْمَسْجِدِ لِلْإِمَامِ.","nl":"Het huis dat vóór de moskee staat, is van de imam."},{"ar":"أَيْنَ الْمُدَرِّسُ الْجَدِيدُ؟ هُوَ عِنْدَ الْمُدِيرِ.","nl":"Waar is de nieuwe leraar? Hij is bij de directeur."}]},{"sec":"Woordenlijst van Les 9a & 9b (blz. 42 & 44)","lead":"Woordenlijst van Les 9a en 9b (30 woorden)","ps":["الْفَاكِهَةُ het fruit · الْعُصْفُورُ de mus · الطَّائِرُ de vogel · الْعَرَبِيَّةُ het Arabisch · اللُّغَةُ de taal · سَهْلٌ gemakkelijk · صَعْبٌ moeilijk · مُجْتَهِدٌ ijverig, hardwerkend · شَهِيرٌ beroemd · الْمَدِينَةُ de stad · الْقَاهِرَةُ Caïro · الْيَوْمَ vandaag · لِمَاذَا waa
