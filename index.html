<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al-Mufrodat — laden…</title>
<style>
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#EFE4D4;color:#3d2b1f}
.box{text-align:center;padding:24px}
.spin{width:36px;height:36px;border:3px solid #c4a882;border-top-color:#3d2b1f;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<div class="spin"></div>
<p>Al-Mufrodat laden…</p>
</div>
<script>
(async function(){
  try {
    const parts = await Promise.all([0,1,2].map(i =>
      fetch('part' + i + '.b64').then(r => { if(!r.ok) throw new Error('part'+i); return r.text(); })
    ));
    const b64 = parts.join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.querySelector('.box').innerHTML =
      '<p>Laden mislukt. Open de app opnieuw of check of part0/1/2.b64 aanwezig zijn.</p><pre>' + e + '</pre>';
  }
})();
</script>
</body>
</html>
